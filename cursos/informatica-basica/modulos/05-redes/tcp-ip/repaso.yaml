- id: L01-001
  tipo: ordering
  dificultad: baja
  objetivo: "1.1"
  enunciado: Ordena las capas del modelo TCP/IP de la más cercana al programa a la más cercana al cable.
  opciones:
    - {id: a, texto: "Aplicación (HTTP)"}
    - {id: b, texto: "Transporte (TCP)"}
    - {id: c, texto: "Internet (IP)"}
    - {id: d, texto: "Enlace (Ethernet)"}
  correctas: [a, b, c, d]
  explicacion: Al enviar, cada capa encapsula lo que recibe de la de arriba y lo pasa a la de abajo. El receptor lo desenvuelve en orden inverso.
  referencia: https://www.rfc-editor.org/rfc/rfc1122.html
- id: L01-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.1"
  enunciado: Un router intermedio reenvía un paquete con una petición HTTPS. ¿Qué información necesita leer para decidir por dónde enviarlo?
  opciones:
    - {id: a, texto: "La URL de la petición HTTP"}
    - {id: b, texto: "La dirección IP de destino"}
    - {id: c, texto: "El contenido descifrado de la conexión TLS"}
    - {id: d, texto: "El nombre del certificado del servidor"}
  correctas: [b]
  explicacion: Un router trabaja en la capa de internet. Mira la IP de destino y su tabla de rutas; lo que va dentro (TCP, TLS, HTTP) no le hace falta.
  distractores:
    a: La URL va dentro de la conexión cifrada; el router no la ve ni la necesita.
    c: El router no tiene las claves de TLS.
    d: El certificado es cosa de TLS, en los extremos de la conexión.
  referencia: https://www.rfc-editor.org/rfc/rfc1122.html
- id: L01-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.2"
  enunciado: ¿Cuántas direcciones tiene la red 192.168.1.0/26?
  opciones:
    - {id: a, texto: "26"}
    - {id: b, texto: "256"}
    - {id: c, texto: "64"}
    - {id: d, texto: "128"}
  correctas: [c]
  explicacion: Quedan 32 − 26 = 6 bits libres, así que hay 2^6 = 64 direcciones, de 192.168.1.0 a 192.168.1.63.
  distractores:
    a: El 26 es el número de bits fijos, no de direcciones.
    b: 256 corresponde a una /24.
    d: 128 corresponde a una /25.
  referencia: https://www.rfc-editor.org/rfc/rfc4632.html
- id: L01-004
  tipo: multiple_response
  dificultad: media
  objetivo: "1.2"
  enunciado: ¿Qué direcciones pertenecen a la red 10.1.2.0/23?
  opciones:
    - {id: a, texto: "10.1.2.0"}
    - {id: b, texto: "10.1.3.200"}
    - {id: c, texto: "10.1.3.255"}
    - {id: d, texto: "10.1.4.1"}
    - {id: e, texto: "10.1.1.255"}
  correctas: [a, b, c]
  explicacion: Una /23 tiene 512 direcciones y abarca dos bloques de 256, de 10.1.2.0 a 10.1.3.255.
  distractores:
    d: 10.1.4.1 ya está en la siguiente /23.
    e: 10.1.1.255 está en la /23 anterior.
  referencia: https://docs.python.org/3/library/ipaddress.html
- id: L01-005
  tipo: matching
  dificultad: media
  objetivo: "1.3"
  enunciado: Empareja cada dirección con el tipo de rango al que pertenece.
  prompts:
    - {id: "1", texto: "192.168.1.141"}
    - {id: "2", texto: "127.0.0.1"}
    - {id: "3", texto: "169.254.169.254"}
    - {id: "4", texto: "100.64.1.1"}
    - {id: "5", texto: "8.8.8.8"}
  opciones:
    - {id: a, texto: "Privada (RFC 1918)"}
    - {id: b, texto: "Loopback"}
    - {id: c, texto: "Enlace local"}
    - {id: d, texto: "NAT de operador (CGNAT)"}
    - {id: e, texto: "Pública, enrutable en Internet"}
    - {id: f, texto: "Multidifusión"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d], ["5", e]]
  explicacion: 192.168.0.0/16 es privada; 127.0.0.0/8, el propio equipo; 169.254.0.0/16, enlace local (la usan los servicios de metadatos de la nube); 100.64.0.0/10, el espacio compartido de los operadores; y 8.8.8.8, una dirección pública.
  distractores:
    f: La multidifusión IPv4 usa 224.0.0.0/4; ninguna de estas direcciones está ahí.
  referencia: https://www.rfc-editor.org/rfc/rfc6598.html
- id: L01-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: "1.3"
  enunciado: Un servidor accesible desde Internet solo debe aceptar peticiones del servicio de metadatos de la nube si vienen de dentro. Un compañero propone confiar en cualquier IP del rango 169.254.0.0/16. ¿Qué es lo correcto?
  opciones:
    - {id: a, texto: "Es seguro, porque ese rango es de enlace local y no lo pueden usar desde Internet"}
    - {id: b, texto: "El rango es privado de RFC 1918, así que no hay riesgo"}
    - {id: c, texto: "Solo es seguro con IPv6"}
    - {id: d, texto: "Es el destino típico de un ataque SSRF, así que el problema está en que tu servidor no haga peticiones a ese rango por cuenta de un usuario"}
  correctas: [d]
  explicacion: 169.254.169.254 no se alcanza desde Internet, pero sí desde tu propio servidor. Si este descarga URL que da el usuario, el atacante llega a los metadatos a través de él. El problema es el SSRF.
  distractores:
    a: Desde Internet no llega directamente, pero tu servidor sí puede, y ese es el riesgo.
    b: 169.254.0.0/16 es de enlace local (RFC 3927), no un rango de RFC 1918.
    c: La familia de direcciones no cambia el problema.
  referencia: https://www.rfc-editor.org/rfc/rfc3927.html
- id: L01-007
  tipo: multiple_choice
  dificultad: baja
  objetivo: "1.4"
  enunciado: Un navegador abre una conexión al puerto 443 de un servidor. ¿Qué puerto de origen usa normalmente?
  opciones:
    - {id: a, texto: "Uno efímero que elige el sistema, en Linux entre 32768 y 60999 por defecto"}
    - {id: b, texto: "También el 443"}
    - {id: c, texto: "El 80"}
    - {id: d, texto: "El 0"}
  correctas: [a]
  explicacion: El cliente usa un puerto efímero para su lado de la conexión. Así puede abrir muchas conexiones al mismo servidor y puerto, cada una con su cuaterna distinta.
  distractores:
    b: Varias conexiones del mismo cliente al 443 no podrían distinguirse si todas usaran el 443 de origen.
    c: El 80 es el puerto conocido de HTTP en el servidor, no el de origen del cliente.
    d: El 0 no se usa como puerto real; al pedirlo, el sistema asigna uno efímero.
  referencia: https://man7.org/linux/man-pages/man7/ip.7.html
- id: L01-008
  tipo: multiple_response
  dificultad: media
  objetivo: "1.4"
  enunciado: Tu equipo está en una red doméstica con NAT. ¿Qué afirmaciones son correctas?
  opciones:
    - {id: a, texto: "Sales a Internet con la IP pública del router"}
    - {id: b, texto: "Para que alguien de fuera conecte con un servicio de tu equipo, el router debe redirigir un puerto"}
    - {id: c, texto: "Si tu operador usa CGNAT, redirigir un puerto en tu router puede no bastar"}
    - {id: d, texto: "El NAT cifra tu tráfico"}
    - {id: e, texto: "Tu IP privada es visible para los servidores que visitas"}
  correctas: [a, b, c]
  explicacion: El router traduce las conexiones salientes a su IP pública. Las entrantes no tienen a dónde ir sin una regla de redirección, y con CGNAT hay otro NAT en el operador que tampoco las deja pasar.
  distractores:
    d: NAT traduce direcciones; no cifra nada.
    e: Los servidores ven la IP pública del router, no la privada.
  referencia: https://www.rfc-editor.org/rfc/rfc1918.html
- id: L02-001
  tipo: ordering
  dificultad: baja
  objetivo: "2.1"
  enunciado: Ordena los segmentos con los que se abre una conexión TCP.
  opciones:
    - {id: a, texto: "El cliente envía SYN"}
    - {id: b, texto: "El servidor responde SYN-ACK"}
    - {id: c, texto: "El cliente responde ACK"}
    - {id: d, texto: "El cliente envía los primeros datos"}
  correctas: [a, b, c, d]
  explicacion: Es el saludo en tres pasos. Hasta que no se completa, el cliente no puede enviar datos, y por eso abrir una conexión cuesta un viaje de ida y vuelta.
  referencia: https://www.rfc-editor.org/rfc/rfc9293.html#section-3.5
- id: L02-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.1"
  enunciado: Con curl -w, una petición HTTPS mostró time_namelookup 0,0017, time_connect 0,0059 y time_appconnect 0,0157 segundos. ¿Cuánto tardó el saludo TLS?
  opciones:
    - {id: a, texto: "15,7 ms"}
    - {id: b, texto: "4,2 ms"}
    - {id: c, texto: "1,7 ms"}
    - {id: d, texto: "Unos 9,8 ms, la diferencia entre time_appconnect y time_connect"}
  correctas: [d]
  explicacion: Los tiempos de --write-out son acumulados desde el inicio. El saludo TLS es lo que va de terminar la conexión TCP (0,0059) a terminar TLS (0,0157).
  distractores:
    a: Es el tiempo total hasta acabar TLS, que incluye DNS y TCP.
    b: Es lo que tardó la conexión TCP, de 0,0017 a 0,0059.
    c: Es lo que tardó la resolución DNS.
  referencia: https://everything.curl.dev/usingcurl/verbose/writeout.html
- id: L02-003
  tipo: multiple_choice
  dificultad: alta
  objetivo: "2.1"
  enunciado: Un servicio abre una conexión nueva para cada una de sus miles de llamadas por segundo a otra API y empieza a fallar con errores al asignar direcciones locales. ¿Cuál es la causa más probable y la solución?
  opciones:
    - {id: a, texto: "Las conexiones en TIME_WAIT agotan los puertos efímeros; hay que reutilizar conexiones con un pool"}
    - {id: b, texto: "La API está caída; hay que reintentar más rápido"}
    - {id: c, texto: "Falta ancho de banda; hay que comprimir las respuestas"}
    - {id: d, texto: "El DNS no responde; hay que bajar el TTL"}
  correctas: [a]
  explicacion: Cada conexión cerrada por el cliente deja su puerto efímero un tiempo en TIME_WAIT. Con miles por segundo, el rango se agota. Reutilizar conexiones elimina el problema y además ahorra los saludos.
  distractores:
    b: Reintentar más rápido abriría todavía más conexiones.
    c: El error es de puertos locales, no de capacidad de la red.
    d: El fallo se produce al conectar, no al resolver el nombre.
  referencia: https://www.rfc-editor.org/rfc/rfc9293.html#section-3.6
- id: L02-004
  tipo: multiple_response
  dificultad: media
  objetivo: "2.2"
  enunciado: ¿Qué garantiza TCP a la aplicación?
  opciones:
    - {id: a, texto: "Que los bytes llegan en el mismo orden en que se enviaron"}
    - {id: b, texto: "Que lo que no se confirma se retransmite"}
    - {id: c, texto: "Que el emisor no desborda al receptor (control de flujo)"}
    - {id: d, texto: "Que cada mensaje se lee de una vez, con sus límites originales"}
    - {id: e, texto: "Que los datos van cifrados"}
  correctas: [a, b, c]
  explicacion: TCP entrega un flujo de bytes fiable y ordenado, con control de flujo y de congestión.
  distractores:
    d: TCP no conserva los límites de los mensajes; la aplicación debe marcarlos, como hace HTTP con Content-Length.
    e: El cifrado lo añade TLS por encima de TCP.
  referencia: https://www.rfc-editor.org/rfc/rfc9293.html
- id: L02-005
  tipo: matching
  dificultad: media
  objetivo: "2.3"
  enunciado: Empareja cada síntoma al conectar con su causa más probable.
  prompts:
    - {id: "1", texto: "Connection refused, al instante"}
    - {id: "2", texto: "Connection timed out tras unos segundos"}
    - {id: "3", texto: "Funciona desde el propio servidor pero no desde otro equipo, y ss muestra 127.0.0.1:8080 en escucha"}
  opciones:
    - {id: a, texto: "No hay ningún proceso escuchando en ese puerto"}
    - {id: b, texto: "Un cortafuegos descarta los paquetes o la IP no responde"}
    - {id: c, texto: "El servicio solo escucha en la interfaz loopback"}
    - {id: d, texto: "El certificado TLS ha caducado"}
  correctas: [["1", a], ["2", b], ["3", c]]
  explicacion: El rechazo inmediato es un RST del equipo; el tiempo agotado es que nadie contesta al SYN; y escuchar en 127.0.0.1 solo acepta conexiones locales.
  distractores:
    d: Un certificado caducado da un error de TLS después de conectar, no un fallo al conectar.
  referencia: https://man7.org/linux/man-pages/man8/ss.8.html
- id: L02-006
  tipo: completar
  dificultad: media
  objetivo: "2.3"
  enunciado: Completa el comando para ver los sockets TCP que están escuchando, con los puertos en número.
  codigo:
    lenguaje: bash
    fuente: |
      ss -[[1]]
  huecos:
    - {id: "1", respuestas: ["ltn", "tln", "nlt", "ntl", "lnt", "tnl"]}
  explicacion: -l muestra los sockets en escucha, -t limita a TCP y -n muestra números en lugar de nombres de servicio.
  referencia: https://man7.org/linux/man-pages/man8/ss.8.html
- id: L02-007
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.4"
  enunciado: En la prueba, un sendto con Python a un puerto UDP cerrado devolvió 4 bytes enviados, sin error. ¿Por qué?
  opciones:
    - {id: a, texto: "Porque el puerto 9 está abierto en este equipo"}
    - {id: b, texto: "Porque UDP no tiene saludo ni confirmaciones: enviar no espera respuesta del destino"}
    - {id: c, texto: "Porque Python reintentó hasta que funcionó"}
    - {id: d, texto: "Porque el datagrama se guardó para cuando se abra el puerto"}
  correctas: [b]
  explicacion: UDP envía el datagrama y se olvida. El error del destino (un ICMP de puerto inaccesible) solo se notificó después, al leer de un socket UDP conectado.
  distractores:
    a: El puerto estaba cerrado; el recv posterior dio Connection refused.
    c: UDP no reintenta; si la aplicación quiere fiabilidad, la añade ella.
    d: Un datagrama que no se puede entregar se descarta.
  referencia: https://www.rfc-editor.org/rfc/rfc768.html
- id: L02-008
  tipo: multiple_response
  dificultad: media
  objetivo: "2.4"
  enunciado: ¿Qué usos encajan con UDP como transporte?
  opciones:
    - {id: a, texto: "Consultas DNS, pequeñas y que el cliente puede repetir"}
    - {id: b, texto: "Voz en tiempo real, donde un paquete que llega tarde ya no sirve"}
    - {id: c, texto: "QUIC, que añade su propia fiabilidad por flujo"}
    - {id: d, texto: "Transferir un fichero sin escribir ningún mecanismo de reenvío"}
    - {id: e, texto: "Una conexión SSH interactiva"}
  correctas: [a, b, c]
  explicacion: UDP encaja cuando la latencia importa más que la entrega completa, cuando el mensaje es pequeño y se puede repetir, o cuando se construye otro transporte encima.
  distractores:
    d: Sin fiabilidad propia, se perderían o desordenarían partes del fichero; para eso está TCP.
    e: SSH necesita un flujo fiable y ordenado y va sobre TCP.
  referencia: https://www.rfc-editor.org/rfc/rfc768.html
- id: L03-001
  tipo: ordering
  dificultad: media
  objetivo: "3.1"
  enunciado: Con la caché vacía, ordena a quién pregunta el resolvedor recursivo para obtener la dirección de curl.se.
  opciones:
    - {id: a, texto: "A un servidor raíz, que le remite a los servidores de .se"}
    - {id: b, texto: "A un servidor de .se, que le remite a los autoritativos de curl.se"}
    - {id: c, texto: "A un servidor autoritativo de curl.se, que devuelve los registros A"}
    - {id: d, texto: "Devuelve la respuesta a la aplicación y la guarda en caché"}
  correctas: [a, b, c, d]
  explicacion: Cada nivel delega en el siguiente. Es el recorrido que mostró dig +trace, del servidor raíz g.root-servers.net a x.ns.se y de ahí a nx3.named.se.
  referencia: https://www.rfc-editor.org/rfc/rfc1034.html#section-2.4
- id: L03-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.1"
  enunciado: ¿Qué sabe un servidor raíz cuando le preguntan por curl.se?
  opciones:
    - {id: a, texto: "La dirección IP de curl.se"}
    - {id: b, texto: "Qué servidores gestionan el dominio de primer nivel .se"}
    - {id: c, texto: "Los nombres de Internet, para responder sin preguntar a nadie más"}
    - {id: d, texto: "Nada: solo responde a los resolvedores de los proveedores"}
  correctas: [b]
  explicacion: La raíz solo delega los dominios de primer nivel. Para curl.se responde con los servidores de .se, que a su vez delegan en los de curl.se.
  distractores:
    a: La dirección la tienen los servidores autoritativos de curl.se.
    c: El DNS es distribuido; ningún servidor tiene todos los nombres.
    d: Responde a cualquier consulta, incluida la que hizo dig +trace desde este equipo.
  referencia: https://www.iana.org/domains/root/servers
- id: L03-003
  tipo: matching
  dificultad: baja
  objetivo: "3.2"
  enunciado: Empareja cada necesidad con el tipo de registro DNS.
  prompts:
    - {id: "1", texto: "La dirección IPv4 del servidor web"}
    - {id: "2", texto: "Que www.tienda.example sea un alias de tienda.example"}
    - {id: "3", texto: "Dónde se entrega el correo del dominio"}
    - {id: "4", texto: "Demostrar a un servicio que controlas el dominio con un texto que te da"}
    - {id: "5", texto: "La dirección IPv6 del servidor"}
  opciones:
    - {id: a, texto: "A"}
    - {id: b, texto: "CNAME"}
    - {id: c, texto: "MX"}
    - {id: d, texto: "TXT"}
    - {id: e, texto: "AAAA"}
    - {id: f, texto: "PTR"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d], ["5", e]]
  explicacion: A y AAAA dan direcciones; CNAME, un alias; MX, los servidores de correo; y TXT, texto libre que se usa para verificaciones y para SPF.
  distractores:
    f: PTR sirve para la resolución inversa, de IP a nombre.
  referencia: https://www.rfc-editor.org/rfc/rfc1035.html#section-3.2.2
- id: L03-004
  tipo: multiple_choice
  dificultad: alta
  objetivo: "3.2"
  enunciado: Quieres que el dominio tienda.example, sin www, apunte al balanceador de un proveedor mediante un CNAME. ¿Qué ocurre?
  opciones:
    - {id: a, texto: "Funciona igual que en www"}
    - {id: b, texto: "Funciona, pero el correo deja de llegar en unas horas"}
    - {id: c, texto: "No se permite: un nombre con CNAME no puede tener otros registros, y el dominio raíz de la zona necesita sus NS y su SOA"}
    - {id: d, texto: "Solo funciona con IPv6"}
  correctas: [c]
  explicacion: Un CNAME declara que el nombre es otro, así que no puede convivir con otros registros. Muchos proveedores ofrecen alias propios (ALIAS, ANAME o aplanado de CNAME) para el dominio raíz.
  distractores:
    a: En www no hay NS ni SOA, por eso allí sí puede haber un CNAME.
    b: El problema no es de tiempo; la configuración no es válida.
    d: La restricción no depende de la familia de direcciones.
  referencia: https://www.rfc-editor.org/rfc/rfc1034.html#section-3.6.2
- id: L03-005
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.2"
  enunciado: Un dominio tiene MX 5 correo1.example. y MX 30 correo2.example. ¿Adónde intentan entregar primero los servidores de correo?
  opciones:
    - {id: a, texto: "A correo2, porque 30 es mayor"}
    - {id: b, texto: "A los dos a la vez"}
    - {id: c, texto: "Al azar"}
    - {id: d, texto: "A correo1, porque el número menor tiene más prioridad"}
  correctas: [d]
  explicacion: En MX, la preferencia más baja se intenta primero. Es lo que tenía gmail.com, con prioridad 5 para el principal y 30 o 40 para los alternativos.
  distractores:
    a: Es al revés; el número mayor es el de respaldo.
    b: Se intenta por orden de preferencia.
    c: El azar solo se usa entre registros con la misma preferencia.
  referencia: https://www.rfc-editor.org/rfc/rfc5321.html#section-5.1
- id: L03-006
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.3"
  enunciado: El registro A de tu web tiene TTL 86400 y mañana migras a otra IP. ¿Qué conviene hacer?
  opciones:
    - {id: a, texto: "Bajar el TTL, por ejemplo a 300, al menos un día antes, y subirlo cuando la migración esté estable"}
    - {id: b, texto: "Cambiar la IP y bajar el TTL a la vez"}
    - {id: c, texto: "Subir el TTL para que el cambio se fije antes"}
    - {id: d, texto: "Nada: los resolvedores consultan al autoritativo en cada petición"}
  correctas: [a]
  explicacion: Los resolvedores guardan la respuesta durante el TTL que tenía cuando la obtuvieron. Si lo bajas con al menos esa antelación, cuando cambies la IP todos la renovarán en pocos minutos.
  distractores:
    b: Los resolvedores que ya guardaron el valor antiguo lo mantendrán hasta 24 horas.
    c: Un TTL más alto retrasa todavía más el cambio.
    d: Los resolvedores usan su caché mientras dura el TTL, como mostró el TTL que bajaba entre dos consultas.
  referencia: https://www.rfc-editor.org/rfc/rfc1035.html#section-3.2.1
- id: L03-007
  tipo: matching
  dificultad: media
  objetivo: "3.4"
  enunciado: Empareja cada estado de la cabecera de dig con su significado.
  prompts:
    - {id: "1", texto: "NOERROR"}
    - {id: "2", texto: "NXDOMAIN"}
    - {id: "3", texto: "SERVFAIL"}
  opciones:
    - {id: a, texto: "La consulta ha ido bien, aunque puede no haber registros de ese tipo"}
    - {id: b, texto: "El nombre no existe"}
    - {id: c, texto: "El resolvedor no ha podido obtener una respuesta"}
    - {id: d, texto: "El registro ha caducado"}
  correctas: [["1", a], ["2", b], ["3", c]]
  explicacion: NXDOMAIN es una respuesta definitiva de que el nombre no existe, y también se guarda en caché. SERVFAIL indica un problema al resolver, como servidores autoritativos que no responden o un fallo de DNSSEC.
  distractores:
    d: Un registro caducado en caché se vuelve a consultar; no genera un estado propio.
  referencia: https://www.rfc-editor.org/rfc/rfc1035.html#section-4.1.1
- id: L03-008
  tipo: completar
  dificultad: media
  objetivo: "3.4"
  enunciado: Completa los comandos para preguntar por el registro MX directamente al resolvedor 1.1.1.1, y para ver solo los datos de la respuesta.
  codigo:
    lenguaje: bash
    fuente: |
      dig [[1]]1.1.1.1 gmail.com MX
      dig [[2]] curl.se
  huecos:
    - {id: "1", respuestas: ["@"]}
    - {id: "2", respuestas: ["+short"]}
  explicacion: Con @servidor, dig pregunta a ese servidor en lugar de al resolvedor del sistema; +short muestra solo los datos.
  referencia: https://bind9.readthedocs.io/en/latest/manpages.html
- id: L03-009
  tipo: multiple_choice
  dificultad: alta
  objetivo: "3.4"
  enunciado: Has cambiado la IP de api.tienda.example. Con dig @ns1 de tu proveedor ves la nueva, pero con dig sin servidor ves la antigua. ¿Qué pasa?
  opciones:
    - {id: a, texto: "El cambio no se ha guardado"}
    - {id: b, texto: "Tu resolvedor tiene la respuesta antigua en caché hasta que caduque su TTL"}
    - {id: c, texto: "El servidor autoritativo está caído"}
    - {id: d, texto: "Hay que reiniciar el servidor web"}
  correctas: [b]
  explicacion: El autoritativo ya da el valor nuevo; tu resolvedor recursivo sirve el que guardó, durante lo que le quede de TTL.
  distractores:
    a: Si no se hubiera guardado, el autoritativo devolvería la IP antigua.
    c: El autoritativo respondió a la consulta directa.
    d: El servidor web no interviene en la resolución de nombres.
  referencia: https://www.rfc-editor.org/rfc/rfc1034.html#section-4.3.1
- id: L04-001
  tipo: multiple_response
  dificultad: media
  objetivo: "4.1"
  enunciado: Tu aplicación usa HTTPS. ¿Qué puede seguir viendo alguien que observa la red?
  opciones:
    - {id: a, texto: "La IP del servidor al que te conectas"}
    - {id: b, texto: "Normalmente, el nombre del sitio, que viaja en el SNI"}
    - {id: c, texto: "El tamaño y el momento de los paquetes"}
    - {id: d, texto: "La URL completa y las cabeceras de la petición"}
    - {id: e, texto: "Las cookies de sesión"}
  correctas: [a, b, c]
  explicacion: TLS cifra el contenido de la conexión, pero la IP de destino es necesaria para enrutar y el SNI suele ir en claro en el ClientHello. El volumen y el ritmo del tráfico también se ven.
  distractores:
    d: La ruta, la consulta y las cabeceras van dentro de la conexión cifrada.
    e: Las cookies van en las cabeceras, cifradas.
  referencia: https://www.rfc-editor.org/rfc/rfc8446.html#section-1
- id: L04-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.1"
  enunciado: ¿Cuántos viajes de ida y vuelta necesita un saludo completo de TLS 1.3 antes de que el cliente envíe sus datos?
  opciones:
    - {id: a, texto: "Ninguno"}
    - {id: b, texto: "Uno"}
    - {id: c, texto: "Dos, como en TLS 1.2"}
    - {id: d, texto: "Tres"}
  correctas: [b]
  explicacion: En TLS 1.3 el cliente envía su clave efímera ya en el ClientHello. Con la respuesta del servidor, los dos tienen el secreto compartido y el cliente puede enviar datos tras un único viaje.
  distractores:
    a: Solo se envían datos sin esperar (0-RTT) al reanudar una sesión anterior, y con limitaciones.
    c: TLS 1.2 necesitaba dos viajes; 1.3 lo redujo a uno.
    d: Ninguna versión de TLS necesita tres.
  referencia: https://www.rfc-editor.org/rfc/rfc8446.html#section-2
- id: L04-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.2"
  enunciado: El certificado de un servidor tiene CN=tienda.example y en su Subject Alternative Name solo www.tienda.example. ¿Para qué nombre lo aceptará un navegador actual?
  opciones:
    - {id: a, texto: "Para tienda.example y www.tienda.example"}
    - {id: b, texto: "Solo para tienda.example, porque manda el CN"}
    - {id: c, texto: "Solo para www.tienda.example"}
    - {id: d, texto: "Para api.tienda.example y los demás subdominios"}
  correctas: [c]
  explicacion: Los clientes validan el nombre contra el SAN; el CN ya no se tiene en cuenta. tienda.example sin www daría un error de nombre.
  distractores:
    a: El CN no añade nombres válidos.
    b: Es justo al revés; el CN está obsoleto para validar.
    d: Haría falta un comodín como *.tienda.example en el SAN.
  referencia: https://www.rfc-editor.org/rfc/rfc5280.html#section-4.2.1.6
- id: L04-004
  tipo: ordering
  dificultad: media
  objetivo: "4.2"
  enunciado: Ordena la cadena que envió curl.se, desde su certificado hasta la raíz que tiene el sistema en su almacén de confianza.
  opciones:
    - {id: a, texto: "CN=curl.se"}
    - {id: b, texto: "Let's Encrypt YR2 (intermedio)"}
    - {id: c, texto: "ISRG Root YR"}
    - {id: d, texto: "ISRG Root X1"}
  correctas: [a, b, c, d]
  explicacion: Cada certificado está firmado por el siguiente. Root YR es una raíz nueva con firma cruzada de ISRG Root X1, así que la aceptan los clientes que solo confían en X1.
  referencia: https://letsencrypt.org/certificates/
- id: L04-005
  tipo: matching
  dificultad: media
  objetivo: "4.3"
  enunciado: Empareja cada mensaje de error de curl con su causa.
  prompts:
    - {id: "1", texto: "certificate has expired"}
    - {id: "2", texto: "self-signed certificate"}
    - {id: "3", texto: "no alternative certificate subject name matches target hostname"}
    - {id: "4", texto: "self-signed certificate in certificate chain"}
  opciones:
    - {id: a, texto: "La fecha notAfter ya pasó"}
    - {id: b, texto: "El certificado se firma a sí mismo y no hay cadena hasta una raíz"}
    - {id: c, texto: "El nombre al que te conectas no está en el SAN"}
    - {id: d, texto: "La cadena acaba en una raíz que el cliente no tiene"}
    - {id: e, texto: "El servidor no admite TLS 1.3"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d]]
  explicacion: Son los errores que dieron expired, self-signed, wrong.host y untrusted-root de badssl.com, todos con el código 60 de curl.
  distractores:
    e: Un problema de versión da un error de negociación, no de verificación del certificado.
  referencia: https://docs.openssl.org/3.5/man1/openssl-s_client/
- id: L04-006
  tipo: multiple_choice
  dificultad: baja
  objetivo: "4.3"
  enunciado: Un script de despliegue usa curl -k para llamar a una API interna porque «daba un error de certificado». ¿Qué problema tiene?
  opciones:
    - {id: a, texto: "Ninguno, si la API es interna"}
    - {id: b, texto: "Que la petición va sin cifrar"}
    - {id: c, texto: "Que solo funciona con HTTP/1.1"}
    - {id: d, texto: "Que curl deja de validar el certificado y cualquiera en medio puede suplantar a la API; hay que indicar la CA correcta con --cacert"}
  correctas: [d]
  explicacion: -k sigue cifrando, pero sin comprobar con quién. Un atacante en la red puede presentar cualquier certificado y leer o modificar el tráfico.
  distractores:
    a: Las redes internas también tienen atacantes y equipos comprometidos.
    b: El tráfico sigue cifrado; lo que se pierde es la autenticación del servidor.
    c: -k no tiene relación con la versión de HTTP.
  referencia: https://curl.se/docs/manpage.html
- id: L04-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: "4.4"
  enunciado: Al conectar con openssl s_client a una IP de curl.se sin enviar SNI, el servidor devolvió un certificado para n.sni-347-default.ssl.fastly.net. ¿Por qué?
  opciones:
    - {id: a, texto: "Porque curl.se ha cambiado de certificado"}
    - {id: b, texto: "Porque sin SNI el servidor no sabe qué sitio, de los muchos que sirve en esa IP, quieres, y entrega uno por defecto"}
    - {id: c, texto: "Porque openssl no admite TLS 1.3"}
    - {id: d, texto: "Porque la IP es de un atacante"}
  correctas: [b]
  explicacion: Una CDN sirve miles de sitios desde las mismas IP. El nombre que va en el SNI del ClientHello le dice qué certificado presentar.
  distractores:
    a: Con -servername curl.se, el mismo servidor devolvió CN=curl.se.
    c: La misma herramienta negoció TLS 1.3 con curl.se.
    d: Es la IP que devuelve el DNS para curl.se; el certificado por defecto es de su CDN.
  referencia: https://www.rfc-editor.org/rfc/rfc6066.html#section-3
- id: L04-008
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.4"
  enunciado: Según la votación SC081v3 del CA/Browser Forum, ¿qué validez máxima tendrán los certificados TLS públicos a partir de marzo de 2029?
  opciones:
    - {id: a, texto: "47 días"}
    - {id: b, texto: "398 días"}
    - {id: c, texto: "Dos años"}
    - {id: d, texto: "90 días"}
  correctas: [a]
  explicacion: La validez máxima baja de 398 días a 47 en etapas entre marzo de 2026 y marzo de 2029. Con esos plazos, la renovación tiene que estar automatizada, por ejemplo con ACME.
  distractores:
    b: Es la validez máxima anterior a los cambios.
    c: Hace años que no se admiten certificados públicos de dos años.
    d: Es lo que duran hoy los certificados de Let's Encrypt, no el máximo que fija la votación.
  referencia: https://cabforum.org/2025/04/11/ballot-sc081v3-introduce-schedule-of-reducing-validity-and-data-reuse-periods/
- id: L04-009
  tipo: completar
  dificultad: media
  objetivo: "4.4"
  enunciado: Completa el comando para conectar a un servidor indicando por SNI el nombre del sitio y ver un resumen del saludo TLS.
  codigo:
    lenguaje: bash
    fuente: |
      openssl s_client -connect curl.se:443 [[1]] curl.se -brief
  huecos:
    - {id: "1", respuestas: ["-servername"]}
  explicacion: -servername fija el nombre del SNI. Con -brief, openssl resume la versión, el cifrado, el certificado y el resultado de la verificación.
  referencia: https://docs.openssl.org/3.5/man1/openssl-s_client/
- id: L05-001
  tipo: ordering
  dificultad: baja
  objetivo: "5.1"
  enunciado: Una web no carga. Ordena las comprobaciones de abajo arriba.
  opciones:
    - {id: a, texto: "Comprobar que el nombre resuelve con dig"}
    - {id: b, texto: "Comprobar que el puerto abre con nc -vz"}
    - {id: c, texto: "Comprobar el certificado con openssl s_client"}
    - {id: d, texto: "Comprobar la respuesta HTTP con curl -v"}
  correctas: [a, b, c, d]
  explicacion: Cada paso depende del anterior. Si el nombre no resuelve, no tiene sentido mirar el certificado; si todo funciona hasta HTTP, el problema está en la aplicación.
  referencia: https://bind9.readthedocs.io/en/latest/manpages.html
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.1"
  enunciado: dig resuelve el nombre, nc conecta al 443 y openssl valida el certificado, pero curl recibe un 502 Bad Gateway. ¿Dónde está el problema más probable?
  opciones:
    - {id: a, texto: "En el DNS"}
    - {id: b, texto: "En el cortafuegos del cliente"}
    - {id: c, texto: "En el proxy o balanceador, que no consigue respuesta de la aplicación de detrás"}
    - {id: d, texto: "En el certificado"}
  correctas: [c]
  explicacion: Todas las capas hasta TLS funcionan, y quien responde es un intermediario. 502 indica que ese proxy recibió una respuesta no válida, o ninguna, del servidor al que reenvía.
  distractores:
    a: El nombre resolvió.
    b: La conexión al 443 se estableció.
    d: openssl validó la cadena.
  referencia: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.3
- id: L05-003
  tipo: matching
  dificultad: media
  objetivo: "5.2"
  enunciado: Empareja cada pregunta con la herramienta que la responde.
  prompts:
    - {id: "1", texto: "¿Qué procesos escuchan en mi servidor y en qué dirección?"}
    - {id: "2", texto: "¿Por qué routers pasa el tráfico y dónde se pierde?"}
    - {id: "3", texto: "¿Qué devuelve el servidor autoritativo de un dominio?"}
    - {id: "4", texto: "¿Qué certificados envía el servidor?"}
    - {id: "5", texto: "¿Cuánto tarda cada fase de una petición HTTPS?"}
  opciones:
    - {id: a, texto: "ss -ltnp"}
    - {id: b, texto: "mtr"}
    - {id: c, texto: "dig @servidor"}
    - {id: d, texto: "openssl s_client -showcerts"}
    - {id: e, texto: "curl -w"}
    - {id: f, texto: "ping"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d], ["5", e]]
  explicacion: Cada herramienta mira una capa distinta, y conocerlas evita adivinar.
  distractores:
    f: ping solo mide si hay respuesta ICMP y la latencia.
  referencia: https://man7.org/linux/man-pages/man8/ss.8.html
- id: L05-004
  tipo: completar
  dificultad: media
  objetivo: "5.2"
  enunciado: Completa el comando para comprobar si el puerto 5432 de bd.interna acepta conexiones, sin enviar datos y esperando como mucho 3 segundos.
  codigo:
    lenguaje: bash
    fuente: |
      nc -[[1]] -w 3 bd.interna [[2]]
  huecos:
    - {id: "1", respuestas: ["vz", "zv"]}
    - {id: "2", respuestas: ["5432"]}
  explicacion: -z solo comprueba si el puerto abre, sin enviar datos; -v muestra el resultado; y -w 3 limita la espera.
  referencia: https://man.openbsd.org/nc.1
- id: L05-005
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.3"
  enunciado: ping a un servidor de la nube no recibe ninguna respuesta, pero la web carga sin problemas. ¿Qué explica la diferencia?
  opciones:
    - {id: a, texto: "Un cortafuegos o grupo de seguridad descarta ICMP y permite el puerto 443"}
    - {id: b, texto: "La web está en caché y el servidor está caído"}
    - {id: c, texto: "ping solo funciona en redes locales"}
    - {id: d, texto: "El DNS devuelve una IP distinta para ping"}
  correctas: [a]
  explicacion: ICMP y TCP 443 son cosas distintas para un cortafuegos. Que ping falle no prueba que el servidor esté caído; prueba el puerto real.
  distractores:
    b: Una caché no explicaría que nuevas peticiones lleguen al servidor y respondan.
    c: ping funciona a través de Internet; en la prueba, curl.se respondió con unos 5 ms.
    d: El DNS devuelve las mismas IP con independencia de la herramienta.
  referencia: https://man7.org/linux/man-pages/man8/ping.8.html
- id: L05-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: "5.3"
  enunciado: En un informe de mtr, el salto 5 muestra 100 % de pérdida, pero los saltos 6 a 9 y el destino muestran 0 %. ¿Qué significa?
  opciones:
    - {id: a, texto: "Que se pierde todo el tráfico en el salto 5"}
    - {id: b, texto: "Que el destino está caído"}
    - {id: c, texto: "Que hay que cambiar de proveedor"}
    - {id: d, texto: "Que el router del salto 5 no contesta a las sondas, pero reenvía el tráfico con normalidad"}
  correctas: [d]
  explicacion: Si el tráfico se perdiera en el salto 5, los siguientes también mostrarían pérdida. Solo es grave la pérdida que empieza en un salto y sigue hasta el destino.
  distractores:
    a: Los saltos siguientes reciben y responden, así que el tráfico pasa por el 5.
    b: El destino responde con 0 % de pérdida.
    c: No hay ningún problema que resolver.
  referencia: https://man7.org/linux/man-pages/man8/tracepath.8.html
- id: L05-007
  tipo: matching
  dificultad: media
  objetivo: "5.4"
  enunciado: Empareja cada síntoma con su causa más probable.
  prompts:
    - {id: "1", texto: "curl: Could not resolve host"}
    - {id: "2", texto: "Funciona en tu equipo pero no en el de un compañero tras cambiar la IP de un dominio"}
    - {id: "3", texto: "curl: (60) certificate has expired"}
    - {id: "4", texto: "Connection refused al conectar desde otro equipo; en el servidor, ss muestra 127.0.0.1:8000"}
  opciones:
    - {id: a, texto: "El nombre no existe o el resolvedor falla"}
    - {id: b, texto: "Su resolvedor tiene en caché la IP antigua"}
    - {id: c, texto: "Hay que renovar el certificado"}
    - {id: d, texto: "El servicio solo escucha en loopback"}
    - {id: e, texto: "El cable de red está desconectado"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d]]
  explicacion: Cada mensaje apunta a una capa concreta, y conocer el síntoma ahorra pruebas inútiles.
  distractores:
    e: Sin cable, fallarían todas las conexiones, empezando por la resolución de nombres.
  referencia: https://bind9.readthedocs.io/en/latest/manpages.html
- id: L05-008
  tipo: multiple_response
  dificultad: alta
  objetivo: "5.4"
  enunciado: La primera petición a una API tarda 600 ms y las siguientes, 40 ms. ¿Qué causas encajan, y cómo lo confirmarías?
  opciones:
    - {id: a, texto: "Una resolución DNS lenta, que después queda en caché; se ve en time_namelookup de curl -w"}
    - {id: b, texto: "El coste de abrir TCP y TLS, que las siguientes peticiones se ahorran al reutilizar la conexión; se ve en time_connect y time_appconnect"}
    - {id: c, texto: "Un arranque en frío del servidor o de su caché; se ve en el tiempo hasta el primer byte"}
    - {id: d, texto: "Que el certificado ha caducado"}
    - {id: e, texto: "Que la API devuelve 404 la primera vez"}
  correctas: [a, b, c]
  explicacion: curl -w separa las fases y dice cuál se lleva el tiempo. Las causas habituales son el DNS, los saludos y el servidor.
  distractores:
    d: Un certificado caducado da error, no una petición lenta que funciona.
    e: El código de estado no explica la diferencia de tiempos, y las peticiones funcionan.
  referencia: https://everything.curl.dev/usingcurl/verbose/writeout.html
