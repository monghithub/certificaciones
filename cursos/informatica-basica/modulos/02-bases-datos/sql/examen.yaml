- id: L05-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: '5.4'
  enunciado: La consulta WHERE id NOT IN (SELECT cliente_id FROM bajas) no devuelve
    ninguna fila, aunque hay clientes que no están de baja. La tabla bajas tiene un
    cliente_id NULL. ¿Por qué?
