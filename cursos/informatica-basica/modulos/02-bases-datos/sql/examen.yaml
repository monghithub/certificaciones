  - id: a
    texto: Porque NOT IN no se puede usar con subconsultas
  - id: b
    texto: Porque bajas está vacía
  - id: c
    texto: Porque NOT IN ignora los NULL
  - id: d
    texto: Porque comparar con un NULL da desconocido, así que x NOT IN (…, NULL)
      nunca es verdadero
  correctas:
  - d
  explicacion: NOT IN equivale a una cadena de desigualdades unidas por AND; la que
