- id: L05-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.3'
  enunciado: ¿Qué es la consistencia eventual?
  opciones:
  - id: a
    texto: Que los datos solo son correctos a veces
  - id: b
    texto: Que si dejan de llegar escrituras, todas las réplicas acaban con el mismo
      valor, aunque mientras tanto una lectura pueda ser antigua
  - id: c
    texto: Que las escrituras tardan un día
  - id: d
    texto: Que no hay réplicas
  correctas:
  - b
  explicacion: Es la garantía descrita por Werner Vogels; las réplicas convergen,
    pero no al instante.
  distractores:
    a: Los datos convergen al valor correcto.
    c: El retraso suele ser de milisegundos o segundos.
    d: Se refiere justamente a réplicas.
  referencia: https://www.allthingsdistributed.com/2008/12/eventually_consistent.html
- id: L05-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: '5.3'
  enunciado: Según el teorema CAP, ¿qué hay que elegir ante una partición de red?
  opciones:
  - id: a
    texto: Entre consistencia y disponibilidad
  - id: b
    texto: Entre SQL y NoSQL
  - id: c
    texto: Entre velocidad y coste
  - id: d
    texto: Nada; se pueden tener las tres propiedades a la vez
  correctas:
  - a
  explicacion: Con la red partida, o se rechazan operaciones para no dar datos incoherentes
