- id: L01-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.1'
  enunciado: Un router intermedio reenvía un paquete con una petición HTTPS. ¿Qué
    información necesita leer para decidir por dónde enviarlo?
  opciones:
  - id: a
    texto: La URL de la petición HTTP
  - id: b
    texto: La dirección IP de destino
  - id: c
    texto: El contenido descifrado de la conexión TLS
  - id: d
    texto: El nombre del certificado del servidor
  correctas:
  - b
  explicacion: Un router trabaja en la capa de internet. Mira la IP de destino y su
    tabla de rutas; lo que va dentro (TCP, TLS, HTTP) no le hace falta.
  distractores:
    a: La URL va dentro de la conexión cifrada; el router no la ve ni la necesita.
    c: El router no tiene las claves de TLS.
    d: El certificado es cosa de TLS, en los extremos de la conexión.
  referencia: https://www.rfc-editor.org/rfc/rfc1122.html
- id: L01-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.2'
  enunciado: ¿Cuántas direcciones tiene la red 192.168.1.0/26?
  opciones:
  - id: a
    texto: '26'
  - id: b
    texto: '256'
  - id: c
    texto: '64'
  - id: d
    texto: '128'
  correctas:
  - c
  explicacion: Quedan 32 − 26 = 6 bits libres, así que hay 2^6 = 64 direcciones, de
    192.168.1.0 a 192.168.1.63.
  distractores:
    a: El 26 es el número de bits fijos, no de direcciones.
    b: 256 corresponde a una /24.
    d: 128 corresponde a una /25.
  referencia: https://www.rfc-editor.org/rfc/rfc4632.html
- id: L01-005
  tipo: matching
  dificultad: media
  objetivo: '1.3'
  enunciado: Empareja cada dirección con el tipo de rango al que pertenece.
  prompts:
  - id: '1'
    texto: 192.168.1.141
  - id: '2'
    texto: 127.0.0.1
  - id: '3'
    texto: 169.254.169.254
  - id: '4'
    texto: 100.64.1.1
  - id: '5'
    texto: 8.8.8.8
  opciones:
  - id: a
    texto: Privada (RFC 1918)
  - id: b
    texto: Loopback
  - id: c
    texto: Enlace local
  - id: d
    texto: NAT de operador (CGNAT)
  - id: e
    texto: Pública, enrutable en Internet
  - id: f
    texto: Multidifusión
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  - - '5'
    - e
  explicacion: 192.168.0.0/16 es privada; 127.0.0.0/8, el propio equipo; 169.254.0.0/16,
    enlace local (la usan los servicios de metadatos de la nube); 100.64.0.0/10, el
    espacio compartido de los operadores; y 8.8.8.8, una dirección pública.
  distractores:
    f: La multidifusión IPv4 usa 224.0.0.0/4; ninguna de estas direcciones está ahí.
  referencia: https://www.rfc-editor.org/rfc/rfc6598.html
- id: L01-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: '1.3'
  enunciado: Un servidor accesible desde Internet solo debe aceptar peticiones del
    servicio de metadatos de la nube si vienen de dentro. Un compañero propone confiar
    en cualquier IP del rango 169.254.0.0/16. ¿Qué es lo correcto?
  opciones:
  - id: a
    texto: Es seguro, porque ese rango es de enlace local y no lo pueden usar desde
      Internet
  - id: b
    texto: El rango es privado de RFC 1918, así que no hay riesgo
  - id: c
    texto: Solo es seguro con IPv6
  - id: d
    texto: Es el destino típico de un ataque SSRF, así que el problema está en que
      tu servidor no haga peticiones a ese rango por cuenta de un usuario
  correctas:
  - d
  explicacion: 169.254.169.254 no se alcanza desde Internet, pero sí desde tu propio
    servidor. Si este descarga URL que da el usuario, el atacante llega a los metadatos
    a través de él. El problema es el SSRF.
  distractores:
    a: Desde Internet no llega directamente, pero tu servidor sí puede, y ese es el
      riesgo.
    b: 169.254.0.0/16 es de enlace local (RFC 3927), no un rango de RFC 1918.
    c: La familia de direcciones no cambia el problema.
  referencia: https://www.rfc-editor.org/rfc/rfc3927.html
- id: L02-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.1'
  enunciado: Con curl -w, una petición HTTPS mostró time_namelookup 0,0017, time_connect
    0,0059 y time_appconnect 0,0157 segundos. ¿Cuánto tardó el saludo TLS?
  opciones:
  - id: a
    texto: 15,7 ms
  - id: b
    texto: 4,2 ms
  - id: c
    texto: 1,7 ms
  - id: d
    texto: Unos 9,8 ms, la diferencia entre time_appconnect y time_connect
  correctas:
  - d
  explicacion: Los tiempos de --write-out son acumulados desde el inicio. El saludo
    TLS es lo que va de terminar la conexión TCP (0,0059) a terminar TLS (0,0157).
  distractores:
    a: Es el tiempo total hasta acabar TLS, que incluye DNS y TCP.
    b: Es lo que tardó la conexión TCP, de 0,0017 a 0,0059.
    c: Es lo que tardó la resolución DNS.
  referencia: https://everything.curl.dev/usingcurl/verbose/writeout.html
- id: L02-003
  tipo: multiple_choice
  dificultad: alta
  objetivo: '2.1'
  enunciado: Un servicio abre una conexión nueva para cada una de sus miles de llamadas
    por segundo a otra API y empieza a fallar con errores al asignar direcciones locales.
    ¿Cuál es la causa más probable y la solución?
  opciones:
  - id: a
    texto: Las conexiones en TIME_WAIT agotan los puertos efímeros; hay que reutilizar
      conexiones con un pool
  - id: b
    texto: La API está caída; hay que reintentar más rápido
  - id: c
    texto: Falta ancho de banda; hay que comprimir las respuestas
  - id: d
    texto: El DNS no responde; hay que bajar el TTL
  correctas:
  - a
  explicacion: Cada conexión cerrada por el cliente deja su puerto efímero un tiempo
    en TIME_WAIT. Con miles por segundo, el rango se agota. Reutilizar conexiones
    elimina el problema y además ahorra los saludos.
  distractores:
    b: Reintentar más rápido abriría todavía más conexiones.
    c: El error es de puertos locales, no de capacidad de la red.
    d: El fallo se produce al conectar, no al resolver el nombre.
  referencia: https://www.rfc-editor.org/rfc/rfc9293.html#section-3.6
- id: L02-005
  tipo: matching
  dificultad: media
  objetivo: '2.3'
  enunciado: Empareja cada síntoma al conectar con su causa más probable.
  prompts:
  - id: '1'
    texto: Connection refused, al instante
  - id: '2'
    texto: Connection timed out tras unos segundos
  - id: '3'
    texto: Funciona desde el propio servidor pero no desde otro equipo, y ss muestra
      127.0.0.1:8080 en escucha
  opciones:
  - id: a
    texto: No hay ningún proceso escuchando en ese puerto
  - id: b
    texto: Un cortafuegos descarta los paquetes o la IP no responde
  - id: c
    texto: El servicio solo escucha en la interfaz loopback
  - id: d
    texto: El certificado TLS ha caducado
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: El rechazo inmediato es un RST del equipo; el tiempo agotado es que
    nadie contesta al SYN; y escuchar en 127.0.0.1 solo acepta conexiones locales.
  distractores:
    d: Un certificado caducado da un error de TLS después de conectar, no un fallo
      al conectar.
  referencia: https://man7.org/linux/man-pages/man8/ss.8.html
- id: L02-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.4'
  enunciado: En la prueba, un sendto con Python a un puerto UDP cerrado devolvió 4
    bytes enviados, sin error. ¿Por qué?
  opciones:
  - id: a
    texto: Porque el puerto 9 está abierto en este equipo
  - id: b
    texto: 'Porque UDP no tiene saludo ni confirmaciones: enviar no espera respuesta
      del destino'
  - id: c
    texto: Porque Python reintentó hasta que funcionó
  - id: d
    texto: Porque el datagrama se guardó para cuando se abra el puerto
  correctas:
  - b
  explicacion: UDP envía el datagrama y se olvida. El error del destino (un ICMP de
    puerto inaccesible) solo se notificó después, al leer de un socket UDP conectado.
  distractores:
    a: El puerto estaba cerrado; el recv posterior dio Connection refused.
    c: UDP no reintenta; si la aplicación quiere fiabilidad, la añade ella.
    d: Un datagrama que no se puede entregar se descarta.
  referencia: https://www.rfc-editor.org/rfc/rfc768.html
- id: L03-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.1'
  enunciado: ¿Qué sabe un servidor raíz cuando le preguntan por curl.se?
  opciones:
  - id: a
    texto: La dirección IP de curl.se
  - id: b
    texto: Qué servidores gestionan el dominio de primer nivel .se
  - id: c
    texto: Los nombres de Internet, para responder sin preguntar a nadie más
  - id: d
    texto: 'Nada: solo responde a los resolvedores de los proveedores'
  correctas:
  - b
  explicacion: La raíz solo delega los dominios de primer nivel. Para curl.se responde
    con los servidores de .se, que a su vez delegan en los de curl.se.
  distractores:
    a: La dirección la tienen los servidores autoritativos de curl.se.
    c: El DNS es distribuido; ningún servidor tiene todos los nombres.
    d: Responde a cualquier consulta, incluida la que hizo dig +trace desde este equipo.
  referencia: https://www.iana.org/domains/root/servers
- id: L03-004
  tipo: multiple_choice
  dificultad: alta
  objetivo: '3.2'
  enunciado: Quieres que el dominio tienda.example, sin www, apunte al balanceador
    de un proveedor mediante un CNAME. ¿Qué ocurre?
  opciones:
  - id: a
    texto: Funciona igual que en www
  - id: b
    texto: Funciona, pero el correo deja de llegar en unas horas
  - id: c
    texto: 'No se permite: un nombre con CNAME no puede tener otros registros, y el
      dominio raíz de la zona necesita sus NS y su SOA'
  - id: d
    texto: Solo funciona con IPv6
  correctas:
  - c
  explicacion: Un CNAME declara que el nombre es otro, así que no puede convivir con
    otros registros. Muchos proveedores ofrecen alias propios (ALIAS, ANAME o aplanado
    de CNAME) para el dominio raíz.
  distractores:
    a: En www no hay NS ni SOA, por eso allí sí puede haber un CNAME.
    b: El problema no es de tiempo; la configuración no es válida.
    d: La restricción no depende de la familia de direcciones.
  referencia: https://www.rfc-editor.org/rfc/rfc1034.html#section-3.6.2
- id: L03-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: Un dominio tiene MX 5 correo1.example. y MX 30 correo2.example. ¿Adónde
    intentan entregar primero los servidores de correo?
  opciones:
  - id: a
    texto: A correo2, porque 30 es mayor
  - id: b
    texto: A los dos a la vez
  - id: c
    texto: Al azar
  - id: d
    texto: A correo1, porque el número menor tiene más prioridad
  correctas:
  - d
  explicacion: En MX, la preferencia más baja se intenta primero. Es lo que tenía
    gmail.com, con prioridad 5 para el principal y 30 o 40 para los alternativos.
  distractores:
    a: Es al revés; el número mayor es el de respaldo.
    b: Se intenta por orden de preferencia.
    c: El azar solo se usa entre registros con la misma preferencia.
  referencia: https://www.rfc-editor.org/rfc/rfc5321.html#section-5.1
- id: L03-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: El registro A de tu web tiene TTL 86400 y mañana migras a otra IP. ¿Qué
    conviene hacer?
  opciones:
  - id: a
    texto: Bajar el TTL, por ejemplo a 300, al menos un día antes, y subirlo cuando
      la migración esté estable
  - id: b
    texto: Cambiar la IP y bajar el TTL a la vez
  - id: c
    texto: Subir el TTL para que el cambio se fije antes
  - id: d
    texto: 'Nada: los resolvedores consultan al autoritativo en cada petición'
  correctas:
  - a
  explicacion: Los resolvedores guardan la respuesta durante el TTL que tenía cuando
    la obtuvieron. Si lo bajas con al menos esa antelación, cuando cambies la IP todos
    la renovarán en pocos minutos.
  distractores:
    b: Los resolvedores que ya guardaron el valor antiguo lo mantendrán hasta 24 horas.
    c: Un TTL más alto retrasa todavía más el cambio.
    d: Los resolvedores usan su caché mientras dura el TTL, como mostró el TTL que
      bajaba entre dos consultas.
  referencia: https://www.rfc-editor.org/rfc/rfc1035.html#section-3.2.1
- id: L03-007
  tipo: matching
  dificultad: media
  objetivo: '3.4'
  enunciado: Empareja cada estado de la cabecera de dig con su significado.
  prompts:
  - id: '1'
    texto: NOERROR
  - id: '2'
    texto: NXDOMAIN
  - id: '3'
    texto: SERVFAIL
  opciones:
  - id: a
    texto: La consulta ha ido bien, aunque puede no haber registros de ese tipo
  - id: b
    texto: El nombre no existe
  - id: c
    texto: El resolvedor no ha podido obtener una respuesta
  - id: d
    texto: El registro ha caducado
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: NXDOMAIN es una respuesta definitiva de que el nombre no existe, y
    también se guarda en caché. SERVFAIL indica un problema al resolver, como servidores
    autoritativos que no responden o un fallo de DNSSEC.
  distractores:
    d: Un registro caducado en caché se vuelve a consultar; no genera un estado propio.
  referencia: https://www.rfc-editor.org/rfc/rfc1035.html#section-4.1.1
- id: L03-009
  tipo: multiple_choice
  dificultad: alta
  objetivo: '3.4'
  enunciado: Has cambiado la IP de api.tienda.example. Con dig @ns1 de tu proveedor
    ves la nueva, pero con dig sin servidor ves la antigua. ¿Qué pasa?
  opciones:
  - id: a
    texto: El cambio no se ha guardado
  - id: b
    texto: Tu resolvedor tiene la respuesta antigua en caché hasta que caduque su
      TTL
  - id: c
    texto: El servidor autoritativo está caído
  - id: d
    texto: Hay que reiniciar el servidor web
  correctas:
  - b
  explicacion: El autoritativo ya da el valor nuevo; tu resolvedor recursivo sirve
    el que guardó, durante lo que le quede de TTL.
  distractores:
    a: Si no se hubiera guardado, el autoritativo devolvería la IP antigua.
    c: El autoritativo respondió a la consulta directa.
    d: El servidor web no interviene en la resolución de nombres.
  referencia: https://www.rfc-editor.org/rfc/rfc1034.html#section-4.3.1
- id: L04-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: ¿Cuántos viajes de ida y vuelta necesita un saludo completo de TLS 1.3
    antes de que el cliente envíe sus datos?
  opciones:
  - id: a
    texto: Ninguno
  - id: b
    texto: Uno
  - id: c
    texto: Dos, como en TLS 1.2
  - id: d
    texto: Tres
  correctas:
  - b
  explicacion: En TLS 1.3 el cliente envía su clave efímera ya en el ClientHello.
    Con la respuesta del servidor, los dos tienen el secreto compartido y el cliente
    puede enviar datos tras un único viaje.
  distractores:
    a: Solo se envían datos sin esperar (0-RTT) al reanudar una sesión anterior, y
      con limitaciones.
    c: TLS 1.2 necesitaba dos viajes; 1.3 lo redujo a uno.
    d: Ninguna versión de TLS necesita tres.
  referencia: https://www.rfc-editor.org/rfc/rfc8446.html#section-2
- id: L04-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.2'
  enunciado: El certificado de un servidor tiene CN=tienda.example y en su Subject
    Alternative Name solo www.tienda.example. ¿Para qué nombre lo aceptará un navegador
    actual?
  opciones:
  - id: a
    texto: Para tienda.example y www.tienda.example
  - id: b
    texto: Solo para tienda.example, porque manda el CN
  - id: c
    texto: Solo para www.tienda.example
  - id: d
    texto: Para api.tienda.example y los demás subdominios
  correctas:
  - c
  explicacion: Los clientes validan el nombre contra el SAN; el CN ya no se tiene
    en cuenta. tienda.example sin www daría un error de nombre.
  distractores:
    a: El CN no añade nombres válidos.
    b: Es justo al revés; el CN está obsoleto para validar.
    d: Haría falta un comodín como *.tienda.example en el SAN.
  referencia: https://www.rfc-editor.org/rfc/rfc5280.html#section-4.2.1.6
- id: L04-005
  tipo: matching
  dificultad: media
  objetivo: '4.3'
  enunciado: Empareja cada mensaje de error de curl con su causa.
  prompts:
  - id: '1'
    texto: certificate has expired
  - id: '2'
    texto: self-signed certificate
  - id: '3'
    texto: no alternative certificate subject name matches target hostname
  - id: '4'
    texto: self-signed certificate in certificate chain
  opciones:
  - id: a
    texto: La fecha notAfter ya pasó
  - id: b
    texto: El certificado se firma a sí mismo y no hay cadena hasta una raíz
  - id: c
    texto: El nombre al que te conectas no está en el SAN
  - id: d
    texto: La cadena acaba en una raíz que el cliente no tiene
  - id: e
    texto: El servidor no admite TLS 1.3
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Son los errores que dieron expired, self-signed, wrong.host y untrusted-root
    de badssl.com, todos con el código 60 de curl.
  distractores:
    e: Un problema de versión da un error de negociación, no de verificación del certificado.
  referencia: https://docs.openssl.org/3.5/man1/openssl-s_client/
- id: L04-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: '4.4'
  enunciado: Al conectar con openssl s_client a una IP de curl.se sin enviar SNI,
    el servidor devolvió un certificado para n.sni-347-default.ssl.fastly.net. ¿Por
    qué?
  opciones:
  - id: a
    texto: Porque curl.se ha cambiado de certificado
  - id: b
    texto: Porque sin SNI el servidor no sabe qué sitio, de los muchos que sirve en
      esa IP, quieres, y entrega uno por defecto
  - id: c
    texto: Porque openssl no admite TLS 1.3
  - id: d
    texto: Porque la IP es de un atacante
  correctas:
  - b
  explicacion: Una CDN sirve miles de sitios desde las mismas IP. El nombre que va
    en el SNI del ClientHello le dice qué certificado presentar.
  distractores:
    a: Con -servername curl.se, el mismo servidor devolvió CN=curl.se.
    c: La misma herramienta negoció TLS 1.3 con curl.se.
    d: Es la IP que devuelve el DNS para curl.se; el certificado por defecto es de
      su CDN.
  referencia: https://www.rfc-editor.org/rfc/rfc6066.html#section-3
- id: L04-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.4'
  enunciado: Según la votación SC081v3 del CA/Browser Forum, ¿qué validez máxima tendrán
    los certificados TLS públicos a partir de marzo de 2029?
  opciones:
  - id: a
    texto: 47 días
  - id: b
    texto: 398 días
  - id: c
    texto: Dos años
  - id: d
    texto: 90 días
  correctas:
  - a
  explicacion: La validez máxima baja de 398 días a 47 en etapas entre marzo de 2026
    y marzo de 2029. Con esos plazos, la renovación tiene que estar automatizada,
    por ejemplo con ACME.
  distractores:
    b: Es la validez máxima anterior a los cambios.
    c: Hace años que no se admiten certificados públicos de dos años.
    d: Es lo que duran hoy los certificados de Let's Encrypt, no el máximo que fija
      la votación.
  referencia: https://cabforum.org/2025/04/11/ballot-sc081v3-introduce-schedule-of-reducing-validity-and-data-reuse-periods/
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.1'
  enunciado: dig resuelve el nombre, nc conecta al 443 y openssl valida el certificado,
    pero curl recibe un 502 Bad Gateway. ¿Dónde está el problema más probable?
  opciones:
  - id: a
    texto: En el DNS
  - id: b
    texto: En el cortafuegos del cliente
  - id: c
    texto: En el proxy o balanceador, que no consigue respuesta de la aplicación de
      detrás
  - id: d
    texto: En el certificado
  correctas:
  - c
  explicacion: Todas las capas hasta TLS funcionan, y quien responde es un intermediario.
    502 indica que ese proxy recibió una respuesta no válida, o ninguna, del servidor
    al que reenvía.
  distractores:
    a: El nombre resolvió.
    b: La conexión al 443 se estableció.
    d: openssl validó la cadena.
  referencia: https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.3
- id: L05-003
  tipo: matching
  dificultad: media
  objetivo: '5.2'
  enunciado: Empareja cada pregunta con la herramienta que la responde.
  prompts:
  - id: '1'
    texto: ¿Qué procesos escuchan en mi servidor y en qué dirección?
  - id: '2'
    texto: ¿Por qué routers pasa el tráfico y dónde se pierde?
  - id: '3'
    texto: ¿Qué devuelve el servidor autoritativo de un dominio?
  - id: '4'
    texto: ¿Qué certificados envía el servidor?
  - id: '5'
    texto: ¿Cuánto tarda cada fase de una petición HTTPS?
  opciones:
  - id: a
    texto: ss -ltnp
  - id: b
    texto: mtr
  - id: c
    texto: dig @servidor
  - id: d
    texto: openssl s_client -showcerts
  - id: e
    texto: curl -w
  - id: f
    texto: ping
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  - - '5'
    - e
  explicacion: Cada herramienta mira una capa distinta, y conocerlas evita adivinar.
  distractores:
    f: ping solo mide si hay respuesta ICMP y la latencia.
  referencia: https://man7.org/linux/man-pages/man8/ss.8.html
- id: L05-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.3'
  enunciado: ping a un servidor de la nube no recibe ninguna respuesta, pero la web
    carga sin problemas. ¿Qué explica la diferencia?
  opciones:
  - id: a
    texto: Un cortafuegos o grupo de seguridad descarta ICMP y permite el puerto 443
  - id: b
    texto: La web está en caché y el servidor está caído
  - id: c
    texto: ping solo funciona en redes locales
  - id: d
    texto: El DNS devuelve una IP distinta para ping
  correctas:
  - a
  explicacion: ICMP y TCP 443 son cosas distintas para un cortafuegos. Que ping falle
    no prueba que el servidor esté caído; prueba el puerto real.
  distractores:
    b: Una caché no explicaría que nuevas peticiones lleguen al servidor y respondan.
    c: ping funciona a través de Internet; en la prueba, curl.se respondió con unos
      5 ms.
    d: El DNS devuelve las mismas IP con independencia de la herramienta.
  referencia: https://man7.org/linux/man-pages/man8/ping.8.html
- id: L05-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: '5.3'
  enunciado: En un informe de mtr, el salto 5 muestra 100 % de pérdida, pero los saltos
    6 a 9 y el destino muestran 0 %. ¿Qué significa?
  opciones:
  - id: a
    texto: Que se pierde todo el tráfico en el salto 5
  - id: b
    texto: Que el destino está caído
  - id: c
    texto: Que hay que cambiar de proveedor
  - id: d
    texto: Que el router del salto 5 no contesta a las sondas, pero reenvía el tráfico
      con normalidad
  correctas:
  - d
  explicacion: Si el tráfico se perdiera en el salto 5, los siguientes también mostrarían
    pérdida. Solo es grave la pérdida que empieza en un salto y sigue hasta el destino.
  distractores:
    a: Los saltos siguientes reciben y responden, así que el tráfico pasa por el 5.
    b: El destino responde con 0 % de pérdida.
    c: No hay ningún problema que resolver.
  referencia: https://man7.org/linux/man-pages/man8/tracepath.8.html
- id: L05-007
  tipo: matching
  dificultad: media
  objetivo: '5.4'
  enunciado: Empareja cada síntoma con su causa más probable.
  prompts:
  - id: '1'
    texto: 'curl: Could not resolve host'
  - id: '2'
    texto: Funciona en tu equipo pero no en el de un compañero tras cambiar la IP
      de un dominio
  - id: '3'
    texto: 'curl: (60) certificate has expired'
  - id: '4'
    texto: Connection refused al conectar desde otro equipo; en el servidor, ss muestra
      127.0.0.1:8000
  opciones:
  - id: a
    texto: El nombre no existe o el resolvedor falla
  - id: b
    texto: Su resolvedor tiene en caché la IP antigua
  - id: c
    texto: Hay que renovar el certificado
  - id: d
    texto: El servicio solo escucha en loopback
  - id: e
    texto: El cable de red está desconectado
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Cada mensaje apunta a una capa concreta, y conocer el síntoma ahorra
    pruebas inútiles.
  distractores:
    e: Sin cable, fallarían todas las conexiones, empezando por la resolución de nombres.
  referencia: https://bind9.readthedocs.io/en/latest/manpages.html
- id: L01-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.2'
  enunciado: Un DELETE /productos/2 devuelve 204 y, al repetirlo, 404. ¿Sigue siendo
    idempotente?
  opciones:
  - id: a
    texto: No, porque las dos respuestas son distintas
  - id: b
    texto: Solo si el servidor devuelve 204 las dos veces
  - id: c
    texto: 'Sí, porque el efecto en el servidor es el mismo: el producto está borrado'
  - id: d
    texto: Depende de si el cliente usó HTTP/1.1 o HTTP/2
  correctas:
  - c
  explicacion: La idempotencia se refiere al efecto en el servidor, no al código de
    la respuesta. Tras el primer DELETE el producto ya no existe, y los siguientes
    no cambian nada más.
  distractores:
    a: Confunde el efecto con la respuesta. Que cambie el código no rompe la idempotencia.
    b: El servidor puede responder 404 a la segunda llamada sin dejar de ser idempotente.
    d: La semántica de los métodos es la misma en todas las versiones de HTTP.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2
- id: L01-006
  tipo: matching
  dificultad: media
  objetivo: '1.3'
  enunciado: Empareja cada situación con el código de estado más adecuado.
  prompts:
  - id: '1'
    texto: Se ha creado el producto; su URL va en Location
  - id: '2'
    texto: La petición no lleva credenciales válidas
  - id: '3'
    texto: El usuario está identificado, pero no tiene permiso para esa operación
  - id: '4'
    texto: El recurso no admite PUT; los métodos válidos van en Allow
  - id: '5'
    texto: El borrado ha ido bien y no hay nada que devolver
  opciones:
  - id: a
    texto: 201 Created
  - id: b
    texto: 401 Unauthorized
  - id: c
    texto: 403 Forbidden
  - id: d
    texto: 405 Method Not Allowed
  - id: e
    texto: 204 No Content
  - id: f
    texto: 500 Internal Server Error
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  - - '5'
    - e
  explicacion: 201 indica que se creó un recurso; 401, que faltan credenciales válidas;
    403, que no hay permiso; 405, que el método no se admite, con la cabecera Allow;
    y 204, éxito sin cuerpo. El servidor de prueba devolvió 201 con Location, 405
    con Allow y 204.
  distractores:
    f: 500 es un error inesperado del servidor; ninguna de estas situaciones lo es.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-15
- id: L01-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: '1.3'
  enunciado: Un formulario hace POST /pedidos y el servidor quiere redirigir a otra
    URL manteniendo el método POST. ¿Qué código debe usar?
  opciones:
  - id: a
    texto: 302 Found
  - id: b
    texto: 301 Moved Permanently
  - id: c
    texto: 304 Not Modified
  - id: d
    texto: 307 Temporary Redirect
  correctas:
  - d
  explicacion: 307 (temporal) y 308 (permanente) obligan al cliente a repetir la petición
    con el mismo método y cuerpo. Con 301 y 302, por motivos históricos, los clientes
    pueden cambiar un POST por un GET.
  distractores:
    a: Con 302 el cliente puede pasar el POST a GET y perder el cuerpo.
    b: Con 301 pasa lo mismo que con 302, y además es permanente.
    c: 304 no es una redirección a otra URL; responde a una petición condicional.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-15.4.8
- id: L01-009
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.4'
  enunciado: Ejecutas curl -X HEAD https://tienda.example/ y el comando se queda esperando.
    ¿Por qué?
  opciones:
  - id: a
    texto: El servidor no admite HEAD
  - id: b
    texto: -X solo cambia la palabra del método; curl sigue esperando el cuerpo que
      anuncia Content-Length, y un HEAD no lo trae
  - id: c
    texto: HEAD necesita HTTP/2
  - id: d
    texto: Falta la opción -v
  correctas:
  - b
  explicacion: El manual de curl lo advierte. -X cambia la palabra que se envía, no
    el comportamiento de curl. Para una petición HEAD correcta se usa -I (--head).
  distractores:
    a: Si el servidor no admitiera HEAD respondería con un error, no dejaría la conexión
      esperando.
    c: HEAD existe desde HTTP/1.0.
    d: -v solo muestra más información; no cambia la espera.
  referencia: https://curl.se/docs/manpage.html
- id: L02-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.2'
  enunciado: Una respuesta lleva Cache-Control no-cache. ¿Qué puede hacer el navegador
    con ella?
  opciones:
  - id: a
    texto: Guardarla, pero revalidarla con el servidor antes de cada uso
  - id: b
    texto: 'Nada: no puede guardarla'
  - id: c
    texto: Reutilizarla sin preguntar durante una hora
  - id: d
    texto: Guardarla solo en las cachés compartidas
  correctas:
  - a
  explicacion: no-cache permite almacenar la respuesta, pero obliga a confirmar con
    el servidor (por ejemplo, con If-None-Match) que sigue siendo válida antes de
    usarla.
  distractores:
    b: Eso es no-store. La confusión entre las dos directivas es muy frecuente.
    c: Reutilizar sin preguntar es lo que permite max-age mientras la respuesta es
      fresca.
    d: Lo que decide qué cachés pueden guardarla es private o public, no no-cache.
  referencia: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.4
- id: L02-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.2'
  enunciado: La página con los movimientos de la cuenta de un cliente no debe guardarse
    en ninguna caché. ¿Qué directiva usas?
  opciones:
  - id: a
    texto: 'Cache-Control: no-cache'
  - id: b
    texto: 'Cache-Control: no-store'
  - id: c
    texto: 'Cache-Control: max-age=0'
  - id: d
    texto: 'Cache-Control: public'
  correctas:
  - b
  explicacion: no-store pide que la respuesta no se guarde en ninguna caché, ni en
    el navegador ni en proxies. Es la directiva para datos sensibles.
  distractores:
    a: no-cache deja guardarla; solo obliga a revalidar antes de usarla.
    c: max-age=0 la da por caducada al instante, pero no prohíbe guardarla.
    d: public permite que la guarden incluso las cachés compartidas, justo lo contrario.
  referencia: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.5
- id: L02-004
  tipo: matching
  dificultad: media
  objetivo: '2.2'
  enunciado: Empareja cada directiva de Cache-Control con su efecto.
  prompts:
  - id: '1'
    texto: max-age=60
  - id: '2'
    texto: private
  - id: '3'
    texto: s-maxage=300
  - id: '4'
    texto: must-revalidate
  opciones:
  - id: a
    texto: 'Fresca 60 s: se reutiliza sin preguntar'
  - id: b
    texto: Solo la puede guardar la caché del propio usuario
  - id: c
    texto: Tiempo de frescura solo para las cachés compartidas
  - id: d
    texto: Caducada, no se sirve sin revalidar aunque el servidor no responda
  - id: e
    texto: Comprime la respuesta
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: max-age da la frescura; private excluye los proxies y las CDN; s-maxage
    aplica solo a las cachés compartidas; y must-revalidate impide servir una copia
    caducada sin confirmar con el servidor.
  distractores:
    e: La compresión se negocia con Accept-Encoding y Content-Encoding, no con Cache-Control.
  referencia: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2
- id: L02-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: '2.3'
  enunciado: ¿Por qué se prefiere un ETag a Last-Modified como validador?
  opciones:
  - id: a
    texto: Porque Last-Modified tiene precisión de segundos y un recurso puede cambiar
      dos veces en el mismo segundo
  - id: b
    texto: Porque Last-Modified no lo entienden los navegadores
  - id: c
    texto: Porque el ETag cifra la respuesta
  - id: d
    texto: Porque con ETag la respuesta no caduca
  correctas:
  - a
  explicacion: Las fechas HTTP no bajan del segundo. Un ETag identifica la versión
    exacta, por ejemplo con un resumen del contenido, como el servidor de prueba.
  distractores:
    b: Los navegadores usan If-Modified-Since con normalidad; el servidor estándar
      de Python respondió 304 así.
    c: El ETag es un identificador, no cifra nada.
    d: La caducidad la fija Cache-Control; el ETag sirve para revalidar después.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-8.8.3
- id: L02-008
  tipo: multiple_choice
  dificultad: alta
  objetivo: '2.4'
  enunciado: Una CDN guarda la página principal y algunos clientes reciben una versión
    comprimida con br que no saben descomprimir. ¿Qué cabecera debería enviar el servidor?
  opciones:
  - id: a
    texto: 'Cache-Control: no-cache'
  - id: b
    texto: Content-Length
  - id: c
    texto: 'Vary: Accept-Encoding'
  - id: d
    texto: ETag
  correctas:
  - c
  explicacion: Vary indica a las cachés qué cabeceras de la petición cambian la respuesta.
    Con Vary Accept-Encoding, la CDN guarda una copia por tipo de compresión y entrega
    a cada cliente la suya.
  distractores:
    a: Obligaría a revalidar cada vez, pero no a separar las versiones.
    b: Solo indica el tamaño del cuerpo.
    d: Sirve para revalidar, no para distinguir variantes.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-12.5.5
- id: L03-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.1'
  enunciado: Una aplicación guarda en una cookie el valor usuario=ana;rol=cliente
    y decide los permisos leyéndola. ¿Cuál es el problema?
  opciones:
  - id: a
    texto: Las cookies no admiten el carácter igual
  - id: b
    texto: Ocupa demasiado espacio
  - id: c
    texto: El navegador la borra al cerrar la pestaña
  - id: d
    texto: El usuario puede editar la cookie y poner rol=admin
  correctas:
  - d
  explicacion: La cookie vive en el navegador del usuario, que puede modificarla.
    Debe llevar un identificador aleatorio, y los datos (como el rol) deben guardarse
    en el servidor o ir firmados.
  distractores:
    a: El valor de la cookie admite ese contenido; el problema es de confianza, no
      de formato.
    b: El tamaño no es el riesgo aquí.
    c: Cuándo caduca depende de Expires o Max-Age, y no arregla el problema.
  referencia: https://www.rfc-editor.org/rfc/rfc6265#section-8
- id: L03-003
  tipo: matching
  dificultad: media
  objetivo: '3.2'
  enunciado: Empareja cada atributo de Set-Cookie con su efecto.
  prompts:
  - id: '1'
    texto: HttpOnly
  - id: '2'
    texto: Secure
  - id: '3'
    texto: Max-Age=3600
  - id: '4'
    texto: Domain=tienda.example
  opciones:
  - id: a
    texto: JavaScript no la ve en document.cookie
  - id: b
    texto: Solo se envía por HTTPS
  - id: c
    texto: Caduca en una hora
  - id: d
    texto: Se envía también a los subdominios
  - id: e
    texto: Cifra el valor de la cookie
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: HttpOnly protege la cookie de un script inyectado; Secure evita que
    viaje en claro; Max-Age fija su duración; y Domain amplía su alcance a los subdominios.
  distractores:
    e: Ningún atributo cifra el valor; viaja tal cual, y por eso Secure exige HTTPS.
  referencia: https://www.rfc-editor.org/rfc/rfc6265#section-4.1.2
- id: L03-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: En la prueba, la cookie sesion llevaba HttpOnly y la cookie estricta
    no. ¿Qué devolvió document.cookie en la página del sitio?
  opciones:
  - id: a
    texto: Solo estricta=1
  - id: b
    texto: Las dos cookies
  - id: c
    texto: Una cadena vacía
  - id: d
    texto: Un error de seguridad
  correctas:
  - a
  explicacion: HttpOnly oculta la cookie a JavaScript, pero el navegador sigue enviándola
    al servidor, que recibió las dos. Un script inyectado por XSS no puede leer la
    sesión.
  distractores:
    b: La cookie con HttpOnly no aparece en document.cookie.
    c: estricta no lleva HttpOnly, así que sí aparece.
    d: Leer document.cookie no falla; simplemente omite las cookies HttpOnly.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie
- id: L03-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: '3.2'
  enunciado: Un servidor crea la cookie con Set-Cookie sesion=abc; Path=/ sin Domain,
    en la respuesta de www.tienda.example. ¿A qué hosts la enviará el navegador?
  opciones:
  - id: a
    texto: A www.tienda.example y a sus subdominios hermanos, como api.tienda.example
  - id: b
    texto: Solo a www.tienda.example
  - id: c
    texto: A tienda.example y a www.tienda.example
  - id: d
    texto: A ningún host hasta que se indique Domain
  correctas:
  - b
  explicacion: Sin Domain, la cookie es host-only, la opción más restrictiva. Con
    Domain=tienda.example se enviaría también a los subdominios.
  distractores:
    a: Eso pasaría al indicar Domain=tienda.example.
    c: Sin Domain no se amplía ni al dominio padre.
    d: La cookie es válida sin Domain; se asocia al host que la creó.
  referencia: https://www.rfc-editor.org/rfc/rfc6265#section-5.3
- id: L03-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: La cookie de sesión lleva SameSite=Lax. Una página de otro sitio envía
    un formulario POST a tu aplicación. ¿Qué recibió el servidor en la prueba?
  opciones:
  - id: a
    texto: La petición con la cookie de sesión
  - id: b
    texto: 'Nada: el navegador bloqueó el envío del formulario'
  - id: c
    texto: La petición sin la cookie de sesión
  - id: d
    texto: Una petición OPTIONS de verificación previa
  correctas:
  - c
  explicacion: El POST llega, pero sin la cookie Lax, así que el servidor no lo atribuye
    al usuario. Es la protección contra CSRF que da SameSite.
  distractores:
    a: Con Lax, la cookie solo viaja desde otro sitio en navegaciones de nivel superior
      con GET.
    b: El navegador envía el formulario; lo que omite es la cookie.
    d: Un formulario HTML no provoca verificación previa; eso es de CORS con peticiones
      no simples.
  referencia: https://datatracker.ietf.org/doc/draft-ietf-httpbis-rfc6265bis/
- id: L03-007
  tipo: matching
  dificultad: alta
  objetivo: '3.3'
  enunciado: El usuario tiene una cookie Lax y otra Strict de tu sitio. Empareja cada
    situación con lo que recibe tu servidor.
  prompts:
  - id: '1'
    texto: Navega dentro de tu propio sitio
  - id: '2'
    texto: Sigue un enlace a tu sitio desde otro sitio
  - id: '3'
    texto: Otro sitio hace un fetch a tu API con credentials include
  opciones:
  - id: a
    texto: Las dos cookies
  - id: b
    texto: Solo la cookie Lax
  - id: c
    texto: Ninguna de las dos
  - id: d
    texto: Solo la cookie Strict
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: Es lo que recibió el servidor de prueba. Strict nunca viaja desde otro
    sitio; Lax solo en la navegación de nivel superior con GET; y una petición en
    segundo plano desde otro sitio no lleva ninguna de las dos.
  distractores:
    d: No hay ningún caso en que viaje Strict y Lax no, porque Strict es más restrictiva.
  referencia: https://web.dev/articles/samesite-cookies-explained
- id: L04-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: ¿Qué impide exactamente la política del mismo origen?
  opciones:
  - id: a
    texto: Que una página envíe peticiones a otro origen
  - id: b
    texto: Que un servidor reciba peticiones de otros orígenes
  - id: c
    texto: Que el JavaScript de una página lea las respuestas de otro origen sin su
      permiso
  - id: d
    texto: Que se carguen imágenes de otros dominios
  correctas:
  - c
  explicacion: La política protege la lectura. Sin ella, una web cualquiera podría
    leer con fetch los datos de tu banco usando tu sesión.
  distractores:
    a: Las páginas envían peticiones a otros orígenes con formularios, imágenes o
      scripts; en la prueba, las peticiones llegaron al servidor.
    b: La política la aplica el navegador, no el servidor.
    d: Una página puede mostrar imágenes de otro origen; lo que no puede es leer sus
      bytes desde el script.
  referencia: https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy
- id: L04-004
  tipo: multiple_choice
  dificultad: alta
  objetivo: '4.2'
  enunciado: El servidor no da permiso en la respuesta al OPTIONS de un PUT entre
    orígenes. ¿Qué peticiones le llegaron en la prueba?
  opciones:
  - id: a
    texto: 'Solo el OPTIONS: el navegador no envió el PUT'
  - id: b
    texto: El OPTIONS y el PUT
  - id: c
    texto: Solo el PUT
  - id: d
    texto: 'Ninguna: el navegador lo bloqueó antes'
  correctas:
  - a
  explicacion: La verificación previa sirve para preguntar antes. Si no hay permiso,
    la petición real no sale del navegador.
  distractores:
    b: El PUT solo se envía si la verificación previa lo permite.
    c: Sin el OPTIONS, el navegador no sabe si puede enviarlo.
    d: El OPTIONS sí llega; es la pregunta.
  referencia: https://fetch.spec.whatwg.org/#cors-preflight-fetch
- id: L04-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: '4.3'
  enunciado: El OPTIONS responde con Allow-Origin, Allow-Methods PUT y Allow-Headers
    X-Token, pero la respuesta del PUT no lleva Access-Control-Allow-Origin. ¿Qué
    pasa?
  opciones:
  - id: a
    texto: El navegador no envía el PUT
  - id: b
    texto: Todo funciona, porque el permiso ya se dio en el OPTIONS
  - id: c
    texto: El PUT se reintenta sin la cabecera X-Token
  - id: d
    texto: El PUT se ejecuta en el servidor, pero el script recibe un error y no puede
      leer la respuesta
  correctas:
  - d
  explicacion: La respuesta real también necesita Access-Control-Allow-Origin. En
    la prueba el PUT llegó al servidor y la página recibió TypeError Failed to fetch.
  distractores:
    a: El preflight dio permiso, así que el PUT sí se envió.
    b: El permiso del preflight es para enviar; para leer, la respuesta real debe
      llevar su cabecera.
    c: El navegador no reintenta ni modifica la petición.
  referencia: https://fetch.spec.whatwg.org/#http-responses
- id: L04-006
  tipo: matching
  dificultad: media
  objetivo: '4.3'
  enunciado: Empareja cada cabecera CORS con su función.
  prompts:
  - id: '1'
    texto: Access-Control-Allow-Origin
  - id: '2'
    texto: Access-Control-Allow-Headers
  - id: '3'
    texto: Access-Control-Max-Age
  - id: '4'
    texto: Access-Control-Allow-Credentials
  opciones:
  - id: a
    texto: Qué origen puede leer la respuesta
  - id: b
    texto: Qué cabeceras de petición se permiten
  - id: c
    texto: Cuántos segundos se puede reutilizar el permiso del preflight
  - id: d
    texto: Si se pueden enviar cookies y leer la respuesta con ellas
  - id: e
    texto: Qué puerto usa el servidor
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Las cabeceras Access-Control-* las envía el servidor para que el navegador
    decida qué permitir.
  distractores:
    e: El puerto forma parte del origen, pero ninguna cabecera CORS lo configura.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
- id: L04-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: '4.3'
  enunciado: Para que su frontend funcione desde cualquier dominio, un servidor copia
    el Origin de cada petición en Access-Control-Allow-Origin y añade Access-Control-Allow-Credentials
    true. ¿Qué consecuencia tiene?
  opciones:
  - id: a
    texto: Ninguna, porque las cookies van cifradas
  - id: b
    texto: Cualquier web que visite el usuario puede leer sus datos de la API usando
      su sesión
  - id: c
    texto: El navegador rechaza la configuración y nada funciona
  - id: d
    texto: Solo afecta a las peticiones GET
  correctas:
  - b
  explicacion: Al reflejar cualquier origen con credenciales, la API da permiso de
    lectura a todo el mundo con la cookie del usuario. Hay que comparar el Origin
    con una lista de orígenes permitidos.
  distractores:
    a: El cifrado del transporte no impide que otra web pida los datos con la sesión
      del usuario.
    c: El navegador solo rechaza el asterisco con credenciales; un origen concreto
      copiado lo acepta.
    d: Afecta a cualquier método que la configuración permita.
  referencia: https://fetch.spec.whatwg.org/#cors-protocol-and-credentials
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.2'
  enunciado: En la prueba con curl, tres peticiones paralelas por HTTP/2 mostraron
    los flujos 1, 3 y 5 sobre una sola conexión. ¿Qué indica?
  opciones:
  - id: a
    texto: Que el servidor perdió los flujos pares
  - id: b
    texto: Que HTTP/2 multiplexa las peticiones como flujos en la misma conexión,
      y los que abre el cliente son impares
  - id: c
    texto: Que curl hizo tres conexiones distintas
  - id: d
    texto: Que se enviaron una detrás de otra, como en HTTP/1.1
  correctas:
  - b
  explicacion: Cada petición es un flujo con su número dentro de la conexión. Los
    flujos iniciados por el cliente llevan identificadores impares, y los pares quedan
    para el servidor.
  distractores:
    a: Los pares no faltan; los reserva el servidor.
    c: La salida mostraba una única conexión establecida.
    d: Los flujos se intercalan; no esperan a que termine el anterior.
  referencia: https://www.rfc-editor.org/rfc/rfc9113#section-5.1.1
- id: L05-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.2'
  enunciado: En la salida de curl aparece «ALPN, curl offers h2,http/1.1» y «server
    accepted h2». ¿Qué ha pasado?
  opciones:
  - id: a
    texto: Durante el saludo TLS, cliente y servidor han acordado usar HTTP/2
  - id: b
    texto: El servidor ha redirigido a HTTP/2 con un 301
  - id: c
    texto: curl ha descargado la página dos veces
  - id: d
    texto: Se ha usado HTTP/3
  correctas:
  - a
  explicacion: ALPN es una extensión de TLS con la que se negocia el protocolo de
    aplicación sin peticiones extra. h2 es el identificador de HTTP/2 sobre TLS.
  distractores:
    b: La negociación ocurre en TLS, antes de cualquier petición HTTP.
    c: Solo hubo una petición.
    d: El identificador de HTTP/3 es h3, y curl no lo ofreció.
  referencia: https://www.rfc-editor.org/rfc/rfc7301
- id: L05-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: '5.3'
  enunciado: ¿Qué problema de HTTP/2 resuelve HTTP/3 al usar QUIC?
  opciones:
  - id: a
    texto: Que las cabeceras no se comprimían
  - id: b
    texto: Que había que abrir una conexión por petición
  - id: c
    texto: Que, sobre TCP, un paquete perdido frena todos los flujos de la conexión
  - id: d
    texto: Que no admitía cifrado
  correctas:
  - c
  explicacion: TCP entrega los bytes en orden, así que una pérdida detiene todo lo
    que viene detrás, aunque sea de otro flujo. QUIC gestiona cada flujo por separado.
  distractores:
    a: HTTP/2 ya comprime las cabeceras con HPACK.
    b: HTTP/2 ya multiplexa en una conexión.
    d: HTTP/2 se usa sobre TLS en los navegadores.
  referencia: https://www.rfc-editor.org/rfc/rfc9114#section-1
- id: L05-006
  tipo: matching
  dificultad: media
  objetivo: '5.3'
  enunciado: Empareja cada característica con la versión de HTTP a la que corresponde.
  prompts:
  - id: '1'
    texto: Mensajes en texto, una respuesta cada vez por conexión
  - id: '2'
    texto: Tramas binarias y flujos multiplexados sobre TCP
  - id: '3'
    texto: Flujos independientes sobre QUIC y UDP
  opciones:
  - id: a
    texto: HTTP/1.1
  - id: b
    texto: HTTP/2
  - id: c
    texto: HTTP/3
  - id: d
    texto: HTTP/0.9
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: Cada versión mejora el transporte de la anterior manteniendo la semántica.
  distractores:
    d: HTTP/0.9 solo admitía GET y no tenía cabeceras; no describe ninguna de las
      tres.
  referencia: https://www.rfc-editor.org/rfc/rfc9114
