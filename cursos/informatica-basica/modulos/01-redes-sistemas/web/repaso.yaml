- id: L01-001
  tipo: multiple_choice
  dificultad: baja
  objetivo: "1.1"
  enunciado: En la respuesta «HTTP/1.1 404 Not Found», ¿qué es «404»?
  opciones:
    - {id: a, texto: "El número de la conexión TCP"}
    - {id: b, texto: "El código de estado, que indica el resultado de la petición"}
    - {id: c, texto: "El tamaño del cuerpo en bytes"}
    - {id: d, texto: "La versión del protocolo"}
  correctas: [b]
  explicacion: La línea de estado tiene la versión (HTTP/1.1), el código de estado de tres cifras (404) y una frase descriptiva (Not Found). El cliente decide qué hacer por el código, no por la frase.
  distractores:
    a: Las conexiones no se numeran en los mensajes HTTP.
    c: El tamaño del cuerpo va en la cabecera Content-Length.
    d: La versión es el primer elemento, HTTP/1.1.
  referencia: https://www.rfc-editor.org/rfc/rfc9112#section-4
- id: L01-002
  tipo: multiple_response
  dificultad: baja
  objetivo: "1.1"
  enunciado: ¿Qué cabeceras envía el cliente en la petición, y no el servidor en la respuesta?
  opciones:
    - {id: a, texto: "Host"}
    - {id: b, texto: "Set-Cookie"}
    - {id: c, texto: "Accept"}
    - {id: d, texto: "Location"}
    - {id: e, texto: "Authorization"}
  correctas: [a, c, e]
  explicacion: Host (obligatoria en HTTP/1.1), Accept (los formatos que acepta) y Authorization (las credenciales) las envía el cliente.
  distractores:
    b: Set-Cookie la envía el servidor para pedir al navegador que guarde una cookie; el navegador la devuelve después en la cabecera Cookie.
    d: Location la envía el servidor para indicar a dónde redirigir o dónde está el recurso creado.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-7.2
- id: L01-003
  tipo: multiple_response
  dificultad: media
  objetivo: "1.2"
  enunciado: ¿Qué métodos son idempotentes según el RFC 9110?
  opciones:
    - {id: a, texto: "GET"}
    - {id: b, texto: "POST"}
    - {id: c, texto: "PUT"}
    - {id: d, texto: "DELETE"}
    - {id: e, texto: "PATCH, en general"}
  correctas: [a, c, d]
  explicacion: Son idempotentes los métodos seguros (GET, HEAD, OPTIONS) más PUT y DELETE. Repetirlos deja el servidor igual que hacerlo una vez, así que un cliente puede reintentarlos.
  distractores:
    b: Cada POST puede crear un recurso nuevo; repetirlo puede duplicar un pedido o un pago.
    e: PATCH describe cambios que pueden depender del estado actual, como sumar 1, y por eso no es idempotente en general.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2
- id: L01-004
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.2"
  enunciado: Un DELETE /productos/2 devuelve 204 y, al repetirlo, 404. ¿Sigue siendo idempotente?
  opciones:
    - {id: a, texto: "No, porque las dos respuestas son distintas"}
    - {id: b, texto: "Solo si el servidor devuelve 204 las dos veces"}
    - {id: c, texto: "Sí, porque el efecto en el servidor es el mismo: el producto está borrado"}
    - {id: d, texto: "Depende de si el cliente usó HTTP/1.1 o HTTP/2"}
  correctas: [c]
  explicacion: La idempotencia se refiere al efecto en el servidor, no al código de la respuesta. Tras el primer DELETE el producto ya no existe, y los siguientes no cambian nada más.
  distractores:
    a: Confunde el efecto con la respuesta. Que cambie el código no rompe la idempotencia.
    b: El servidor puede responder 404 a la segunda llamada sin dejar de ser idempotente.
    d: La semántica de los métodos es la misma en todas las versiones de HTTP.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2
- id: L01-005
  tipo: multiple_choice
  dificultad: baja
  objetivo: "1.2"
  enunciado: Una aplicación borra un producto con el enlace GET /borrar?id=3. ¿Cuál es el problema?
  opciones:
    - {id: a, texto: "GET es un método seguro: navegadores, rastreadores y cachés pueden repetirlo o precargarlo y borrar sin querer"}
    - {id: b, texto: "GET no admite parámetros en la URL"}
    - {id: c, texto: "GET es más lento que DELETE"}
    - {id: d, texto: "Ninguno, si el servidor responde 200"}
  correctas: [a]
  explicacion: Quien recibe un enlace GET supone que solo lee. Un rastreador que sigue los enlaces o una precarga del navegador ejecutaría el borrado. Las acciones que cambian estado van con POST, PUT, PATCH o DELETE.
  distractores:
    b: Los GET llevan parámetros en la URL con normalidad.
    c: La velocidad no depende del método.
    d: El código de respuesta no arregla que un método seguro cambie estado.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-9.2.1
- id: L01-006
  tipo: matching
  dificultad: media
  objetivo: "1.3"
  enunciado: Empareja cada situación con el código de estado más adecuado.
  prompts:
    - {id: "1", texto: "Se ha creado el producto; su URL va en Location"}
    - {id: "2", texto: "La petición no lleva credenciales válidas"}
    - {id: "3", texto: "El usuario está identificado, pero no tiene permiso para esa operación"}
    - {id: "4", texto: "El recurso no admite PUT; los métodos válidos van en Allow"}
    - {id: "5", texto: "El borrado ha ido bien y no hay nada que devolver"}
  opciones:
    - {id: a, texto: "201 Created"}
    - {id: b, texto: "401 Unauthorized"}
    - {id: c, texto: "403 Forbidden"}
    - {id: d, texto: "405 Method Not Allowed"}
    - {id: e, texto: "204 No Content"}
    - {id: f, texto: "500 Internal Server Error"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d], ["5", e]]
  explicacion: 201 indica que se creó un recurso; 401, que faltan credenciales válidas; 403, que no hay permiso; 405, que el método no se admite, con la cabecera Allow; y 204, éxito sin cuerpo. El servidor de prueba devolvió 201 con Location, 405 con Allow y 204.
  distractores:
    f: 500 es un error inesperado del servidor; ninguna de estas situaciones lo es.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-15
- id: L01-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: "1.3"
  enunciado: Un formulario hace POST /pedidos y el servidor quiere redirigir a otra URL manteniendo el método POST. ¿Qué código debe usar?
  opciones:
    - {id: a, texto: "302 Found"}
    - {id: b, texto: "301 Moved Permanently"}
    - {id: c, texto: "304 Not Modified"}
    - {id: d, texto: "307 Temporary Redirect"}
  correctas: [d]
  explicacion: 307 (temporal) y 308 (permanente) obligan al cliente a repetir la petición con el mismo método y cuerpo. Con 301 y 302, por motivos históricos, los clientes pueden cambiar un POST por un GET.
  distractores:
    a: Con 302 el cliente puede pasar el POST a GET y perder el cuerpo.
    b: Con 301 pasa lo mismo que con 302, y además es permanente.
    c: 304 no es una redirección a otra URL; responde a una petición condicional.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-15.4.8
- id: L01-008
  tipo: completar
  dificultad: media
  objetivo: "1.4"
  enunciado: Completa los comandos para ver solo las cabeceras de la respuesta y para crear un producto enviando JSON.
  codigo:
    lenguaje: bash
    fuente: |
      curl [[1]] https://tienda.example/productos/1
      curl -X POST -H '[[2]]: application/json' -d '{"nombre":"Casco"}' https://tienda.example/productos
  huecos:
    - {id: "1", respuestas: ["-I", "--head"]}
    - {id: "2", respuestas: ["Content-Type"], mayusculas: false}
  explicacion: -I hace un HEAD y muestra solo las cabeceras; usar -X HEAD no basta, porque curl sigue esperando un cuerpo. Content-Type dice al servidor en qué formato va el cuerpo de la petición.
  referencia: https://curl.se/docs/manpage.html
- id: L01-009
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.4"
  enunciado: Ejecutas curl -X HEAD https://tienda.example/ y el comando se queda esperando. ¿Por qué?
  opciones:
    - {id: a, texto: "El servidor no admite HEAD"}
    - {id: b, texto: "-X solo cambia la palabra del método; curl sigue esperando el cuerpo que anuncia Content-Length, y un HEAD no lo trae"}
    - {id: c, texto: "HEAD necesita HTTP/2"}
    - {id: d, texto: "Falta la opción -v"}
  correctas: [b]
  explicacion: El manual de curl lo advierte. -X cambia la palabra que se envía, no el comportamiento de curl. Para una petición HEAD correcta se usa -I (--head).
  distractores:
    a: Si el servidor no admitiera HEAD respondería con un error, no dejaría la conexión esperando.
    c: HEAD existe desde HTTP/1.0.
    d: -v solo muestra más información; no cambia la espera.
  referencia: https://curl.se/docs/manpage.html
- id: L02-001
  tipo: multiple_choice
  dificultad: baja
  objetivo: "2.1"
  enunciado: Un cliente envía un cuerpo JSON en un POST y el servidor responde 415 Unsupported Media Type. ¿Qué es lo más probable que falte?
  opciones:
    - {id: a, texto: "La cabecera Accept: application/json"}
    - {id: b, texto: "La cabecera Cache-Control"}
    - {id: c, texto: "La cabecera Content-Type: application/json en la petición"}
    - {id: d, texto: "La cabecera Location"}
  correctas: [c]
  explicacion: Content-Type describe el formato del cuerpo que se envía. Sin ella, el servidor no sabe que es JSON y puede rechazarlo con 415.
  distractores:
    a: Accept indica qué formato se quiere recibir en la respuesta, no qué se envía.
    b: Cache-Control no tiene que ver con el formato del cuerpo.
    d: Location la envía el servidor en las redirecciones o al crear un recurso.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-15.5.16
- id: L02-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.2"
  enunciado: Una respuesta lleva Cache-Control no-cache. ¿Qué puede hacer el navegador con ella?
  opciones:
    - {id: a, texto: "Guardarla, pero revalidarla con el servidor antes de cada uso"}
    - {id: b, texto: "Nada: no puede guardarla"}
    - {id: c, texto: "Reutilizarla sin preguntar durante una hora"}
    - {id: d, texto: "Guardarla solo en las cachés compartidas"}
  correctas: [a]
  explicacion: no-cache permite almacenar la respuesta, pero obliga a confirmar con el servidor (por ejemplo, con If-None-Match) que sigue siendo válida antes de usarla.
  distractores:
    b: Eso es no-store. La confusión entre las dos directivas es muy frecuente.
    c: Reutilizar sin preguntar es lo que permite max-age mientras la respuesta es fresca.
    d: Lo que decide qué cachés pueden guardarla es private o public, no no-cache.
  referencia: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.4
- id: L02-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.2"
  enunciado: La página con los movimientos de la cuenta de un cliente no debe guardarse en ninguna caché. ¿Qué directiva usas?
  opciones:
    - {id: a, texto: "Cache-Control: no-cache"}
    - {id: b, texto: "Cache-Control: no-store"}
    - {id: c, texto: "Cache-Control: max-age=0"}
    - {id: d, texto: "Cache-Control: public"}
  correctas: [b]
  explicacion: no-store pide que la respuesta no se guarde en ninguna caché, ni en el navegador ni en proxies. Es la directiva para datos sensibles.
  distractores:
    a: no-cache deja guardarla; solo obliga a revalidar antes de usarla.
    c: max-age=0 la da por caducada al instante, pero no prohíbe guardarla.
    d: public permite que la guarden incluso las cachés compartidas, justo lo contrario.
  referencia: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.5
- id: L02-004
  tipo: matching
  dificultad: media
  objetivo: "2.2"
  enunciado: Empareja cada directiva de Cache-Control con su efecto.
  prompts:
    - {id: "1", texto: "max-age=60"}
    - {id: "2", texto: "private"}
    - {id: "3", texto: "s-maxage=300"}
    - {id: "4", texto: "must-revalidate"}
  opciones:
    - {id: a, texto: "Fresca 60 s: se reutiliza sin preguntar"}
    - {id: b, texto: "Solo la puede guardar la caché del propio usuario"}
    - {id: c, texto: "Tiempo de frescura solo para las cachés compartidas"}
    - {id: d, texto: "Caducada, no se sirve sin revalidar aunque el servidor no responda"}
    - {id: e, texto: "Comprime la respuesta"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d]]
  explicacion: max-age da la frescura; private excluye los proxies y las CDN; s-maxage aplica solo a las cachés compartidas; y must-revalidate impide servir una copia caducada sin confirmar con el servidor.
  distractores:
    e: La compresión se negocia con Accept-Encoding y Content-Encoding, no con Cache-Control.
  referencia: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2
- id: L02-005
  tipo: ordering
  dificultad: media
  objetivo: "2.3"
  enunciado: Ordena lo que ocurre cuando una respuesta con ETag y max-age=60 se vuelve a pedir pasados dos minutos y no ha cambiado.
  opciones:
    - {id: a, texto: "El servidor responde 200 con ETag y Cache-Control max-age=60"}
    - {id: b, texto: "Pasan 60 segundos y la copia deja de ser fresca"}
    - {id: c, texto: "El navegador pide el recurso con If-None-Match y el ETag guardado"}
    - {id: d, texto: "El servidor responde 304 Not Modified sin cuerpo"}
    - {id: e, texto: "El navegador usa la copia que tenía guardada"}
  correctas: [a, b, c, d, e]
  explicacion: La copia se reutiliza sin preguntar mientras es fresca. Al caducar, una petición condicional evita descargar otra vez el cuerpo si nada ha cambiado.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-13.1.2
- id: L02-006
  tipo: multiple_choice
  dificultad: baja
  objetivo: "2.3"
  enunciado: ¿Qué lleva el cuerpo de una respuesta 304 Not Modified?
  opciones:
    - {id: a, texto: "La versión nueva del recurso"}
    - {id: b, texto: "Un mensaje de error"}
    - {id: c, texto: "La URL a la que redirigir"}
    - {id: d, texto: "Nada: el cliente usa la copia que ya tenía"}
  correctas: [d]
  explicacion: 304 confirma que la copia del cliente sigue valiendo, así que no hace falta enviarla otra vez. En la prueba, la respuesta llegó con Content-Length 0.
  distractores:
    a: Si el recurso hubiera cambiado, la respuesta sería 200 con el cuerpo nuevo.
    b: 304 no es un error; es parte normal de la revalidación.
    c: Aunque es de la clase 3xx, 304 no redirige a ninguna parte.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-15.4.5
- id: L02-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: "2.3"
  enunciado: ¿Por qué se prefiere un ETag a Last-Modified como validador?
  opciones:
    - {id: a, texto: "Porque Last-Modified tiene precisión de segundos y un recurso puede cambiar dos veces en el mismo segundo"}
    - {id: b, texto: "Porque Last-Modified no lo entienden los navegadores"}
    - {id: c, texto: "Porque el ETag cifra la respuesta"}
    - {id: d, texto: "Porque con ETag la respuesta no caduca"}
  correctas: [a]
  explicacion: Las fechas HTTP no bajan del segundo. Un ETag identifica la versión exacta, por ejemplo con un resumen del contenido, como el servidor de prueba.
  distractores:
    b: Los navegadores usan If-Modified-Since con normalidad; el servidor estándar de Python respondió 304 así.
    c: El ETag es un identificador, no cifra nada.
    d: La caducidad la fija Cache-Control; el ETag sirve para revalidar después.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-8.8.3
- id: L02-008
  tipo: multiple_choice
  dificultad: alta
  objetivo: "2.4"
  enunciado: Una CDN guarda la página principal y algunos clientes reciben una versión comprimida con br que no saben descomprimir. ¿Qué cabecera debería enviar el servidor?
  opciones:
    - {id: a, texto: "Cache-Control: no-cache"}
    - {id: b, texto: "Content-Length"}
    - {id: c, texto: "Vary: Accept-Encoding"}
    - {id: d, texto: "ETag"}
  correctas: [c]
  explicacion: Vary indica a las cachés qué cabeceras de la petición cambian la respuesta. Con Vary Accept-Encoding, la CDN guarda una copia por tipo de compresión y entrega a cada cliente la suya.
  distractores:
    a: Obligaría a revalidar cada vez, pero no a separar las versiones.
    b: Solo indica el tamaño del cuerpo.
    d: Sirve para revalidar, no para distinguir variantes.
  referencia: https://www.rfc-editor.org/rfc/rfc9110#section-12.5.5
- id: L02-009
  tipo: multiple_response
  dificultad: media
  objetivo: "2.4"
  enunciado: Una API devuelve el perfil del usuario identificado. ¿Qué afirmaciones sobre su caché son correctas?
  opciones:
    - {id: a, texto: "Debe llevar private o no-store para que no la guarde una caché compartida"}
    - {id: b, texto: "Con public, una CDN podría servir el perfil de un usuario a otro"}
    - {id: c, texto: "Vary: Cookie suele generar casi una copia por usuario en la caché compartida"}
    - {id: d, texto: "Con max-age, la caché sabe sola que la respuesta depende del usuario"}
    - {id: e, texto: "Las CDN no guardan respuestas con JSON"}
  correctas: [a, b, c]
  explicacion: Una respuesta que depende del usuario no debe guardarse en cachés compartidas. private la limita al navegador, y no-store la excluye de todas. Variar por Cookie anula casi por completo la utilidad de la caché.
  distractores:
    d: max-age solo fija la frescura; no dice nada de a quién pertenece la respuesta.
    e: Una CDN guarda cualquier tipo de contenido que las cabeceras le permitan.
  referencia: https://www.rfc-editor.org/rfc/rfc9111#section-5.2.2.7
- id: L03-001
  tipo: ordering
  dificultad: baja
  objetivo: "3.1"
  enunciado: Ordena cómo un servidor reconoce al usuario en la segunda petición gracias a una cookie.
  opciones:
    - {id: a, texto: "El usuario inicia sesión y el servidor responde con Set-Cookie: sesion=abc123"}
    - {id: b, texto: "El navegador guarda la cookie"}
    - {id: c, texto: "En la siguiente petición, el navegador envía Cookie: sesion=abc123"}
    - {id: d, texto: "El servidor busca abc123 en su almacén de sesiones y sabe quién es"}
  correctas: [a, b, c, d]
  explicacion: HTTP no tiene estado. La cookie es un dato que el navegador guarda y devuelve, y con él el servidor recupera el estado de la sesión.
  referencia: https://www.rfc-editor.org/rfc/rfc6265#section-3
- id: L03-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.1"
  enunciado: Una aplicación guarda en una cookie el valor usuario=ana;rol=cliente y decide los permisos leyéndola. ¿Cuál es el problema?
  opciones:
    - {id: a, texto: "Las cookies no admiten el carácter igual"}
    - {id: b, texto: "Ocupa demasiado espacio"}
    - {id: c, texto: "El navegador la borra al cerrar la pestaña"}
    - {id: d, texto: "El usuario puede editar la cookie y poner rol=admin"}
  correctas: [d]
  explicacion: La cookie vive en el navegador del usuario, que puede modificarla. Debe llevar un identificador aleatorio, y los datos (como el rol) deben guardarse en el servidor o ir firmados.
  distractores:
    a: El valor de la cookie admite ese contenido; el problema es de confianza, no de formato.
    b: El tamaño no es el riesgo aquí.
    c: Cuándo caduca depende de Expires o Max-Age, y no arregla el problema.
  referencia: https://www.rfc-editor.org/rfc/rfc6265#section-8
- id: L03-003
  tipo: matching
  dificultad: media
  objetivo: "3.2"
  enunciado: Empareja cada atributo de Set-Cookie con su efecto.
  prompts:
    - {id: "1", texto: "HttpOnly"}
    - {id: "2", texto: "Secure"}
    - {id: "3", texto: "Max-Age=3600"}
    - {id: "4", texto: "Domain=tienda.example"}
  opciones:
    - {id: a, texto: "JavaScript no la ve en document.cookie"}
    - {id: b, texto: "Solo se envía por HTTPS"}
    - {id: c, texto: "Caduca en una hora"}
    - {id: d, texto: "Se envía también a los subdominios"}
    - {id: e, texto: "Cifra el valor de la cookie"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d]]
  explicacion: HttpOnly protege la cookie de un script inyectado; Secure evita que viaje en claro; Max-Age fija su duración; y Domain amplía su alcance a los subdominios.
  distractores:
    e: Ningún atributo cifra el valor; viaja tal cual, y por eso Secure exige HTTPS.
  referencia: https://www.rfc-editor.org/rfc/rfc6265#section-4.1.2
- id: L03-004
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.2"
  enunciado: En la prueba, la cookie sesion llevaba HttpOnly y la cookie estricta no. ¿Qué devolvió document.cookie en la página del sitio?
  opciones:
    - {id: a, texto: "Solo estricta=1"}
    - {id: b, texto: "Las dos cookies"}
    - {id: c, texto: "Una cadena vacía"}
    - {id: d, texto: "Un error de seguridad"}
  correctas: [a]
  explicacion: HttpOnly oculta la cookie a JavaScript, pero el navegador sigue enviándola al servidor, que recibió las dos. Un script inyectado por XSS no puede leer la sesión.
  distractores:
    b: La cookie con HttpOnly no aparece en document.cookie.
    c: estricta no lleva HttpOnly, así que sí aparece.
    d: Leer document.cookie no falla; simplemente omite las cookies HttpOnly.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie
- id: L03-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: "3.2"
  enunciado: Un servidor crea la cookie con Set-Cookie sesion=abc; Path=/ sin Domain, en la respuesta de www.tienda.example. ¿A qué hosts la enviará el navegador?
  opciones:
    - {id: a, texto: "A www.tienda.example y a sus subdominios hermanos, como api.tienda.example"}
    - {id: b, texto: "Solo a www.tienda.example"}
    - {id: c, texto: "A tienda.example y a www.tienda.example"}
    - {id: d, texto: "A ningún host hasta que se indique Domain"}
  correctas: [b]
  explicacion: Sin Domain, la cookie es host-only, la opción más restrictiva. Con Domain=tienda.example se enviaría también a los subdominios.
  distractores:
    a: Eso pasaría al indicar Domain=tienda.example.
    c: Sin Domain no se amplía ni al dominio padre.
    d: La cookie es válida sin Domain; se asocia al host que la creó.
  referencia: https://www.rfc-editor.org/rfc/rfc6265#section-5.3
- id: L03-006
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.3"
  enunciado: La cookie de sesión lleva SameSite=Lax. Una página de otro sitio envía un formulario POST a tu aplicación. ¿Qué recibió el servidor en la prueba?
  opciones:
    - {id: a, texto: "La petición con la cookie de sesión"}
    - {id: b, texto: "Nada: el navegador bloqueó el envío del formulario"}
    - {id: c, texto: "La petición sin la cookie de sesión"}
    - {id: d, texto: "Una petición OPTIONS de verificación previa"}
  correctas: [c]
  explicacion: El POST llega, pero sin la cookie Lax, así que el servidor no lo atribuye al usuario. Es la protección contra CSRF que da SameSite.
  distractores:
    a: Con Lax, la cookie solo viaja desde otro sitio en navegaciones de nivel superior con GET.
    b: El navegador envía el formulario; lo que omite es la cookie.
    d: Un formulario HTML no provoca verificación previa; eso es de CORS con peticiones no simples.
  referencia: https://datatracker.ietf.org/doc/draft-ietf-httpbis-rfc6265bis/
- id: L03-007
  tipo: matching
  dificultad: alta
  objetivo: "3.3"
  enunciado: El usuario tiene una cookie Lax y otra Strict de tu sitio. Empareja cada situación con lo que recibe tu servidor.
  prompts:
    - {id: "1", texto: "Navega dentro de tu propio sitio"}
    - {id: "2", texto: "Sigue un enlace a tu sitio desde otro sitio"}
    - {id: "3", texto: "Otro sitio hace un fetch a tu API con credentials include"}
  opciones:
    - {id: a, texto: "Las dos cookies"}
    - {id: b, texto: "Solo la cookie Lax"}
    - {id: c, texto: "Ninguna de las dos"}
    - {id: d, texto: "Solo la cookie Strict"}
  correctas: [["1", a], ["2", b], ["3", c]]
  explicacion: Es lo que recibió el servidor de prueba. Strict nunca viaja desde otro sitio; Lax solo en la navegación de nivel superior con GET; y una petición en segundo plano desde otro sitio no lleva ninguna de las dos.
  distractores:
    d: No hay ningún caso en que viaje Strict y Lax no, porque Strict es más restrictiva.
  referencia: https://web.dev/articles/samesite-cookies-explained
- id: L03-008
  tipo: completar
  dificultad: media
  objetivo: "3.3"
  enunciado: Completa la cabecera para una cookie de sesión que solo viaje por HTTPS, que no lea JavaScript y que se envíe al seguir un enlace desde otro sitio pero no en un POST desde otro sitio.
  codigo:
    lenguaje: http
    fuente: |
      Set-Cookie: sesion=9f2c...; Path=/; [[1]]; HttpOnly; SameSite=[[2]]
  huecos:
    - {id: "1", respuestas: ["Secure"], mayusculas: false}
    - {id: "2", respuestas: ["Lax"], mayusculas: false}
  explicacion: Secure limita la cookie a HTTPS, HttpOnly la oculta a JavaScript y SameSite Lax la envía en las navegaciones de nivel superior con GET, pero no en peticiones POST ni en segundo plano desde otro sitio.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie
- id: L03-009
  tipo: multiple_response
  dificultad: alta
  objetivo: "3.4"
  enunciado: Comparando una sesión en cookie HttpOnly con un token guardado en localStorage y enviado en Authorization, ¿qué afirmaciones son correctas?
  opciones:
    - {id: a, texto: "La cookie la envía el navegador por su cuenta, por eso existe el riesgo de CSRF"}
    - {id: b, texto: "Un script inyectado por XSS puede leer el token de localStorage"}
    - {id: c, texto: "Una API que solo acepta el token en Authorization no es vulnerable a CSRF"}
    - {id: d, texto: "La cookie HttpOnly impide que un script haga peticiones con la sesión"}
    - {id: e, texto: "El token en localStorage se envía en cada petición sin código adicional"}
  correctas: [a, b, c]
  explicacion: El navegador adjunta las cookies solo, y por eso hacen falta SameSite y los tokens anti-CSRF. La cabecera Authorization solo la pone el código del cliente. A cambio, un token en localStorage queda al alcance de un script inyectado.
  distractores:
    d: HttpOnly impide leer la cookie, no usarla. Un script en la página puede hacer peticiones y el navegador adjuntará la cookie.
    e: Hay que añadirlo en cada petición desde el código; el navegador no lo hace solo.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies
- id: L04-001
  tipo: multiple_response
  dificultad: baja
  objetivo: "4.1"
  enunciado: ¿Qué URL son de un origen distinto a https://tienda.example?
  opciones:
    - {id: a, texto: "https://tienda.example/carrito"}
    - {id: b, texto: "http://tienda.example"}
    - {id: c, texto: "https://api.tienda.example"}
    - {id: d, texto: "https://tienda.example:8443"}
    - {id: e, texto: "https://tienda.example/?q=bici"}
  correctas: [b, c, d]
  explicacion: El origen es esquema, host y puerto. Cambia el esquema en b, el host en c (un subdominio es otro host) y el puerto en d.
  distractores:
    a: Solo cambia la ruta, que no forma parte del origen.
    e: La consulta tampoco forma parte del origen.
  referencia: https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy
- id: L04-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.1"
  enunciado: ¿Qué impide exactamente la política del mismo origen?
  opciones:
    - {id: a, texto: "Que una página envíe peticiones a otro origen"}
    - {id: b, texto: "Que un servidor reciba peticiones de otros orígenes"}
    - {id: c, texto: "Que el JavaScript de una página lea las respuestas de otro origen sin su permiso"}
    - {id: d, texto: "Que se carguen imágenes de otros dominios"}
  correctas: [c]
  explicacion: La política protege la lectura. Sin ella, una web cualquiera podría leer con fetch los datos de tu banco usando tu sesión.
  distractores:
    a: Las páginas envían peticiones a otros orígenes con formularios, imágenes o scripts; en la prueba, las peticiones llegaron al servidor.
    b: La política la aplica el navegador, no el servidor.
    d: Una página puede mostrar imágenes de otro origen; lo que no puede es leer sus bytes desde el script.
  referencia: https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy
- id: L04-003
  tipo: multiple_response
  dificultad: media
  objetivo: "4.2"
  enunciado: Desde una página de otro origen, ¿qué peticiones con fetch provocan una verificación previa con OPTIONS?
  opciones:
    - {id: a, texto: "PUT /productos/1"}
    - {id: b, texto: "GET /productos/1 sin cabeceras extra"}
    - {id: c, texto: "POST con Content-Type application/json"}
    - {id: d, texto: "GET con la cabecera X-Token"}
    - {id: e, texto: "POST con Content-Type text/plain"}
  correctas: [a, c, d]
  explicacion: Necesitan verificación previa las peticiones que no son simples, es decir, otro método que GET, HEAD o POST, una cabecera fuera de la lista segura o un Content-Type que no sea de formulario o text/plain.
  distractores:
    b: GET sin cabeceras extra es una petición simple.
    e: text/plain está permitido en las peticiones simples; en la prueba el POST llegó sin OPTIONS.
  referencia: https://fetch.spec.whatwg.org/#cors-preflight-fetch
- id: L04-004
  tipo: multiple_choice
  dificultad: alta
  objetivo: "4.2"
  enunciado: El servidor no da permiso en la respuesta al OPTIONS de un PUT entre orígenes. ¿Qué peticiones le llegaron en la prueba?
  opciones:
    - {id: a, texto: "Solo el OPTIONS: el navegador no envió el PUT"}
    - {id: b, texto: "El OPTIONS y el PUT"}
    - {id: c, texto: "Solo el PUT"}
    - {id: d, texto: "Ninguna: el navegador lo bloqueó antes"}
  correctas: [a]
  explicacion: La verificación previa sirve para preguntar antes. Si no hay permiso, la petición real no sale del navegador.
  distractores:
    b: El PUT solo se envía si la verificación previa lo permite.
    c: Sin el OPTIONS, el navegador no sabe si puede enviarlo.
    d: El OPTIONS sí llega; es la pregunta.
  referencia: https://fetch.spec.whatwg.org/#cors-preflight-fetch
- id: L04-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: "4.3"
  enunciado: El OPTIONS responde con Allow-Origin, Allow-Methods PUT y Allow-Headers X-Token, pero la respuesta del PUT no lleva Access-Control-Allow-Origin. ¿Qué pasa?
  opciones:
    - {id: a, texto: "El navegador no envía el PUT"}
    - {id: b, texto: "Todo funciona, porque el permiso ya se dio en el OPTIONS"}
    - {id: c, texto: "El PUT se reintenta sin la cabecera X-Token"}
    - {id: d, texto: "El PUT se ejecuta en el servidor, pero el script recibe un error y no puede leer la respuesta"}
  correctas: [d]
  explicacion: La respuesta real también necesita Access-Control-Allow-Origin. En la prueba el PUT llegó al servidor y la página recibió TypeError Failed to fetch.
  distractores:
    a: El preflight dio permiso, así que el PUT sí se envió.
    b: El permiso del preflight es para enviar; para leer, la respuesta real debe llevar su cabecera.
    c: El navegador no reintenta ni modifica la petición.
  referencia: https://fetch.spec.whatwg.org/#http-responses
- id: L04-006
  tipo: matching
  dificultad: media
  objetivo: "4.3"
  enunciado: Empareja cada cabecera CORS con su función.
  prompts:
    - {id: "1", texto: "Access-Control-Allow-Origin"}
    - {id: "2", texto: "Access-Control-Allow-Headers"}
    - {id: "3", texto: "Access-Control-Max-Age"}
    - {id: "4", texto: "Access-Control-Allow-Credentials"}
  opciones:
    - {id: a, texto: "Qué origen puede leer la respuesta"}
    - {id: b, texto: "Qué cabeceras de petición se permiten"}
    - {id: c, texto: "Cuántos segundos se puede reutilizar el permiso del preflight"}
    - {id: d, texto: "Si se pueden enviar cookies y leer la respuesta con ellas"}
    - {id: e, texto: "Qué puerto usa el servidor"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d]]
  explicacion: Las cabeceras Access-Control-* las envía el servidor para que el navegador decida qué permitir.
  distractores:
    e: El puerto forma parte del origen, pero ninguna cabecera CORS lo configura.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
- id: L04-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: "4.3"
  enunciado: Para que su frontend funcione desde cualquier dominio, un servidor copia el Origin de cada petición en Access-Control-Allow-Origin y añade Access-Control-Allow-Credentials true. ¿Qué consecuencia tiene?
  opciones:
    - {id: a, texto: "Ninguna, porque las cookies van cifradas"}
    - {id: b, texto: "Cualquier web que visite el usuario puede leer sus datos de la API usando su sesión"}
    - {id: c, texto: "El navegador rechaza la configuración y nada funciona"}
    - {id: d, texto: "Solo afecta a las peticiones GET"}
  correctas: [b]
  explicacion: Al reflejar cualquier origen con credenciales, la API da permiso de lectura a todo el mundo con la cookie del usuario. Hay que comparar el Origin con una lista de orígenes permitidos.
  distractores:
    a: El cifrado del transporte no impide que otra web pida los datos con la sesión del usuario.
    c: El navegador solo rechaza el asterisco con credenciales; un origen concreto copiado lo acepta.
    d: Afecta a cualquier método que la configuración permita.
  referencia: https://fetch.spec.whatwg.org/#cors-protocol-and-credentials
- id: L04-008
  tipo: multiple_response
  dificultad: alta
  objetivo: "4.4"
  enunciado: ¿Qué afirmaciones sobre CORS son correctas?
  opciones:
    - {id: a, texto: "Un POST simple de otro origen llega y se ejecuta en el servidor aunque la respuesta no tenga cabeceras CORS"}
    - {id: b, texto: "curl y otros servidores no aplican CORS"}
    - {id: c, texto: "CORS relaja la política del mismo origen; no protege la API"}
    - {id: d, texto: "Configurar CORS con cuidado evita los ataques CSRF"}
    - {id: e, texto: "Sin cabeceras CORS, el servidor no recibe peticiones de otros orígenes"}
  correctas: [a, b, c]
  explicacion: CORS decide qué puede leer el script de otra página; la autorización de cada petición se decide en el servidor. En la prueba, el POST con text/plain se ejecutó sin verificación previa.
  distractores:
    d: Contra CSRF están SameSite y los tokens anti-CSRF; un formulario de otro sitio no necesita CORS para enviar un POST.
    e: Las peticiones llegan igualmente; el navegador solo oculta la respuesta al script.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
- id: L05-001
  tipo: multiple_choice
  dificultad: baja
  objetivo: "5.1"
  enunciado: Con HTTP/1.1, ¿por qué un navegador abre varias conexiones con el mismo servidor?
  opciones:
    - {id: a, texto: "Porque HTTP/1.1 exige una conexión por recurso"}
    - {id: b, texto: "Para cifrar cada recurso con una clave distinta"}
    - {id: c, texto: "Porque el servidor no admite conexiones persistentes"}
    - {id: d, texto: "Porque en una conexión las respuestas llegan una detrás de otra, y así puede cargar varias a la vez"}
  correctas: [d]
  explicacion: HTTP/1.1 mantiene la conexión abierta para varias peticiones, pero las atiende en orden. Para cargar recursos en paralelo, el cliente abre más conexiones; en la prueba, tres peticiones paralelas usaron tres.
  distractores:
    a: Desde HTTP/1.1 las conexiones son persistentes y se reutilizan para varias peticiones.
    b: Todas las peticiones de una conexión TLS comparten las claves de esa conexión.
    c: Las conexiones persistentes son el comportamiento por defecto en HTTP/1.1.
  referencia: https://www.rfc-editor.org/rfc/rfc9112#section-9.3
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.2"
  enunciado: En la prueba con curl, tres peticiones paralelas por HTTP/2 mostraron los flujos 1, 3 y 5 sobre una sola conexión. ¿Qué indica?
  opciones:
    - {id: a, texto: "Que el servidor perdió los flujos pares"}
    - {id: b, texto: "Que HTTP/2 multiplexa las peticiones como flujos en la misma conexión, y los que abre el cliente son impares"}
    - {id: c, texto: "Que curl hizo tres conexiones distintas"}
    - {id: d, texto: "Que se enviaron una detrás de otra, como en HTTP/1.1"}
  correctas: [b]
  explicacion: Cada petición es un flujo con su número dentro de la conexión. Los flujos iniciados por el cliente llevan identificadores impares, y los pares quedan para el servidor.
  distractores:
    a: Los pares no faltan; los reserva el servidor.
    c: La salida mostraba una única conexión establecida.
    d: Los flujos se intercalan; no esperan a que termine el anterior.
  referencia: https://www.rfc-editor.org/rfc/rfc9113#section-5.1.1
- id: L05-003
  tipo: multiple_response
  dificultad: media
  objetivo: "5.2"
  enunciado: ¿Qué cambia HTTP/2 respecto a HTTP/1.1?
  opciones:
    - {id: a, texto: "Los mensajes viajan en tramas binarias"}
    - {id: b, texto: "Varias peticiones se intercalan en una conexión"}
    - {id: c, texto: "Las cabeceras se comprimen con HPACK"}
    - {id: d, texto: "Los métodos y los códigos de estado son otros"}
    - {id: e, texto: "Funciona sobre UDP"}
  correctas: [a, b, c]
  explicacion: HTTP/2 cambia el formato y la gestión de la conexión, pero mantiene la semántica de HTTP.
  distractores:
    d: La semántica (RFC 9110) es la misma en todas las versiones.
    e: HTTP/2 va sobre TCP; el que usa UDP, a través de QUIC, es HTTP/3.
  referencia: https://www.rfc-editor.org/rfc/rfc9113
- id: L05-004
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.2"
  enunciado: En la salida de curl aparece «ALPN, curl offers h2,http/1.1» y «server accepted h2». ¿Qué ha pasado?
  opciones:
    - {id: a, texto: "Durante el saludo TLS, cliente y servidor han acordado usar HTTP/2"}
    - {id: b, texto: "El servidor ha redirigido a HTTP/2 con un 301"}
    - {id: c, texto: "curl ha descargado la página dos veces"}
    - {id: d, texto: "Se ha usado HTTP/3"}
  correctas: [a]
  explicacion: ALPN es una extensión de TLS con la que se negocia el protocolo de aplicación sin peticiones extra. h2 es el identificador de HTTP/2 sobre TLS.
  distractores:
    b: La negociación ocurre en TLS, antes de cualquier petición HTTP.
    c: Solo hubo una petición.
    d: El identificador de HTTP/3 es h3, y curl no lo ofreció.
  referencia: https://www.rfc-editor.org/rfc/rfc7301
- id: L05-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: "5.3"
  enunciado: ¿Qué problema de HTTP/2 resuelve HTTP/3 al usar QUIC?
  opciones:
    - {id: a, texto: "Que las cabeceras no se comprimían"}
    - {id: b, texto: "Que había que abrir una conexión por petición"}
    - {id: c, texto: "Que, sobre TCP, un paquete perdido frena todos los flujos de la conexión"}
    - {id: d, texto: "Que no admitía cifrado"}
  correctas: [c]
  explicacion: TCP entrega los bytes en orden, así que una pérdida detiene todo lo que viene detrás, aunque sea de otro flujo. QUIC gestiona cada flujo por separado.
  distractores:
    a: HTTP/2 ya comprime las cabeceras con HPACK.
    b: HTTP/2 ya multiplexa en una conexión.
    d: HTTP/2 se usa sobre TLS en los navegadores.
  referencia: https://www.rfc-editor.org/rfc/rfc9114#section-1
- id: L05-006
  tipo: matching
  dificultad: media
  objetivo: "5.3"
  enunciado: Empareja cada característica con la versión de HTTP a la que corresponde.
  prompts:
    - {id: "1", texto: "Mensajes en texto, una respuesta cada vez por conexión"}
    - {id: "2", texto: "Tramas binarias y flujos multiplexados sobre TCP"}
    - {id: "3", texto: "Flujos independientes sobre QUIC y UDP"}
  opciones:
    - {id: a, texto: "HTTP/1.1"}
    - {id: b, texto: "HTTP/2"}
    - {id: c, texto: "HTTP/3"}
    - {id: d, texto: "HTTP/0.9"}
  correctas: [["1", a], ["2", b], ["3", c]]
  explicacion: Cada versión mejora el transporte de la anterior manteniendo la semántica.
  distractores:
    d: HTTP/0.9 solo admitía GET y no tenía cabeceras; no describe ninguna de las tres.
  referencia: https://www.rfc-editor.org/rfc/rfc9114
- id: L05-007
  tipo: completar
  dificultad: media
  objetivo: "5.3"
  enunciado: Completa la cabecera con la que un servidor anuncia, en una respuesta HTTP/2, que también habla HTTP/3 en el puerto 443 durante un día.
  codigo:
    lenguaje: http
    fuente: |
      [[1]]: [[2]]=":443"; ma=86400
  huecos:
    - {id: "1", respuestas: ["alt-svc", "Alt-Svc"], mayusculas: false}
    - {id: "2", respuestas: ["h3"]}
  explicacion: Alt-Svc anuncia un servicio alternativo; h3 identifica HTTP/3 y ma es la duración del anuncio en segundos. Es lo que devolvió www.cloudflare.com en la prueba.
  referencia: https://www.rfc-editor.org/rfc/rfc9114#section-3.1.1
- id: L05-008
  tipo: multiple_response
  dificultad: alta
  objetivo: "5.4"
  enunciado: Migras el proxy de tu aplicación para que hable HTTP/2 y HTTP/3 con los clientes. ¿Qué afirmaciones son correctas?
  opciones:
    - {id: a, texto: "El código de la aplicación no necesita cambiar: los métodos, códigos y cabeceras son los mismos"}
    - {id: b, texto: "Las cabeceras llegarán en minúscula, así que hay que compararlas sin distinguir mayúsculas"}
    - {id: c, texto: "Repartir los recursos entre varios dominios ya no aporta ventajas"}
    - {id: d, texto: "Hay que reescribir las rutas de la API para HTTP/3"}
    - {id: e, texto: "Si una red bloquea UDP, esos clientes se quedan sin servicio"}
  correctas: [a, b, c]
  explicacion: La semántica es común. En HTTP/2 y HTTP/3 los nombres de cabecera van en minúscula, y las técnicas para ahorrar conexiones de HTTP/1.1 ya no ayudan.
  distractores:
    d: Las URL y las rutas no dependen de la versión del protocolo.
    e: Si UDP no pasa, el navegador usa HTTP/2 sobre TCP; el anuncio Alt-Svc es una opción, no una obligación.
  referencia: https://www.rfc-editor.org/rfc/rfc9113#section-8.2.1
