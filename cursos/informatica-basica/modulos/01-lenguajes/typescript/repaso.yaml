- id: L03-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: "3.3"
  enunciado: '¿Qué diferencia hay entre const IVA: Record<string, number> = {...} y const IVA = {...} satisfies Record<string, number>?'
  opciones:
    - {id: a, texto: "Ninguna"}
    - {id: b, texto: "satisfies convierte los valores en texto"}
    - {id: c, texto: "Con la anotación, el tipo pasa a ser Record y cualquier clave compila; con satisfies se comprueba el valor y se conservan las claves exactas"}
