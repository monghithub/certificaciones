- id: L01-001
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.1"
  enunciado: ¿Qué imprime node ejecuta.ts con Node 26?
  codigo:
    lenguaje: typescript
    fuente: |
      const precio: number = "20";
      console.log("se ejecutó igualmente:", precio + 1);
  opciones:
    - {id: a, texto: "Error TS2322 y no se ejecuta"}
    - {id: b, texto: "se ejecutó igualmente: 21"}
    - {id: c, texto: "se ejecutó igualmente: 201"}
    - {id: d, texto: "TypeError en ejecución"}
  correctas: [c]
  explicacion: Node quita los tipos sin comprobarlos; precio vale el texto "20" y + concatena. tsc sí habría dado el error TS2322.
  distractores:
    a: Eso lo hace tsc, no Node.
    b: Es un texto, así que no suma.
    d: Concatenar texto y número es válido en JavaScript.
  referencia: https://nodejs.org/api/typescript.html
- id: L01-002
  tipo: multiple_choice
  dificultad: baja
  objetivo: "1.1"
  enunciado: ¿Qué queda de los tipos de TypeScript cuando el programa se ejecuta?
  opciones:
    - {id: a, texto: "Nada; se borran al compilar o al quitarlos Node"}
    - {id: b, texto: "Se convierten en comprobaciones automáticas"}
    - {id: c, texto: "Se guardan como metadatos que se pueden consultar"}
    - {id: d, texto: "Se convierten en clases de Java"}
  correctas: [a]
  explicacion: Lo que se ejecuta es JavaScript; por eso los tipos no validan datos externos.
  distractores:
    b: No se genera ninguna comprobación.
    c: No hay metadatos de tipos en ejecución.
    d: No tiene relación con Java.
  referencia: https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/
- id: L01-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.2"
  enunciado: '¿Compila la última línea? interface ConNombre { nombre: string }; const producto = { id: 1, nombre: "libro", precio: 20 };'
  codigo:
    lenguaje: typescript
    fuente: |
      const n: ConNombre = producto;
  opciones:
    - {id: a, texto: "No, porque producto no declara implements ConNombre"}
    - {id: b, texto: "No, porque tiene propiedades de más"}
    - {id: c, texto: "Solo con un cast"}
    - {id: d, texto: "Sí, porque tiene la forma requerida (nombre: string)"}
  correctas: [d]
  explicacion: El tipado es estructural. Las propiedades de más solo se rechazan cuando se escribe el literal directamente.
  distractores:
    a: TypeScript no necesita declarar la relación.
    b: Desde una variable, las propiedades de más se aceptan.
    c: No hace falta.
  referencia: https://www.typescriptlang.org/docs/handbook/type-compatibility.html
- id: L01-004
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.2"
  enunciado: '¿Qué ocurre con const literal: ConNombre = { nombre: "libro", precio: 20 }?'
  opciones:
    - {id: a, texto: "Compila"}
    - {id: b, texto: "Error TS2353, porque un literal no puede tener propiedades que no están en el tipo"}
    - {id: c, texto: "Error en ejecución"}
    - {id: d, texto: "Se elimina precio en silencio"}
  correctas: [b]
  explicacion: La comprobación de propiedades sobrantes en literales detecta errores de escritura. tsc 7 dio TS2353.
  distractores:
    a: Desde una variable compilaría; desde el literal, no.
    c: Es un error de compilación.
    d: No se transforma nada.
  referencia: https://www.typescriptlang.org/docs/handbook/type-compatibility.html
- id: L01-005
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.3"
  enunciado: ¿Qué diferencia hay entre any y unknown?
  opciones:
    - {id: a, texto: "Ninguna"}
    - {id: b, texto: "unknown solo admite cadenas"}
    - {id: c, texto: "any desactiva la comprobación; unknown obliga a comprobar el tipo antes de usar el valor"}
    - {id: d, texto: "any es más estricto"}
  correctas: [c]
  explicacion: Con unknown, x.toUpperCase() dio TS18046 hasta comprobar typeof x === "string".
  distractores:
    a: El compilador los trata de forma opuesta.
    b: Admite cualquier valor, pero no deja usarlo sin comprobar.
    d: Es al revés.
  referencia: https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
- id: L01-006
  tipo: multiple_choice
  dificultad: baja
  objetivo: "1.4"
  enunciado: ¿Qué cambió en TypeScript 7?
  opciones:
    - {id: a, texto: "El compilador es nativo, escrito en Go, y unas 10 veces más rápido"}
    - {id: b, texto: "Se eliminaron los genéricos"}
    - {id: c, texto: "Ya no hace falta JavaScript"}
    - {id: d, texto: "Los tipos se comprueban al ejecutar"}
  correctas: [a]
  explicacion: El anuncio indica mejoras de entre 8 y 12 veces en compilaciones completas, con el mismo comportamiento.
  distractores:
    b: El lenguaje se mantiene.
    c: Sigue generando y ejecutando JavaScript.
    d: Los tipos siguen borrándose.
  referencia: https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/
- id: L01-007
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.4"
  enunciado: Un tsconfig.json nuevo no menciona strict. Con TypeScript 7, ¿está activo el modo estricto?
  opciones:
    - {id: a, texto: "No, hay que activarlo"}
    - {id: b, texto: "Sí, desde TypeScript 6 strict vale true por defecto"}
    - {id: c, texto: "Solo en Node"}
    - {id: d, texto: "Depende del editor"}
  correctas: [b]
  explicacion: El anuncio de TypeScript 6 cambió el valor por defecto. En la prueba, un parámetro sin tipo dio TS7006.
  distractores:
    a: Era así antes de TypeScript 6.
    c: Es una opción del compilador.
    d: Depende del tsconfig, no del editor.
  referencia: https://devblogs.microsoft.com/typescript/announcing-typescript-6-0/
- id: L01-008
  tipo: completar
  dificultad: media
  objetivo: "1.3"
  enunciado: Completa la función para que acepte cualquier valor pero solo llame a toUpperCase si es texto.
  codigo:
    lenguaje: typescript
    fuente: |
      function procesar(x: [[1]]) {
        if ([[2]] x === "string") {
          return x.toUpperCase();
        }
      }
  huecos:
    - {id: "1", respuestas: [unknown]}
    - {id: "2", respuestas: [typeof]}
  explicacion: unknown obliga a comprobar; typeof estrecha el tipo a string dentro del if.
  referencia: https://www.typescriptlang.org/docs/handbook/2/narrowing.html
- id: L02-001
  tipo: multiple_choice
  dificultad: baja
  objetivo: "2.2"
  enunciado: ¿Qué devuelve longitud(12345)?
  codigo:
    lenguaje: typescript
    fuente: |
      function longitud(x: string | number | null): number {
        if (x === null) return 0;
        if (typeof x === "string") return x.length;
        return x.toString().length;
      }
  opciones:
    - {id: a, texto: "0"}
    - {id: b, texto: "12345"}
    - {id: c, texto: "Error de compilación"}
    - {id: d, texto: "5"}
  correctas: [d]
  explicacion: No es null ni string, así que llega a la última línea, donde x es number. Se ejecutó con Node 26.
  distractores:
    a: Solo para null.
    b: Devuelve la longitud, no el número.
    c: Tras las comprobaciones, x es number y toString es válido.
  referencia: https://www.typescriptlang.org/docs/handbook/2/narrowing.html
- id: L02-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.3"
  enunciado: Quitas el case "bizum" del switch de describir, que tiene la asignación a never en el default. ¿Qué pasa?
  opciones:
    - {id: a, texto: "Compila y, con un Bizum, devuelve undefined"}
    - {id: b, texto: "Error TS2322, porque el caso bizum no se puede asignar a never"}
    - {id: c, texto: "Compila con una advertencia"}
    - {id: d, texto: "Error en ejecución al llegar un Bizum"}
  correctas: [b]
  explicacion: El caso sin tratar llega al default y no cabe en never. tsc 7 dio TS2322 con el tipo del caso olvidado.
  distractores:
    a: La asignación a never lo impide.
    c: Es un error.
    d: Se detecta al compilar.
  referencia: https://www.typescriptlang.org/docs/handbook/2/narrowing.html
- id: L02-003
  tipo: completar
  dificultad: media
  objetivo: "2.3"
  enunciado: Completa la comprobación de exhaustividad.
  codigo:
    lenguaje: typescript
    fuente: |
      switch (pago.tipo) {
        // ...casos...
        default: {
          const imposible: [[1]] = [[2]];
          return imposible;
        }
      }
  huecos:
    - {id: "1", respuestas: [never]}
    - {id: "2", respuestas: [pago]}
  explicacion: Si se han tratado todos los casos, pago es never en el default y la asignación es válida.
  referencia: https://www.typescriptlang.org/docs/handbook/2/narrowing.html
- id: L02-004
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.3"
  enunciado: ¿Qué es una unión discriminada?
  opciones:
    - {id: a, texto: "Una unión de objetos con una propiedad literal común que indica el caso"}
    - {id: b, texto: "Una unión que excluye null"}
    - {id: c, texto: "Una clase abstracta"}
    - {id: d, texto: "Un enum de números"}
  correctas: [a]
  explicacion: La propiedad tipo permite a TypeScript estrechar a cada caso en un switch o un if.
  distractores:
    b: No tiene relación con null.
    c: Son tipos de objeto, no clases.
    d: Usa literales de texto, no un enum.
  referencia: https://www.typescriptlang.org/docs/handbook/2/narrowing.html
- id: L02-005
  tipo: multiple_response
  dificultad: media
  objetivo: "2.2"
  enunciado: ¿Qué comprobaciones estrechan el tipo en TypeScript?
  opciones:
    - {id: a, texto: "typeof x === \"string\""}
    - {id: b, texto: "x instanceof Date"}
    - {id: c, texto: "\"iban\" in pago"}
    - {id: d, texto: "Un comentario // x es string"}
    - {id: e, texto: "console.log(x)"}
  correctas: [a, b, c]
  explicacion: El compilador entiende typeof, instanceof, in, la igualdad y las funciones de guarda.
  distractores:
    d: Los comentarios no afectan al tipo.
    e: Mostrar el valor no lo comprueba.
  referencia: https://www.typescriptlang.org/docs/handbook/2/narrowing.html
- id: L02-006
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.4"
  enunciado: 'En modo estricto, ¿qué pasa con let nombre: string = null?'
  opciones:
    - {id: a, texto: "Compila"}
    - {id: b, texto: "Se convierte en cadena vacía"}
    - {id: c, texto: "Error, porque string no incluye null; hay que declarar string | null"}
    - {id: d, texto: "Error solo al ejecutar"}
  correctas: [c]
  explicacion: El modo estricto separa null y undefined del resto de tipos para obligar a tratarlos.
  distractores:
    a: Solo compilaría sin el modo estricto.
    b: No hay conversión.
    d: Es un error de compilación.
  referencia: https://www.typescriptlang.org/docs/handbook/2/everyday-types.html
