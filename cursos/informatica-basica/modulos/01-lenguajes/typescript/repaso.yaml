  tipo: multiple_choice
  dificultad: media
  objetivo: "4.2"
  enunciado: ¿Qué diferencia hay entre parse y safeParse?
  opciones:
    - {id: a, texto: "safeParse no valida"}
    - {id: b, texto: "parse lanza un error si los datos no son válidos; safeParse devuelve un objeto con success y los datos o el error"}
    - {id: c, texto: "parse es asíncrono"}
    - {id: d, texto: "Son iguales"}
  correctas: [b]
  explicacion: safeParse es cómodo para devolver un 400 con todos los problemas sin usar excepciones.
  distractores:
    a: Valida igual.
    c: Ambos son síncronos; hay variantes asíncronas aparte.
    d: Se comportan distinto ante datos inválidos.
  referencia: https://zod.dev/basics
- id: L04-005
  tipo: completar
  dificultad: media
  objetivo: "4.3"
  enunciado: Completa la línea para deducir el tipo del esquema.
  codigo:
    lenguaje: typescript
    fuente: |
      type NuevoProducto = z.[[1]]<[[2]] NuevoProductoSchema>;
  huecos:
    - {id: "1", respuestas: [infer]}
    - {id: "2", respuestas: [typeof]}
  explicacion: z.infer recibe el tipo del esquema, que se obtiene con typeof.
  referencia: https://zod.dev/basics
- id: L04-006
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.3"
  enunciado: ¿Qué ventaja tiene deducir el tipo con z.infer en lugar de escribir una interfaz aparte?
  opciones:
    - {id: a, texto: "Que el tipo y la validación salen de una sola definición y no se desincronizan"}
    - {id: b, texto: "Que el programa es más rápido"}
    - {id: c, texto: "Que no hace falta validar"}
    - {id: d, texto: "Que el tipo existe al ejecutar"}
  correctas: [a]
  explicacion: Si se añade un campo al esquema, el tipo lo incluye automáticamente.
  distractores:
    b: No afecta al rendimiento.
    c: El esquema es la validación.
    d: El tipo se sigue borrando; lo que existe al ejecutar es el esquema.
  referencia: https://zod.dev/basics
- id: L04-007
  tipo: multiple_response
  dificultad: media
  objetivo: "4.1"
  enunciado: ¿Qué datos conviene validar al llegar?
  opciones:
    - {id: a, texto: "El cuerpo de una petición HTTP"}
    - {id: b, texto: "La respuesta de una API externa"}
    - {id: c, texto: "Las variables de entorno"}
    - {id: d, texto: "El valor que una función propia pasa a otra"}
    - {id: e, texto: "Una constante del propio código"}
  correctas: [a, b, c]
  explicacion: Son bordes por donde entran datos que el compilador no controla.
  distractores:
    d: Entre funciones propias, el compilador ya lo comprueba.
    e: El compilador conoce su valor.
  referencia: https://zod.dev/
- id: L04-008
  tipo: multiple_choice
  dificultad: baja
  objetivo: "4.2"
  enunciado: '¿Qué mensajes dio safeParse({ nombre: "   ", precio: -1 })?'
  opciones:
    - {id: a, texto: "Solo el del nombre"}
    - {id: b, texto: "Ninguno"}
    - {id: c, texto: "Uno genérico"}
    - {id: d, texto: "Los dos: el del nombre vacío y el de precio no positivo, cada uno con su ruta"}
  correctas: [d]
  explicacion: Zod revisa el objeto completo y devuelve la lista de problemas con su ruta.
  distractores:
