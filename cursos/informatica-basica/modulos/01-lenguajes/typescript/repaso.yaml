- id: L03-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.2"
  enunciado: '¿Qué dio tsc 7 con function cambiar(p: Readonly<Producto>) { p.precio = 1; }?'
  opciones:
    - {id: a, texto: "Nada; compila"}
    - {id: b, texto: "Un error en ejecución"}
    - {id: c, texto: "Una advertencia"}
    - {id: d, texto: "Error TS2540, porque precio es de solo lectura"}
  correctas: [d]
  explicacion: Readonly marca las propiedades como de solo lectura para el compilador.
  distractores:
    a: El compilador lo rechaza.
    b: Al ejecutar no hay ninguna protección; el error es de compilación.
    c: Es un error.
  referencia: https://www.typescriptlang.org/docs/handbook/utility-types.html
- id: L03-004
  tipo: multiple_choice
  dificultad: alta
  objetivo: "3.2"
  enunciado: Si el código se ejecuta saltándose tsc, ¿impide Readonly modificar el objeto?
  opciones:
    - {id: a, texto: "No; Readonly solo existe al compilar. Para impedirlo al ejecutar haría falta Object.freeze"}
    - {id: b, texto: "Sí, lanza un error"}
    - {id: c, texto: "Sí, ignora la asignación"}
    - {id: d, texto: "Solo en Node 26"}
  correctas: [a]
  explicacion: Los tipos se borran; Readonly no genera ningún código.
  distractores:
    b: No queda nada en ejecución que lo compruebe.
