- id: L03-001
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.1"
  enunciado: 'Con function campo<T, K extends keyof T>(obj: T, clave: K): T[K], ¿qué pasa con campo(libro, "color") si Producto no tiene color?'
