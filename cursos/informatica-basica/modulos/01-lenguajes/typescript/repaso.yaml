    d: Node tampoco lo comprueba.
  referencia: https://www.typescriptlang.org/docs/handbook/utility-types.html
- id: L03-005
  tipo: completar
  dificultad: media
  objetivo: "3.3"
  enunciado: Completa el código para derivar la unión "EUR" | "USD" | "GBP" de la lista.
