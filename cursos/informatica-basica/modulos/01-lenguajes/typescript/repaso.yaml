- id: L05-001
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.2"
  enunciado: ¿Qué pasó al ejecutar con node un fichero .ts que declara enum Estado { Pendiente, Pagado }?
  opciones:
    - {id: a, texto: "Funcionó igual que con tsc"}
    - {id: b, texto: "Imprimió un aviso y siguió"}
    - {id: c, texto: "SyntaxError ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX, porque enum no se puede borrar"}
    - {id: d, texto: "Lo convirtió en una unión"}
  correctas: [c]
  explicacion: Node solo quita sintaxis de tipos; un enum genera código, y en el modo de solo borrado no se admite.
  distractores:
    a: Node no transforma código, solo borra tipos.
    b: Es un error que detiene la ejecución.
    d: No hace conversiones.
  referencia: https://nodejs.org/api/typescript.html
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.1"
  enunciado: ¿Qué hace erasableSyntaxOnly en tsconfig.json?
  opciones:
    - {id: a, texto: "Hace que tsc rechace la sintaxis que no se puede borrar, como enum, para que el código funcione con Node"}
    - {id: b, texto: "Borra los ficheros generados"}
    - {id: c, texto: "Desactiva la comprobación de tipos"}
    - {id: d, texto: "Elimina los comentarios"}
  correctas: [a]
  explicacion: Con la opción, tsc dio TS1294 en el enum, antes de ejecutar.
  distractores:
    b: No borra ficheros.
    c: La comprobación sigue activa.
    d: No tiene relación con los comentarios.
  referencia: https://www.typescriptlang.org/tsconfig/#erasableSyntaxOnly
- id: L05-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.1"
  enunciado: 'Con noUncheckedIndexedAccess, ¿qué pasa con const n: string = nombres[3], si nombres es string[]?'
  opciones:
    - {id: a, texto: "Compila y n vale undefined al ejecutar"}
    - {id: b, texto: "Error TS2322, porque el acceso es string | undefined"}
    - {id: c, texto: "Lanza un error de índice al ejecutar"}
    - {id: d, texto: "Devuelve una cadena vacía"}
  correctas: [b]
  explicacion: La opción añade undefined a los accesos por índice y obliga a comprobarlos.
  distractores:
    a: Es lo que pasa sin la opción.
    c: JavaScript devuelve undefined, no lanza un error.
    d: No hay valores por defecto.
  referencia: https://www.typescriptlang.org/tsconfig/#noUncheckedIndexedAccess
- id: L05-004
  tipo: multiple_response
  dificultad: media
  objetivo: "5.2"
  enunciado: ¿Qué limitaciones tiene ejecutar TypeScript directamente con Node 26?
  opciones:
    - {id: a, texto: "No comprueba los tipos"}
    - {id: b, texto: "Ignora tsconfig.json, así que no admite alias de rutas (paths)"}
    - {id: c, texto: "No admite enum ni otra sintaxis que genere código"}
    - {id: d, texto: "Solo funciona en Windows"}
    - {id: e, texto: "No admite interfaces"}
  correctas: [a, b, c]
  explicacion: La documentación de Node lo describe así; las interfaces se borran sin problema.
  distractores:
    d: Funciona en cualquier sistema.
    e: Las interfaces son sintaxis de tipos y se borran.
  referencia: https://nodejs.org/api/typescript.html
- id: L05-005
  tipo: completar
  dificultad: baja
  objetivo: "5.3"
  enunciado: Completa las órdenes de la CI que comprueban los tipos y ejecutan las pruebas.
  codigo:
    lenguaje: bash
    fuente: |
      npx tsc --[[1]]
      node --[[2]] src/*.test.ts
  huecos:
    - {id: "1", respuestas: [noEmit]}
    - {id: "2", respuestas: [test]}
  explicacion: tsc --noEmit solo comprueba tipos; node --test ejecuta las pruebas de node:test.
  referencia: https://nodejs.org/api/test.html
- id: L05-006
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.1"
  enunciado: Con TypeScript 7, el código usa process.env pero tsc dice que no encuentra process. ¿Qué falta?
  opciones:
    - {id: a, texto: "Activar strict"}
    - {id: b, texto: "Usar any"}
    - {id: c, texto: "Instalar Node 26"}
    - {id: d, texto: "Declarar types ['node'] y tener @types/node, porque desde TypeScript 6 types vale []"}
  correctas: [d]
  explicacion: TypeScript 6 dejó de incluir por defecto todos los paquetes de node_modules/@types.
  distractores:
    a: strict no añade declaraciones.
    b: Ocultaría el problema.
    c: Es un problema de declaraciones de tipos, no de la versión de Node.
  referencia: https://devblogs.microsoft.com/typescript/announcing-typescript-6-0/
- id: L05-007
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.2"
  enunciado: ¿Qué usarías en lugar de enum Estado { Pendiente, Pagado } para que funcione con Node?
  opciones:
    - {id: a, texto: "type Estado = \"pendiente\" | \"pagado\", o un objeto as const"}
    - {id: b, texto: "Una clase abstracta"}
    - {id: c, texto: "any"}
    - {id: d, texto: "Un comentario con los valores"}
  correctas: [a]
  explicacion: Las uniones de literales y los objetos as const son sintaxis borrable o JavaScript normal.
  distractores:
    b: No modela un conjunto de valores.
    c: Pierde la comprobación.
    d: El compilador no lo entiende.
  referencia: https://nodejs.org/api/typescript.html
- id: L05-008
  tipo: multiple_choice
  dificultad: baja
  objetivo: "5.1"
  enunciado: ¿Por qué el proyecto del tema usa noEmit?
  opciones:
    - {id: a, texto: "Para no comprobar tipos"}
    - {id: b, texto: "Porque tsc solo comprueba los tipos; Node ejecuta los .ts directamente"}
    - {id: c, texto: "Para que tsc sea más lento"}
    - {id: d, texto: "Porque Node no admite JavaScript"}
  correctas: [b]
  explicacion: No hace falta generar JavaScript si Node ejecuta los ficheros TypeScript.
  distractores:
    a: Comprueba los tipos igual.
    c: Al contrario, hace menos trabajo.
    d: Node ejecuta JavaScript.
  referencia: https://www.typescriptlang.org/tsconfig/
