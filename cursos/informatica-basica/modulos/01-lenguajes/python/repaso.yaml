  referencia: https://docs.pydantic.dev/latest/concepts/pydantic_settings/
- id: L03-007
  tipo: multiple_response
  dificultad: media
  objetivo: "3.3"
  enunciado: ¿Qué ventajas tiene cargar la configuración con BaseSettings frente a os.environ disperso por el código?
