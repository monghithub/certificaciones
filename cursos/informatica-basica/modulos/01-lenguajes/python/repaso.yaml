  distractores:
    b: Son libres.
    c: Se podrían poner como dependencias normales, pero no conviene.
    d: El grupo no cambia la velocidad.
  referencia: https://docs.astral.sh/uv/concepts/projects/
- id: L02-001
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.2"
  enunciado: ¿Qué devuelve describir(Importe(200_000))?
  codigo:
    lenguaje: python
    fuente: |
      def describir(x: object) -> str:
          match x:
              case Importe(centimos=c) if c > 100_000:
                  return "importe alto"
              case Importe(centimos=c, moneda=m):
                  return f"{c / 100:.2f} {m}"
              case _:
                  return "desconocido"
  opciones:
    - {id: a, texto: "2000.00 EUR"}
    - {id: b, texto: "desconocido"}
    - {id: c, texto: "importe alto"}
    - {id: d, texto: "Error, porque encajan dos casos"}
  correctas: [c]
  explicacion: Los casos se prueban en orden y el primero, con la guarda, se cumple. Es la salida de la ejecución con Python 3.15.
  distractores:
    a: Sería el resultado si el caso general fuera primero.
    b: Es un Importe, así que encaja antes.
    d: Se elige el primer caso que encaja.
  referencia: https://peps.python.org/pep-0636/
- id: L02-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.2"
  enunciado: '¿Qué devuelve describir({"tipo": "bizum", "telefono": "600123123"}) con un caso case {"tipo": "bizum", "telefono": tel}?'
  opciones:
    - {id: a, texto: "desconocido, porque match no admite diccionarios"}
    - {id: b, texto: "Bizum a 600123123"}
    - {id: c, texto: "Error, porque el diccionario no es una clase"}
    - {id: d, texto: "Bizum a tel"}
  correctas: [b]
  explicacion: Los patrones de diccionario comprueban las claves y capturan valores en variables.
  distractores:
    a: match admite patrones de diccionario.
    c: No hace falta que sea una clase.
    d: tel es una variable capturada, no un texto.
  referencia: https://peps.python.org/pep-0636/
- id: L02-003
  tipo: completar
  dificultad: media
  objetivo: "2.1"
  enunciado: Completa la declaración genérica con la sintaxis del PEP 695.
  codigo:
    lenguaje: python
    fuente: |
      [[1]] Id = int

      class Repositorio[[2]]:
          def buscar(self, id: Id) -> T | None: ...
  huecos:
    - {id: "1", respuestas: [type]}
    - {id: "2", respuestas: ["[T]"]}
  explicacion: Desde Python 3.12, type declara alias y los parámetros de tipo van entre corchetes tras el nombre de la clase.
  referencia: https://peps.python.org/pep-0695/
- id: L02-004
  tipo: multiple_choice
  dificultad: baja
  objetivo: "2.2"
  enunciado: ¿Qué hace @dataclass(frozen=True)?
  opciones:
    - {id: a, texto: "Guarda la clase en disco"}
    - {id: b, texto: "Genera constructor, igualdad y representación, e impide modificar los campos"}
    - {id: c, texto: "Hace la clase más rápida congelando la memoria"}
    - {id: d, texto: "Convierte la clase en un diccionario"}
  correctas: [b]
  explicacion: Es la forma habitual de crear objetos valor inmutables, como los records de Java.
  distractores:
    a: No tiene relación con la persistencia.
    c: frozen se refiere a la inmutabilidad.
    d: Sigue siendo una clase.
  referencia: https://docs.python.org/3/library/typing.html
- id: L02-005
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.3"
  enunciado: ¿Qué imprimió este código con Python 3.15?
  codigo:
    lenguaje: python
    fuente: |
      lazy import json
      import sys
      print("json" in sys.modules)
      json.dumps({})
      print("json" in sys.modules)
  opciones:
    - {id: a, texto: "False y True"}
    - {id: b, texto: "True y True"}
    - {id: c, texto: "SyntaxError"}
    - {id: d, texto: "False y False"}
  correctas: [a]
  explicacion: Con lazy import (PEP 810), el módulo se carga en el primer uso.
  distractores:
    b: Sería una importación normal.
    c: Es sintaxis válida desde Python 3.15.
    d: Al usarlo, se carga.
  referencia: https://peps.python.org/pep-0810/
