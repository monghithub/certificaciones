    - {id: "1", respuestas: [HTTPException]}
    - {id: "2", respuestas: ["404"]}
  explicacion: HTTPException corta la ruta y devuelve el código y el detalle. En la prueba, la respuesta fue detail No existe el producto 99.
  referencia: https://fastapi.tiangolo.com/tutorial/handling-errors/
- id: L04-004
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.2"
  enunciado: ¿Por qué obtener_sesion usa yield en lugar de return?
  codigo:
    lenguaje: python
    fuente: |
      def obtener_sesion() -> Iterator[Session]:
          with fabrica() as sesion:
              yield sesion
  opciones:
    - {id: a, texto: "Para que la sesión se comparta entre peticiones"}
    - {id: b, texto: "Para que el código posterior (cerrar la sesión) se ejecute cuando la ruta termina, haya error o no"}
    - {id: c, texto: "Porque FastAPI no admite return en dependencias"}
    - {id: d, texto: "Para que sea asíncrona"}
  correctas: [b]
  explicacion: Es el patrón de FastAPI para abrir y cerrar un recurso por petición.
  distractores:
    a: Se crea una sesión por petición.
    c: Admite dependencias con return.
    d: yield no la convierte en asíncrona.
  referencia: https://fastapi.tiangolo.com/tutorial/dependencies/dependencies-with-yield/
- id: L04-005
  tipo: multiple_choice
  dificultad: baja
  objetivo: "4.1"
  enunciado: ¿Dónde ofrece FastAPI la documentación interactiva de la API?
  opciones:
    - {id: a, texto: "En /docs, generada a partir de los tipos"}
    - {id: b, texto: "Hay que escribirla a mano en un fichero YAML"}
    - {id: c, texto: "En /actuator"}
    - {id: d, texto: "No ofrece documentación"}
  correctas: [a]
  explicacion: FastAPI genera el esquema OpenAPI con los modelos y las rutas y lo muestra en /docs.
  distractores:
    b: La genera sola.
    c: Es una ruta de Spring Boot Actuator.
    d: Es una de sus funciones principales.
  referencia: https://fastapi.tiangolo.com/tutorial/dependencies/
- id: L04-006
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.1"
  enunciado: La ruta declara -> ProductoLeido. ¿Qué efecto tiene ese tipo de retorno?
  opciones:
    - {id: a, texto: "Ninguno; Python ignora las anotaciones"}
    - {id: b, texto: "Convierte la respuesta en XML"}
    - {id: c, texto: "Guarda el producto"}
    - {id: d, texto: "FastAPI valida y filtra la respuesta con ese modelo y la documenta en OpenAPI"}
  correctas: [d]
  explicacion: Aunque Python no aplique anotaciones, FastAPI las lee y las usa.
  distractores:
    a: FastAPI sí las usa.
    b: La respuesta es JSON.
    c: No tiene relación con la persistencia.
  referencia: https://fastapi.tiangolo.com/tutorial/dependencies/
- id: L04-007
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.4"
  enunciado: ¿Qué ventaja tiene declarar las columnas con Mapped[int] en SQLAlchemy 2?
  opciones:
    - {id: a, texto: "Crea la tabla más rápido"}
    - {id: b, texto: "Los tipos de las columnas son visibles para mypy y el editor"}
    - {id: c, texto: "Valida la entrada HTTP"}
    - {id: d, texto: "Evita usar una base de datos"}
  correctas: [b]
  explicacion: El estilo declarativo de SQLAlchemy 2 integra las anotaciones de tipo en el modelo.
  distractores:
    a: No afecta a la creación.
    c: Eso lo hace Pydantic.
    d: Sigue necesitando una base de datos.
  referencia: https://docs.sqlalchemy.org/en/21/orm/quickstart.html
- id: L04-008
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.2"
  enunciado: ¿Qué ventaja principal tiene obtener la sesión con Depends en vez de crearla dentro de cada ruta?
  opciones:
    - {id: a, texto: "Que no hace falta base de datos"}
    - {id: b, texto: "Que las rutas son asíncronas"}
    - {id: c, texto: "Que se gestiona en un solo sitio y se puede sustituir en las pruebas"}
    - {id: d, texto: "Que la sesión dura toda la vida de la aplicación"}
  correctas: [c]
  explicacion: La dependencia centraliza la creación y el cierre, y app.dependency_overrides permite cambiarla por una base de pruebas.
  distractores:
    a: Sigue habiendo base de datos.
    b: No cambia si la ruta es asíncrona.
    d: Hay una sesión por petición.
  referencia: https://fastapi.tiangolo.com/tutorial/dependencies/
- id: L05-001
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.2"
  enunciado: Con uvicorn, 10 peticiones simultáneas a esta ruta. ¿Cuánto tardaron en total?
  codigo:
    lenguaje: python
    fuente: |
      @app.get("/async-bloqueante")
      async def async_bloqueante() -> str:
          time.sleep(1)
          return "ok"
  opciones:
    - {id: a, texto: "Unos 1,01 s"}
    - {id: b, texto: "Unos 10,05 s, porque time.sleep bloquea el bucle de eventos"}
    - {id: c, texto: "Unos 5 s"}
    - {id: d, texto: "Fallaron por tiempo de espera"}
  correctas: [b]
  explicacion: La llamada bloqueante detiene el único hilo del bucle, así que las peticiones se atienden de una en una.
  distractores:
    a: Fue el tiempo de las rutas que no bloquean.
    c: No hay paralelismo parcial.
    d: Terminaron todas, aunque una detrás de otra.
  referencia: https://fastapi.tiangolo.com/async/
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.2"
  enunciado: La misma espera de 1 s con time.sleep, pero declarada con def normal. ¿Cuánto tardaron 10 peticiones?
  opciones:
    - {id: a, texto: "Unos 10 s"}
    - {id: b, texto: "Error, porque FastAPI exige async def"}
    - {id: c, texto: "Unos 1,01 s, porque FastAPI ejecuta las rutas def en un grupo de hilos"}
    - {id: d, texto: "Unos 20 s"}
  correctas: [c]
  explicacion: La documentación de FastAPI indica que las rutas con def normal se ejecutan en un grupo de hilos externo para no bloquear el servidor.
  distractores:
    a: El bucle no se bloquea.
    b: FastAPI admite ambas.
    d: No hay penalización.
  referencia: https://fastapi.tiangolo.com/async/
- id: L05-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.2"
  enunciado: Tu ruta consulta la base de datos con una biblioteca síncrona. ¿Cómo la declaras?
  opciones:
    - {id: a, texto: "Con def, para que FastAPI la ejecute en un hilo aparte"}
    - {id: b, texto: "Con async def, porque es más rápido"}
    - {id: c, texto: "Con async def y time.sleep entre consultas"}
    - {id: d, texto: "Es indiferente"}
  correctas: [a]
  explicacion: async def solo conviene si todo lo que espera dentro es asíncrono; si no, bloquearía el bucle.
  distractores:
    b: Con bibliotecas síncronas es el peor caso.
    c: Empeora el bloqueo.
    d: La prueba mostró una diferencia de 1 s a 10 s.
  referencia: https://fastapi.tiangolo.com/async/
- id: L05-004
  tipo: multiple_choice
  dificultad: baja
  objetivo: "5.1"
  enunciado: ¿Qué hace una corrutina cuando ejecuta await asyncio.sleep(1)?
  opciones:
    - {id: a, texto: "Bloquea el hilo un segundo"}
    - {id: b, texto: "Termina la corrutina"}
    - {id: c, texto: "Crea un proceso nuevo"}
    - {id: d, texto: "Cede el control al bucle de eventos, que puede avanzar otras corrutinas mientras espera"}
  correctas: [d]
  explicacion: Es lo que permite atender muchas esperas en un solo hilo.
  distractores:
    a: Eso hace time.sleep.
    b: Continúa al terminar la espera.
    c: asyncio trabaja en un solo hilo.
  referencia: https://docs.python.org/3/library/asyncio-task.html
- id: L05-005
  tipo: completar
  dificultad: media
  objetivo: "5.3"
  enunciado: Completa la fixture para que las peticiones usen la sesión de prueba.
  codigo:
    lenguaje: python
    fuente: |
      app.[[1]][obtener_sesion] = sesion_de_prueba
      with TestClient(app) as c:
          yield c
      app.dependency_overrides.[[2]]()
  huecos:
    - {id: "1", respuestas: [dependency_overrides]}
    - {id: "2", respuestas: [clear]}
  explicacion: dependency_overrides sustituye la dependencia original; al terminar se limpia para no afectar a otras pruebas.
  referencia: https://fastapi.tiangolo.com/advanced/testing-dependencies/
- id: L05-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: "5.3"
  enunciado: Las pruebas con SQLite en memoria fallaban con OperationalError porque la tabla no existía. ¿Qué lo resolvió?
  opciones:
    - {id: a, texto: "Usar un fichero en lugar de memoria"}
    - {id: b, texto: "Usar StaticPool, para que todas las sesiones compartan la misma conexión y, por tanto, la misma base"}
    - {id: c, texto: "Reintentar la petición"}
    - {id: d, texto: "Declarar las rutas con async def"}
  correctas: [b]
  explicacion: SQLite en memoria crea una base distinta por conexión; la tabla se creó en una y la petición usaba otra.
  distractores:
    a: Funcionaría, pero no es el problema de fondo.
    c: Fallaría igual.
    d: No tiene relación con las conexiones.
  referencia: https://fastapi.tiangolo.com/advanced/testing-dependencies/
- id: L05-007
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.3"
  enunciado: ¿Qué limitación tiene probar con SQLite en memoria una aplicación que usa PostgreSQL en producción?
  opciones:
    - {id: a, texto: "Ninguna"}
    - {id: b, texto: "Que es más lento"}
    - {id: c, texto: "Que no se comporta igual en tipos, bloqueos y SQL específico, así que las consultas y transacciones conviene probarlas contra PostgreSQL"}
    - {id: d, texto: "Que no admite SQLAlchemy"}
  correctas: [c]
  explicacion: Para la integración real, se usa la misma base que en producción, por ejemplo con Testcontainers.
  distractores:
    a: Las diferencias pueden ocultar errores.
    b: Es más rápido.
    d: SQLAlchemy admite SQLite.
  referencia: https://fastapi.tiangolo.com/advanced/testing-dependencies/
- id: L05-008
  tipo: multiple_choice
  dificultad: baja
  objetivo: "5.3"
  enunciado: En una fixture de pytest, ¿qué ocurre con el código que va después del yield?
  opciones:
    - {id: a, texto: "No se ejecuta"}
    - {id: b, texto: "Se ejecuta antes de la prueba"}
    - {id: c, texto: "Se ejecuta solo si la prueba falla"}
    - {id: d, texto: "Se ejecuta cuando termina la prueba, como limpieza"}
  correctas: [d]
  explicacion: El yield entrega el valor a la prueba; lo que sigue es la limpieza.
  distractores:
    a: Se ejecuta al terminar.
    b: Lo de antes del yield es la preparación.
    c: Se ejecuta siempre.
  referencia: https://docs.pytest.org/en/stable/how-to/fixtures.html
