- id: L02-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: "2.3"
  enunciado: ¿Para qué sirven las plantillas t"…" de Python 3.14 frente a las f-strings?
  opciones:
    - {id: a, texto: "Son f-strings más rápidas"}
    - {id: b, texto: "Traducen el texto a otros idiomas"}
    - {id: c, texto: "Devuelven un objeto Template con el texto y los valores separados, para procesarlos (por ejemplo, escaparlos) antes de unirlos"}
    - {id: d, texto: "Solo admiten números"}
  correctas: [c]
  explicacion: Una f-string se convierte en una cadena al momento; una plantilla conserva sus partes, y eso permite construir SQL o HTML seguros.
  distractores:
    a: No es una optimización.
    b: No tienen relación con la traducción.
    d: Admiten cualquier valor.
  referencia: https://peps.python.org/pep-0750/
- id: L02-008
  tipo: multiple_choice
  dificultad: media
  objetivo: "2.1"
  enunciado: Un método devuelve T | None. ¿Qué te obliga a hacer mypy antes de usar el resultado como T?
  opciones:
    - {id: a, texto: "Nada"}
    - {id: b, texto: "Comprobar que no es None"}
    - {id: c, texto: "Convertirlo a cadena"}
    - {id: d, texto: "Capturar una excepción"}
  correctas: [b]
  explicacion: El tipo declara que puede faltar el valor; mypy marca el uso directo como error hasta que se trata el caso None.
  distractores:
    a: mypy lo comprueba.
    c: No es necesario.
    d: No hay ninguna excepción; el valor puede ser None.
  referencia: https://mypy.readthedocs.io/en/stable/
- id: L03-001
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.2"
  enunciado: Con el modelo NuevoProducto de la lección, ¿qué nombre se guardó al enviar "  libro "?
  opciones:
    - {id: a, texto: "\"  libro \""}
    - {id: b, texto: "Error de validación"}
    - {id: c, texto: "\"LIBRO\""}
    - {id: d, texto: "\"libro\", porque el validador quita los espacios"}
  correctas: [d]
  explicacion: El validador devuelve el valor transformado, y ese es el que queda en el modelo. La respuesta de la API fue nombre libro.
  distractores:
    a: El validador lo modifica.
    b: Tras quitar los espacios no está vacío.
    c: No cambia mayúsculas.
  referencia: https://docs.pydantic.dev/latest/concepts/validators/
- id: L03-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.1"
  enunciado: 'Se envía {"nombre": "   ", "precio": -1}. ¿Qué errores devolvió Pydantic?'
  opciones:
    - {id: a, texto: "Solo el primero, el del nombre"}
    - {id: b, texto: "Los dos, cada uno con su ubicación (body.nombre y body.precio)"}
    - {id: c, texto: "Ninguno; se corrigen solos"}
    - {id: d, texto: "Un error genérico sin detalle"}
  correctas: [b]
  explicacion: Pydantic valida todos los campos y devuelve la lista completa de errores.
  distractores:
    a: No se detiene en el primero.
    c: No se corrigen los valores inválidos.
    d: Cada error tiene tipo, ubicación y mensaje.
  referencia: https://docs.pydantic.dev/latest/concepts/models/
- id: L03-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.4"
  enunciado: ¿Cómo apareció el campo precio (Decimal) en el JSON de la respuesta?
  opciones:
    - {id: a, texto: "Como el número 20.0"}
    - {id: b, texto: "Como la cadena \"20\""}
    - {id: c, texto: "Como un objeto con parte entera y decimal"}
    - {id: d, texto: "No apareció"}
  correctas: [b]
  explicacion: Pydantic serializa Decimal como cadena en JSON para no perder precisión. La respuesta real fue precio "20".
  distractores:
    a: Un número JSON se leería como coma flotante.
    c: No usa esa estructura.
    d: Es un campo declarado del modelo de salida.
  referencia: https://docs.pydantic.dev/latest/concepts/serialization/
- id: L03-004
  tipo: completar
  dificultad: media
  objetivo: "3.1"
  enunciado: Completa el modelo para que el precio sea mayor que cero y el nombre tenga al menos un carácter.
  codigo:
    lenguaje: python
    fuente: |
      class NuevoProducto(BaseModel):
          nombre: Annotated[str, Field([[1]]=1)]
          precio: Annotated[Decimal, Field([[2]]=0)]
  huecos:
    - {id: "1", respuestas: [min_length]}
    - {id: "2", respuestas: [gt]}
  explicacion: min_length limita la longitud y gt exige un valor estrictamente mayor.
  referencia: https://docs.pydantic.dev/latest/concepts/models/
- id: L03-005
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.1"
  enunciado: ¿Para qué sirve model_config = ConfigDict(from_attributes=True) en ProductoLeido?
  opciones:
    - {id: a, texto: "Para leer atributos de un objeto, como una entidad de SQLAlchemy, con model_validate"}
    - {id: b, texto: "Para guardar el modelo en la base de datos"}
    - {id: c, texto: "Para que los atributos sean opcionales"}
    - {id: d, texto: "Para exponer el resto de atributos de la entidad"}
  correctas: [a]
  explicacion: Por defecto Pydantic espera un diccionario; con from_attributes acepta objetos y copia solo los campos declarados.
  distractores:
    b: Pydantic no persiste nada.
    c: No cambia la obligatoriedad.
    d: Solo salen los campos declarados en el modelo.
  referencia: https://docs.pydantic.dev/latest/concepts/models/
- id: L03-006
  tipo: multiple_choice
  dificultad: media
