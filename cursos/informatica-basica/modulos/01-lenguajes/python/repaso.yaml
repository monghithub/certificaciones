- id: L01-007
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.4"
  enunciado: 'Una función anotada como def total(x: int) -> int recibe "3" al ejecutarse. ¿Qué hace Python?'
  opciones:
    - {id: a, texto: "Lanza TypeError por la anotación"}
    - {id: b, texto: 'Convierte "3" a 3'}
    - {id: c, texto: "Nada especial; las anotaciones no se comprueban al ejecutar. Lo detectaría mypy antes"}
    - {id: d, texto: "No compila"}
  correctas: [c]
  explicacion: Las anotaciones son información para herramientas como mypy, Pydantic o FastAPI; el intérprete no las aplica.
  distractores:
    a: El intérprete no valida anotaciones.
    b: Python no convierte tipos por la anotación; Pydantic sí lo haría.
    d: Python no tiene un paso de compilación que lo impida.
