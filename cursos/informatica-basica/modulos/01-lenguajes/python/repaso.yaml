- id: L01-001
  tipo: multiple_choice
  dificultad: baja
  objetivo: "1.1"
  enunciado: ¿Con qué frecuencia publica Python una versión nueva y cuánto dura su soporte?
  opciones:
    - {id: a, texto: "Cada seis meses, con LTS cada dos años"}
    - {id: b, texto: "Cada año en octubre, con soporte durante cinco años"}
    - {id: c, texto: "Cada cinco años, con soporte durante diez"}
    - {id: d, texto: "Cuando está lista, sin calendario"}
  correctas: [b]
  explicacion: Según el PEP 602 y la guía de desarrollo, hay una versión anual y cada una llega a su fin de vida cinco años después.
  distractores:
    a: Es el modelo de Java.
    c: El ciclo es anual.
    d: Hay un calendario fijo.
  referencia: https://devguide.python.org/versions/
- id: L01-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.1"
  enunciado: Desde Python 3.13, ¿qué pasa dos años después de publicarse una versión?
  opciones:
    - {id: a, texto: "Llega a su fin de vida"}
    - {id: b, texto: "Pasa a ser LTS"}
    - {id: c, texto: "Solo recibe correcciones de seguridad y ya no se publican binarios"}
    - {id: d, texto: "Recibe nuevas características"}
  correctas: [c]
  explicacion: La fase de correcciones de errores dura dos años; después solo hay arreglos de seguridad hasta el quinto año.
  distractores:
    a: El fin de vida llega a los cinco años.
    b: Python no tiene versiones LTS.
    d: Las características nuevas solo entran antes de la primera beta.
  referencia: https://devguide.python.org/versions/
- id: L01-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.3"
  enunciado: ¿Qué diferencia hay entre pyproject.toml y uv.lock?
  opciones:
    - {id: a, texto: "pyproject.toml dice qué versiones se aceptan; uv.lock fija las exactas, también las de las dependencias indirectas"}
    - {id: b, texto: "Son el mismo fichero en dos formatos"}
    - {id: c, texto: "uv.lock se genera en cada máquina y no se sube al repositorio"}
    - {id: d, texto: "pyproject.toml solo se usa en producción"}
  correctas: [a]
  explicacion: El bloqueo es lo que garantiza que todos los entornos instalen exactamente lo mismo, y por eso se versiona.
  distractores:
    b: Tienen propósitos distintos.
    c: Se sube al repositorio para que todos usen las mismas versiones.
    d: Describe el proyecto en todos los entornos.
  referencia: https://docs.astral.sh/uv/concepts/projects/sync/
- id: L01-004
  tipo: multiple_choice
  dificultad: media
  objetivo: "1.3"
  enunciado: En la CI ejecutas uv run --locked pytest y alguien cambió pyproject.toml sin actualizar uv.lock. ¿Qué pasa?
  opciones:
    - {id: a, texto: "uv actualiza el bloqueo y sigue"}
    - {id: b, texto: "uv ignora el cambio"}
    - {id: c, texto: "Instala las últimas versiones de todo"}
    - {id: d, texto: "uv da un error en lugar de actualizar el bloqueo"}
  correctas: [d]
  explicacion: La documentación de uv indica que, con --locked, si el bloqueo no está al día se produce un error.
  distractores:
    a: Es lo que hace sin --locked.
    b: Detecta que no coinciden.
    c: No instala nada distinto del bloqueo.
  referencia: https://docs.astral.sh/uv/concepts/projects/sync/
- id: L01-005
  tipo: completar
  dificultad: baja
  objetivo: "1.2"
  enunciado: Completa las órdenes para añadir FastAPI al proyecto y pytest solo como herramienta de desarrollo.
  codigo:
