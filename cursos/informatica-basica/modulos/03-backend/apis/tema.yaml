resumen: Cómo diseñar APIs que se entienden, fallan bien y evolucionan sin romper a nadie, comprobado con una API en Spring Boot 4.2. Recursos y REST, errores con Problem Details, concurrencia optimista, paginación, idempotencia, contratos OpenAPI, versionado y cuándo elegir gRPC.
