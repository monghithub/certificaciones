resumen: Diseñar el software alrededor del dominio del negocio. Lenguaje ubicuo y subdominios, contextos delimitados y mapas de contexto, agregados con sus invariantes, eventos de dominio y repositorios, e integración entre contextos con capas anticorrupción. El código de ejemplo, en Java 25, se ha ejecutado para comprobar cada regla.
