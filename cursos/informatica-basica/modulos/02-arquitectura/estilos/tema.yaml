resumen: Capas, hexagonal, cebolla, limpia, monolito modular, microservicios y arquitectura dirigida por eventos, comparados por sus reglas de dependencia y sus compromisos. Cómo comprobar los límites de forma automática (import-linter en Python y Spring Modulith en Java, ambos probados) y cómo elegir y documentar la decisión con ADR.
