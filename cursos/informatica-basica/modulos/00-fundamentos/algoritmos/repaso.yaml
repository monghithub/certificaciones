- id: L04-003
  tipo: multiple_response
  dificultad: media
  objetivo: "4.1"
  enunciado: ¿Qué permite un TreeMap que no permite un HashMap?
  opciones:
    - {id: a, texto: "Recorrer las claves en orden"}
    - {id: b, texto: "Obtener la primera clave mayor o igual que una dada"}
    - {id: c, texto: "Consultar un rango de claves"}
    - {id: d, texto: "Búsquedas por clave en O(1) de media"}
    - {id: e, texto: "Claves mutables sin problemas"}
  correctas: [a, b, c]
  explicacion: El árbol mantiene el orden; la tabla hash es más rápida por clave, pero no ordena.
