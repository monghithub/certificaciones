- id: L05-004
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.3"
  enunciado: ¿Cuántas llamadas hizo el Fibonacci recursivo sin memoización para calcular fib(30)?
  opciones:
    - {id: a, texto: "30"}
    - {id: b, texto: "31"}
    - {id: c, texto: "Unas 900"}
    - {id: d, texto: "2 692 537"}
  correctas: [d]
  explicacion: Recalcula los mismos valores muchas veces; el número de llamadas crece de forma exponencial. Con @cache, 31 valores.
  distractores:
    a: Haría falta memoización o un bucle.
    b: Es lo que calculó la versión con @cache.
    c: Son muchas más.
  referencia: https://docs.python.org/3/library/functools.html#functools.cache
- id: L05-005
  tipo: completar
  dificultad: baja
  objetivo: "5.3"
  enunciado: Completa la memoización.
  codigo:
    lenguaje: python
    fuente: |
      from functools import [[1]]

      @[[2]]
      def fibm(n):
          return n if n < 2 else fibm(n - 1) + fibm(n - 2)
  huecos:
    - {id: "1", respuestas: [cache]}
    - {id: "2", respuestas: [cache]}
  explicacion: functools.cache guarda el resultado de cada argumento y lo reutiliza.
  referencia: https://docs.python.org/3/library/functools.html#functools.cache
- id: L05-006
