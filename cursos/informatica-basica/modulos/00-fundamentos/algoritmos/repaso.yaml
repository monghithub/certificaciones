    c: Son las claves posteriores a p.
    d: Los límites no tienen por qué existir.
  referencia: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/TreeMap.html
- id: L04-002
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.1"
  enunciado: ¿Qué coste garantiza TreeMap para get, put y remove?
  opciones:
    - {id: a, texto: "O(1)"}
    - {id: b, texto: "O(n)"}
    - {id: c, texto: "O(log n)"}
    - {id: d, texto: "O(n log n)"}
  correctas: [c]
  explicacion: Su documentación garantiza log(n) porque es un árbol rojo-negro equilibrado.
