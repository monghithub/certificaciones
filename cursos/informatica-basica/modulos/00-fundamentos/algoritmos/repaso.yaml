- id: L05-003
  tipo: multiple_choice
  dificultad: media
  objetivo: "5.2"
  enunciado: ¿Qué devolvió sorted(pedidos, key=lambda p p[1]) con [ana 3, luis 1, eva 3, juan 2, bea 1]?
  opciones:
    - {id: a, texto: "[luis 1, bea 1, juan 2, ana 3, eva 3]"}
    - {id: b, texto: "[bea 1, luis 1, juan 2, ana 3, eva 3]"}
    - {id: c, texto: "[luis 1, bea 1, juan 2, eva 3, ana 3]"}
    - {id: d, texto: "[ana 3, eva 3, juan 2, luis 1, bea 1]"}
