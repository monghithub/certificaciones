  opciones:
    - {id: a, texto: "Porque explora por niveles con una cola: llega antes a los nodos más cercanos"}
    - {id: b, texto: "Porque prueba cada camino posible y elige el menor"}
    - {id: c, texto: "Porque usa una pila"}
    - {id: d, texto: "Porque ordena los nodos alfabéticamente"}
  correctas: [a]
