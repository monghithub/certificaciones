  referencia: https://wiki.python.org/moin/TimeComplexity
- id: L03-007
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.2"
  enunciado: ¿Por qué un record de Java funciona bien como clave de un HashMap?
  opciones:
    - {id: a, texto: "Porque genera equals y hashCode a partir de sus componentes y sus campos son final"}
    - {id: b, texto: "Porque es más pequeño"}
    - {id: c, texto: "Porque HashMap trata los records de forma especial"}
    - {id: d, texto: "No funciona bien"}
  correctas: [a]
  explicacion: Cumple el contrato y es inmutable; en la prueba, contains con un record igual devolvió true.
  distractores:
    b: El tamaño no importa.
    c: No hay trato especial.
    d: Es una buena clave.
  referencia: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html
- id: L03-008
  tipo: multiple_choice
  dificultad: media
  objetivo: "3.1"
  enunciado: Necesitas los clientes ordenados por apellido y consultar los que van de la C a la F. ¿Sirve un HashMap?
  opciones:
    - {id: a, texto: "Sí, es lo más rápido para todo"}
    - {id: b, texto: "Sí, mantiene el orden alfabético"}
    - {id: c, texto: "Solo con claves enteras"}
    - {id: d, texto: "No; una tabla hash no conserva el orden de las claves ni permite rangos. Mejor un TreeMap"}
