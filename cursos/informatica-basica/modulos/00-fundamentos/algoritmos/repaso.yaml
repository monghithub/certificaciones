    - {id: d, texto: "dict.fromkeys(lista)"}
    - {id: e, texto: "Una lista y el operador in"}
  correctas: [["1", a], ["2", b], ["3", c], ["4", d]]
  explicacion: Todas se basan en tablas hash y operan en O(1) de media por elemento.
  distractores:
