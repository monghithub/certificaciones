    a: Es rápido por clave, pero no ordena.
    b: No ordena por clave.
    c: Tampoco ordena enteros.
  referencia: https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/TreeMap.html
- id: L04-001
  tipo: multiple_choice
  dificultad: media
  objetivo: "4.1"
  enunciado: ¿Qué devolvió stock.subMap("k", "p") con las claves kiwi, manzana, pera y uva?
  opciones:
    - {id: a, texto: "{kiwi=7, manzana=5}"}
    - {id: b, texto: "{kiwi=7, manzana=5, pera=3}"}
    - {id: c, texto: "{pera=3, uva=1}"}
    - {id: d, texto: "Error, porque k y p no son claves"}
  correctas: [a]
  explicacion: subMap devuelve el rango [k, p) en orden; pera es posterior a p.
  distractores:
