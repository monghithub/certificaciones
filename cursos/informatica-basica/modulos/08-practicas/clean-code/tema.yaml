resumen: Cómo escribir código fácil de leer y de cambiar, reconocer sus olores y refactorizarlo sin romperlo, también cuando es código heredado sin pruebas, comprobado con Python 3.12, ruff 0.17.6, radon 6.0.1 y pytest 9.2 sobre una misma función de pedidos. Nombres, funciones pequeñas, deuda técnica, pruebas de caracterización, costuras, métricas y pruebas de mutación.
