  - id: b
    texto: Si una ruta no tiene una regla de acceso, se rechaza
  - id: c
    texto: Escapar la salida y, además, enviar una cabecera CSP
  - id: d
    texto: Tratar el parámetro q como dato en una consulta parametrizada
  - id: e
