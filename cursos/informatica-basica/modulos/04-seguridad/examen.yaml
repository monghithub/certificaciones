  distractores:
    e: Ocultar no es proteger.
  referencia: https://owasp.org/Top10/2025/
- id: L01-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.3'
  enunciado: La tienda acepta el precio que envía el navegador al pagar. ¿Qué tipo
    de fallo es?
  opciones:
  - id: a
    texto: Un error de rendimiento
  - id: b
    texto: 'Diseño inseguro: el sistema confía en un dato que el cliente controla'
  - id: c
    texto: Un fallo criptográfico
  - id: d
    texto: No es un fallo
  correctas:
  - b
  explicacion: Es un fallo de diseño (A06) que ninguna revisión de código detecta
