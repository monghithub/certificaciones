      el servidor no comprueba la propiedad
  - id: c
    texto: Sí, si además se cifran
  - id: d
    texto: Solo en APIs REST
  correctas:
  - b
  explicacion: Los identificadores aparecen en enlaces, registros y capturas. La comprobación
    de propiedad es imprescindible.
  distractores:
    a: Pueden filtrarse.
    c: Cifrarlos tampoco comprueba permisos.
    d: Afecta a cualquier interfaz.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
- id: L02-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.1'
  enunciado: ¿Por qué la ruta segura responde 404, y no 403, cuando el pedido es de
    otro?
  opciones:
  - id: a
