- id: L02-001
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.1'
  enunciado: Ana, autenticada, pide GET /v/pedidos/2, que es de Luis. ¿Qué respondió
    la ruta vulnerable?
  opciones:
  - id: a
    texto: '401'
  - id: b
    texto: '403'
  - id: c
    texto: '404'
  - id: d
    texto: Los datos del pedido de Luis, con un total de 350
  correctas:
  - d
  explicacion: La ruta comprueba que hay sesión, pero no de quién es el pedido. Es
    una IDOR.
  distractores:
    a: Ana está autenticada.
    b: La ruta no comprueba permisos.
    c: El pedido existe y no se filtra por propietario.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
- id: L02-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.1'
  enunciado: ¿Basta con usar UUID aleatorios en lugar de ids consecutivos para evitar
    una IDOR?
  opciones:
  - id: a
    texto: Sí, porque nadie los puede adivinar
  - id: b
