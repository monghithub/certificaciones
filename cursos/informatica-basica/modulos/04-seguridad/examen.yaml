  distractores:
    d: Ningún atributo cifra la cookie.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie
- id: L04-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.3'
  enunciado: Según NIST SP 800-63B, ¿qué política de contraseñas es la correcta?
  opciones:
  - id: a
    texto: Exigir mayúsculas, números y símbolos, y cambiarla cada 90 días
  - id: b
    texto: Longitud mínima y rechazar contraseñas comunes o filtradas, sin reglas
      de composición ni cambios periódicos
  - id: c
    texto: Cuatro dígitos
  - id: d
    texto: Que la elija el administrador
  correctas:
  - b
  explicacion: La guía prohíbe imponer reglas de composición y cambios periódicos,
    salvo que haya indicios de compromiso.
  distractores:
    a: NIST lo desaconseja; lleva a contraseñas predecibles.
    c: Demasiado corta.
    d: No es la recomendación.
  referencia: https://pages.nist.gov/800-63-4/sp800-63b.html
- id: L04-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.4'
  enunciado: Necesitas generar un token de recuperación de contraseña en Python. ¿Qué
    usas?
  opciones:
  - id: a
    texto: random.randint
  - id: b
    texto: La hora actual en milisegundos
  - id: c
    texto: Un hash MD5 del email
  - id: d
    texto: secrets.token_urlsafe
  correctas:
  - d
  explicacion: El módulo secrets usa un generador criptográfico; random es predecible.
  distractores:
    a: Es predecible, no apto para seguridad.
    b: Se adivina fácilmente.
    c: Cualquiera que conozca el email lo calcula.
  referencia: https://owasp.org/Top10/2025/A04_2025-Cryptographic_Failures/
- id: L05-001
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.3'
  enunciado: ¿Qué problema tiene esta respuesta de error que devuelve la API?
  codigo:
    lenguaje: json
    fuente: "{\"error\": \"ZeroDivisionError('division by zero')\",\n \"consulta\"\
      : \"select * from cuentas where saldo > 0\",\n \"version\": \"sqlite 3.53.1\"\
      }\n"
  opciones:
  - id: a
    texto: Ninguno; ayuda al cliente
  - id: b
    texto: Que no es XML
  - id: c
    texto: Que el código de estado debería ser 200
  - id: d
    texto: Que revela detalles internos (excepción, consulta y versión) útiles para
      un atacante
  correctas:
  - d
  explicacion: Al cliente se le da un mensaje genérico; el detalle va al registro
    del servidor.
  distractores:
    a: El cliente no necesita esos detalles.
    b: El formato no es el problema.
    c: Es un error, así que 500 es correcto.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.3'
  enunciado: Con el servicio de permisos caído, ¿qué devolvió puede_ver_abierto?
  codigo:
    lenguaje: python
    fuente: "def puede_ver_abierto(usuario, recurso):\n    try:\n        return consultar_permisos(usuario,\
      \ recurso)\n    except Exception:\n        return True\n"
  opciones:
  - id: a
    texto: 'True: concedió el acceso ante un error'
  - id: b
    texto: 'False'
  - id: c
    texto: Una excepción
  - id: d
    texto: None
  correctas:
  - a
  explicacion: Es fallar abierto. La versión que devuelve False ante el error falla
    cerrada, que es lo correcto en un control de seguridad.
  distractores:
    b: Es lo que devolvió la versión que falla cerrada.
    c: La excepción se captura.
    d: El except devuelve True.
  referencia: https://owasp.org/Top10/2025/A10_2025-Mishandling_of_Exceptional_Conditions/
- id: L05-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.2'
  enunciado: ¿Qué informó pip-audit sobre requests 2.19.0?
  opciones:
  - id: a
    texto: Nada
  - id: b
    texto: Que el paquete no existe
  - id: c
    texto: Cinco avisos de seguridad, cada uno con la versión que lo corrige, hasta
      la 2.33.0
  - id: d
    texto: Que hay que cambiar de lenguaje
  correctas:
  - c
  explicacion: Las herramientas de análisis cruzan las versiones con bases de avisos
    y proponen la versión corregida.
  distractores:
    a: Encontró cinco avisos.
    b: Es una versión antigua, pero existe.
    d: Basta con actualizar.
  referencia: https://owasp.org/Top10/2025/A03_2025-Software_Supply_Chain_Failures/
- id: L05-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: ¿Qué patrón merece una alerta de seguridad?
  opciones:
  - id: a
