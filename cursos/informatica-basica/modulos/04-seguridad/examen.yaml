  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html
- id: L04-001
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: En el laboratorio, ¿cuántos intentos por segundo permitía SHA-256 frente
    a Argon2id en esa máquina?
  opciones:
  - id: a
    texto: Unos 4 millones frente a unos 27
  - id: b
    texto: Los mismos
  - id: c
    texto: 27 frente a 4 millones
  - id: d
    texto: Unos 100 frente a unos 50
  correctas:
  - a
  explicacion: SHA-256 está hecho para ser rápido y Argon2id para ser lento y consumir
