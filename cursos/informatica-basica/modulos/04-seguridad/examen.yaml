  distractores:
    a: Es demasiado rápido aunque lleve sal.
    c: Lo cifrado se puede descifrar si se roba la clave.
    d: MD5 es rápido y está roto.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
- id: L04-004
  tipo: matching
  dificultad: media
  objetivo: '4.2'
  enunciado: Empareja cada atributo de cookie con su efecto.
  prompts:
  - id: '1'
