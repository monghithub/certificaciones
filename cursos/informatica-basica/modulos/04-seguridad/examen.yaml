  distractores:
    a: verify funcionó con la contraseña correcta.
    b: No es cifrado.
    c: Es el comportamiento esperado.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
- id: L04-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: ¿Qué recomienda OWASP para guardar contraseñas?
  opciones:
  - id: a
    texto: SHA-256 con sal
  - id: b
    texto: Argon2id con al menos 19 MiB de memoria, 2 iteraciones y paralelismo 1
  - id: c
    texto: Cifrarlas con AES
  - id: d
    texto: MD5 doble
  correctas:
  - b
  explicacion: Es la recomendación de la hoja de trucos de OWASP; scrypt o bcrypt
