  distractores:
    b: La diferencia es enorme.
    c: Es al revés.
    d: Las cifras medidas son muy distintas.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
- id: L04-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: ¿Por qué dos usuarios con la contraseña secreto tienen hashes Argon2id
    distintos?
  opciones:
  - id: a
    texto: Porque Argon2id es aleatorio y no se puede verificar
  - id: b
    texto: Porque se cifran con claves distintas
  - id: c
    texto: Por un error
  - id: d
    texto: Porque cada hash incluye una sal aleatoria propia, guardada en el propio
