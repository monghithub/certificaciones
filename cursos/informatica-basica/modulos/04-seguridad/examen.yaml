    d: Las listas de prohibidos se esquivan.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
- id: L03-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: ¿Qué devolvió la ruta segura con nombre igual a <script>alert(1)</script>?
  opciones:
  - id: a
