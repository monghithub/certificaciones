    a: La ruta vulnerable no comprueba el destino.
    c: Devolvió el texto del panel.
    d: Eso hizo la ruta corregida.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
- id: L02-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.4'
  enunciado: ¿Qué hace SameSite=Lax en la cookie de sesión frente a CSRF?
  opciones:
  - id: a
    texto: Cifra la cookie
  - id: b
    texto: Impide leer la cookie desde JavaScript
  - id: c
    texto: Obliga a usar HTTPS
  - id: d
    texto: Que el navegador no la envíe en peticiones iniciadas desde otros sitios,
      salvo navegaciones de nivel superior
  correctas:
  - d
  explicacion: Según MDN, Lax solo la envía entre sitios en navegaciones de nivel
    superior; fetch, imágenes o iframes de otro sitio no la llevan.
  distractores:
    a: No cifra.
    b: Eso es HttpOnly.
    c: Eso es Secure.
  referencia: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie
- id: L02-008
  tipo: multiple_choice
  dificultad: alta
  objetivo: '2.4'
  enunciado: Una API se autentica solo con un token en la cabecera Authorization.
    ¿Es vulnerable a CSRF?
  opciones:
  - id: a
    texto: Sí, igual que una que usa cookies
  - id: b
    texto: No por ese mecanismo; el navegador no añade la cabecera Authorization por
      su cuenta, como sí hace con las cookies
  - id: c
    texto: Solo con GET
  - id: d
    texto: Solo si usa HTTPS
  correctas:
  - b
  explicacion: CSRF se aprovecha de credenciales que el navegador adjunta solo, como
    las cookies.
  distractores:
    a: Depende de cómo se autentique.
    c: El método no es lo que decide.
    d: HTTPS no tiene relación con CSRF.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
- id: L03-001
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: ¿Qué devolvió la búsqueda vulnerable con q igual a ' or 1=1 --?
  codigo:
    lenguaje: python
    fuente: 'sql = f"select nombre from productos where oculto = 0 and nombre like
      ''%{q}%''"

      '
  opciones:
  - id: a
    texto: Una lista vacía
  - id: b
    texto: Un error de sintaxis
  - id: c
    texto: Todos los productos, incluido el prototipo secreto oculto
  - id: d
    texto: Solo el libro
  correctas:
  - c
  explicacion: La comilla cierra el texto, or 1=1 hace cierta la condición y -- comenta
    el resto. El filtro de ocultos se anula.
  distractores:
    a: Es lo que devolvió la versión parametrizada.
    b: La consulta resultante es válida.
    d: Sería con una búsqueda normal.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
- id: L03-002
  tipo: multiple_choice
  dificultad: alta
  objetivo: '3.2'
  enunciado: ¿Qué permitió el ataque con UNION SELECT en el laboratorio?
  opciones:
  - id: a
