  opciones:
  - id: a
    texto: Es la A10
  - id: b
    texto: Ha desaparecido
  - id: c
    texto: Dentro de A01, control de acceso roto
  - id: d
    texto: En A05, inyección
  correctas:
  - c
  explicacion: La página de A01:2025 incluye SSRF (CWE-918) y CSRF (CWE-352) entre
