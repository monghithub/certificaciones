  - id: '3'
    texto: SameSite=Lax
  opciones:
  - id: a
    texto: JavaScript no puede leer la cookie
  - id: b
    texto: Solo se envía por HTTPS
  - id: c
    texto: No se envía en peticiones iniciadas desde otros sitios, salvo navegaciones
