  referencia: https://owasp.org/Top10/2025/A09_2025-Security_Logging_and_Alerting_Failures/
- id: L05-007
  tipo: matching
  dificultad: media
  objetivo: '5.1'
  enunciado: Empareja cada cabecera de seguridad con su efecto.
  prompts:
  - id: '1'
    texto: Content-Security-Policy
  - id: '2'
    texto: Strict-Transport-Security
  - id: '3'
    texto: 'X-Content-Type-Options: nosniff'
  opciones:
  - id: a
    texto: Limita de dónde puede cargar scripts y recursos el navegador
  - id: b
    texto: Obliga al navegador a usar HTTPS con el sitio
  - id: c
    texto: Impide que el navegador adivine el tipo de contenido
  - id: d
    texto: Cifra las cookies
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
