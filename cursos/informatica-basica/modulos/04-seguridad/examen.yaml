  - id: d
    texto: Cambiar el precio de un producto
  correctas:
  - b
  explicacion: UNION añade al resultado filas de otra consulta; la respuesta fue ana:hash-de-ana
    y luis:hash-de-luis.
  distractores:
    a: Ese ataque solo leía.
    c: Funcionó.
    d: Fue una lectura.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
- id: L03-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: Necesitas ordenar por la columna que elija el usuario (nombre o precio).
