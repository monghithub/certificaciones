  referencia: https://owasp.org/Top10/2025/A06_2025-Insecure_Design/
- id: L01-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.1'
  enunciado: En el Top 10:2025, ¿dónde está la falsificación de peticiones del lado
