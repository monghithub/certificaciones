- id: L05-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: ¿Qué no debe aparecer en un registro de inicios de sesión fallidos?
  opciones:
  - id: a
    texto: El usuario
  - id: b
    texto: La IP de origen
  - id: c
    texto: La hora
  - id: d
    texto: La contraseña probada
  correctas:
  - d
  explicacion: Los registros los lee mucha gente y se guardan mucho tiempo; además,
    a menudo la contraseña fallida es una variante de la real.
  distractores:
    a: Es necesario para detectar ataques.
    b: Ayuda a detectar el origen.
    c: Es imprescindible.
  referencia: https://owasp.org/Top10/2025/A09_2025-Security_Logging_and_Alerting_Failures/
