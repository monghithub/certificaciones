  - id: b
    texto: Porque 403 no existe en HTTP
  - id: c
    texto: Porque es más rápido
  - id: d
    texto: Por error
  correctas:
  - a
  explicacion: Un 403 revela que el recurso existe y permite enumerarlos.
  distractores:
    b: 403 existe.
    c: No cambia la velocidad.
    d: Es intencionado.
  referencia: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
- id: L02-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.3'
  enunciado: ¿Qué devolvió GET /v/previsualizar?url=http://127.0.0.1:18202/admin?
  opciones:
  - id: a
    texto: Un error, porque es una dirección interna
  - id: b
    texto: El contenido del panel interno, con sus claves
  - id: c
    texto: Una página vacía
  - id: d
    texto: '400'
  correctas:
  - b
