resumen: Las vulnerabilidades más frecuentes según el OWASP Top 10:2025 y cómo evitarlas. Control de acceso (IDOR, SSRF), inyección SQL y XSS, almacenamiento de contraseñas y sesiones, configuración, dependencias y gestión de errores. Cada ataque se ha reproducido contra una aplicación vulnerable local y comprobado contra su versión corregida.
