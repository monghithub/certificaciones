resumen: Cómo saber qué pasa dentro de un sistema en producción. Señales doradas y objetivos de nivel de servicio, logs estructurados correlacionados, métricas con Prometheus, trazas distribuidas y OpenTelemetry con su Collector. Probado en un laboratorio con dos servicios Python, OpenTelemetry 1.45, Collector 0.165, Jaeger 2.23 y Prometheus 3.16.
