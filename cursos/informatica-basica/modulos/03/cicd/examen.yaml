- id: L01-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.1'
  enunciado: La rama principal está rota desde esta mañana. ¿Qué hace el equipo según
    la integración continua?
  opciones:
  - id: a
    texto: Seguir integrando y arreglarlo el viernes
  - id: b
    texto: Arreglarlo (o revertir el cambio) antes que cualquier otra cosa
  - id: c
    texto: Desactivar la CI
  - id: d
    texto: Crear una rama nueva desde la rota
  correctas:
  - b
  explicacion: Fowler lo cita como práctica básica, fix broken builds immediately;
    con la rama rota, nadie sabe si su cambio funciona.
  distractores:
    a: Los fallos se acumulan y se mezclan.
    c: Elimina la red de seguridad.
    d: Arrastra el fallo.
  referencia: https://martinfowler.com/articles/continuousIntegration.html
- id: L01-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.2'
  enunciado: Una prueba falla una de cada diez ejecuciones sin cambios en el código.
    ¿Qué haces?
  opciones:
  - id: a
    texto: Reintentar la tubería hasta que pase
  - id: b
    texto: Ignorarla
  - id: c
    texto: Arreglarla o retirarla, porque una prueba inestable enseña a ignorar los
      fallos
  - id: d
    texto: Ejecutarla solo los lunes
  correctas:
  - c
  explicacion: La tubería solo sirve si se confía en ella. Las pruebas inestables
    minan esa confianza.
  distractores:
    a: Oculta el problema y alarga la tubería.
    b: El equipo aprende a ignorar el rojo.
    d: Sigue siendo inestable.
  referencia: https://martinfowler.com/articles/continuousIntegration.html
- id: L01-005
  tipo: matching
  dificultad: media
  objetivo: '1.3'
  enunciado: Empareja cada métrica DORA con lo que mide.
  prompts:
  - id: '1'
    texto: Tiempo de entrega del cambio
  - id: '2'
    texto: Frecuencia de despliegue
  - id: '3'
    texto: Tasa de fallo de cambios
  - id: '4'
    texto: Tiempo de recuperación de un despliegue fallido
  opciones:
  - id: a
    texto: Tiempo desde el commit hasta producción
  - id: b
    texto: Despliegues por periodo
  - id: c
    texto: Proporción de despliegues que requieren intervención inmediata
  - id: d
    texto: Cuánto se tarda en recuperarse de un despliegue que falla
  - id: e
    texto: Líneas de código por persona
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Son métricas de rendimiento e inestabilidad según la guía de DORA.
  distractores:
    e: No es una métrica DORA y mide mal la productividad.
  referencia: https://dora.dev/guides/dora-metrics/
- id: L01-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.3'
  enunciado: ¿Qué relación encuentra DORA entre velocidad y estabilidad?
  opciones:
  - id: a
    texto: Que se oponen; desplegar más a menudo causa más fallos
  - id: b
    texto: Que no se oponen; los equipos que despliegan a menudo con cambios pequeños
      también fallan menos y se recuperan antes
  - id: c
    texto: Que no tienen relación
  - id: d
    texto: Que solo importa la velocidad
  correctas:
  - b
  explicacion: Los cambios pequeños y frecuentes son más fáciles de probar, revisar
    y revertir.
  distractores:
    a: Es la intuición que los datos de DORA contradicen.
    c: Van juntas.
    d: DORA mide también la inestabilidad.
  referencia: https://dora.dev/guides/dora-metrics/
- id: L02-001
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.3'
  enunciado: ¿Qué riesgo tiene este paso?
  codigo:
    lenguaje: yaml
    fuente: '- run: echo "Probando ${{ github.event.pull_request.title }}"

      '
  opciones:
  - id: a
    texto: Ninguno
  - id: b
    texto: Que el título se muestre en el registro
  - id: c
    texto: Que falle con títulos largos
  - id: d
    texto: Inyección de script; el título lo controla un tercero y se inserta como
      código antes de ejecutar la shell
  correctas:
  - d
  explicacion: actionlint lo marcó como potentially untrusted. La solución es pasar
    el valor por una variable de entorno.
  distractores:
    a: Un título malicioso puede ejecutar órdenes en el runner.
    b: Mostrarlo no es el problema.
    c: El problema es de seguridad, no de longitud.
  referencia: https://docs.github.com/en/actions/reference/security/secure-use
- id: L02-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.2'
  enunciado: ¿Qué permisos recomienda GitHub para GITHUB_TOKEN por defecto?
  opciones:
  - id: a
    texto: Solo lectura del contenido, ampliando por trabajo lo que haga falta
  - id: b
    texto: Escritura en todo, para no tener problemas
  - id: c
    texto: Los de administrador
  - id: d
    texto: Ninguno, y usar la contraseña personal
  correctas:
  - a
  explicacion: Es el principio de mínimo privilegio aplicado a la credencial de cada
    ejecución.
  distractores:
    b: Un paso comprometido podría modificar el repositorio.
    c: Es el peor caso.
    d: Una credencial personal de larga duración es mucho más peligrosa.
  referencia: https://docs.github.com/en/actions/reference/security/secure-use
- id: L02-004
  tipo: multiple_choice
  dificultad: alta
  objetivo: '2.3'
  enunciado: ¿Por qué es peligroso hacer checkout y ejecutar el código del pull request
    en un flujo lanzado por pull_request_target?
  opciones:
  - id: a
    texto: Porque es más lento
  - id: b
    texto: Porque se ejecuta con los secretos y permisos de escritura del repositorio
      de destino, aunque el código venga de un fork
  - id: c
    texto: Porque no funciona con forks
  - id: d
    texto: Porque no admite matrices
  correctas:
  - b
  explicacion: La documentación de GitHub advierte que puede dar acceso a secretos
    y escritura, o envenenar la caché. Para probar el código del pull request, se
    usa pull_request.
  distractores:
    a: El riesgo es de seguridad.
    c: Funciona con forks, y ahí está el riesgo.
    d: Admite matrices.
  referencia: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
- id: L02-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.3'
  enunciado: ¿Por qué fijar una acción con su SHA completo (uses accion@3d3c42e…)
    en lugar de @v7?
  opciones:
  - id: a
    texto: Porque la etiqueta v7 la puede mover su dueño, y el SHA identifica un código
      concreto que no cambia
  - id: b
    texto: Porque es más rápido
  - id: c
    texto: Porque @v7 no funciona
  - id: d
    texto: Porque así se actualiza sola
  correctas:
  - a
  explicacion: GitHub recomienda fijar el SHA completo para que nadie pueda cambiar
    lo que ejecutas.
  distractores:
    b: No cambia la velocidad.
    c: Funciona, pero es mutable.
    d: Es al revés; el SHA no cambia nunca.
  referencia: https://docs.github.com/en/actions/reference/security/secure-use
- id: L02-006
  tipo: matching
  dificultad: media
  objetivo: '2.1'
  enunciado: Empareja cada clave del flujo con su efecto.
  prompts:
  - id: '1'
    texto: strategy.matrix
  - id: '2'
    texto: concurrency con cancel-in-progress
  - id: '3'
    texto: timeout-minutes
  - id: '4'
    texto: needs
  opciones:
  - id: a
    texto: Repite el trabajo para cada combinación de valores
  - id: b
    texto: Cancela la ejecución anterior de la misma rama
  - id: c
    texto: Corta un trabajo que tarda demasiado (por defecto, 360 minutos)
  - id: d
    texto: Hace que un trabajo espere a otro
  - id: e
    texto: Guarda los secretos
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Son claves de la sintaxis de los flujos de GitHub Actions.
  distractores:
    e: Los secretos se gestionan en la configuración del repositorio.
  referencia: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
- id: L02-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.2'
  enunciado: Un flujo se lanza por un pull request desde un fork. ¿Qué secretos recibe?
  opciones:
  - id: a
    texto: Todos
  - id: b
    texto: Los de producción
  - id: c
    texto: Ninguno salvo GITHUB_TOKEN, que además es de solo lectura
  - id: d
    texto: Los que pida el autor del fork
  correctas:
  - c
  explicacion: La documentación indica que, salvo GITHUB_TOKEN, los secretos no se
    pasan a los flujos lanzados desde forks.
  distractores:
    a: Sería una fuga de secretos.
    b: Tampoco.
    d: El autor del fork no decide.
  referencia: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
- id: L03-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: La tubería compila una imagen para preproducción y otra, desde el mismo
    commit, para producción. ¿Qué problema hay?
  opciones:
  - id: a
    texto: Lo que llega a producción no es exactamente lo que se probó
  - id: b
    texto: Ninguno, porque es el mismo commit
  - id: c
    texto: Que ocupa más disco
  - id: d
    texto: Que Docker no lo permite
  correctas:
  - a
  explicacion: Al recompilar pueden cambiar dependencias, imágenes base o herramientas.
    Se construye una vez y se promociona.
  distractores:
    b: El mismo commit no garantiza el mismo artefacto.
    c: El problema es de fiabilidad.
    d: Docker lo permite.
  referencia: https://12factor.net/es/build-release-run
- id: L03-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: ¿Qué identifica una imagen de forma inmutable?
  opciones:
  - id: a
    texto: La etiqueta latest
  - id: b
    texto: La etiqueta 1.4.0
  - id: c
    texto: El digest sha256 del contenido
  - id: d
    texto: El nombre del repositorio
  correctas:
  - c
  explicacion: El digest es el hash del contenido; las etiquetas pueden apuntar a
    otra imagen.
  distractores:
    a: Cambia con cada publicación.
    b: Se puede sobrescribir.
    d: Contiene muchas imágenes.
  referencia: https://12factor.net/es/build-release-run
- id: L03-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: ¿Qué cambia entre preproducción y producción si se sigue construir una
    vez?
  opciones:
  - id: a
    texto: El código
  - id: b
    texto: La imagen
  - id: c
    texto: Las dependencias
  - id: d
    texto: La configuración, por variables de entorno o secretos
  correctas:
  - d
  explicacion: El artefacto es el mismo; la configuración de cada entorno se aplica
    al ejecutar.
  distractores:
    a: Es el mismo.
    b: Es la misma imagen.
    c: Van dentro del artefacto.
  referencia: https://12factor.net/es/build-release-run
- id: L03-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: ¿Qué aporta la procedencia (provenance) de SLSA?
  opciones:
  - id: a
    texto: Comprime la imagen
  - id: b
    texto: Registra quién construyó el artefacto, desde qué commit y cómo, para verificarlo
      antes de desplegar
  - id: c
    texto: Acelera la tubería
  - id: d
    texto: Sustituye a las pruebas
  correctas:
  - b
  explicacion: Permite comprobar que el artefacto viene de donde dice y no se ha manipulado.
  distractores:
    a: No comprime nada.
    c: Añade un paso.
    d: Garantiza el origen, no que funcione.
  referencia: https://slsa.dev/
- id: L03-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: Un servicio interno se despliega varias veces al día. ¿Qué es imprescindible
    en su identificador de versión?
  opciones:
  - id: a
    texto: Que siga semver estrictamente
  - id: b
    texto: Que incluya el nombre del autor
  - id: c
    texto: Que sea latest
  - id: d
    texto: Que se pueda rastrear hasta el commit del que salió
  correctas:
  - d
  explicacion: Saber qué código hay en producción es lo esencial; semver aporta más
    en bibliotecas y APIs públicas.
  distractores:
    a: Es útil, pero no imprescindible para un servicio interno.
    b: No aporta trazabilidad del código.
    c: No identifica nada.
  referencia: https://semver.org/lang/es/
- id: L04-001
  tipo: matching
  dificultad: media
  objetivo: '4.1'
  enunciado: Empareja cada estrategia con su característica principal.
  prompts:
  - id: '1'
    texto: Progresiva (rolling)
  - id: '2'
    texto: Azul-verde
  - id: '3'
    texto: Canario
  opciones:
  - id: a
    texto: Sustituye las instancias poco a poco
  - id: b
    texto: Dos entornos completos y cambio de tráfico de golpe, con vuelta atrás inmediata
  - id: c
    texto: Una pequeña parte del tráfico prueba la versión nueva antes de ampliarla
  - id: d
    texto: Apaga el servicio durante la actualización
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: Son las tres estrategias habituales, con distinto coste y velocidad
    de vuelta atrás.
  distractores:
    d: Es lo que las tres evitan.
  referencia: https://martinfowler.com/bliki/BlueGreenDeployment.html
- id: L04-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: El canario con el 5 % del tráfico muestra una tasa de error del 3 %,
    frente al 0,2 % de la versión estable. ¿Qué haces?
  opciones:
  - id: a
    texto: Ampliarlo al 100 % para tener más datos
  - id: b
    texto: Retirar el canario y analizar el problema
  - id: c
    texto: Esperar una semana
  - id: d
    texto: Reiniciar la versión estable
  correctas:
  - b
  explicacion: El canario existe para detectar esto afectando a pocos usuarios.
  distractores:
    a: Afectaría a todos.
    c: Mientras, el 5 % sufre errores.
    d: La estable funciona bien.
  referencia: https://martinfowler.com/bliki/CanaryRelease.html
- id: L04-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.2'
  enunciado: ¿Qué separa un interruptor de funcionalidad?
  opciones:
  - id: a
    texto: El código del frontend y el backend
  - id: b
    texto: Las pruebas de la producción
  - id: c
    texto: Desplegar el código de lanzar la funcionalidad a los usuarios
  - id: d
    texto: Las ramas de Git
  correctas:
  - c
  explicacion: El código llega apagado y se activa cuando se decide, para quien se
    decide, y se puede apagar en segundos.
  distractores:
    a: No tiene relación.
    b: Las pruebas siguen siendo necesarias.
    d: Permite justo trabajar sin ramas largas.
  referencia: https://martinfowler.com/articles/feature-toggles.html
- id: L04-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.2'
  enunciado: La funcionalidad de pago con Bizum lleva seis meses activa para todos.
    ¿Qué haces con su interruptor?
  opciones:
  - id: a
    texto: Eliminarlo junto con la rama de código antigua
  - id: b
    texto: Dejarlo por si acaso
  - id: c
    texto: Añadir otro interruptor encima
  - id: d
    texto: Moverlo a otro servicio
  correctas:
  - a
  explicacion: Cada interruptor es complejidad; se tratan como deuda que se paga al
    terminar el lanzamiento.
  distractores:
    b: Se acumulan y complican el código.
    c: Aumenta la complejidad.
    d: No la reduce.
  referencia: https://martinfowler.com/articles/feature-toggles.html
- id: L04-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: '4.3'
  enunciado: ¿Por qué renombrar una columna en un solo paso rompe un despliegue progresivo?
  opciones:
  - id: a
    texto: Porque durante el despliegue conviven la versión vieja y la nueva sobre
      la misma base de datos, y una de las dos no encontrará la columna
  - id: b
    texto: Porque Kubernetes no permite migraciones
  - id: c
    texto: Porque las bases de datos no admiten renombrar
  - id: d
    texto: No lo rompe
  correctas:
  - a
  explicacion: Los cambios de esquema deben ser compatibles con las dos versiones
    mientras conviven.
  distractores:
    b: No es una limitación de Kubernetes.
    c: Se puede renombrar; el problema es la convivencia.
    d: La versión vieja fallaría.
  referencia: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- id: L04-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.4'
  enunciado: Un despliegue causa errores en producción. ¿Qué es lo primero?
  opciones:
  - id: a
    texto: Encontrar al responsable
  - id: b
    texto: Investigar la causa a fondo antes de tocar nada
  - id: c
    texto: Escribir el informe del incidente
  - id: d
    texto: Restaurar el servicio, volviendo atrás o corrigiendo hacia delante
  correctas:
  - d
  explicacion: Se restaura primero; la causa se investiga después con calma.
  distractores:
    a: No restaura nada.
    b: Mientras, los usuarios sufren el fallo.
    c: Va después.
  referencia: https://martinfowler.com/bliki/BlueGreenDeployment.html
- id: L04-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: ¿Qué inconveniente tiene el despliegue azul-verde?
  opciones:
  - id: a
    texto: Que no permite volver atrás
  - id: b
    texto: Que necesita el doble de recursos mientras conviven los dos entornos
  - id: c
    texto: Que solo funciona en Kubernetes
  - id: d
    texto: Que el cambio es muy lento
  correctas:
  - b
  explicacion: Se mantienen dos entornos completos; a cambio, el cambio y la vuelta
    atrás son inmediatos.
  distractores:
    a: Es su principal ventaja.
    c: Es una técnica general.
    d: El cambio es de golpe.
  referencia: https://martinfowler.com/bliki/BlueGreenDeployment.html
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.2'
  enunciado: ¿Qué ventaja de seguridad tiene GitOps frente a que la CI ejecute kubectl
    apply?
  opciones:
  - id: a
    texto: Que no hacen falta pruebas
  - id: b
    texto: Que las imágenes se cifran
  - id: c
    texto: Que la CI no necesita credenciales del clúster; solo el agente que está
      dentro
  - id: d
    texto: Que no hace falta Git
  correctas:
  - c
  explicacion: El agente extrae los cambios desde dentro; un compromiso de la CI no
    da acceso directo al clúster.
  distractores:
    a: Las pruebas siguen haciendo falta.
    b: No cifra imágenes.
    d: Git es la fuente de verdad.
  referencia: https://opengitops.dev/
- id: L05-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: Con selfHeal activado, alguien escala a mano el Deployment a 3 réplicas
    y borra el Service. ¿Qué pasó en el laboratorio?
  opciones:
  - id: a
    texto: Argo CD restauró 1 réplica y el Service en 1,2 s
  - id: b
    texto: Nada hasta el siguiente commit
  - id: c
    texto: Argo CD borró la aplicación
  - id: d
    texto: Se quedaron 3 réplicas y sin Service
  correctas:
  - a
  explicacion: Argo CD vigila el clúster y, con selfHeal, devuelve el estado declarado
    en Git.
  distractores:
    b: selfHeal reacciona a cambios en el clúster, no solo en Git.
    c: Solo corrige la deriva.
    d: Habría pasado sin selfHeal, con la aplicación en OutOfSync.
  referencia: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
- id: L05-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: Sin selfHeal, se escala a mano a 3 réplicas. ¿Qué mostró Argo CD a los
    20 s?
  opciones:
  - id: a
    texto: Synced, con 1 réplica
  - id: b
    texto: OutOfSync, con las 3 réplicas sin corregir
  - id: c
    texto: Un error y la aplicación detenida
  - id: d
    texto: Nada; no detecta cambios manuales
  correctas:
  - b
  explicacion: La deriva se detecta y se muestra, pero la documentación indica que,
    por defecto, los cambios en el clúster no lanzan la sincronización.
  distractores:
    a: Sin selfHeal no corrige.
    c: La aplicación sigue funcionando.
    d: Los detecta y marca el recurso como OutOfSync.
  referencia: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
- id: L05-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: '5.3'
  enunciado: Borras un manifiesto del repositorio. Con sincronización automática pero
    sin prune, ¿qué pasa con el recurso en el clúster?
  opciones:
  - id: a
    texto: Se borra al instante
  - id: b
    texto: Se borra el repositorio
  - id: c
    texto: Argo CD falla
  - id: d
    texto: Sigue en el clúster; por seguridad, la sincronización automática no borra
      recursos salvo con prune
  correctas:
  - d
  explicacion: La documentación lo describe como un mecanismo de seguridad; se puede
    borrar con una sincronización manual con poda o activando prune.
  distractores:
    a: Solo con prune activado.
    b: Argo CD no modifica el repositorio.
    c: Simplemente no lo borra.
  referencia: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
- id: L05-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: Haces un commit con una imagen nueva y Argo CD tarda dos minutos en desplegarla.
    ¿Por qué, y cómo se acelera?
  opciones:
  - id: a
    texto: Porque Kubernetes es lento; no se puede acelerar
  - id: b
    texto: Porque hace falta aprobar cada cambio
  - id: c
    texto: Porque Argo CD consulta Git cada 120 s más hasta 60 s aleatorios; un webhook
      del repositorio lo avisa al instante
  - id: d
    texto: Porque la imagen es grande
  correctas:
  - c
  explicacion: La documentación de Argo CD describe ese intervalo de sondeo, ajustable
    con timeout.reconciliation, y los webhooks.
  distractores:
    a: El retraso está en la detección del commit.
    b: Con sincronización automática no hay aprobación.
    d: El retraso es anterior a descargar la imagen.
  referencia: https://argo-cd.readthedocs.io/en/stable/faq/
- id: L05-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.2'
  enunciado: Con GitOps y selfHeal, ¿cómo se vuelve a la versión anterior de una aplicación?
  opciones:
  - id: a
    texto: Revirtiendo el commit en Git; Argo CD aplica el estado anterior
  - id: b
    texto: Con kubectl rollout undo, y ya está
  - id: c
    texto: Borrando el namespace
  - id: d
    texto: Reiniciando Argo CD
  correctas:
  - a
  explicacion: Git es la fuente de verdad. Un rollout undo manual sería deriva, y
    selfHeal lo desharía.
  distractores:
