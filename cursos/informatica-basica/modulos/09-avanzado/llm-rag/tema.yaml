resumen: Cómo funcionan los modelos de lenguaje y cómo construir aplicaciones fiables con ellos. Tokens, temperatura y alucinaciones; embeddings y búsqueda semántica; generación aumentada por recuperación (RAG); llamadas a herramientas y agentes; y los riesgos del OWASP Top 10 para LLM, con la inyección de instrucciones a la cabeza. Todo probado con un Ollama local (Qwen3 1.7B y nomic-embed-text).
