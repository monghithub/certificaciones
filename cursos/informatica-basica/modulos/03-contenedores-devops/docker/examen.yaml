- id: L01-002
  tipo: matching
  dificultad: media
  objetivo: '1.3'
  enunciado: Empareja cada necesidad del contenedor con la función de Linux que la
    cubre.
  prompts:
  - id: '1'
    texto: Que el contenedor solo vea sus propios procesos
  - id: '2'
    texto: Que el contenedor no use más de 512 MB de memoria
  - id: '3'
    texto: Que el contenedor tenga su propia IP e interfaces de red
  opciones:
  - id: a
    texto: Namespace de procesos
  - id: b
    texto: cgroups
  - id: c
    texto: Namespace de red
  - id: d
    texto: Hipervisor
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: Los namespaces dan a cada contenedor su propia vista de un recurso
    (procesos, red). Los cgroups limitan el consumo de recursos.
  distractores:
    d: Los contenedores no usan hipervisor; es propio de las máquinas virtuales.
  referencia: https://man7.org/linux/man-pages/man7/namespaces.7.html
- id: L01-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.3'
  enunciado: Dentro de un contenedor ejecutas ps y ves que la aplicación tiene el
    PID 1. ¿Por qué?
  opciones:
  - id: a
    texto: Porque la aplicación ha sustituido al init del anfitrión
  - id: b
    texto: Porque el contenedor tiene su propio namespace de procesos, en el que la
      aplicación es el primero
  - id: c
    texto: Porque Docker reinicia el anfitrión
  - id: d
    texto: Es un error de ps dentro de contenedores
  correctas:
  - b
  explicacion: El namespace de procesos da al contenedor su propio árbol de PID. Desde
    el anfitrión, el mismo proceso tiene otro PID distinto.
  distractores:
    a: El init del anfitrión sigue funcionando; solo cambia la vista del contenedor.
    c: Ejecutar un contenedor no reinicia nada.
    d: Es el comportamiento esperado de los namespaces.
  referencia: https://man7.org/linux/man-pages/man7/namespaces.7.html
- id: L01-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.4'
  enunciado: ¿Qué aporta la Open Container Initiative?
  opciones:
  - id: a
    texto: Un registro público gratuito de imágenes
  - id: b
    texto: Estándares abiertos de imagen, ejecución y distribución, para que las imágenes
      funcionen con distintas herramientas
  - id: c
    texto: Una alternativa a Linux para contenedores
  - id: d
    texto: Un sistema de máquinas virtuales
  correctas:
  - b
  explicacion: Gracias a los estándares OCI, una imagen construida con Docker se ejecuta
    en Podman, containerd o Kubernetes.
  distractores:
    a: Eso es Docker Hub u otros registros, no la OCI.
    c: La OCI estandariza formatos; no sustituye al núcleo.
    d: No trata de máquinas virtuales.
  referencia: https://opencontainers.org/
- id: L01-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.1'
  enunciado: Un equipo sufre errores que solo aparecen en producción porque allí hay
    otra versión de una biblioteca del sistema. ¿Cómo ayudan los contenedores?
  opciones:
  - id: a
    texto: Hacen que el código se ejecute más rápido
  - id: b
    texto: Sustituyen las pruebas automáticas
  - id: c
    texto: Empaquetan la aplicación con sus dependencias, de modo que el entorno es
      el mismo en desarrollo y en producción
  - id: d
    texto: Actualizan automáticamente las bibliotecas del servidor
  correctas:
  - c
  explicacion: La imagen incluye las versiones exactas de lo que la aplicación necesita,
    así que el entorno viaja con ella.
  distractores:
    a: El rendimiento es parecido al de un proceso normal; la ventaja es la reproducibilidad.
    b: Las pruebas siguen siendo necesarias.
    d: Las bibliotecas van dentro de la imagen; las del servidor no intervienen.
  referencia: https://docs.docker.com/learn/content/what-is-a-container/
- id: L02-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.2'
  enunciado: Solo has cambiado app.py. Con el Dockerfile de la lección, ¿qué pasos
    se reconstruyen?
  codigo:
    lenguaje: dockerfile
    fuente: 'FROM python:3.12-slim

      WORKDIR /app

      COPY requirements.txt .

      RUN pip install --no-cache-dir -r requirements.txt

      COPY . .

      RUN useradd --system --uid 10001 app

      '
  opciones:
  - id: a
    texto: Todos, desde FROM
  - id: b
    texto: Desde COPY . . en adelante; pip install sale de la caché
  - id: c
    texto: Solo pip install
  - id: d
    texto: Ninguno
  correctas:
  - b
  explicacion: requirements.txt no ha cambiado, así que su COPY y el pip install se
    reutilizan. COPY . . sí cambia, e invalida todas las capas siguientes.
  distractores:
    a: Las capas anteriores al cambio se reutilizan.
    c: pip install no cambia, porque sus entradas son las mismas.
    d: El COPY . . cambia porque app.py es distinto.
  referencia: https://docs.docker.com/build/cache/
- id: L02-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.2'
  enunciado: ¿Por qué el Dockerfile copia requirements.txt e instala las dependencias
    antes de copiar el resto del código?
  opciones:
  - id: a
    texto: Porque Docker exige ese orden
  - id: b
    texto: Para que la imagen sea más segura
  - id: c
    texto: Para que pip pueda leer el código
  - id: d
    texto: Para que un cambio de código no invalide la capa de las dependencias, que
      se reutiliza de la caché
  correctas:
  - d
  explicacion: Las dependencias cambian poco y el código, mucho. Al separarlas, la
    instalación (lenta) solo se repite cuando cambia requirements.txt.
  distractores:
    a: Docker acepta cualquier orden; este es el que aprovecha la caché.
    b: El orden no afecta a la seguridad.
    c: pip solo necesita requirements.txt para instalar.
  referencia: https://docs.docker.com/build/cache/
- id: L02-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.3'
  enunciado: ¿Qué imprime docker run demo-ep a todos con este Dockerfile?
  codigo:
    lenguaje: dockerfile
    fuente: 'FROM alpine:3.20

      ENTRYPOINT ["echo", "hola"]

      CMD ["mundo"]

      '
  opciones:
  - id: a
    texto: hola mundo
  - id: b
    texto: a todos
  - id: c
    texto: hola mundo a todos
  - id: d
    texto: hola a todos
  correctas:
  - d
  explicacion: Los argumentos de docker run sustituyen a CMD y se añaden a ENTRYPOINT.
    Queda echo hola a todos.
  distractores:
    a: Es lo que imprime sin argumentos, cuando se usa el CMD por defecto.
    b: ENTRYPOINT no se sustituye con los argumentos.
    c: Los argumentos sustituyen a CMD, no se suman a él.
  referencia: https://docs.docker.com/reference/dockerfile/
- id: L02-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.4'
  enunciado: El proyecto tiene un fichero .env con contraseñas y el Dockerfile hace
    COPY . . sin .dockerignore. ¿Qué riesgo hay?
  opciones:
  - id: a
    texto: Ninguno; COPY ignora los ficheros ocultos
  - id: b
    texto: Que el .env se copie dentro de la imagen y cualquiera que la descargue
      pueda leer las contraseñas
  - id: c
    texto: Que la construcción falle
  - id: d
    texto: Que el contenedor no arranque
  correctas:
  - b
  explicacion: COPY . . copia todo el contexto, incluidos los ficheros ocultos. Hay
    que excluir .env (y .git) en .dockerignore.
  distractores:
    a: COPY no ignora los ficheros que empiezan por punto.
    c: La construcción funciona; el problema es lo que acaba dentro.
    d: El contenedor arranca; el riesgo es de seguridad.
  referencia: https://docs.docker.com/build/concepts/context/
- id: L03-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: ¿Por qué no conviene que el proceso del contenedor se ejecute como root?
  opciones:
  - id: a
    texto: Porque root no puede abrir puertos
  - id: b
    texto: Porque el contenedor arranca más despacio
  - id: c
    texto: Porque si se explota una vulnerabilidad, el atacante tiene más privilegios
      y más opciones de escapar al anfitrión
  - id: d
    texto: Porque Docker no lo permite
  correctas:
  - c
  explicacion: Ejecutar con un usuario sin privilegios limita el daño de una intrusión.
    Se combina con solo lectura y sin capacidades.
  distractores:
    a: Root puede abrir cualquier puerto, incluidos los bajos.
    b: El usuario no afecta al tiempo de arranque.
    d: Docker ejecuta como root por defecto si no se indica otro usuario.
  referencia: https://docs.docker.com/build/building/best-practices/
- id: L03-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: ¿Qué problema tiene FROM python:latest en un proyecto que se construye
    en la integración continua?
  opciones:
  - id: a
    texto: Que no existe esa etiqueta
  - id: b
    texto: Que la imagen es más grande que con una etiqueta fija
  - id: c
    texto: Que Docker no admite etiquetas en FROM
  - id: d
    texto: Que una construcción futura puede usar otra versión mayor de Python y romper
      la aplicación
  correctas:
  - d
  explicacion: latest se mueve con cada versión. Fijar la versión (python:3.12-slim)
    o el digest hace las construcciones predecibles.
  distractores:
    a: La etiqueta latest existe en la mayoría de las imágenes oficiales.
    b: El tamaño depende de la variante, no de la etiqueta latest.
    c: FROM admite etiquetas y digests.
  referencia: https://docs.docker.com/build/building/best-practices/
- id: L03-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: '3.4'
  enunciado: La construcción necesita un token para descargar paquetes privados. ¿Cuál
    es la forma correcta de pasarlo?
  opciones:
  - id: a
    texto: ARG TOKEN y usarlo en el RUN
  - id: b
    texto: ENV TOKEN=... en el Dockerfile
  - id: c
    texto: RUN --mount=type=secret,id=token y docker build --secret id=token,src=...
  - id: d
    texto: COPY token.txt . y borrarlo en el siguiente RUN
  correctas:
  - c
  explicacion: El secreto montado solo existe durante ese RUN y no queda en ninguna
    capa ni en el historial.
  distractores:
    a: Los valores de ARG pueden quedar en el historial de la imagen.
    b: ENV queda grabado en la imagen y visible al ejecutarla.
    d: Borrarlo en otra capa no lo elimina de la capa en la que se copió.
  referencia: https://docs.docker.com/build/building/secrets/
- id: L03-007
  tipo: matching
  dificultad: media
  objetivo: '3.1'
  enunciado: Empareja cada imagen base con su característica.
  prompts:
  - id: '1'
    texto: python:3.12
  - id: '2'
    texto: python:3.12-slim
  - id: '3'
    texto: alpine:3.20
  - id: '4'
    texto: scratch
  opciones:
  - id: a
    texto: Completa, con muchas herramientas; útil para construir o depurar
  - id: b
    texto: Reducida; buena opción por defecto para ejecutar
  - id: c
    texto: De pocos MB, usa musl en lugar de glibc
  - id: d
    texto: Vacía; solo para binarios autocontenidos
  - id: e
    texto: Incluye un JDK
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Las variantes van de la más completa a la vacía. Cuanto más pequeña,
    menos superficie de ataque y más cuidado con lo que falta.
  distractores:
    e: Ninguna de estas imágenes incluye un JDK.
  referencia: https://docs.docker.com/build/building/best-practices/
- id: L03-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: Has fijado FROM python:3.12-slim. ¿Qué más debes hacer para mantener
    la imagen segura con el tiempo?
  opciones:
  - id: a
    texto: Nada; con la etiqueta fija ya está protegida
  - id: b
    texto: Reconstruirla periódicamente para incorporar los parches de seguridad de
      la imagen base
  - id: c
    texto: Cambiar a latest
  - id: d
    texto: Borrar el Dockerfile
  correctas:
  - b
  explicacion: Fijar la versión evita sorpresas, pero los parches solo llegan si se
    reconstruye con la base actualizada.
  distractores:
    a: Las vulnerabilidades se descubren después; sin reconstruir, la imagen las conserva.
    c: latest reintroduce las versiones impredecibles.
    d: El Dockerfile es necesario para reconstruir.
  referencia: https://docs.docker.com/build/building/best-practices/
- id: L04-001
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: Ejecutas docker run -d -p 5432:5432 postgres:16 en un servidor con ufw
    que solo permite SSH. ¿Es accesible la base de datos desde la red?
  opciones:
  - id: a
    texto: No, porque ufw bloquea todo salvo SSH
  - id: b
    texto: No, porque Docker publica solo en 127.0.0.1 por defecto
  - id: c
    texto: Sí, porque Docker publica en todas las interfaces y sus reglas de cortafuegos
      se aplican antes que las de ufw
  - id: d
    texto: Solo si se reinicia ufw
  correctas:
  - c
  explicacion: Sin IP, -p publica en 0.0.0.0. Docker desvía el tráfico en la tabla
    nat antes de que llegue a las cadenas que usa ufw, así que la configuración de
    ufw no lo bloquea. Para uso interno, -p 127.0.0.1:5432:5432.
  distractores:
    a: La documentación de Docker advierte de que el tráfico a puertos publicados
      no pasa por las reglas de ufw.
    b: Sin IP, la publicación es en todas las interfaces.
    d: Reiniciar ufw no cambia cómo enruta Docker el tráfico.
  referencia: https://docs.docker.com/engine/network/packet-filtering-firewalls/
- id: L04-004
  tipo: matching
  dificultad: media
  objetivo: '4.2'
  enunciado: Elige el tipo de montaje adecuado para cada caso.
  prompts:
  - id: '1'
    texto: Datos de una base de datos en producción
  - id: '2'
    texto: El código fuente durante el desarrollo, para ver los cambios al momento
  - id: '3'
    texto: Un fichero de configuración del anfitrión, en solo lectura
  opciones:
  - id: a
    texto: Volumen
  - id: b
    texto: Montaje enlazado (bind mount)
  - id: c
    texto: La capa escribible del contenedor
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - b
  explicacion: Los volúmenes los gestiona Docker y son lo indicado para datos persistentes.
    Los montajes enlazados exponen carpetas o ficheros concretos del anfitrión.
  distractores:
    c: La capa escribible se pierde al eliminar el contenedor.
  referencia: https://docs.docker.com/engine/storage/bind-mounts/
- id: L04-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.3'
  enunciado: Dos contenedores arrancados sin --network no consiguen comunicarse usando
    el nombre del otro. ¿Por qué?
  opciones:
  - id: a
    texto: Porque los contenedores están aislados y no pueden comunicarse entre sí
  - id: b
    texto: Porque la red bridge por defecto no ofrece resolución por nombre; hay que
      usar una red definida por el usuario
  - id: c
    texto: Porque falta publicar los puertos con -p
  - id: d
    texto: Porque los nombres de contenedor solo admiten mayúsculas
  correctas:
  - b
  explicacion: Las redes definidas por el usuario incluyen DNS interno. En la bridge
    por defecto, los contenedores solo se alcanzan por IP.
  distractores:
    a: Pueden comunicarse; lo que falla es la resolución por nombre.
    c: -p publica en el anfitrión; no hace falta para la comunicación entre contenedores.
    d: Los nombres de contenedor no exigen mayúsculas.
  referencia: https://docs.docker.com/engine/network/drivers/bridge/
- id: L04-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.3'
  enunciado: ¿Por qué la aplicación debe configurarse con DB_HOST=bd (el nombre del
    contenedor) y no con su IP?
  opciones:
  - id: a
    texto: Porque las IP de los contenedores pueden cambiar en cada arranque, y el
      DNS interno resuelve el nombre
  - id: b
    texto: Porque las IP no funcionan dentro de Docker
  - id: c
    texto: Porque el nombre es más corto
  - id: d
    texto: Porque así se cifra la conexión
  correctas:
  - a
  explicacion: Docker asigna las IP dinámicamente. El nombre se mantiene y el DNS
    de la red lo traduce a la IP actual.
  distractores:
    b: Las IP funcionan, pero no son estables.
    c: La longitud no es el motivo.
    d: Resolver por nombre no cifra nada.
  referencia: https://docs.docker.com/engine/network/drivers/bridge/
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.3'
  enunciado: La aplicación falla al arrancar porque PostgreSQL aún no acepta conexiones,
    aunque tiene depends_on db. ¿Qué cambio lo resuelve en Compose?
  opciones:
  - id: a
    texto: Añadir un healthcheck a db y usar depends_on con condition service_healthy
  - id: b
    texto: Poner db antes que web en el fichero
  - id: c
    texto: Publicar el puerto de db
  - id: d
    texto: Usar docker compose down -v
  correctas:
  - a
  explicacion: depends_on sin condición solo espera a que el contenedor arranque.
    Con service_healthy, Compose espera a que pase la comprobación de salud.
  distractores:
    b: El orden en el fichero no determina el orden de arranque.
    c: Publicar el puerto no cambia cuándo está lista la base de datos.
    d: Borraría los datos sin resolver el problema.
  referencia: https://docs.docker.com/compose/how-tos/startup-order/
- id: L05-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: Ejecutas docker compose down y luego docker compose up -d. ¿Qué pasa
    con los datos del volumen datos?
  opciones:
  - id: a
    texto: Se pierden, porque down lo elimina todo
  - id: b
    texto: Se conservan, porque down no borra los volúmenes con nombre salvo que se
      use -v
  - id: c
    texto: Se copian a la imagen
  - id: d
    texto: Se conservan solo si la imagen no ha cambiado
  correctas:
  - b
  explicacion: down elimina contenedores y redes, pero conserva los volúmenes con
    nombre. down -v sí los borra.
  distractores:
    a: down sin -v conserva los volúmenes.
    c: Los volúmenes nunca se copian a la imagen.
    d: El volumen es independiente de la imagen.
  referencia: https://docs.docker.com/reference/compose-file/
- id: L05-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: '5.3'
  enunciado: Con service_healthy en depends_on, ¿sigue haciendo falta que la aplicación
    reintente la conexión a la base de datos?
  opciones:
  - id: a
    texto: No; Compose evita que la base de datos se caiga
  - id: b
    texto: Solo en Windows
  - id: c
    texto: No, porque el healthcheck repara la base de datos
  - id: d
    texto: Sí; la condición solo afecta al arranque, y la base de datos puede caerse
      y volver después
  correctas:
  - d
  explicacion: depends_on ordena el arranque, pero no protege de caídas posteriores.
    Una aplicación robusta reintenta las conexiones.
  distractores:
    a: Compose no puede evitar que un servicio se caiga.
    b: El comportamiento no depende del sistema operativo.
    c: El healthcheck comprueba el estado; no repara nada.
  referencia: https://docs.docker.com/compose/how-tos/startup-order/
- id: L01-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.2'
  enunciado: Un Deployment declara 3 réplicas y borras uno de sus pods a mano. ¿Qué
    ocurre?
  opciones:
  - id: a
    texto: Quedan 2 réplicas hasta que alguien vuelva a aplicar el manifiesto
  - id: b
    texto: El Deployment se borra
  - id: c
    texto: Kubernetes lanza un error y se detiene
  - id: d
    texto: Un controlador detecta que hay 2 en lugar de 3 y crea un pod nuevo
  correctas:
  - d
  explicacion: El bucle de control compara el estado real con el deseado y lo corrige.
    Al preparar la lección, el pod borrado se sustituyó en segundos por otro con nombre
    nuevo.
  distractores:
    a: La reconciliación es continua; no hace falta volver a aplicar nada.
    b: Borrar un pod no afecta al Deployment que lo gestiona.
    c: Es una situación normal que el controlador corrige.
  referencia: https://kubernetes.io/docs/concepts/architecture/controller/
- id: L01-003
  tipo: matching
  dificultad: media
  objetivo: '1.3'
  enunciado: Empareja cada componente con su función.
  prompts:
  - id: '1'
    texto: kube-apiserver
  - id: '2'
    texto: etcd
  - id: '3'
    texto: kube-scheduler
  - id: '4'
    texto: kubelet
  opciones:
  - id: a
    texto: Única puerta de entrada al clúster; expone la API
  - id: b
    texto: Almacén clave-valor con todo el estado del clúster
  - id: c
    texto: Decide en qué nodo se ejecuta cada pod
  - id: d
    texto: Agente de cada nodo que arranca y vigila los contenedores de sus pods
  - id: e
    texto: Construye las imágenes de los contenedores
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: La API recibe todas las peticiones, etcd guarda el estado, el planificador
    asigna nodos y el kubelet ejecuta en cada nodo.
  distractores:
    e: Kubernetes no construye imágenes.
  referencia: https://kubernetes.io/docs/concepts/overview/components/
- id: L01-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.4'
  enunciado: Escalas un Deployment a 5 réplicas con kubectl scale, pero el manifiesto
    en Git dice 3. Al día siguiente, alguien ejecuta kubectl apply -f con el manifiesto.
    ¿Cuántas réplicas habrá?
  opciones:
  - id: a
    texto: 3, porque el manifiesto aplicado vuelve a ser el estado deseado
  - id: b
    texto: 5, porque los cambios manuales tienen prioridad
  - id: c
    texto: 8, la suma de ambos
  - id: d
    texto: 0, porque hay un conflicto
  correctas:
  - a
  explicacion: Al aplicar el manifiesto, el estado deseado vuelve a ser 3. Por eso
    los cambios deben hacerse en el manifiesto versionado, no a mano.
  distractores:
    b: El último estado deseado aplicado es el que cuenta.
    c: Las réplicas no se suman.
    d: No hay conflicto; simplemente se sustituye el valor.
  referencia: https://kubernetes.io/docs/concepts/overview/
- id: L01-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.3'
  enunciado: Kubernetes ya no usa Docker Engine como runtime en los nodos. ¿Pueden
    ejecutarse imágenes construidas con docker build?
  opciones:
  - id: a
    texto: No; hay que reconstruirlas con otra herramienta
  - id: b
    texto: Sí, porque las imágenes siguen el estándar OCI, que entienden runtimes
      como containerd
  - id: c
    texto: Solo si se instala Docker en cada nodo
  - id: d
    texto: Solo en clústeres de Windows
  correctas:
  - b
  explicacion: El formato de imagen es un estándar abierto (OCI). containerd y otros
    runtimes compatibles con CRI ejecutan las mismas imágenes.
  distractores:
    a: Las imágenes son compatibles; no hace falta reconstruir.
    c: No hace falta Docker en los nodos.
    d: No depende del sistema operativo de los nodos.
  referencia: https://kubernetes.io/docs/concepts/overview/components/
- id: L02-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.1'
  enunciado: ¿Por qué no se suelen crear pods sueltos en producción?
  opciones:
  - id: a
    texto: Porque Kubernetes no lo permite
  - id: b
    texto: Porque un pod suelto no puede tener más de un contenedor
  - id: c
    texto: Porque los pods son efímeros y, sin un controlador, nadie los vuelve a
      crear si se pierden
  - id: d
    texto: Porque los pods sueltos no tienen IP
  correctas:
  - c
  explicacion: Si el nodo cae o el pod se borra, un pod suelto desaparece. Un Deployment
    (o otro controlador) mantiene el número deseado.
  distractores:
    a: Se pueden crear, pero no se recuperan solos.
    b: Un pod suelto puede tener varios contenedores.
    d: Todo pod recibe una IP.
  referencia: https://kubernetes.io/docs/concepts/workloads/pods/
- id: L02-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.3'
  enunciado: Un pod se llama web-56547b957b-gzxg7. ¿Qué indica la parte 56547b957b?
  opciones:
  - id: a
    texto: La IP del pod
  - id: b
    texto: La fecha de creación
  - id: c
    texto: El número de réplica
  - id: d
    texto: El ReplicaSet que lo creó, identificado por un hash de la plantilla
  correctas:
  - d
  explicacion: El Deployment crea un ReplicaSet por cada versión de la plantilla,
    y sus pods heredan ese identificador seguido de un sufijo aleatorio.
  distractores:
    a: La IP no forma parte del nombre.
    b: El nombre no codifica la fecha.
    c: El sufijo final es aleatorio; no hay un número de réplica.
  referencia: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- id: L02-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: '2.4'
  enunciado: Actualizas un Deployment de 3 réplicas a una imagen que no existe. ¿Qué
    observarás?
  opciones:
  - id: a
    texto: Los 3 pods se paran y el servicio se corta
  - id: b
    texto: Kubernetes rechaza el cambio antes de aplicarlo
  - id: c
    texto: Un pod nuevo en ImagePullBackOff y los 3 pods de la versión anterior siguiendo
      en marcha
  - id: d
    texto: Kubernetes vuelve atrás automáticamente y borra el cambio
  correctas:
  - c
  explicacion: La actualización progresiva solo retira pods antiguos cuando los nuevos
    están disponibles. Como el nuevo no arranca, la actualización se detiene y la
    versión anterior sigue sirviendo.
  distractores:
    a: maxUnavailable limita cuántos pods pueden faltar; no se paran todos.
    b: La API no comprueba que la imagen exista.
    d: Kubernetes no hace rollback por sí solo; hay que ejecutar rollout undo o corregir
      el manifiesto.
  referencia: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- id: L02-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.4'
  enunciado: ¿Qué valores tiene por defecto la estrategia RollingUpdate de un Deployment?
  opciones:
  - id: a
    texto: maxSurge 25 % y maxUnavailable 25 %
  - id: b
    texto: maxSurge 0 y maxUnavailable 100 %
  - id: c
    texto: maxSurge 100 % y maxUnavailable 0
  - id: d
    texto: No tiene valores por defecto
  correctas:
  - a
  explicacion: Por defecto puede haber hasta un 25 % de pods de más y faltar hasta
    un 25 % durante la actualización. Se comprobó con kubectl get deploy -o jsonpath='{.spec.strategy}'.
  distractores:
    b: Equivaldría a parar todo antes de arrancar lo nuevo, como la estrategia Recreate.
    c: Es una configuración posible, pero no la de por defecto.
    d: Los valores por defecto existen y se ven en el objeto creado.
  referencia: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- id: L02-008
  tipo: multiple_choice
  dificultad: alta
  objetivo: '2.4'
  enunciado: Tras un kubectl rollout undo, kubectl avisa de que la anotación last-applied-configuration
    no se actualiza. ¿Qué conviene hacer?
  opciones:
  - id: a
    texto: Ignorarlo; el aviso no tiene consecuencias
  - id: b
    texto: Borrar el Deployment y crearlo de nuevo
  - id: c
    texto: Ejecutar rollout undo otra vez
  - id: d
    texto: Corregir el manifiesto en Git para que refleje la versión buena y volver
      a aplicarlo
  correctas:
  - d
  explicacion: El manifiesto es la fuente de verdad. Si no se corrige, el próximo
    kubectl apply volverá a poner la versión rota.
  distractores:
    a: Un apply posterior con el manifiesto antiguo reintroduciría el fallo.
    b: Borrar el Deployment corta el servicio sin necesidad.
    c: Repetir el undo volvería a la versión rota.
  referencia: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- id: L03-002
  tipo: matching
  dificultad: media
  objetivo: '3.2'
  enunciado: Empareja cada tipo de Service con su uso.
  prompts:
  - id: '1'
    texto: ClusterIP
  - id: '2'
    texto: NodePort
  - id: '3'
    texto: LoadBalancer
  - id: '4'
    texto: ExternalName
  opciones:
  - id: a
    texto: Comunicación interna entre servicios del clúster
  - id: b
    texto: Abrir un puerto en cada nodo, para pruebas o entornos sin balanceador
  - id: c
    texto: Crear un balanceador externo en la nube
  - id: d
    texto: Alias DNS de un servicio externo al clúster
  - id: e
    texto: Guardar configuración
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: ClusterIP es interno, NodePort expone un puerto en los nodos, LoadBalancer
    pide un balanceador al proveedor y ExternalName es un alias DNS.
  distractores:
    e: Guardar configuración es tarea de un ConfigMap.
  referencia: https://kubernetes.io/docs/concepts/services-networking/service/
- id: L03-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.1'
  enunciado: Un Service tiene selector app=web, pero los pods del Deployment tienen
    la etiqueta app=tienda-web. ¿Qué ocurre al llamar al Service?
  opciones:
  - id: a
    texto: El Service no tiene endpoints y las conexiones fallan
  - id: b
    texto: Kubernetes ajusta el selector automáticamente
  - id: c
    texto: El Service envía tráfico a los pods del namespace, tengan la etiqueta que
      tengan
  - id: d
    texto: El Deployment cambia la etiqueta de sus pods
  correctas:
  - a
  explicacion: El Service solo envía tráfico a los pods que coinciden con su selector.
    Si ninguno coincide, no hay endpoints y nadie responde.
  distractores:
    b: Kubernetes no corrige selectores.
    c: El selector filtra; sin coincidencias no hay destinos.
    d: El Deployment no conoce al Service.
  referencia: https://kubernetes.io/docs/concepts/services-networking/service/
- id: L03-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.4'
  enunciado: Creas un Ingress correcto, pero no hay ningún controlador de Ingress
    instalado en el clúster. ¿Qué pasa?
  opciones:
  - id: a
    texto: Kubernetes usa un proxy integrado
  - id: b
    texto: Se crea un LoadBalancer automáticamente
  - id: c
    texto: El objeto se crea, pero no tiene ningún efecto
  - id: d
    texto: La API rechaza el Ingress
  correctas:
  - c
  explicacion: El Ingress solo declara reglas. Un controlador (NGINX, Traefik u otro)
    tiene que leerlas y configurar el proxy.
  distractores:
    a: Kubernetes no trae un controlador de Ingress de serie.
    b: El Ingress no crea balanceadores por sí mismo.
    d: La API acepta el objeto aunque no haya controlador.
  referencia: https://kubernetes.io/docs/concepts/services-networking/ingress/
- id: L03-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.4'
  enunciado: ¿Qué recomienda hoy el proyecto Kubernetes sobre Ingress?
  opciones:
  - id: a
    texto: Usar la Gateway API en lugar de Ingress, que está congelado pero sigue
      disponible
  - id: b
    texto: Usar Ingress, que es la API más moderna
  - id: c
    texto: Dejar de usar Ingress, porque se retirará en la próxima versión
  - id: d
    texto: Usar NodePort para todo
  correctas:
  - a
  explicacion: La documentación indica que la API de Ingress está congelada (estable,
    sin planes de retirarla, pero sin cambios) y recomienda la Gateway API.
  distractores:
    b: La Gateway API es la evolución de Ingress.
    c: El proyecto dice expresamente que no tiene planes de retirar Ingress.
    d: NodePort no ofrece enrutado por host y ruta.
  referencia: https://kubernetes.io/docs/concepts/services-networking/ingress/
- id: L03-007
  tipo: multiple_choice
  dificultad: alta
  objetivo: '3.1'
  enunciado: Un pod del Deployment está en marcha pero no pasa su sonda de disponibilidad.
    ¿Recibe tráfico del Service?
  opciones:
  - id: a
    texto: Sí, basta con tener la etiqueta para recibir tráfico
  - id: b
    texto: No; aparece en el EndpointSlice como no listo y el Service no le envía
      tráfico
  - id: c
    texto: Sí, pero solo la mitad
  - id: d
    texto: No, y además Kubernetes lo borra
  correctas:
  - b
  explicacion: Al preparar el tema se comprobó con un pod cuya sonda fallaba, que
    aparecía con ready=False en el EndpointSlice mientras los demás seguían con ready=True.
  distractores:
    a: La disponibilidad se tiene en cuenta además de la etiqueta.
    c: No hay reparto parcial; un pod no listo queda fuera.
    d: La sonda de disponibilidad no reinicia ni borra; eso lo hace, en su caso, la
      de vida.
  referencia: https://kubernetes.io/docs/concepts/services-networking/service/
- id: L04-001
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.2'
  enunciado: Un compañero dice que los Secrets de Kubernetes son seguros porque sus
    valores aparecen cifrados como bm8tbGEt... ¿Qué le respondes?
  opciones:
  - id: a
    texto: Que tiene razón; base64 es un cifrado fuerte
  - id: b
    texto: Que el cifrado depende de la versión de kubectl
  - id: c
    texto: Que es base64, una codificación que cualquiera revierte sin clave, y que
      por defecto se guardan sin cifrar en etcd
  - id: d
    texto: Que los Secrets solo los puede leer el administrador del clúster
  correctas:
  - c
  explicacion: base64 -d devuelve el valor original. Para protegerlos hay que cifrar
    etcd en reposo, restringir con RBAC y no guardarlos en claro en Git.
  distractores:
    a: base64 no usa clave; no es un cifrado.
    b: kubectl no cifra los Secrets.
    d: Cualquiera que pueda crear pods en el namespace puede leer sus Secrets.
  referencia: https://kubernetes.io/docs/concepts/configuration/secret/
- id: L04-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.3'
  enunciado: Un contenedor con limits.memory 64Mi intenta reservar 200 MiB. ¿Qué estado
    muestra después?
  opciones:
  - id: a
    texto: Running, con la memoria limitada a 64 MiB
  - id: b
    texto: Pending
  - id: c
    texto: ImagePullBackOff
  - id: d
    texto: Terminado con motivo OOMKilled
  correctas:
  - d
  explicacion: Superar el límite de memoria hace que el núcleo mate el proceso. Se
    comprobó con un pod de Python que reservaba 200 MiB con un límite de 64 MiB.
  distractores:
    a: La memoria no se puede «frenar» como la CPU; el proceso muere.
    b: Pending indica que no se ha podido planificar; aquí sí arrancó.
    c: Ese estado indica que no se pudo descargar la imagen.
  referencia: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
- id: L04-004
  tipo: matching
  dificultad: media
  objetivo: '4.3'
  enunciado: Empareja cada situación con lo que ocurre.
  prompts:
  - id: '1'
    texto: El contenedor supera su límite de CPU
  - id: '2'
    texto: El contenedor supera su límite de memoria
  - id: '3'
    texto: Ningún nodo tiene hueco para los requests del pod
  opciones:
  - id: a
    texto: Se le frena (throttling)
  - id: b
    texto: Muere con OOMKilled
  - id: c
    texto: El pod se queda en Pending
  - id: d
    texto: Se borra el Deployment
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: La CPU es compresible y se limita frenando; la memoria no, y se mata
    el proceso. Si los requests no caben en ningún nodo, el planificador no puede
    colocar el pod.
  distractores:
    d: Ninguna de estas situaciones borra el Deployment.
  referencia: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
- id: L04-005
  tipo: matching
  dificultad: media
  objetivo: '4.4'
  enunciado: Empareja cada sonda con lo que pasa cuando falla.
  prompts:
  - id: '1'
    texto: readinessProbe
  - id: '2'
    texto: livenessProbe
  - id: '3'
    texto: startupProbe
  opciones:
  - id: a
    texto: El pod sale del Service, sin reiniciarse
  - id: b
    texto: El contenedor se reinicia
  - id: c
    texto: Mientras no pase, no se evalúan las otras sondas
  - id: d
    texto: Se escala el Deployment
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: La de disponibilidad controla el tráfico, la de vida reinicia procesos
    bloqueados y la de arranque da tiempo a las aplicaciones lentas.
  distractores:
    d: Las sondas no escalan; eso lo hace el HorizontalPodAutoscaler.
  referencia: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
- id: L04-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: '4.4'
  enunciado: La sonda de vida de un servicio comprueba que la base de datos responde.
    Una noche la base de datos se cae durante 10 minutos. ¿Qué ocurre?
  opciones:
  - id: a
    texto: Nada, porque las sondas de vida solo comprueban el arranque
  - id: b
    texto: Kubernetes reinicia en bucle todos los pods del servicio, aunque reiniciarlos
      no arregla nada
  - id: c
    texto: Kubernetes arregla la base de datos
  - id: d
    texto: Los pods se mueven a otro nodo
  correctas:
  - b
  explicacion: La sonda de vida falla por una dependencia externa y Kubernetes reinicia
    los contenedores, que siguen fallando. La sonda de vida debe comprobar solo el
    propio proceso; la dependencia, en todo caso, en la de disponibilidad.
  distractores:
    a: La de vida se evalúa durante toda la vida del contenedor.
    c: Kubernetes no repara servicios externos.
    d: Una sonda de vida fallida reinicia el contenedor en el mismo nodo.
  referencia: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
- id: L05-002
  tipo: matching
  dificultad: media
  objetivo: '5.2'
  enunciado: Elige el controlador adecuado para cada carga.
  prompts:
  - id: '1'
    texto: Una API REST sin estado con 4 réplicas
  - id: '2'
    texto: Un clúster de base de datos de 3 nodos, cada uno con sus datos
  - id: '3'
    texto: El frontend web de la tienda
  opciones:
  - id: a
    texto: Deployment
  - id: b
    texto: StatefulSet
  - id: c
    texto: ConfigMap
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - a
  explicacion: Las cargas sin estado van en Deployments. La base de datos necesita
    identidad estable y un volumen por réplica, que es lo que da un StatefulSet.
  distractores:
    c: Un ConfigMap guarda configuración; no ejecuta pods.
  referencia: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
- id: L05-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.2'
  enunciado: ¿Cómo se llaman los pods de un StatefulSet llamado bd con 3 réplicas?
  opciones:
  - id: a
    texto: bd-7d9f-x1, bd-7d9f-k2, bd-7d9f-p3, con sufijos aleatorios
  - id: b
    texto: bd-0, bd-1 y bd-2
  - id: c
    texto: bd, bd y bd
  - id: d
    texto: bd-a, bd-b y bd-c
  correctas:
  - b
  explicacion: El StatefulSet da a cada pod una identidad estable y ordenada, que
    mantiene aunque se recree, junto con su propio almacenamiento.
  distractores:
    a: Los sufijos aleatorios son propios de los pods de un Deployment.
    c: Dos objetos no pueden tener el mismo nombre en un namespace.
    d: Se numeran con ordinales, no con letras.
  referencia: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
- id: L05-006
  tipo: matching
  dificultad: media
  objetivo: '5.4'
  enunciado: Empareja cada estado con su causa más probable.
  prompts:
  - id: '1'
    texto: Pending
  - id: '2'
    texto: ImagePullBackOff
  - id: '3'
    texto: CrashLoopBackOff
  - id: '4'
    texto: OOMKilled
  opciones:
  - id: a
    texto: No hay nodo con recursos suficientes o la PVC no está vinculada
  - id: b
    texto: La imagen no existe o faltan credenciales del registro
  - id: c
    texto: El contenedor arranca y termina con error una y otra vez
  - id: d
    texto: El contenedor superó su límite de memoria
  - id: e
    texto: El Service no tiene selector
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Cada estado apunta a una fase distinta, la planificación, la descarga
    de la imagen, la ejecución y los recursos.
  distractores:
    e: Un Service sin pods coincidentes no cambia el estado de los pods.
  referencia: https://kubernetes.io/docs/concepts/workloads/pods/
- id: L05-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: Un pod está en CrashLoopBackOff. ¿Qué comando muestra la salida del contenedor
    que acaba de fallar?
  opciones:
  - id: a
    texto: kubectl get pods
  - id: b
    texto: kubectl scale deploy/web --replicas=0
  - id: c
    texto: kubectl logs <pod> --previous
  - id: d
    texto: kubectl apply -f web.yaml
  correctas:
  - c
  explicacion: --previous muestra los registros de la ejecución anterior, la que terminó
    con error, en lugar de la que acaba de arrancar.
  distractores:
    a: Muestra el estado, no la causa.
    b: Pararía el servicio sin diagnosticar nada.
    d: Volvería a aplicar el mismo manifiesto.
  referencia: https://kubernetes.io/docs/concepts/workloads/pods/
- id: L05-008
  tipo: multiple_choice
  dificultad: alta
  objetivo: '5.3'
  enunciado: Un Deployment tiene replicas 3 en el manifiesto y un HPA que lo ha escalado
    a 8 por la carga. Alguien ejecuta kubectl apply con el manifiesto. ¿Qué pasa y
    cómo se evita?
  opciones:
  - id: a
    texto: Nada; el HPA tiene prioridad sobre apply
  - id: b
    texto: Las réplicas vuelven a 3 hasta que el HPA las sube de nuevo; se evita quitando
      replicas del manifiesto
  - id: c
    texto: El HPA se borra
  - id: d
    texto: Kubernetes rechaza el apply
  correctas:
  - b
  explicacion: apply fija replicas en 3 y el HPA tiene que volver a escalar, con un
    bajón de capacidad. Si un HPA gestiona las réplicas, el manifiesto no debe fijarlas.
  distractores:
    a: apply cambia el campo replicas, que el HPA también modifica.
    c: apply sobre el Deployment no afecta al objeto HPA.
    d: La API acepta el cambio.
  referencia: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
- id: L01-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.1'
  enunciado: La rama principal está rota desde esta mañana. ¿Qué hace el equipo según
    la integración continua?
  opciones:
  - id: a
    texto: Seguir integrando y arreglarlo el viernes
  - id: b
    texto: Arreglarlo (o revertir el cambio) antes que cualquier otra cosa
  - id: c
    texto: Desactivar la CI
  - id: d
    texto: Crear una rama nueva desde la rota
  correctas:
  - b
  explicacion: Fowler lo cita como práctica básica, fix broken builds immediately;
    con la rama rota, nadie sabe si su cambio funciona.
  distractores:
    a: Los fallos se acumulan y se mezclan.
    c: Elimina la red de seguridad.
    d: Arrastra el fallo.
  referencia: https://martinfowler.com/articles/continuousIntegration.html
- id: L01-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.2'
  enunciado: Una prueba falla una de cada diez ejecuciones sin cambios en el código.
    ¿Qué haces?
  opciones:
  - id: a
    texto: Reintentar la tubería hasta que pase
  - id: b
    texto: Ignorarla
  - id: c
    texto: Arreglarla o retirarla, porque una prueba inestable enseña a ignorar los
      fallos
  - id: d
    texto: Ejecutarla solo los lunes
  correctas:
  - c
  explicacion: La tubería solo sirve si se confía en ella. Las pruebas inestables
    minan esa confianza.
  distractores:
    a: Oculta el problema y alarga la tubería.
    b: El equipo aprende a ignorar el rojo.
    d: Sigue siendo inestable.
  referencia: https://martinfowler.com/articles/continuousIntegration.html
- id: L01-005
  tipo: matching
  dificultad: media
  objetivo: '1.3'
  enunciado: Empareja cada métrica DORA con lo que mide.
  prompts:
  - id: '1'
    texto: Tiempo de entrega del cambio
  - id: '2'
    texto: Frecuencia de despliegue
  - id: '3'
    texto: Tasa de fallo de cambios
  - id: '4'
    texto: Tiempo de recuperación de un despliegue fallido
  opciones:
  - id: a
    texto: Tiempo desde el commit hasta producción
  - id: b
    texto: Despliegues por periodo
  - id: c
    texto: Proporción de despliegues que requieren intervención inmediata
  - id: d
    texto: Cuánto se tarda en recuperarse de un despliegue que falla
  - id: e
    texto: Líneas de código por persona
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Son métricas de rendimiento e inestabilidad según la guía de DORA.
  distractores:
    e: No es una métrica DORA y mide mal la productividad.
  referencia: https://dora.dev/guides/dora-metrics/
- id: L01-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '1.3'
  enunciado: ¿Qué relación encuentra DORA entre velocidad y estabilidad?
  opciones:
  - id: a
    texto: Que se oponen; desplegar más a menudo causa más fallos
  - id: b
    texto: Que no se oponen; los equipos que despliegan a menudo con cambios pequeños
      también fallan menos y se recuperan antes
  - id: c
    texto: Que no tienen relación
  - id: d
    texto: Que solo importa la velocidad
  correctas:
  - b
  explicacion: Los cambios pequeños y frecuentes son más fáciles de probar, revisar
    y revertir.
  distractores:
    a: Es la intuición que los datos de DORA contradicen.
    c: Van juntas.
    d: DORA mide también la inestabilidad.
  referencia: https://dora.dev/guides/dora-metrics/
- id: L02-001
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.3'
  enunciado: ¿Qué riesgo tiene este paso?
  codigo:
    lenguaje: yaml
    fuente: '- run: echo "Probando ${{ github.event.pull_request.title }}"

      '
  opciones:
  - id: a
    texto: Ninguno
  - id: b
    texto: Que el título se muestre en el registro
  - id: c
    texto: Que falle con títulos largos
  - id: d
    texto: Inyección de script; el título lo controla un tercero y se inserta como
      código antes de ejecutar la shell
  correctas:
  - d
  explicacion: actionlint lo marcó como potentially untrusted. La solución es pasar
    el valor por una variable de entorno.
  distractores:
    a: Un título malicioso puede ejecutar órdenes en el runner.
    b: Mostrarlo no es el problema.
    c: El problema es de seguridad, no de longitud.
  referencia: https://docs.github.com/en/actions/reference/security/secure-use
- id: L02-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.2'
  enunciado: ¿Qué permisos recomienda GitHub para GITHUB_TOKEN por defecto?
  opciones:
  - id: a
    texto: Solo lectura del contenido, ampliando por trabajo lo que haga falta
  - id: b
    texto: Escritura en todo, para no tener problemas
  - id: c
    texto: Los de administrador
  - id: d
    texto: Ninguno, y usar la contraseña personal
  correctas:
  - a
  explicacion: Es el principio de mínimo privilegio aplicado a la credencial de cada
    ejecución.
  distractores:
    b: Un paso comprometido podría modificar el repositorio.
    c: Es el peor caso.
    d: Una credencial personal de larga duración es mucho más peligrosa.
  referencia: https://docs.github.com/en/actions/reference/security/secure-use
- id: L02-004
  tipo: multiple_choice
  dificultad: alta
  objetivo: '2.3'
  enunciado: ¿Por qué es peligroso hacer checkout y ejecutar el código del pull request
    en un flujo lanzado por pull_request_target?
  opciones:
  - id: a
    texto: Porque es más lento
  - id: b
    texto: Porque se ejecuta con los secretos y permisos de escritura del repositorio
      de destino, aunque el código venga de un fork
  - id: c
    texto: Porque no funciona con forks
  - id: d
    texto: Porque no admite matrices
  correctas:
  - b
  explicacion: La documentación de GitHub advierte que puede dar acceso a secretos
    y escritura, o envenenar la caché. Para probar el código del pull request, se
    usa pull_request.
  distractores:
    a: El riesgo es de seguridad.
    c: Funciona con forks, y ahí está el riesgo.
    d: Admite matrices.
  referencia: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
- id: L02-005
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.3'
  enunciado: ¿Por qué fijar una acción con su SHA completo (uses accion@3d3c42e…)
    en lugar de @v7?
  opciones:
  - id: a
    texto: Porque la etiqueta v7 la puede mover su dueño, y el SHA identifica un código
      concreto que no cambia
  - id: b
    texto: Porque es más rápido
  - id: c
    texto: Porque @v7 no funciona
  - id: d
    texto: Porque así se actualiza sola
  correctas:
  - a
  explicacion: GitHub recomienda fijar el SHA completo para que nadie pueda cambiar
    lo que ejecutas.
  distractores:
    b: No cambia la velocidad.
    c: Funciona, pero es mutable.
    d: Es al revés; el SHA no cambia nunca.
  referencia: https://docs.github.com/en/actions/reference/security/secure-use
- id: L02-006
  tipo: matching
  dificultad: media
  objetivo: '2.1'
  enunciado: Empareja cada clave del flujo con su efecto.
  prompts:
  - id: '1'
    texto: strategy.matrix
  - id: '2'
    texto: concurrency con cancel-in-progress
  - id: '3'
    texto: timeout-minutes
  - id: '4'
    texto: needs
  opciones:
  - id: a
    texto: Repite el trabajo para cada combinación de valores
  - id: b
    texto: Cancela la ejecución anterior de la misma rama
  - id: c
    texto: Corta un trabajo que tarda demasiado (por defecto, 360 minutos)
  - id: d
    texto: Hace que un trabajo espere a otro
  - id: e
    texto: Guarda los secretos
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  - - '4'
    - d
  explicacion: Son claves de la sintaxis de los flujos de GitHub Actions.
  distractores:
    e: Los secretos se gestionan en la configuración del repositorio.
  referencia: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
- id: L02-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '2.2'
  enunciado: Un flujo se lanza por un pull request desde un fork. ¿Qué secretos recibe?
  opciones:
  - id: a
    texto: Todos
  - id: b
    texto: Los de producción
  - id: c
    texto: Ninguno salvo GITHUB_TOKEN, que además es de solo lectura
  - id: d
    texto: Los que pida el autor del fork
  correctas:
  - c
  explicacion: La documentación indica que, salvo GITHUB_TOKEN, los secretos no se
    pasan a los flujos lanzados desde forks.
  distractores:
    a: Sería una fuga de secretos.
    b: Tampoco.
    d: El autor del fork no decide.
  referencia: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
- id: L03-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: La tubería compila una imagen para preproducción y otra, desde el mismo
    commit, para producción. ¿Qué problema hay?
  opciones:
  - id: a
    texto: Lo que llega a producción no es exactamente lo que se probó
  - id: b
    texto: Ninguno, porque es el mismo commit
  - id: c
    texto: Que ocupa más disco
  - id: d
    texto: Que Docker no lo permite
  correctas:
  - a
  explicacion: Al recompilar pueden cambiar dependencias, imágenes base o herramientas.
    Se construye una vez y se promociona.
  distractores:
    b: El mismo commit no garantiza el mismo artefacto.
    c: El problema es de fiabilidad.
    d: Docker lo permite.
  referencia: https://12factor.net/es/build-release-run
- id: L03-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: ¿Qué identifica una imagen de forma inmutable?
  opciones:
  - id: a
    texto: La etiqueta latest
  - id: b
    texto: La etiqueta 1.4.0
  - id: c
    texto: El digest sha256 del contenido
  - id: d
    texto: El nombre del repositorio
  correctas:
  - c
  explicacion: El digest es el hash del contenido; las etiquetas pueden apuntar a
    otra imagen.
  distractores:
    a: Cambia con cada publicación.
    b: Se puede sobrescribir.
    d: Contiene muchas imágenes.
  referencia: https://12factor.net/es/build-release-run
- id: L03-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.2'
  enunciado: ¿Qué cambia entre preproducción y producción si se sigue construir una
    vez?
  opciones:
  - id: a
    texto: El código
  - id: b
    texto: La imagen
  - id: c
    texto: Las dependencias
  - id: d
    texto: La configuración, por variables de entorno o secretos
  correctas:
  - d
  explicacion: El artefacto es el mismo; la configuración de cada entorno se aplica
    al ejecutar.
  distractores:
    a: Es el mismo.
    b: Es la misma imagen.
    c: Van dentro del artefacto.
  referencia: https://12factor.net/es/build-release-run
- id: L03-006
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: ¿Qué aporta la procedencia (provenance) de SLSA?
  opciones:
  - id: a
    texto: Comprime la imagen
  - id: b
    texto: Registra quién construyó el artefacto, desde qué commit y cómo, para verificarlo
      antes de desplegar
  - id: c
    texto: Acelera la tubería
  - id: d
    texto: Sustituye a las pruebas
  correctas:
  - b
  explicacion: Permite comprobar que el artefacto viene de donde dice y no se ha manipulado.
  distractores:
    a: No comprime nada.
    c: Añade un paso.
    d: Garantiza el origen, no que funcione.
  referencia: https://slsa.dev/
- id: L03-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '3.3'
  enunciado: Un servicio interno se despliega varias veces al día. ¿Qué es imprescindible
    en su identificador de versión?
  opciones:
  - id: a
    texto: Que siga semver estrictamente
  - id: b
    texto: Que incluya el nombre del autor
  - id: c
    texto: Que sea latest
  - id: d
    texto: Que se pueda rastrear hasta el commit del que salió
  correctas:
  - d
  explicacion: Saber qué código hay en producción es lo esencial; semver aporta más
    en bibliotecas y APIs públicas.
  distractores:
    a: Es útil, pero no imprescindible para un servicio interno.
    b: No aporta trazabilidad del código.
    c: No identifica nada.
  referencia: https://semver.org/lang/es/
- id: L04-001
  tipo: matching
  dificultad: media
  objetivo: '4.1'
  enunciado: Empareja cada estrategia con su característica principal.
  prompts:
  - id: '1'
    texto: Progresiva (rolling)
  - id: '2'
    texto: Azul-verde
  - id: '3'
    texto: Canario
  opciones:
  - id: a
    texto: Sustituye las instancias poco a poco
  - id: b
    texto: Dos entornos completos y cambio de tráfico de golpe, con vuelta atrás inmediata
  - id: c
    texto: Una pequeña parte del tráfico prueba la versión nueva antes de ampliarla
  - id: d
    texto: Apaga el servicio durante la actualización
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - c
  explicacion: Son las tres estrategias habituales, con distinto coste y velocidad
    de vuelta atrás.
  distractores:
    d: Es lo que las tres evitan.
  referencia: https://martinfowler.com/bliki/BlueGreenDeployment.html
- id: L04-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: El canario con el 5 % del tráfico muestra una tasa de error del 3 %,
    frente al 0,2 % de la versión estable. ¿Qué haces?
  opciones:
  - id: a
    texto: Ampliarlo al 100 % para tener más datos
  - id: b
    texto: Retirar el canario y analizar el problema
  - id: c
    texto: Esperar una semana
  - id: d
    texto: Reiniciar la versión estable
  correctas:
  - b
  explicacion: El canario existe para detectar esto afectando a pocos usuarios.
  distractores:
    a: Afectaría a todos.
    c: Mientras, el 5 % sufre errores.
    d: La estable funciona bien.
  referencia: https://martinfowler.com/bliki/CanaryRelease.html
- id: L04-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.2'
  enunciado: ¿Qué separa un interruptor de funcionalidad?
  opciones:
  - id: a
    texto: El código del frontend y el backend
  - id: b
    texto: Las pruebas de la producción
  - id: c
    texto: Desplegar el código de lanzar la funcionalidad a los usuarios
  - id: d
    texto: Las ramas de Git
  correctas:
  - c
  explicacion: El código llega apagado y se activa cuando se decide, para quien se
    decide, y se puede apagar en segundos.
  distractores:
    a: No tiene relación.
    b: Las pruebas siguen siendo necesarias.
    d: Permite justo trabajar sin ramas largas.
  referencia: https://martinfowler.com/articles/feature-toggles.html
- id: L04-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.2'
  enunciado: La funcionalidad de pago con Bizum lleva seis meses activa para todos.
    ¿Qué haces con su interruptor?
  opciones:
  - id: a
    texto: Eliminarlo junto con la rama de código antigua
  - id: b
    texto: Dejarlo por si acaso
  - id: c
    texto: Añadir otro interruptor encima
  - id: d
    texto: Moverlo a otro servicio
  correctas:
  - a
  explicacion: Cada interruptor es complejidad; se tratan como deuda que se paga al
    terminar el lanzamiento.
  distractores:
    b: Se acumulan y complican el código.
    c: Aumenta la complejidad.
    d: No la reduce.
  referencia: https://martinfowler.com/articles/feature-toggles.html
- id: L04-006
  tipo: multiple_choice
  dificultad: alta
  objetivo: '4.3'
  enunciado: ¿Por qué renombrar una columna en un solo paso rompe un despliegue progresivo?
  opciones:
  - id: a
    texto: Porque durante el despliegue conviven la versión vieja y la nueva sobre
      la misma base de datos, y una de las dos no encontrará la columna
  - id: b
    texto: Porque Kubernetes no permite migraciones
  - id: c
    texto: Porque las bases de datos no admiten renombrar
  - id: d
    texto: No lo rompe
  correctas:
  - a
  explicacion: Los cambios de esquema deben ser compatibles con las dos versiones
    mientras conviven.
  distractores:
    b: No es una limitación de Kubernetes.
    c: Se puede renombrar; el problema es la convivencia.
    d: La versión vieja fallaría.
  referencia: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- id: L04-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.4'
  enunciado: Un despliegue causa errores en producción. ¿Qué es lo primero?
  opciones:
  - id: a
    texto: Encontrar al responsable
  - id: b
    texto: Investigar la causa a fondo antes de tocar nada
  - id: c
    texto: Escribir el informe del incidente
  - id: d
    texto: Restaurar el servicio, volviendo atrás o corrigiendo hacia delante
  correctas:
  - d
  explicacion: Se restaura primero; la causa se investiga después con calma.
  distractores:
    a: No restaura nada.
    b: Mientras, los usuarios sufren el fallo.
    c: Va después.
  referencia: https://martinfowler.com/bliki/BlueGreenDeployment.html
- id: L04-008
  tipo: multiple_choice
  dificultad: media
  objetivo: '4.1'
  enunciado: ¿Qué inconveniente tiene el despliegue azul-verde?
  opciones:
  - id: a
    texto: Que no permite volver atrás
  - id: b
    texto: Que necesita el doble de recursos mientras conviven los dos entornos
  - id: c
    texto: Que solo funciona en Kubernetes
  - id: d
    texto: Que el cambio es muy lento
  correctas:
  - b
  explicacion: Se mantienen dos entornos completos; a cambio, el cambio y la vuelta
    atrás son inmediatos.
  distractores:
    a: Es su principal ventaja.
    c: Es una técnica general.
    d: El cambio es de golpe.
  referencia: https://martinfowler.com/bliki/BlueGreenDeployment.html
- id: L05-002
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.2'
  enunciado: ¿Qué ventaja de seguridad tiene GitOps frente a que la CI ejecute kubectl
    apply?
  opciones:
  - id: a
    texto: Que no hacen falta pruebas
  - id: b
    texto: Que las imágenes se cifran
  - id: c
    texto: Que la CI no necesita credenciales del clúster; solo el agente que está
      dentro
  - id: d
    texto: Que no hace falta Git
  correctas:
  - c
  explicacion: El agente extrae los cambios desde dentro; un compromiso de la CI no
    da acceso directo al clúster.
  distractores:
    a: Las pruebas siguen haciendo falta.
    b: No cifra imágenes.
    d: Git es la fuente de verdad.
  referencia: https://opengitops.dev/
- id: L05-003
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: Con selfHeal activado, alguien escala a mano el Deployment a 3 réplicas
    y borra el Service. ¿Qué pasó en el laboratorio?
  opciones:
  - id: a
    texto: Argo CD restauró 1 réplica y el Service en 1,2 s
  - id: b
    texto: Nada hasta el siguiente commit
  - id: c
    texto: Argo CD borró la aplicación
  - id: d
    texto: Se quedaron 3 réplicas y sin Service
  correctas:
  - a
  explicacion: Argo CD vigila el clúster y, con selfHeal, devuelve el estado declarado
    en Git.
  distractores:
    b: selfHeal reacciona a cambios en el clúster, no solo en Git.
    c: Solo corrige la deriva.
    d: Habría pasado sin selfHeal, con la aplicación en OutOfSync.
  referencia: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
- id: L05-004
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: Sin selfHeal, se escala a mano a 3 réplicas. ¿Qué mostró Argo CD a los
    20 s?
  opciones:
  - id: a
    texto: Synced, con 1 réplica
  - id: b
    texto: OutOfSync, con las 3 réplicas sin corregir
  - id: c
    texto: Un error y la aplicación detenida
  - id: d
    texto: Nada; no detecta cambios manuales
  correctas:
  - b
  explicacion: La deriva se detecta y se muestra, pero la documentación indica que,
    por defecto, los cambios en el clúster no lanzan la sincronización.
  distractores:
    a: Sin selfHeal no corrige.
    c: La aplicación sigue funcionando.
    d: Los detecta y marca el recurso como OutOfSync.
  referencia: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
- id: L05-005
  tipo: multiple_choice
  dificultad: alta
  objetivo: '5.3'
  enunciado: Borras un manifiesto del repositorio. Con sincronización automática pero
    sin prune, ¿qué pasa con el recurso en el clúster?
  opciones:
  - id: a
    texto: Se borra al instante
  - id: b
    texto: Se borra el repositorio
  - id: c
    texto: Argo CD falla
  - id: d
    texto: Sigue en el clúster; por seguridad, la sincronización automática no borra
      recursos salvo con prune
  correctas:
  - d
  explicacion: La documentación lo describe como un mecanismo de seguridad; se puede
    borrar con una sincronización manual con poda o activando prune.
  distractores:
    a: Solo con prune activado.
    b: Argo CD no modifica el repositorio.
    c: Simplemente no lo borra.
  referencia: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
- id: L05-007
  tipo: multiple_choice
  dificultad: media
  objetivo: '5.4'
  enunciado: Haces un commit con una imagen nueva y Argo CD tarda dos minutos en desplegarla.
    ¿Por qué, y cómo se acelera?
  opciones:
  - id: a
    texto: Porque Kubernetes es lento; no se puede acelerar
  - id: b
    texto: Porque hace falta aprobar cada cambio
  - id: c
    texto: Porque Argo CD consulta Git cada 120 s más hasta 60 s aleatorios; un webhook
      del repositorio lo avisa al instante
  - id: d
    texto: Porque la imagen es grande
  correctas:
  - c
  explicacion: La documentación de Argo CD describe ese intervalo de sondeo, ajustable
    con timeout.reconciliation, y los webhooks.
  distractores:
