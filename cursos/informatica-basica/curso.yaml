slug: informatica-basica
titulo: Informática Básica
proveedor: Educativo
fuentes_oficiales: [man7.org, kernel.org, freedesktop.org, aws.amazon.com, docker.com]
idioma: es-ES

# Áreas de conocimiento
dominios:
  - {id: 1, nombre: "Fundamentos y Sistemas Operativos", peso: 20}
  - {id: 2, nombre: "Redes y Comunicaciones", peso: 20}
  - {id: 3, nombre: "Bases de Datos", peso: 20}
  - {id: 4, nombre: "Contenedores y DevOps", peso: 20}
  - {id: 5, nombre: "Seguridad", peso: 20}

# Simulacro y examen
simulacro: simulacro-informatica-basica
examen:
  preguntas: 50
  minutos: 90
  tipos: [multiple_choice, matching]
  distribucion: {multiple_choice: 70, matching: 30}

# Banco de preguntas
banco:
  minimo_por_modulo: 30
  minimo_simulacro: 50
  minimo_por_objetivo: 2
  minimo_por_tarea: 10
  distribucion: {multiple_choice: 70, matching: 30}

# Configuración de repaso
repaso:
  minimo_por_modulo: 15
  minimo_por_objetivo: 3

