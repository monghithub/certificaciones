  enunciado: ¿Qué servicio de AWS es la plataforma agéntica para crear, desplegar y operar agentes de forma segura
    a escala, recomendada para clientes nuevos?
  opciones:
  - id: a
    texto: Amazon Bedrock Agents (Classic)
  - id: b
    texto: Amazon Bedrock AgentCore
  - id: c
    texto: Strands Agents
  - id: d
    texto: Amazon Bedrock Knowledge Bases
  correctas:
  - b
  explicacion: 'Amazon Bedrock AgentCore es la plataforma agéntica para crear, desplegar y operar agentes de forma segura a escala. Amazon Bedrock Agents, ahora Classic, ya no está abierto a clientes nuevos y AWS remite a AgentCore. Pista: «Core» = el núcleo actual para operar agentes.'
  distractores:
    a: Bedrock Agents (Classic) sigue funcionando para quien ya lo usa, pero no está abierto a clientes nuevos.
    c: Strands Agents es un SDK de código abierto para programar agentes, no la plataforma gestionada para operarlos.
    d: Knowledge Bases integra información propia con RAG; no es una plataforma para operar agentes.
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
