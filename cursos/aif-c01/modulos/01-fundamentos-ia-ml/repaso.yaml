- id: R1-037
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.5
  tipo: matching
  dificultad: media
  enunciado: Empareja cada descripción con el concepto de MLOps correspondiente.
  prompts:
  - id: '1'
    texto: Probar y comparar variantes de modelo de forma registrada
  - id: '2'
    texto: Automatizar los flujos para obtener los mismos resultados
  - id: '3'
    texto: Evitar que el código, los datos y los modelos sin versionar ni documentar frenen el desarrollo
  - id: '4'
    texto: Aplicar controles de calidad y de gobierno antes del despliegue
  - id: '5'
    texto: Volver a entrenar el modelo cuando se degrada
  opciones:
  - id: a
    texto: Reentrenamiento
  - id: b
    texto: Gestión de la deuda técnica
  - id: c
    texto: Experimentación
  - id: d
    texto: Preparación para producción
  - id: e
    texto: Procesos repetibles
  - id: f
    texto: Sistemas escalables
  correctas:
  - - '1'
    - c
  - - '2'
    - e
  - - '3'
    - b
  - - '4'
    - d
  - - '5'
    - a
  explicacion: 'MLOps aplica las prácticas de DevOps al ML. Experimentación: MLflow en SageMaker AI. Procesos repetibles:
    SageMaker Pipelines. Deuda técnica: registro de modelos y trazabilidad. Preparación para producción: Model Registry.
    Reentrenamiento: pipelines automatizados.'
  distractores:
    f: Los sistemas escalables buscan que el proceso funcione al crecer el número de modelos y de datos; no encaja con
      ninguna de las descripciones.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/mlops.html
- id: R1-038
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.5
  tipo: multiple_choice
  dificultad: alta
  enunciado: ¿Qué recomienda AWS para registrar y comparar experimentos de ML en SageMaker AI?
  opciones:
  - id: a
    texto: MLflow en SageMaker AI
  - id: b
    texto: SageMaker Experiments Classic
  - id: c
    texto: SageMaker Pipelines
  - id: d
    texto: Amazon CloudWatch
  correctas:
  - a
  explicacion: 'MLflow en SageMaker AI registra y compara experimentos para que sean reproducibles. SageMaker Experiments es ahora Experiments Classic y AWS recomienda MLflow en su lugar. Pista: experimento → MLflow; flujo completo → Pipelines; versión aprobada → Model Registry.'
  distractores:
    b: Experiments es ahora Classic, solo en Studio Classic, y AWS recomienda MLflow en SageMaker AI.
    c: Pipelines automatiza y hace repetible el flujo de entrenamiento y despliegue; no es la herramienta para registrar
      experimentos.
    d: CloudWatch recoge métricas, registros y alarmas de endpoints y aplicaciones, no experimentos de entrenamiento.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow.html
- id: R1-039
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.6
  tipo: matching
  dificultad: media
  enunciado: Empareja cada fórmula o pregunta con su métrica, técnica o de negocio.
  prompts:
  - id: '1'
    texto: VP / (VP + FP)
  - id: '2'
    texto: VP / (VP + FN)
  - id: '3'
    texto: Media armónica de precisión y exhaustividad
  - id: '4'
    texto: ¿Compensa lo invertido en el proyecto?
  - id: '5'
    texto: ¿Cuánto cuesta atender a cada cliente con el asistente?
  opciones:
  - id: a
    texto: Retorno de la inversión (ROI)
  - id: b
    texto: Exhaustividad (recall)
  - id: c
    texto: Coste por usuario
  - id: d
    texto: Precisión (precision)
  - id: e
    texto: Puntuación F1
  - id: f
    texto: Exactitud (accuracy)
  - id: g
    texto: Costes de desarrollo
  correctas:
  - - '1'
    - d
  - - '2'
    - b
  - - '3'
    - e
  - - '4'
    - a
  - - '5'
    - c
  explicacion: 'Las métricas técnicas miden el modelo: precisión = VP / (VP + FP), exhaustividad = VP / (VP + FN)
    y F1, su media armónica. Las de negocio miden el valor: el ROI dice si compensa la inversión y el coste por usuario,
    cuánto cuesta atender a cada cliente.'
  distractores:
    f: La exactitud es la proporción de elementos clasificados correctamente sobre el total; no corresponde a ninguna
      fórmula de la lista.
    g: Los costes de desarrollo responden a «¿cuánto ha costado construirlo?», no al coste por cliente atendido.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
- id: R1-040
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.6
  tipo: multiple_choice
  dificultad: media
  enunciado: En un filtro de spam, lo más caro es enviar a spam un correo legítimo (falso positivo). ¿Qué métrica
    conviene priorizar?
  opciones:
  - id: a
    texto: Exhaustividad (recall)
  - id: b
    texto: Exactitud (accuracy)
  - id: c
    texto: Precisión (precision)
  - id: d
    texto: Retorno de la inversión (ROI)
  correctas:
  - c
  explicacion: 'La precisión mide, de todo lo que el modelo marca como positivo, qué parte lo es realmente, VP / (VP + FP). Se prioriza cuando un falso positivo es caro. Pista: Precisión ↔ falsos Positivos; exhaustividad ↔ falsos negativos.'
  distractores:
    a: La exhaustividad se prioriza cuando lo caro es el falso negativo, como no detectar a un enfermo.
    b: La exactitud es una medida general de aciertos y no distingue entre tipos de error; además engaña con clases
      desequilibradas.
    d: El ROI es una métrica de negocio; no mide el tipo de error del clasificador.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
- id: R1-041
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.6
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un clasificador detecta 40 de los 50 casos positivos reales (VP = 40, FN = 10) y da 20 falsos positivos.
    ¿Cuál es su exhaustividad (recall)?
  opciones:
  - id: a
    texto: 67 %
  - id: b
    texto: 57 %
  - id: c
    texto: 73 %
  - id: d
    texto: 80 %
  correctas:
  - d
  explicacion: 'La exhaustividad es VP / (VP + FN) = 40 / (40 + 10) = 80 %. Mide, de todos los positivos reales, cuántos detecta el modelo; los falsos positivos no intervienen. Pista: exhaustividad mira los positivos reales; precisión, las alertas que da el modelo.'
  distractores:
    a: 'Es la precisión: VP / (VP + FP) = 40 / (40 + 20) ≈ 67 %. Usa los falsos positivos, no los falsos negativos.'
    b: 'Resulta de mezclar los dos tipos de error: 40 / (40 + 10 + 20) ≈ 57 %. La exhaustividad solo usa los falsos negativos.'
    c: 'Es la puntuación F1, la media armónica de precisión (67 %) y exhaustividad (80 %): unos 73 %. Equilibra ambas, pero no es la exhaustividad.'
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
- id: R1-042
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.6
  tipo: multiple_response
  dificultad: media
  enunciado: Con clases muy desequilibradas (por ejemplo, un 1 % de fraude), ¿qué DOS métricas conviene mirar en lugar
    de la exactitud?
  opciones:
  - id: a
    texto: Retorno de la inversión (ROI)
  - id: b
    texto: Puntuación F1
  - id: c
    texto: Coste por usuario
  - id: d
    texto: AUC (área bajo la curva ROC)
  - id: e
    texto: Proporción de elementos clasificados correctamente sobre el total
  correctas:
  - b
  - d
  explicacion: 'Con clases desequilibradas, la exactitud engaña; un modelo que dijera «no hay fraude» acertaría el 99 % sin detectar ninguno. Por eso se miran la precisión, la exhaustividad, F1 o AUC (1 es perfecto y 0,5 equivale al azar). Pista: si la clase que importa es rara, olvida la exactitud.'
  distractores:
    a: El ROI es una métrica de negocio; no evalúa cómo clasifica el modelo la clase minoritaria.
    c: El coste por usuario es una métrica de negocio, no de rendimiento del clasificador.
    e: Esa es la definición de exactitud, justo la métrica que engaña con clases desequilibradas.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
