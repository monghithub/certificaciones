  - id: b
    texto: La compatibilidad con entrada de imágenes
  - id: c
    texto: El máximo de tokens de salida
  - id: d
    texto: La temperatura por defecto del modelo
  correctas:
  - c
  explicacion: 'La longitud de entrada y de salida es un criterio de selección: un informe largo necesita un modelo
