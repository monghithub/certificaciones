  opciones:
  - id: a
    texto: Conocer la causa exacta de cada compra
  - id: b
    texto: Sustituir la estrategia comercial de la dirección
  - id: c
    texto: Automatizar decisiones repetitivas de gran volumen
  - id: d
    texto: Reducir la cantidad de datos de clientes que hay que recoger
  - id: e
    texto: Escalar una tarea que no se puede hacer a mano para cada cliente
  correctas:
  - c
  - e
  explicacion: 'La guía cita como valor del ML apoyar las decisiones humanas, la escalabilidad y la automatización:
