- id: S-044
  dominio: 5
  tarea: '5.2'
  objetivo: 5.2.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un hospital necesita revisar y aceptar con AWS un acuerdo exigido por la normativa sanitaria antes
