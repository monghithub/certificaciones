  - id: d
    texto: Amazon Polly
  correctas:
  - d
  explicacion: Amazon Polly convierte texto en voz realista.
  distractores:
    a: 'Hace lo contrario: convierte voz en texto.'
    b: Traduce texto; no lo convierte en voz.
    c: Crea interfaces conversacionales (bots); no genera audio a partir de artículos.
  referencia: https://docs.aws.amazon.com/polly/latest/dg/what-is.html
- id: S-023
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: matching
  dificultad: alta
  enunciado: Una empresa despliega agentes con Amazon Bedrock AgentCore. Empareja cada necesidad con el componente
