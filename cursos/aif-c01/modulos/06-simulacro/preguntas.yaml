- id: S-054
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.5
  tipo: multiple_choice
  dificultad: media
  enunciado: Un pipeline reentrena cada semana un modelo de previsión. Una semana, el modelo nuevo es peor que el
