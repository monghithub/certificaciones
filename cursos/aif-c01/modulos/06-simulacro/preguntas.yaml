  - id: c
    texto: Un agente de atención al cliente que consulta los pedidos
  - id: d
    texto: Calcular la nómina con las tablas fiscales vigentes
  - id: e
    texto: Predecir las ventas del trimestre con datos tabulares históricos
  correctas:
  - a
  - c
  explicacion: La traducción y los agentes de atención al cliente son casos de uso de la IA generativa que cita
