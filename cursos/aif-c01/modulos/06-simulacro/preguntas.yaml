- id: S-001
  dominio: 1
  tarea: '1.1'
  objetivo: 1.1.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una cadena de gimnasios quiere agrupar a sus socios en perfiles según sus hábitos de uso, sin tener
    grupos definidos de antemano. ¿Qué tipo de aprendizaje es el adecuado?
  opciones:
  - id: a
    texto: Aprendizaje supervisado
  - id: b
    texto: Aprendizaje no supervisado
  - id: c
    texto: Aprendizaje por refuerzo
  - id: d
    texto: Ajuste fino de un modelo fundacional
  correctas:
  - b
  explicacion: El aprendizaje no supervisado encuentra estructura en datos sin etiquetar; el agrupamiento (clustering)
    es su ejemplo típico para segmentar clientes.
  distractores:
    a: Necesita ejemplos etiquetados con el grupo correcto, y aquí los grupos no existen de antemano.
    c: Aprende acciones mediante recompensas en un entorno; no agrupa datos.
    d: Adapta un modelo generativo con datos etiquetados; no descubre grupos en datos sin etiquetar.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html
- id: S-002
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.5
  tipo: ordering
  dificultad: alta
  enunciado: Ordena un ciclo de MLOps automatizado para un modelo de previsión.
  opciones:
  - id: a
    texto: Llegan datos nuevos y se lanza el pipeline de entrenamiento
  - id: b
    texto: Se aprueba la versión y se despliega
  - id: c
    texto: Se evalúa el modelo y se registra la versión en el Model Registry
  - id: d
    texto: La monitorización detecta deriva y vuelve a lanzar el pipeline
  correctas:
  - a
  - c
  - b
  - d
  explicacion: 'MLOps automatiza el ciclo: entrenamiento reproducible en un pipeline, evaluación y registro de versiones,
    aprobación y despliegue, y monitorización que dispara el reentrenamiento.'
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html
- id: S-003
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.5
  tipo: multiple_response
  dificultad: alta
  enunciado: En sesiones largas, un asistente olvida datos que el cliente dio al principio y el prompt crece hasta
    acercarse al límite de la ventana de contexto. ¿Qué DOS técnicas de ingeniería de contexto ayudan? (Elige DOS.)
  opciones:
  - id: a
    texto: Subir la temperatura del modelo
  - id: b
    texto: Recuperar solo la información relevante para cada pregunta
  - id: c
    texto: Ajustar el modelo cada semana con las conversaciones
  - id: d
    texto: Resumir el historial antiguo y conservar los datos clave
  - id: e
    texto: Aumentar el número máximo de tokens de salida
  correctas:
  - b
  - d
  explicacion: 'La ingeniería de contexto decide qué información llega al modelo en cada petición: resumir o seleccionar
    el historial y recuperar solo lo relevante mantiene el contexto útil y dentro del límite.'
  distractores:
    a: Cambia la variabilidad de la respuesta, no lo que el modelo recibe como contexto.
    c: Es caro y lento; el problema es qué contexto se envía en cada petición.
    e: Permite respuestas más largas, pero no gestiona el contexto de entrada.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: S-004
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.5
  tipo: matching
  dificultad: media
  enunciado: Empareja cada objetivo de negocio de una aplicación de IA con la métrica que lo mide.
  prompts:
  - id: '1'
    texto: Reducir el coste de la atención al cliente
  - id: '2'
    texto: Que el agente resuelva las solicitudes sin escalar
  - id: '3'
    texto: Mejorar la experiencia de los clientes
  opciones:
  - id: a
    texto: Puntuación ROUGE
  - id: b
    texto: Coste por interacción
  - id: c
    texto: Satisfacción del usuario
  - id: d
    texto: Tasa de tareas completadas
  correctas:
  - - '1'
    - b
  - - '2'
    - d
  - - '3'
    - c
  explicacion: 'Las métricas de alineamiento con el negocio miden el efecto de la aplicación en los objetivos: coste
    por interacción, tareas completadas y satisfacción.'
  distractores:
    a: Es una métrica técnica de solapamiento, no de alineamiento con el negocio.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: S-005
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una tienda en línea quiere que la búsqueda encuentre «zapatillas para correr» aunque el cliente escriba
    «calzado de running». ¿Qué representación lo hace posible?
  opciones:
  - id: a
    texto: La temperatura del modelo
  - id: b
    texto: Los embeddings de cada producto
  - id: c
    texto: El chunking de las fichas de producto
  - id: d
    texto: Un filtro de palabras exactas
  correctas:
  - b
  explicacion: 'Un embedding es un vector que representa el significado de un texto: textos con significado parecido
    quedan cerca, lo que permite la búsqueda semántica.'
  distractores:
    a: Controla la variabilidad de la generación; no representa significados.
    c: Parte textos largos en fragmentos, pero no compara significados por sí solo.
    d: Solo encontraría coincidencias literales.
  referencia: https://aws.amazon.com/what-is/embeddings-in-machine-learning/
- id: S-006
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: El comité de riesgos de una financiera pide un documento por cada modelo propio con su uso previsto,
    su calificación de riesgo y sus resultados de evaluación. ¿Qué herramienta de AWS usa?
  opciones:
  - id: a
    texto: Amazon Bedrock Guardrails
  - id: b
    texto: AWS CloudTrail
  - id: c
    texto: Amazon SageMaker Model Cards
  - id: d
    texto: AWS AI Service Cards
  correctas:
  - c
  explicacion: SageMaker Model Cards documenta en un sitio el uso previsto, la calificación de riesgo, el entrenamiento
    y la evaluación de un modelo, con versiones inmutables.
  distractores:
    a: Filtra contenido; no documenta modelos.
    b: Registra la actividad de la API, no el uso previsto de un modelo.
    d: Las publica AWS sobre sus propios servicios y modelos, no sobre los del cliente.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
- id: S-007
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: matching
  dificultad: media
  enunciado: Empareja cada necesidad de evaluación con la métrica o el enfoque adecuado.
  prompts:
  - id: '1'
    texto: Medir cuánto de un resumen de referencia aparece en el resumen generado
  - id: '2'
    texto: Medir la calidad de una traducción frente a traducciones de referencia
  - id: '3'
    texto: Medir la similitud semántica aunque cambien las palabras
  - id: '4'
    texto: Puntuar la utilidad de las respuestas con una rúbrica y a escala
  opciones:
  - id: a
    texto: BLEU
  - id: b
    texto: LLM-as-a-judge
  - id: c
    texto: BERTScore
  - id: d
    texto: ROUGE
  - id: e
    texto: Temperatura
  correctas:
  - - '1'
    - d
  - - '2'
    - a
  - - '3'
    - c
  - - '4'
    - b
  explicacion: ROUGE mide solapamiento orientado a la exhaustividad (resúmenes); BLEU, a la precisión (traducción);
    BERTScore compara significados con embeddings; un modelo juez puntúa con una rúbrica.
  distractores:
    e: Es un parámetro de inferencia, no una métrica de evaluación.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
- id: S-008
  dominio: 5
  tarea: '5.1'
  objetivo: 5.1.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Antes de usar como fuente de un RAG un bucket con años de correos de clientes, una empresa quiere saber
    si contiene datos personales. ¿Qué servicio usa?
  opciones:
  - id: a
    texto: El filtro de palabras de Guardrails
  - id: b
    texto: Amazon Inspector
  - id: c
    texto: Amazon Macie
  - id: d
    texto: AWS Artifact
  correctas:
  - c
  explicacion: Amazon Macie descubre datos sensibles en S3 con ML y patrones, y avisa de riesgos de acceso.
  distractores:
    a: Actúa sobre las conversaciones, no sobre los datos almacenados en S3.
    b: Busca vulnerabilidades de software, no datos personales.
    d: Ofrece informes de cumplimiento de AWS.
  referencia: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
- id: S-009
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una consultora necesita resumir notas internas breves. Un modelo pequeño cumple su nivel de calidad
    y otro mucho mayor apenas lo mejora. ¿Qué elección es la más responsable?
  opciones:
  - id: a
    texto: Entrenar un modelo propio desde cero
  - id: b
    texto: Usar ambos y quedarse con la respuesta más larga
  - id: c
    texto: El modelo grande, por si en el futuro hiciera falta
  - id: d
    texto: El modelo pequeño, que cumple con menos consumo y coste
  correctas:
  - d
  explicacion: Elegir el modelo del tamaño justo (el más pequeño que cumple) es una práctica de sostenibilidad del
    Generative AI Lens de AWS.
  distractores:
    a: Tiene una huella y un coste mucho mayores.
    b: Duplica el consumo y la longitud no mide la calidad.
    c: Consume más energía y dinero en cada inferencia sin una necesidad actual.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/sustainability.html
- id: S-010
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.6
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa quiere que sus agentes de IA usen herramientas internas (CRM, catálogo) mediante un protocolo
    estándar, para no escribir una integración distinta para cada agente. ¿Qué protocolo usa?
  opciones:
  - id: a
    texto: Retrieval Augmented Generation (RAG)
  - id: b
    texto: Model Context Protocol (MCP)
  - id: c
    texto: Prompt caching
  - id: d
    texto: Agent2Agent (A2A)
  correctas:
  - b
  explicacion: MCP es un protocolo abierto para conectar modelos y agentes con herramientas y fuentes de datos de
    forma estándar; A2A conecta agentes entre sí.
  distractores:
    a: Es una técnica para añadir información al prompt, no un protocolo de herramientas.
    c: Abarata contextos repetidos; no conecta herramientas.
    d: Está pensado para la comunicación entre agentes, no para conectar un agente con herramientas y datos.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/getting-started-with-mcp.html
- id: S-011
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un modelo falla en problemas de cálculo de varios pasos sobre tarifas y descuentos. ¿Qué técnica de
    prompt mejora su razonamiento?
  opciones:
  - id: a
    texto: 'Chain-of-thought: pedir que razone paso a paso'
  - id: b
    texto: Bajar top-p al mínimo
  - id: c
    texto: Reducir la longitud máxima de la respuesta
  - id: d
    texto: Zero-shot con la pregunta más corta
  correctas:
  - a
  explicacion: Chain-of-thought pide al modelo que exponga los pasos intermedios, lo que mejora tareas de razonamiento
    de varios pasos.
  distractores:
    b: Reduce la variedad, no la calidad del razonamiento.
    c: Cortaría el razonamiento que necesita.
    d: Quitar contexto no mejora el razonamiento.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
- id: S-012
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un modelo de reconocimiento de matrículas acierta el 99 % de las imágenes de entrenamiento y solo el
    72 % de las imágenes nuevas de las cámaras. ¿Qué le ocurre?
  opciones:
  - id: a
    texto: Sobreajuste
  - id: b
    texto: Subajuste
  - id: c
    texto: Deriva de los datos en producción
  - id: d
    texto: Un buen equilibrio entre sesgo y varianza
  correctas:
  - a
  explicacion: 'Acertar mucho más con los datos de entrenamiento que con los nuevos indica sobreajuste: alta varianza,
    el modelo memoriza en lugar de generalizar.'
  distractores:
    b: Fallaría también con las imágenes de entrenamiento.
    c: La diferencia ya aparece entre entrenamiento y prueba, antes de cualquier cambio con el tiempo.
    d: Un modelo equilibrado tiene errores parecidos en entrenamiento y en datos nuevos.
  referencia: https://aws.amazon.com/what-is/overfitting/
- id: S-013
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo necesita que un modelo devuelva siempre la clasificación de cada reseña con un formato exacto
    de tres campos. Explicar el formato no basta. ¿Qué técnica de prompt ayuda más?
  opciones:
  - id: a
    texto: Few-shot con ejemplos del formato
  - id: b
    texto: 'Zero-shot: pedirlo sin ejemplos con más énfasis'
  - id: c
    texto: Subir la temperatura para explorar formatos
  - id: d
    texto: Prompt negativo con los formatos que no se quieren
  correctas:
  - a
  explicacion: Few-shot incluye ejemplos en el prompt para que el modelo imite el patrón y el formato de salida,
    un caso típico de aprendizaje en contexto.
  distractores:
    b: Es lo que ya se ha probado sin éxito.
    c: Aumentaría la variabilidad del formato.
    d: Describir lo que no se quiere suele ser menos eficaz que mostrar lo que sí.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
- id: S-014
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.2
  tipo: multiple_response
  dificultad: media
  enunciado: Un banco evalúa un asistente de IA generativa para su web. ¿Qué DOS desventajas debe tener en cuenta?
    (Elige DOS.)
  opciones:
  - id: a
    texto: La misma pregunta puede recibir respuestas distintas
  - id: b
    texto: Puede generar respuestas plausibles pero falsas
  - id: c
    texto: No entiende preguntas en lenguaje natural
  - id: d
    texto: No puede integrarse con aplicaciones existentes
  - id: e
    texto: Necesita datos etiquetados para cada pregunta
  correctas:
  - a
  - b
  explicacion: Las alucinaciones y el no determinismo son dos desventajas de la IA generativa que el examen cita,
    junto con la interpretabilidad y la inexactitud.
  distractores:
    c: Entender y generar lenguaje natural es justo su punto fuerte.
    d: Se integra por API con otras aplicaciones.
    e: Los modelos fundacionales se usan sin etiquetar cada caso.
  referencia: https://aws.amazon.com/what-is/ai-hallucinations/
- id: S-015
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.3
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una empresa va a entrenar un modelo de aprendizaje profundo muy grande en Amazon EC2 y busca reducir
    el coste del entrenamiento. ¿Qué chips de AWS están diseñados para ello?
  opciones:
  - id: a
    texto: AWS Inferentia
  - id: b
    texto: AWS Trainium
  - id: c
    texto: Instancias de uso general sin aceleradores
  - id: d
    texto: AWS Lambda
  correctas:
  - b
  explicacion: AWS Trainium son chips diseñados por AWS para el entrenamiento de aprendizaje profundo e IA generativa
    con menor coste.
  distractores:
    a: Está diseñado para inferencia, no para entrenamiento.
    c: Son poco eficientes para entrenar modelos profundos grandes.
    d: Es un servicio serverless de funciones, no un chip para entrenar modelos.
  referencia: https://aws.amazon.com/ai/machine-learning/trainium/
- id: S-016
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.3
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una aseguradora quiere estimar el importe en euros que costará cada siniestro a partir de sus características.
    ¿Qué técnica de ML es la adecuada?
  opciones:
  - id: a
    texto: Detección de anomalías
  - id: b
    texto: Regresión
  - id: c
    texto: Agrupamiento
  - id: d
    texto: Clasificación
  correctas:
  - b
  explicacion: La regresión predice un valor numérico continuo, como un importe; la clasificación predice categorías.
  distractores:
    a: Encuentra casos raros; no estima el importe de cada siniestro.
    c: Forma grupos sin etiquetas; no estima un valor.
    d: Predice una categoría (por ejemplo, fraude sí o no), no un importe numérico.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html
- id: S-017
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_choice
  dificultad: alta
  enunciado: La aplicación de una aerolínea para reprogramar vuelos durante incidencias necesita las respuestas
    más rápidas posibles, con tráfico difícil de prever y sin reservar capacidad. ¿Qué opción de Bedrock encaja?
  opciones:
  - id: a
    texto: El nivel de servicio Flex
  - id: b
    texto: Provisioned Throughput
  - id: c
    texto: El nivel de servicio Priority
  - id: d
    texto: La inferencia por lotes
  correctas:
  - c
  explicacion: El nivel Priority da la respuesta más rápida sin reservar capacidad, con un precio por token superior
    al Standard (un 75 % más según la página de precios).
  distractores:
    a: 'Es más barato a cambio de más tiempo de proceso: lo contrario de lo que se necesita.'
    b: Garantiza capacidad, pero hay que reservarla y pagarla aunque no se use.
    d: Es asíncrona; no da respuestas inmediatas.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
- id: S-018
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una gestoría recibe miles de facturas escaneadas y necesita extraer las tablas y los pares clave-valor
    (fecha, NIF, importe). ¿Qué servicio de AWS lo hace sin entrenar un modelo?
  opciones:
  - id: a
    texto: Amazon Transcribe
  - id: b
    texto: Amazon Textract
  - id: c
    texto: Amazon Rekognition
  - id: d
    texto: Amazon Comprehend
  correctas:
  - b
  explicacion: Amazon Textract extrae texto, escritura a mano, tablas y pares clave-valor de documentos escaneados
    con ML, sin que el cliente entrene modelos.
  distractores:
    a: Convierte voz en texto, no documentos escaneados.
    c: Analiza imágenes y vídeo (objetos, caras, contenido), no la estructura de formularios y tablas.
    d: Analiza texto ya extraído (entidades, sentimiento); no lee documentos escaneados.
  referencia: https://docs.aws.amazon.com/textract/latest/dg/what-is.html
- id: S-019
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.3
  tipo: ordering
  dificultad: media
  enunciado: Ordena las etapas del ciclo de vida de un modelo fundacional desde la perspectiva de quien lo crea.
  opciones:
  - id: a
    texto: Despliegue
  - id: b
    texto: Preentrenamiento
  - id: c
    texto: Evaluación
  - id: d
    texto: Ajuste fino
  - id: e
    texto: Selección de los datos
  correctas:
  - e
  - b
  - d
  - c
  - a
  explicacion: El ciclo de vida empieza por seleccionar los datos (y el modelo base), sigue con el preentrenamiento,
    el ajuste fino, la evaluación y el despliegue, y se cierra con la retroalimentación.
  referencia: https://aws.amazon.com/what-is/foundation-models/
- id: S-020
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.3
  tipo: multiple_response
  dificultad: media
  enunciado: Un equipo prepara los datos para ajustar un modelo de atención al cliente. ¿Qué DOS prácticas son las
    adecuadas? (Elige DOS.)
  opciones:
  - id: a
    texto: Omitir el conjunto de validación para entrenar con más datos
  - id: b
    texto: Incluir las conversaciones sin revisar para tener más volumen
  - id: c
    texto: Mezclar datos de otros sectores para aumentar el tamaño
  - id: d
    texto: Curar ejemplos representativos y de calidad del caso de uso
  - id: e
    texto: Formatear los datos como pares de prompt y respuesta etiquetados
  correctas:
  - d
  - e
  explicacion: Preparar los datos de ajuste implica curar ejemplos de calidad y representativos, gobernarlos y darles
    el formato que exige el método, con un conjunto de validación.
  distractores:
    a: Sin validación no se puede medir si el ajuste funciona.
    b: Más datos de mala calidad empeoran el modelo y pueden incluir datos personales.
    c: Datos no representativos del caso de uso diluyen el ajuste.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
- id: S-021
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.2
  tipo: multiple_response
  dificultad: media
  enunciado: Una pyme duda entre alojar un modelo propio o usar Amazon Bedrock. ¿Qué DOS ventajas ofrece Bedrock?
    (Elige DOS.)
  opciones:
  - id: a
    texto: No hay que gestionar la infraestructura que aloja los modelos
  - id: b
    texto: Las respuestas del modelo son exactas sin revisión
  - id: c
    texto: El precio por uso es fijo e independiente del volumen
  - id: d
    texto: Se integra con la seguridad de AWS, como IAM y el cifrado
  - id: e
    texto: No hace falta evaluar el modelo antes de usarlo
