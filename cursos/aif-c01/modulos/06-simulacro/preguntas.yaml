  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
- id: S-056
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.3
  tipo: multiple_response
  dificultad: media
  enunciado: Un prompt de 3 páginas con mucho texto irrelevante da respuestas largas e imprecisas. ¿Qué DOS buenas
