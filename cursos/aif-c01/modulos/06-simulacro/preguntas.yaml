- id: S-045
  dominio: 5
  tarea: '5.1'
  objetivo: 5.1.4
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un auditor quiere saber qué usuarios consultan una Knowledge Base de Bedrock con Retrieve. En el historial
    de eventos de CloudTrail no aparecen esas llamadas. ¿Qué hay que hacer?
  opciones:
  - id: a
    texto: Activar el registro de invocaciones de modelos
  - id: b
