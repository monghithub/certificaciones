  opciones:
  - id: a
    texto: Ajuste fino supervisado
  - id: b
    texto: Preentrenamiento continuado
  - id: c
    texto: Few-shot en el prompt
  - id: d
    texto: RAG con una Knowledge Base
  - id: e
    texto: Prompt caching
  correctas:
  - a
  - b
  explicacion: El ajuste fino y el preentrenamiento continuado entrenan el modelo y cambian sus pesos; RAG, few-shot
