- id: S-001
  dominio: 1
  tarea: '1.1'
  objetivo: 1.1.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un banco quiere predecir si un nuevo préstamo se pagará a tiempo. Dispone de diez años de préstamos
    con su resultado final conocido (pagado o impagado). ¿Qué tipo de aprendizaje encaja?
  opciones:
  - id: a
    texto: Aprendizaje no supervisado
  - id: b
    texto: Aprendizaje por refuerzo
  - id: c
    texto: Aprendizaje supervisado
  - id: d
    texto: Aprendizaje autosupervisado
  correctas:
  - c
  explicacion: Con ejemplos históricos etiquetados con el resultado que se quiere predecir, el problema es de aprendizaje
    supervisado (clasificación).
  distractores:
    a: Busca estructura en datos sin etiquetar; aquí cada préstamo tiene su resultado conocido.
    b: Aprende acciones por recompensas en un entorno; no predice un resultado a partir de ejemplos etiquetados.
    d: Genera sus propias etiquetas a partir de los datos, como en el preentrenamiento de los modelos de lenguaje;
      aquí las etiquetas ya existen.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html
- id: S-002
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.6
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un modelo de cribado médico se prueba con 1 000 pacientes, de los que 50 están enfermos. Detecta a
    45 de ellos y además marca como enfermos a 100 pacientes sanos. ¿Cuál es su exhaustividad (recall)?
  opciones:
  - id: a
    texto: 0,90
  - id: b
    texto: 0,31
  - id: c
    texto: 0,46
  - id: d
    texto: 0,895
  correctas:
  - a
  explicacion: Exhaustividad = VP / (VP + FN) = 45 / (45 + 5) = 0,90. En un cribado interesa que se escapen pocos
    enfermos, aunque la precisión sea baja.
  distractores:
    b: 'Es la precisión: 45 / (45 + 100).'
    c: Es la puntuación F1, la media armónica de la precisión (0,31) y la exhaustividad (0,90).
    d: 'Es la exactitud: (45 + 850) / 1 000.'
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
- id: S-003
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Un asistente recibe 1 millón de peticiones al mes. El equipo reduce la respuesta media de 800 a 400
    tokens. Con un precio supuesto de 3 USD por millón de tokens de salida, ¿cuánto ahorra al mes?
  opciones:
  - id: a
    texto: 120 USD
  - id: b
    texto: 1 200 USD
  - id: c
    texto: 2 400 USD
  - id: d
    texto: 600 USD
  correctas:
  - b
  explicacion: Ahorro = 1 000 000 × (800 − 400) = 400 millones de tokens de salida × 3 USD por millón = 1 200 USD.
    Controlar la longitud de salida es una palanca directa de coste.
  distractores:
    a: Equivale a dividir el ahorro entre diez por error.
    c: Es el coste total de la salida antes del cambio (800 millones de tokens × 3 USD), no el ahorro.
    d: Aplica la mitad del precio; el ahorro son 400 millones de tokens al precio completo.
  referencia: https://aws.amazon.com/bedrock/pricing/
- id: S-069
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.5
  tipo: multiple_response
  dificultad: media
  enunciado: Una editorial genera con Amazon Bedrock la contraportada de cada novela a partir de su título y su género. Antes de llevar el prompt a producción con Prompt Management, quiere probar dos redacciones distintas, cada una con un modelo diferente, y quedarse con la mejor. Después, cada llamada de la aplicación debe enviar solo el título y el género de la novela. ¿Qué DOS elementos de Prompt Management usa? (Elige DOS.)
  opciones:
  - id: a
    texto: Una versión del prompt por cada novela, con el título y el género escritos en el texto
  - id: b
    texto: Marcadores en el texto del prompt cuyos valores se pasan en cada invocación
  - id: c
    texto: Cambios directos sobre la versión que usa la aplicación cada vez que mejore la redacción
  - id: d
    texto: Un reparto del tráfico de producción entre las dos redacciones para elegir la mejor sobre la marcha
  - id: e
    texto: Variantes del prompt comparadas en el generador de prompts antes de guardar la elegida
  correctas:
  - b
  - e
  explicacion: Las variables son marcadores del prompt (por ejemplo, {{titulo}} y {{genero}}) que convierten el prompt en una plantilla cuyos valores se rellenan al probarlo o en cada invocación, así que la aplicación solo envía el título y el género. Las variantes son configuraciones alternativas del mismo prompt (otro mensaje, otro modelo u otros parámetros de inferencia) que se comparan en el generador de prompts (prompt builder) para guardar la que mejor funciona. Después se crea una versión, una instantánea del borrador, para usarla en producción y poder volver a una anterior.
  distractores:
    a: Las versiones son instantáneas del prompt para desplegarlo y poder volver atrás; crear una por novela con los datos escritos a mano es justo lo que evitan las variables.
    c: Una versión es una instantánea del borrador; las mejoras se hacen en el borrador y se publican como una versión nueva, de modo que se puede volver a la anterior.
    d: Prompt Management compara las variantes durante las pruebas y se guarda la elegida; no reparte el tráfico de producción entre ellas.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html
- id: S-005
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Una tienda de muebles quiere que sus clientes encuentren fotos de productos escribiendo una descripción,
    por ejemplo «sofá de terciopelo verde», aunque las fotos no tengan texto. ¿Qué concepto lo hace posible?
  opciones:
  - id: a
    texto: Extraer el texto de las fotos con reconocimiento óptico
  - id: b
    texto: Un modelo de difusión que genere fotos nuevas del sofá
  - id: c
    texto: Embeddings multimodales de texto e imagen
  - id: d
    texto: Dividir las descripciones en fragmentos (chunking)
  correctas:
  - c
  explicacion: Un modelo de embeddings multimodal representa texto e imágenes como vectores comparables, de modo
    que una descripción encuentra las imágenes de significado parecido.
  distractores:
    a: Las fotos no contienen texto que extraer.
    b: Generaría imágenes nuevas, no encontraría las fotos reales del catálogo.
    d: Sirve para documentos largos; no relaciona texto con imágenes.
  referencia: https://aws.amazon.com/what-is/embeddings-in-machine-learning/
- id: S-006
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo reentrena cada semana un modelo de precios con datos muy parecidos, y las predicciones cambian
    mucho de una versión a otra aunque todas aciertan casi siempre con los datos de entrenamiento. ¿Qué indica?
  opciones:
  - id: a
    texto: Un modelo equilibrado con datos ruidosos
  - id: b
    texto: 'Alta varianza: es muy sensible a los datos de entrenamiento'
  - id: c
    texto: 'Alto sesgo: el modelo es demasiado simple para captar los precios'
  - id: d
    texto: Deriva de datos en producción
  correctas:
  - b
  explicacion: 'La alta varianza (sobreajuste) hace que el modelo se ajuste al ruido de cada conjunto: acierta en
    entrenamiento y sus predicciones cambian mucho con pequeños cambios en los datos.'
  distractores:
    a: Un modelo equilibrado no cambiaría tanto con datos casi iguales.
    c: Un modelo con alto sesgo fallaría también con los datos de entrenamiento y sería estable entre versiones.
    d: Los datos de cada semana son muy parecidos; la inestabilidad viene del modelo.
  referencia: https://aws.amazon.com/what-is/overfitting/
- id: S-007
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Antes del asistente, preparar un informe costaba 12 minutos; con él, 8. Se preparan 3 000 informes
    al mes. ¿Cuántas horas al mes ahorra?
  opciones:
  - id: a
    texto: 600 horas
  - id: b
    texto: 40 horas
  - id: c
    texto: 200 horas
  - id: d
    texto: 400 horas
  correctas:
  - c
  explicacion: Ahorro = (12 − 8) × 3 000 = 12 000 minutos = 200 horas al mes. La productividad es una forma de comprobar
    si el modelo cumple los objetivos de negocio.
  distractores:
    a: Usa los 12 minutos iniciales como ahorro.
    b: Divide entre 300 en lugar de entre 60.
    d: Usa 8 minutos ahorrados en lugar de 4.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: S-008
  dominio: 5
  tarea: '5.1'
  objetivo: 5.1.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un equipo tiene cientos de tablas en S3 y quiere registrar automáticamente su ubicación y su esquema
    en el catálogo de datos, sin hacerlo a mano. ¿Qué usa?
  opciones:
  - id: a
    texto: AWS Lake Formation
  - id: b
    texto: Amazon Macie sobre los buckets de datos
  - id: c
    texto: Un rastreador (crawler) de AWS Glue
  - id: d
    texto: Amazon Bedrock Knowledge Bases
  correctas:
  - c
  explicacion: El AWS Glue Data Catalog se rellena con rastreadores que escanean las fuentes de datos y extraen
    sus metadatos (ubicación y esquema).
  distractores:
    a: Gestiona los permisos sobre los datos catalogados, no los descubre.
    b: Busca datos sensibles en S3, pero no rellena el catálogo de datos.
    d: Indexa documentos para RAG, no cataloga tablas.
  referencia: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
- id: S-009
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un conjunto de 200 000 transacciones tiene solo 2 000 fraudes, y el modelo apenas detecta la clase
    minoritaria. El equipo no puede conseguir más fraudes reales. ¿Qué acción sobre los datos ayuda?
  opciones:
  - id: a
    texto: Añadir más transacciones legítimas
  - id: b
    texto: Equilibrar las clases con remuestreo o dando más peso a la minoritaria
  - id: c
    texto: Eliminar la mitad de los fraudes para simplificar el conjunto
  - id: d
    texto: Mezclar datos de otro país con distinta normativa
  correctas:
  - b
  explicacion: Con un conjunto desequilibrado se equilibran las clases (sobremuestreo de la minoritaria, submuestreo
    de la mayoritaria o pesos), además de medir con métricas adecuadas como la exhaustividad.
  distractores:
    a: Aumentaría todavía más el desequilibrio.
    c: Agravaría el desequilibrio.
    d: Los datos no representativos del caso añaden ruido.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html
- id: S-010
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.5
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un agente tiene acceso a 40 herramientas y en cada petición recibe la descripción de todas. Elige herramientas
    equivocadas y el coste por petición es alto. ¿Qué técnica de ingeniería de contexto ayuda MÁS?
  opciones:
  - id: a
    texto: Ajustar el modelo con las 40 descripciones de herramientas
  - id: b
    texto: Enviar en cada petición solo las herramientas relevantes
  - id: c
    texto: Subir la temperatura para que explore más herramientas
  - id: d
    texto: Cambiar a un modelo con una ventana de contexto mayor
  correctas:
  - b
  explicacion: 'La ingeniería de contexto selecciona la información que llega al modelo: menos herramientas y más
    pertinentes mejoran la elección y reducen tokens.'
  distractores:
    a: Es caro y no reduce lo que se envía en cada petición.
    c: Aumentaría la aleatoriedad de la elección, no su acierto.
    d: Cabrían más descripciones, pero el exceso de contexto sigue confundiendo al modelo y cuesta más.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: S-011
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un equipo solo tiene un ejemplo aprobado del formato de informe que quiere y lo incluye en el prompt.
    ¿Qué técnica está usando?
  opciones:
  - id: a
    texto: One-shot (single-shot)
  - id: b
    texto: Few-shot
  - id: c
    texto: Chain-of-thought
  - id: d
    texto: Zero-shot
  correctas:
  - a
  explicacion: One-shot o single-shot incluye un único ejemplo en el prompt; few-shot, varios; zero-shot, ninguno.
  distractores:
    b: Incluiría varios ejemplos.
    c: Pide razonar paso a paso; no se basa en ejemplos.
    d: No incluiría ningún ejemplo.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
- id: S-012
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Una red social permite subir fotos a su asistente y quiere bloquear las que muestren violencia antes
    de que el modelo de Bedrock las procese. ¿Qué configuración usa?
  opciones:
  - id: a
    texto: El filtro de información sensible de Guardrails
  - id: b
    texto: Filtros de contenido de imágenes de Guardrails
  - id: c
    texto: La comprobación de grounding contextual
  - id: d
    texto: Un filtro de palabras con términos violentos
  correctas:
  - b
  explicacion: Los filtros de contenido de Guardrails también evalúan imágenes (PNG y JPEG) en categorías como violencia,
    odio o contenido sexual.
  distractores:
    a: Detecta datos personales, no violencia en imágenes.
    c: Compara respuestas con una fuente; no clasifica imágenes.
    d: Bloquea términos exactos en el texto; no analiza imágenes.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-mmfilter.html
- id: S-013
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un asistente responde bien a las preguntas, pero ignora que el cliente es premium y tiene condiciones
    especiales. ¿Qué componente del prompt falta?
  opciones:
  - id: a
    texto: El indicador de salida
  - id: b
    texto: La instrucción
  - id: c
    texto: El contexto
  - id: d
    texto: El prompt negativo
  correctas:
  - c
  explicacion: El contexto aporta la información de fondo que el modelo necesita (aquí, el tipo de cliente y sus
    condiciones) junto a la instrucción y los datos de entrada.
  distractores:
    a: Define el formato de la respuesta, no la información de fondo.
    b: 'La tarea ya está clara: el asistente responde bien a lo que se pregunta.'
    d: Indica lo que no se quiere; no aporta información del cliente.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/design-a-prompt.html
- id: S-014
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.6
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un cliente pide al agente de una aerolínea «cambia mi vuelo al viernes». El agente consulta el sistema de reservas y ve que el vuelo del viernes está lleno. ¿Qué hace a continuación un agente de IA bien diseñado?
  opciones:
  - id: a
    texto: Decide el siguiente paso a partir de ese resultado
  - id: b
    texto: Pasa la petición a un flujo fijo de Bedrock Flows
  - id: c
    texto: Vuelve a llamar a la misma herramienta hasta que haya plazas
  - id: d
    texto: Responde con lo que había planificado antes de consultar
  correctas:
  - a
  explicacion: 'Un agente sigue un ciclo de razonar, actuar con una herramienta, observar el resultado y volver a decidir. Si la herramienta devuelve que el vuelo está lleno, ese resultado cambia su plan: buscar otra opción o informar al cliente.'
  distractores:
    b: Un flujo fijo ejecuta siempre los mismos pasos; lo que caracteriza al agente es decidir según lo que observa.
    c: Repetir la misma llamada sin cambiar de plan no avanza hacia el objetivo y gasta tokens y peticiones.
    d: Ignorar lo que devuelve la herramienta rompe el ciclo de observar y decidir; respondería con información falsa.
  referencia: https://aws.amazon.com/what-is/ai-agents/
- id: S-015
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aseguradora quiere modernizar aplicaciones heredadas en .NET y mainframe con la ayuda de agentes
    de IA, en lugar de reescribirlas a mano. ¿Qué servicio de AWS está pensado para ello?
  opciones:
  - id: a
    texto: AWS Transform
  - id: b
    texto: Amazon SageMaker Canvas
  - id: c
    texto: Amazon Quick
  - id: d
    texto: Kiro
  correctas:
  - a
  explicacion: AWS Transform usa agentes de IA para acelerar la migración y modernización de aplicaciones, como
    .NET o mainframe.
  distractores:
    b: Sirve para crear modelos de ML sin código.
    c: Es un asistente para empleados sobre los datos de la empresa.
    d: Es un entorno de desarrollo agéntico basado en especificaciones, no un servicio de migración y modernización
      a escala.
  referencia: https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html
- id: S-016
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una pasarela de pagos quiere decidir en milisegundos si cada compra con tarjeta es sospechosa, a partir
    del historial de compras de cada cliente. ¿Qué aplicación de IA del mundo real es?
  opciones:
  - id: a
    texto: Sistema de recomendación
  - id: b
    texto: Detección de fraude
  - id: c
    texto: Previsión (forecasting)
  - id: d
    texto: Reconocimiento de voz
  correctas:
  - b
  explicacion: 'La detección de fraude es una de las aplicaciones reales de la IA que cita la guía: identificar
    operaciones que se apartan del comportamiento normal.'
  distractores:
    a: Sugiere productos a los clientes; no evalúa si una operación es sospechosa.
    c: Estima valores futuros, como la demanda; no evalúa cada operación.
    d: Convierte audio en texto; no analiza transacciones.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html
- id: S-068
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Dos cadenas hoteleras competidoras usan el mismo modelo base en Amazon Bedrock. Una de ellas va a ajustarlo con 20 000 respuestas a reseñas escritas por su equipo, y su director comercial teme que la otra cadena, al invocar ese mismo modelo base, reciba respuestas con el estilo y los datos de su empresa. ¿Qué ocurre al personalizar el modelo en Bedrock?
  opciones:
  - id: a
    texto: El ajuste se aplica al modelo base compartido, pero solo la cuenta de la cadena puede invocar la versión ajustada
  - id: b
    texto: El proveedor incorpora el ajuste a la siguiente versión del modelo base, sin conservar las reseñas originales
  - id: c
    texto: El ajuste queda aislado de los demás clientes solo si se contrata Provisioned Throughput para el modelo base
  - id: d
    texto: Bedrock entrena una copia aparte del modelo base, y el modelo base que invocan los demás clientes no cambia
  correctas:
  - d
  explicacion: 'Al personalizar un modelo, Amazon Bedrock hace una copia aparte del modelo base y entrena esa copia privada. El modelo base compartido no cambia, así que la otra cadena sigue recibiendo las respuestas del modelo original. Además, según AWS, el contenido del cliente no se usa para mejorar los modelos base ni se comparte con los proveedores de modelos: es uno de los beneficios de seguridad y privacidad de la infraestructura de AWS para la IA generativa.'
  distractores:
    a: 'El ajuste no se aplica al modelo base compartido: se entrena una copia privada, y el modelo base queda como estaba.'
    b: Según AWS, el contenido del cliente no se usa para mejorar los modelos base ni se comparte con los proveedores de modelos.
    c: Provisioned Throughput reserva capacidad de inferencia; no decide si el ajuste afecta a otros clientes, porque la copia privada se crea al personalizar el modelo, se contrate o no esa capacidad.
  referencia: https://aws.amazon.com/bedrock/faqs/
- id: S-066
  dominio: 1
  tarea: '1.1'
  objetivo: 1.1.3
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una mutua sanitaria despliega en Amazon SageMaker AI un modelo propio que extrae datos de informes médicos escaneados. Los informes llegan unas pocas veces al día, sin horario fijo, y cada uno tarda varios minutos en procesarse; otro sistema recoge cada resultado en cuanto está listo. Por su política de seguridad, el modelo debe ejecutarse con configuración de VPC. ¿Qué opción de inferencia es la MÁS rentable?
  opciones:
  - id: a
    texto: Inferencia en tiempo real con un endpoint permanente
  - id: b
    texto: Inferencia serverless, que escala a cero cuando no hay peticiones
  - id: c
    texto: Inferencia asíncrona con escalado automático a cero
  - id: d
    texto: Transformación por lotes una vez al día con los informes acumulados
  correctas:
  - c
  explicacion: La inferencia asíncrona encola las peticiones, admite tiempos de procesamiento de hasta una hora y puede escalar las instancias a cero cuando no hay nada que procesar, así que con pocas peticiones al día solo se paga mientras se procesan. Es un endpoint basado en instancias, de modo que admite la configuración de VPC del modelo (la inferencia serverless excluye la configuración de VPC y las GPU), y cada resultado se deja en Amazon S3 en cuanto termina.
  distractores:
    a: Admite VPC, pero cada invocación debe responder en 60 segundos y aquí cada informe tarda varios minutos; además, sus instancias se facturan mientras están en marcha aunque pasen horas sin informes.
    b: Escala a cero y se paga por uso, pero no admite configuración de VPC, que aquí es obligatoria, y cada invocación debe responder en 60 segundos, cuando cada informe tarda varios minutos.
    d: No necesita un endpoint persistente, pero los resultados llegarían una vez al día y no en cuanto cada informe estuviera listo.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
- id: S-019
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.6
  tipo: multiple_choice
  dificultad: media
  enunciado: 'El agente de reservas de una agencia de viajes debe colaborar con el agente de pagos de otro proveedor:
    descubrir qué sabe hacer y enviarle tareas. ¿Qué protocolo está pensado para ello?'
  opciones:
  - id: a
    texto: Model Context Protocol (MCP)
  - id: b
    texto: La API Converse de Amazon Bedrock
  - id: c
    texto: Agent2Agent (A2A)
  - id: d
    texto: Retrieval Augmented Generation (RAG)
  correctas:
  - c
  explicacion: A2A es un protocolo abierto para que agentes de distintos equipos o proveedores se descubran (Agent
    Card) y se intercambien mensajes y tareas.
  distractores:
    a: Conecta un agente con herramientas y fuentes de datos, no agentes entre sí.
    b: Es una interfaz para invocar modelos, no un protocolo entre agentes.
    d: Es una técnica para aportar información al prompt.
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-a2a.html
- id: S-020
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo tiene 4 000 pares de pregunta y respuesta revisados para ajustar un modelo en Amazon Bedrock. Quiere poder detectar si el modelo ajustado memoriza los ejemplos en lugar de generalizar. ¿Qué debe hacer al preparar los datos?
  opciones:
  - id: a
    texto: Usar los 4 000 pares para entrenar y medir la calidad con los mismos pares
  - id: b
    texto: Apartar una parte de los pares como conjunto de validación, sin usarla para entrenar
  - id: c
    texto: Duplicar los pares para que el modelo los vea más veces
  - id: d
    texto: Añadir texto sin etiquetar del dominio a los ficheros de entrenamiento
  correctas:
  - b
  explicacion: 'Un conjunto de validación separado permite comprobar cómo se comporta el modelo con ejemplos que no ha visto; si acierta mucho en entrenamiento y poco en validación, está sobreajustado.'
  distractores:
    a: Evaluar con los mismos datos de entrenamiento oculta el sobreajuste.
    c: Duplicar los ejemplos favorece justo la memorización que se quiere detectar.
    d: El texto sin etiquetar sirve para el preentrenamiento continuado, no para medir la generalización de un ajuste supervisado.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
- id: S-021
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Un proceso nocturno consume 1 000 millones de tokens al mes a un precio supuesto de 0,50 USD por millón
    bajo demanda. El modelo admite inferencia por lotes. ¿Cuánto costaría por lotes?
  opciones:
  - id: a
    texto: 125 USD
  - id: b
    texto: 500 USD
  - id: c
    texto: 875 USD
  - id: d
    texto: 250 USD
  correctas:
  - d
  explicacion: '1 000 millones × 0,50 USD por millón = 500 USD bajo demanda; la inferencia por lotes cuesta un 50
    % menos: 250 USD.'
  distractores:
    a: Aplica un 75 % de descuento, que no es el de la inferencia por lotes.
    b: Es el coste bajo demanda; por lotes cuesta un 50 % menos en los modelos que la admiten.
    c: Aplica un recargo del 75 %, propio del nivel Priority.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
- id: S-022
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una aplicación de noticias quiere ofrecer cada artículo también en audio, con voces naturales y sin
    grabar a locutores. ¿Qué servicio usa?
  opciones:
  - id: a
    texto: Amazon Transcribe
  - id: b
    texto: Amazon Translate
  - id: c
    texto: Amazon Lex
  - id: d
    texto: Amazon Polly
  correctas:
  - d
  explicacion: Amazon Polly convierte texto en voz realista.
  distractores:
    a: 'Hace lo contrario: convierte voz en texto.'
    b: Traduce texto; no lo convierte en voz.
    c: Crea interfaces conversacionales (bots); no genera audio a partir de artículos.
  referencia: https://docs.aws.amazon.com/polly/latest/dg/what-is.html
- id: S-023
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_response
  dificultad: alta
  enunciado: Una empresa lleva a producción un agente con Amazon Bedrock AgentCore. Necesita que recuerde las preferencias de cada usuario entre sesiones y que pueda llamar a sus APIs internas como herramientas MCP. ¿Qué DOS componentes de AgentCore resuelven esas dos necesidades?
  opciones:
  - id: a
    texto: AgentCore Observability
  - id: b
    texto: AgentCore Memory
  - id: c
    texto: AgentCore Runtime
  - id: d
    texto: AgentCore Gateway
  - id: e
    texto: AgentCore Identity
  correctas:
  - b
  - d
  explicacion: 'AgentCore Memory guarda la memoria a corto y largo plazo, como las preferencias del usuario entre sesiones, y AgentCore Gateway convierte APIs y funciones en herramientas compatibles con MCP.'
  distractores:
    a: Observability da las trazas y métricas de las ejecuciones, pero no guarda preferencias ni expone herramientas.
    c: Runtime ejecuta el agente de forma serverless y aislada; no aporta por sí solo la memoria entre sesiones ni las herramientas MCP.
    e: Identity gestiona las identidades y credenciales con las que el agente accede a otros servicios; no guarda preferencias ni convierte APIs en herramientas.
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
- id: S-024
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo necesita un asistente RAG en dos semanas. Construir su propia canalización de fragmentación,
    embeddings, índice y recuperación le llevaría meses. ¿Qué ventaja obtiene al usar Bedrock Knowledge Bases?
  opciones:
  - id: a
    texto: Que el modelo se reentrene con los documentos
  - id: b
    texto: Llegar antes al mercado al delegar ese trabajo
  - id: c
    texto: Que no se pague por las consultas ni por el almacenamiento vectorial
  - id: d
    texto: Que el asistente deje de necesitar evaluación
  correctas:
  - b
  explicacion: Los servicios gestionados reducen el trabajo de construir y operar piezas como la ingesta y la recuperación,
    lo que acelera la llegada al mercado, una de las ventajas que cita la guía.
  distractores:
    a: RAG no reentrena el modelo; añade fragmentos al prompt.
    c: Se paga la inferencia del modelo y el almacén vectorial elegido.
    d: Un RAG gestionado también hay que evaluarlo, por ejemplo con evaluaciones de RAG.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
- id: S-025
  dominio: 5
  tarea: '5.2'
  objetivo: 5.2.3
  tipo: multiple_response
  dificultad: media
  enunciado: Antes de lanzar un asistente para clientes, el comité de IA define su estrategia de revisión. ¿Qué
    DOS prácticas incluye? (Elige DOS.)
  opciones:
  - id: a
    texto: Revisar solo si llegan quejas tras el lanzamiento
  - id: b
    texto: Que el equipo que lo desarrolló apruebe su propio trabajo
  - id: c
    texto: Pruebas adversarias que intenten saltarse las salvaguardas
  - id: d
    texto: Lanzar sin documentar para iterar más rápido
  - id: e
    texto: Una revisión independiente de las evaluaciones críticas
  correctas:
  - c
  - e
  explicacion: Entre las estrategias de revisión están probar el sistema con ataques antes de lanzarlo y corroborar
    de forma independiente las evaluaciones críticas o subjetivas.
  distractores:
    a: 'Es reactivo: los problemas se descubren cuando ya afectan a clientes.'
    b: Falta independencia en las evaluaciones críticas.
    d: Incumple los estándares de transparencia y dificulta auditar.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raier01-bp02.html
- id: S-026
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo pide a un modelo, solo con ingeniería de prompts, que conteste sobre una normativa aprobada
    el mes pasado, posterior a su entrenamiento. Las respuestas son inventadas. ¿Qué limitación explica el fallo?
  opciones:
  - id: a
    texto: Falta un prompt negativo que prohíba inventar
  - id: b
    texto: La temperatura del modelo es demasiado baja
  - id: c
    texto: El modelo está sufriendo una inyección de prompts
  - id: d
    texto: Un prompt no añade conocimiento nuevo
  correctas:
  - d
  explicacion: 'Una limitación de la ingeniería de prompts es que no añade conocimiento: si el modelo no tiene la
    información, hay que dársela en el contexto (por ejemplo, con RAG) o adaptarlo.'
  distractores:
    a: Prohibir respuestas no le da la información que necesita.
    b: No hace que el modelo conozca una norma posterior a su entrenamiento.
    c: No hay ninguna instrucción maliciosa en el escenario.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
- id: S-027
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo ajusta un modelo y reserva una parte de los datos que no usa para entrenar. ¿Para qué sirve
    ese conjunto de validación?
  opciones:
  - id: a
    texto: Cifrar los datos del trabajo de ajuste
  - id: b
    texto: Aumentar el volumen de datos de entrenamiento
  - id: c
    texto: Guardar las respuestas del modelo en producción
  - id: d
    texto: Medir la calidad y detectar sobreajuste
  correctas:
  - d
  explicacion: El conjunto de validación mide el modelo con datos que no ha visto durante el entrenamiento; si el
    error de validación empeora mientras el de entrenamiento mejora, hay sobreajuste.
  distractores:
    a: El cifrado lo hace AWS KMS, no un conjunto de datos.
    b: Precisamente no se usa para entrenar.
    c: Eso es el registro de invocaciones.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
- id: S-028
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo explica con SHAP las predicciones de una red neuronal profunda de riesgo de crédito. ¿Qué
    precaución recomienda la guía de AWS?
  opciones:
  - id: a
    texto: Pueden engañar si las variables interactúan mucho
  - id: b
    texto: Tratarlas como la lógica exacta del modelo
  - id: c
    texto: Sustituir el modelo por SHAP en producción
  - id: d
    texto: Usarlas solo para modelos lineales
  correctas:
  - a
  explicacion: La guía prescriptiva de AWS advierte de que las atribuciones SHAP pueden engañar al estimar la importancia
    de las variables cuando hay interacciones fuertes entre ellas.
  distractores:
    b: SHAP es una explicación a posteriori y aproximada, no la lógica interna del modelo.
    c: SHAP explica un modelo; no predice por sí mismo.
    d: En los modelos lineales los coeficientes ya explican; SHAP se usa sobre todo con modelos complejos.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/faq.html
- id: S-029
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa de defensa necesita un modelo generativo que funcione en sus instalaciones sin conexión
    a Internet. ¿Qué factor de selección es el decisivo?
  opciones:
  - id: a
    texto: Un modelo de pesos abiertos autoalojable
  - id: b
    texto: La disponibilidad por API en Amazon Bedrock
  - id: c
    texto: La mayor ventana de contexto disponible
  - id: d
    texto: El menor precio por token del mercado
  correctas:
  - a
  explicacion: 'Las restricciones del caso (aquí, funcionar sin conexión) son un factor de selección: obligan a
    un modelo cuyos pesos se puedan desplegar en infraestructura propia.'
  distractores:
    b: Un servicio por API necesita conexión con AWS.
    c: No resuelve la restricción de funcionar sin conexión.
    d: El precio por token no importa si no se puede usar sin conexión.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: S-030
  dominio: 5
  tarea: '5.1'
  objetivo: 5.1.3
  tipo: multiple_response
  dificultad: baja
  enunciado: Un equipo va a entrenar un modelo de abandono de clientes con una base de datos de 60 columnas, incluidos
    el DNI y la dirección. ¿Qué DOS prácticas de privacidad aplica? (Elige DOS.)
  opciones:
  - id: a
    texto: Sustituir los identificadores por códigos
  - id: b
    texto: Publicar el conjunto para que lo revise un tercero
  - id: c
    texto: Usar solo las columnas que el modelo necesita
  - id: d
    texto: Dar acceso de lectura a toda la empresa
  - id: e
    texto: Copiar las 60 columnas por si son útiles más adelante
  correctas:
  - a
  - c
  explicacion: 'La minimización y la seudonimización son técnicas de mejora de la privacidad: no usar datos que
    la tarea no necesita y reducir la identificabilidad de lo que se usa.'
  distractores:
    b: Expondría datos personales.
    d: Va contra el control de acceso a los datos.
    e: Aumenta el riesgo sin beneficio para el modelo.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp02-bp02.html
- id: S-031
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una marca publica en redes sociales fotos de producto generadas con IA sin indicarlo. Cuando se descubre,
    muchos clientes reaccionan mal. ¿Qué riesgo se materializó y qué lo habría mitigado?
  opciones:
  - id: a
    texto: Infracción de propiedad intelectual; usar la temperatura más baja
  - id: b
    texto: Alucinación; añadir RAG con el catálogo
  - id: c
    texto: Sesgo; analizar los resultados por subgrupos
  - id: d
    texto: Pérdida de confianza; indicar que el contenido está generado con IA
  correctas:
  - d
  explicacion: La pérdida de confianza de los clientes es uno de los riesgos de la IA generativa; la transparencia
    sobre el uso de la IA lo reduce.
  distractores:
    a: No se describe ninguna obra de terceros, y la temperatura no protege derechos.
    b: Las fotos no contienen datos falsos sobre el producto; el problema es no haberlo comunicado.
    c: No hay un trato desigual entre grupos.
  referencia: https://aws.amazon.com/ai/responsible-ai/policy/
- id: S-032
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.3
  tipo: multiple_response
  dificultad: media
  enunciado: Una cadena de electrodomésticos estudia dónde aplicar RAG en lugar de ajuste fino. ¿Qué DOS casos encajan
    mejor con RAG? (Elige DOS.)
  opciones:
  - id: a
    texto: Un buscador de productos con precios y existencias actualizados
  - id: b
    texto: Un asistente sobre condiciones de garantía que cambian cada mes, con citas
  - id: c
    texto: Reducir la latencia de un modelo grande
  - id: d
    texto: Que el modelo devuelva un formato fijo de etiqueta
  - id: e
    texto: Que el asistente escriba con el tono desenfadado de la marca
  correctas:
  - a
  - b
  explicacion: RAG brilla cuando la información es propia, cambia a menudo y conviene citar la fuente; el ajuste
    fino, cuando hay que cambiar el estilo o el comportamiento.
  distractores:
    c: RAG añade un paso de recuperación; no reduce la latencia.
    d: Es una tarea de formato, propia de prompts o ajuste fino.
    e: El tono y el estilo se consiguen con prompts o ajuste fino, no aportando documentos.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
- id: S-033
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: El equipo de calidad de un banco necesita cientos de conversaciones de clientes ficticias y variadas
    para probar su nuevo canal de chat, sin usar datos reales. ¿Qué ventaja de la IA generativa aprovecha?
  opciones:
  - id: a
    texto: La capacidad de generar contenido nuevo
  - id: b
    texto: La exactitud de los cálculos numéricos
  - id: c
    texto: El determinismo de las respuestas
  - id: d
    texto: La interpretabilidad de sus decisiones
  correctas:
  - a
  explicacion: Generar contenido nuevo (texto, imágenes, código, datos de prueba) es una de las ventajas que cita
    la guía, junto con la adaptabilidad, la capacidad de respuesta y las capacidades conversacionales.
  distractores:
    b: La inexactitud es una de sus desventajas.
    c: La IA generativa no es determinista; aquí interesa la variedad.
    d: Es una de sus desventajas, no lo que se aprovecha aquí.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: S-034
  dominio: 5
  tarea: '5.2'
  objetivo: 5.2.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un agente de atención en producción a veces llama a una herramienta equivocada. El equipo necesita ver, para cada petición, qué pasos dio el agente, qué herramientas invocó y con qué resultado. ¿Qué estrategia de gobierno de datos lo resuelve?
  opciones:
  - id: a
    texto: Retención de los registros de la aplicación durante más tiempo
  - id: b
    texto: Residencia de los datos en una sola Región
  - id: c
    texto: Observación con las trazas del agente
  - id: d
    texto: Ciclo de vida de los datos con S3 Lifecycle
  correctas:
  - c
  explicacion: 'La observación muestra qué hace el sistema por dentro: las trazas de un agente registran sus pasos, las herramientas que invoca y lo que devuelven, por ejemplo con la observabilidad de AgentCore.'
  distractores:
    a: Guardar los registros más tiempo no aporta el detalle de los pasos internos del agente si no se capturan.
    b: La residencia decide dónde se almacenan los datos, no qué pasos da el agente.
    d: El ciclo de vida decide cuándo se archivan o borran los datos, no permite ver la ejecución del agente.
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability.html
- id: S-035
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.6
  tipo: multiple_choice
  dificultad: media
  enunciado: Una startup necesita clasificar desde esta semana los correos de sus clientes en tres categorías. No
    tiene ningún correo etiquetado ni equipo de ML. ¿Qué enfoque es el más adecuado?
  opciones:
  - id: a
    texto: Un modelo fundacional con un prompt de clasificación y algunos ejemplos
  - id: b
    texto: Agrupar los correos con un algoritmo de clustering
  - id: c
    texto: Entrenar un clasificador tradicional con algoritmos integrados de SageMaker AI
  - id: d
    texto: Preentrenar un modelo de lenguaje propio
  correctas:
  - a
  explicacion: Sin datos etiquetados ni tiempo, un modelo fundacional resuelve la clasificación con instrucciones
    y pocos ejemplos en el prompt. Cuando haya datos y volumen, un modelo tradicional puede ser más barato.
  distractores:
    b: Descubre grupos, pero no los asigna a las tres categorías definidas.
    c: Necesitaría miles de correos etiquetados y un equipo de ML que no tienen.
    d: Es la opción más costosa y lenta, y tampoco hay datos.
  referencia: https://docs.aws.amazon.com/decision-guides/latest/machine-learning-on-aws-how-to-choose/guide.html
- id: S-036
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: multiple_response
  dificultad: media
  enunciado: Una consultora quiere que su nuevo asistente tenga la menor huella ambiental posible. ¿Qué DOS decisiones
    son las más responsables? (Elige DOS.)
  opciones:
  - id: a
    texto: Elegir el modelo con más parámetros para no quedarse corto
  - id: b
    texto: Partir de un modelo preentrenado en lugar de entrenar uno desde cero
  - id: c
    texto: Comparar candidatos y quedarse con el más pequeño que cumple
  - id: d
    texto: Entrenar su propio modelo para controlar la eficiencia
  - id: e
    texto: Mantener una réplica encendida en otra Región como reserva
  correctas:
  - b
  - c
  explicacion: Las prácticas de sostenibilidad de AWS para IA generativa recomiendan reutilizar modelos y elegir
    el del tamaño justo, además de evitar recursos ociosos.
  distractores:
    a: Un modelo mayor de lo necesario consume más en cada inferencia.
    d: El preentrenamiento tiene una huella enorme frente a reutilizar un modelo existente.
    e: Deja capacidad ociosa que consume energía sin necesidad.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/sustainability.html
- id: S-037
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un asistente de reservas da respuestas correctas, pero cambia de respuesta cuando el cliente escribe
    con faltas de ortografía o con sinónimos. ¿Qué rasgo de la IA responsable falla?
  opciones:
  - id: a
    texto: La transparencia
  - id: b
    texto: La equidad
  - id: c
    texto: La robustez
  - id: d
    texto: La controlabilidad
  correctas:
  - c
  explicacion: La robustez es mantener salidas correctas ante variaciones de la entrada, como erratas o sinónimos,
    y ante entradas maliciosas.
  distractores:
    a: Trata de informar sobre el sistema; no explica que la respuesta cambie con una errata.
    b: Trata del trato a los distintos grupos de personas, no de variaciones en la forma de escribir.
    d: Trata de poder supervisar y dirigir el sistema.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: S-067
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.3
  tipo: multiple_choice
  dificultad: media
  enunciado: 'Una inmobiliaria ajustó un modelo de Amazon Bedrock con 1 500 contratos de alquiler para que redacte con el formato y el estilo de la casa. Tras cuatro meses en producción, los gestores marcan como incorrectos casi todos los borradores de alquiler de temporada, un contrato que la inmobiliaria empezó a ofrecer después del ajuste: no siguen las cláusulas ni el formato que exige. Mejorar el prompt no ha bastado. ¿Por qué etapa del ciclo de vida del modelo fundacional debe empezar la siguiente iteración?'
  opciones:
  - id: a
    texto: Preentrenamiento, con un corpus masivo que incluya los contratos de temporada
  - id: b
    texto: Evaluación, añadiendo contratos de temporada al conjunto de prueba antes de volver a desplegar el mismo modelo
  - id: c
    texto: Selección del modelo, cambiando a un modelo base más grande que se use sin ajuste
  - id: d
    texto: Selección de datos, reuniendo y revisando ejemplos de contratos de temporada para otra ronda de ajuste
  correctas:
  - d
  explicacion: 'La retroalimentación cierra el ciclo: las correcciones de los usuarios muestran qué le falta al modelo. El fallo está en las cláusulas y el formato de un tipo de contrato posterior al ajuste, y el prompt no basta, así que la siguiente iteración empieza por seleccionar y depurar ejemplos etiquetados de ese contrato; después vienen el ajuste fino, la evaluación y el despliegue de la nueva versión.'
  distractores:
    a: El preentrenamiento es la etapa más cara, con meses de trabajo y datos masivos, y la hace el proveedor del modelo; para un tipo de contrato nuevo basta con ajustar el modelo que ya se usa.
    b: Ampliar la evaluación mide mejor el fallo, pero no lo corrige, porque el modelo desplegado seguiría siendo el mismo.
    c: Un modelo base, aunque sea más grande, no conoce el formato propio de la inmobiliaria, y se perdería el ajuste que ya funciona con los demás contratos.
  referencia: https://aws.amazon.com/what-is/foundation-models/
- id: S-039
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.5
  tipo: multiple_response
  dificultad: alta
  enunciado: Un equipo duda entre añadir 10 ejemplos few-shot a cada prompt o ajustar el modelo. Recibe 2 millones
    de peticiones al mes. ¿Qué DOS afirmaciones sobre el coste son correctas? (Elige DOS.)
  opciones:
  - id: a
    texto: Tras el ajuste solo se paga la inferencia, como con el modelo base
  - id: b
    texto: Few-shot exige crear y almacenar un modelo personalizado
  - id: c
    texto: Few-shot reduce los tokens de entrada de cada petición
  - id: d
    texto: El ajuste fino tiene un coste inicial y permite prompts más cortos
  - id: e
    texto: Few-shot no tiene coste de entrenamiento, pero añade tokens a cada petición
  correctas:
  - d
  - e
  explicacion: El aprendizaje en contexto se paga en cada petición; el ajuste fino concentra el coste al principio
    (más almacenamiento e inferencia del modelo personalizado). A gran volumen conviene comparar ambos.
  distractores:
    a: También se paga el almacenamiento mensual del modelo personalizado.
    b: Few-shot solo cambia el prompt; no crea ningún modelo.
    c: Los ejemplos se envían en cada petición, así que los aumentan.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
- id: S-040
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.1
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo quiere que 3 evaluadores propios valoren 500 respuestas en una evaluación humana de Amazon
    Bedrock. Si cada valoración es una tarea, ¿cuánto se paga por las tareas humanas, sin contar la inferencia?
  opciones:
  - id: a
    texto: 0 USD
  - id: b
    texto: 105 USD
  - id: c
    texto: 1 500 USD
  - id: d
    texto: 315 USD
  correctas:
  - d
  explicacion: 'La página de precios de Bedrock indica 0,21 USD por tarea humana completada en evaluaciones con
    equipo propio: 500 × 3 × 0,21 = 315 USD, más la inferencia del modelo.'
  distractores:
    a: Con trabajadores propios Bedrock cobra igualmente cada tarea humana completada.
    b: Cuenta un solo evaluador por respuesta (500 × 0,21).
    c: Paga 1 USD por tarea en lugar de 0,21.
  referencia: https://aws.amazon.com/bedrock/pricing/
- id: S-041
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo configura una evaluación programática de Amazon Bedrock para la tarea de preguntas y respuestas.
    ¿Qué métrica de exactitud usa el servicio en esa tarea?
  opciones:
  - id: a
    texto: BLEU
  - id: b
    texto: F1
  - id: c
    texto: ROUGE
  - id: d
    texto: BERTScore
  correctas:
  - b
  explicacion: En las evaluaciones programáticas, Bedrock mide la exactitud de preguntas y respuestas con F1 y la
    de los resúmenes con BERTScore.
  distractores:
    a: Es propia de la traducción.
    c: Es la métrica clásica de resúmenes, no la que usa Bedrock para preguntas y respuestas.
    d: Bedrock la usa en la tarea de resumen.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
- id: S-042
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un despacho quiere que un modelo redacte informes de unas 20 páginas en una sola respuesta. ¿Qué característica
