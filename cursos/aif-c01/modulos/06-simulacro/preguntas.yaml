- id: S-046
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.2
  tipo: multiple_response
  dificultad: media
  enunciado: Un equipo debate qué técnicas modifican los pesos del modelo y cuáles no. ¿Qué DOS técnicas cambian
