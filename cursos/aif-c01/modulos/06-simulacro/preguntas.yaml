  prompts:
  - id: '1'
    texto: Ejecutar el agente de forma serverless y aislada
  - id: '2'
    texto: Recordar las preferencias del usuario entre sesiones
  - id: '3'
    texto: Convertir APIs internas en herramientas MCP
  - id: '4'
