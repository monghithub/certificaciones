  - id: b
    texto: Limpiar valores ausentes y duplicados
  - id: c
    texto: Recoger los datos de ventas de las tiendas
  - id: d
    texto: Calcular la normalización solo con los datos de entrenamiento
  correctas:
  - c
  - b
  - a
  - d
