  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html
- id: S-048
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Un grupo quiere usar el mismo asistente para RR. HH., finanzas y asuntos legales, pero solo lo ha probado
