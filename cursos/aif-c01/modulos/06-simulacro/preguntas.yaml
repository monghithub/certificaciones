  - id: c
    texto: Un trail con eventos de datos
  - id: d
    texto: Activar AWS Config en la cuenta
  correctas:
  - c
  explicacion: 'Bedrock registra Retrieve y RetrieveAndGenerate como eventos de datos de CloudTrail: hay que configurar
