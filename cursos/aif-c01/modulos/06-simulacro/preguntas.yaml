  opciones:
  - id: a
    texto: Indicar con precisión qué se pide y la extensión
  - id: b
    texto: Repetir la instrucción varias veces en mayúsculas
  - id: c
    texto: Añadir más documentos al prompt por si acaso
  - id: d
    texto: Eliminar el texto que no aporta a la tarea
  - id: e
    texto: Subir la temperatura para que explore más
  correctas:
  - a
  - d
  explicacion: 'La guía cita la especificidad y la concisión entre las buenas prácticas: menos ruido y peticiones
