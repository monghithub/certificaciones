- id: S-049
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.1
  tipo: multiple_response
  dificultad: media
  enunciado: Una cadena de tiendas con 5 millones de clientes estudia usar ML para personalizar las ofertas, algo
