- id: S-001
  dominio: 1
  tarea: '1.1'
  objetivo: 1.1.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un banco quiere predecir si un nuevo préstamo se pagará a tiempo. Dispone de diez años de préstamos
    con su resultado final conocido (pagado o impagado). ¿Qué tipo de aprendizaje encaja?
  opciones:
  - id: a
    texto: Aprendizaje no supervisado
  - id: b
    texto: Aprendizaje por refuerzo
  - id: c
    texto: Aprendizaje supervisado
  - id: d
    texto: Aprendizaje autosupervisado
  correctas:
  - c
  explicacion: Con ejemplos históricos etiquetados con el resultado que se quiere predecir, el problema es de aprendizaje
    supervisado (clasificación).
  distractores:
    a: Busca estructura en datos sin etiquetar; aquí cada préstamo tiene su resultado conocido.
    b: Aprende acciones por recompensas en un entorno; no predice un resultado a partir de ejemplos etiquetados.
    d: Genera sus propias etiquetas a partir de los datos, como en el preentrenamiento de los modelos de lenguaje;
      aquí las etiquetas ya existen.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html
- id: S-002
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.6
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un modelo de cribado médico se prueba con 1 000 pacientes, de los que 50 están enfermos. Detecta a
    45 de ellos y además marca como enfermos a 100 pacientes sanos. ¿Cuál es su exhaustividad (recall)?
  opciones:
  - id: a
    texto: 0,90
  - id: b
    texto: 0,31
  - id: c
    texto: 0,46
  - id: d
    texto: 0,895
  correctas:
  - a
  explicacion: Exhaustividad = VP / (VP + FN) = 45 / (45 + 5) = 0,90. En un cribado interesa que se escapen pocos
    enfermos, aunque la precisión sea baja.
  distractores:
    b: 'Es la precisión: 45 / (45 + 100).'
    c: Es la puntuación F1, la media armónica de la precisión (0,31) y la exhaustividad (0,90).
    d: 'Es la exactitud: (45 + 850) / 1 000.'
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html
- id: S-003
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Un asistente recibe 1 millón de peticiones al mes. El equipo reduce la respuesta media de 800 a 400
    tokens. Con un precio supuesto de 3 USD por millón de tokens de salida, ¿cuánto ahorra al mes?
  opciones:
  - id: a
    texto: 120 USD
  - id: b
    texto: 1 200 USD
  - id: c
    texto: 2 400 USD
  - id: d
    texto: 600 USD
  correctas:
  - b
  explicacion: Ahorro = 1 000 000 × (800 − 400) = 400 millones de tokens de salida × 3 USD por millón = 1 200 USD.
    Controlar la longitud de salida es una palanca directa de coste.
  distractores:
    a: Equivale a dividir el ahorro entre diez por error.
    c: Es el coste total de la salida antes del cambio (800 millones de tokens × 3 USD), no el ahorro.
    d: Aplica la mitad del precio; el ahorro son 400 millones de tokens al precio completo.
  referencia: https://aws.amazon.com/bedrock/pricing/
- id: S-004
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.5
  tipo: matching
  dificultad: media
  enunciado: Empareja cada forma de adaptar un modelo fundacional con el coste que la caracteriza.
  prompts:
  - id: '1'
    texto: Ingeniería de prompts
  - id: '2'
    texto: RAG
  - id: '3'
    texto: Ajuste fino
  - id: '4'
    texto: Preentrenamiento
  opciones:
  - id: a
    texto: Una licencia perpetua del modelo base
  - id: b
    texto: Solo el esfuerzo de redactar y probar mejores prompts
  - id: c
    texto: Enormes volúmenes de datos y meses de cómputo
  - id: d
    texto: Entrenamiento, almacenamiento mensual del modelo e inferencia
  - id: e
    texto: Tokens extra en cada consulta más el almacén vectorial
  correctas:
  - - '1'
    - b
  - - '2'
    - e
  - - '3'
    - d
  - - '4'
    - c
  explicacion: 'De menor a mayor coste: prompts, RAG, ajuste fino y preentrenamiento. RAG se paga sobre todo por
    consulta; el ajuste fino concentra el coste al entrenar.'
  distractores:
    a: Ninguna de estas formas de adaptación consiste en comprar una licencia perpetua; en Bedrock se paga por uso
      (tokens, entrenamiento, almacenamiento del modelo personalizado).
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: S-005
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Una tienda de muebles quiere que sus clientes encuentren fotos de productos escribiendo una descripción,
    por ejemplo «sofá de terciopelo verde», aunque las fotos no tengan texto. ¿Qué concepto lo hace posible?
  opciones:
  - id: a
    texto: Extraer el texto de las fotos con reconocimiento óptico
  - id: b
    texto: Un modelo de difusión que genere fotos nuevas del sofá
  - id: c
    texto: Embeddings multimodales de texto e imagen
  - id: d
    texto: Dividir las descripciones en fragmentos (chunking)
  correctas:
  - c
  explicacion: Un modelo de embeddings multimodal representa texto e imágenes como vectores comparables, de modo
    que una descripción encuentra las imágenes de significado parecido.
  distractores:
    a: Las fotos no contienen texto que extraer.
    b: Generaría imágenes nuevas, no encontraría las fotos reales del catálogo.
    d: Sirve para documentos largos; no relaciona texto con imágenes.
  referencia: https://aws.amazon.com/what-is/embeddings-in-machine-learning/
- id: S-006
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo reentrena cada semana un modelo de precios con datos muy parecidos, y las predicciones cambian
    mucho de una versión a otra aunque todas aciertan casi siempre con los datos de entrenamiento. ¿Qué indica?
  opciones:
  - id: a
    texto: Un modelo equilibrado con datos ruidosos
  - id: b
    texto: 'Alta varianza: es muy sensible a los datos de entrenamiento'
  - id: c
    texto: 'Alto sesgo: el modelo es demasiado simple para captar los precios'
  - id: d
    texto: Deriva de datos en producción
  correctas:
  - b
  explicacion: 'La alta varianza (sobreajuste) hace que el modelo se ajuste al ruido de cada conjunto: acierta en
    entrenamiento y sus predicciones cambian mucho con pequeños cambios en los datos.'
  distractores:
    a: Un modelo equilibrado no cambiaría tanto con datos casi iguales.
    c: Un modelo con alto sesgo fallaría también con los datos de entrenamiento y sería estable entre versiones.
    d: Los datos de cada semana son muy parecidos; la inestabilidad viene del modelo.
  referencia: https://aws.amazon.com/what-is/overfitting/
- id: S-007
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Antes del asistente, preparar un informe costaba 12 minutos; con él, 8. Se preparan 3 000 informes
    al mes. ¿Cuántas horas al mes ahorra?
  opciones:
  - id: a
    texto: 600 horas
  - id: b
    texto: 40 horas
  - id: c
    texto: 200 horas
  - id: d
    texto: 400 horas
  correctas:
  - c
  explicacion: Ahorro = (12 − 8) × 3 000 = 12 000 minutos = 200 horas al mes. La productividad es una forma de comprobar
    si el modelo cumple los objetivos de negocio.
  distractores:
    a: Usa los 12 minutos iniciales como ahorro.
    b: Divide entre 300 en lugar de entre 60.
    d: Usa 8 minutos ahorrados en lugar de 4.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: S-008
  dominio: 5
  tarea: '5.1'
  objetivo: 5.1.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un equipo tiene cientos de tablas en S3 y quiere registrar automáticamente su ubicación y su esquema
    en el catálogo de datos, sin hacerlo a mano. ¿Qué usa?
  opciones:
  - id: a
    texto: AWS Lake Formation
  - id: b
    texto: Amazon Macie sobre los buckets de datos
  - id: c
    texto: Un rastreador (crawler) de AWS Glue
  - id: d
    texto: Amazon Bedrock Knowledge Bases
  correctas:
  - c
  explicacion: El AWS Glue Data Catalog se rellena con rastreadores que escanean las fuentes de datos y extraen
    sus metadatos (ubicación y esquema).
  distractores:
    a: Gestiona los permisos sobre los datos catalogados, no los descubre.
    b: Busca datos sensibles en S3, pero no rellena el catálogo de datos.
    d: Indexa documentos para RAG, no cataloga tablas.
  referencia: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html
- id: S-009
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un conjunto de 200 000 transacciones tiene solo 2 000 fraudes, y el modelo apenas detecta la clase
    minoritaria. El equipo no puede conseguir más fraudes reales. ¿Qué acción sobre los datos ayuda?
  opciones:
  - id: a
    texto: Añadir más transacciones legítimas
  - id: b
    texto: Equilibrar las clases con remuestreo o dando más peso a la minoritaria
  - id: c
    texto: Eliminar la mitad de los fraudes para simplificar el conjunto
  - id: d
    texto: Mezclar datos de otro país con distinta normativa
  correctas:
  - b
  explicacion: Con un conjunto desequilibrado se equilibran las clases (sobremuestreo de la minoritaria, submuestreo
    de la mayoritaria o pesos), además de medir con métricas adecuadas como la exhaustividad.
  distractores:
    a: Aumentaría todavía más el desequilibrio.
    c: Agravaría el desequilibrio.
    d: Los datos no representativos del caso añaden ruido.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html
- id: S-010
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.5
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un agente tiene acceso a 40 herramientas y en cada petición recibe la descripción de todas. Elige herramientas
    equivocadas y el coste por petición es alto. ¿Qué técnica de ingeniería de contexto ayuda MÁS?
  opciones:
  - id: a
    texto: Ajustar el modelo con las 40 descripciones de herramientas
  - id: b
    texto: Enviar en cada petición solo las herramientas relevantes
  - id: c
    texto: Subir la temperatura para que explore más herramientas
  - id: d
    texto: Cambiar a un modelo con una ventana de contexto mayor
  correctas:
  - b
  explicacion: 'La ingeniería de contexto selecciona la información que llega al modelo: menos herramientas y más
    pertinentes mejoran la elección y reducen tokens.'
  distractores:
    a: Es caro y no reduce lo que se envía en cada petición.
    c: Aumentaría la aleatoriedad de la elección, no su acierto.
    d: Cabrían más descripciones, pero el exceso de contexto sigue confundiendo al modelo y cuesta más.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: S-011
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un equipo solo tiene un ejemplo aprobado del formato de informe que quiere y lo incluye en el prompt.
    ¿Qué técnica está usando?
  opciones:
  - id: a
    texto: One-shot (single-shot)
  - id: b
    texto: Few-shot
  - id: c
    texto: Chain-of-thought
  - id: d
    texto: Zero-shot
  correctas:
  - a
  explicacion: One-shot o single-shot incluye un único ejemplo en el prompt; few-shot, varios; zero-shot, ninguno.
  distractores:
    b: Incluiría varios ejemplos.
    c: Pide razonar paso a paso; no se basa en ejemplos.
    d: No incluiría ningún ejemplo.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
- id: S-012
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Una red social permite subir fotos a su asistente y quiere bloquear las que muestren violencia antes
    de que el modelo de Bedrock las procese. ¿Qué configuración usa?
  opciones:
  - id: a
    texto: El filtro de información sensible de Guardrails
  - id: b
    texto: Filtros de contenido de imágenes de Guardrails
  - id: c
    texto: La comprobación de grounding contextual
  - id: d
    texto: Un filtro de palabras con términos violentos
  correctas:
  - b
  explicacion: Los filtros de contenido de Guardrails también evalúan imágenes (PNG y JPEG) en categorías como violencia,
    odio o contenido sexual.
  distractores:
    a: Detecta datos personales, no violencia en imágenes.
    c: Compara respuestas con una fuente; no clasifica imágenes.
    d: Bloquea términos exactos en el texto; no analiza imágenes.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-mmfilter.html
- id: S-013
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un asistente responde bien a las preguntas, pero ignora que el cliente es premium y tiene condiciones
    especiales. ¿Qué componente del prompt falta?
  opciones:
  - id: a
    texto: El indicador de salida
  - id: b
    texto: La instrucción
  - id: c
    texto: El contexto
  - id: d
    texto: El prompt negativo
  correctas:
  - c
  explicacion: El contexto aporta la información de fondo que el modelo necesita (aquí, el tipo de cliente y sus
    condiciones) junto a la instrucción y los datos de entrada.
  distractores:
    a: Define el formato de la respuesta, no la información de fondo.
    b: 'La tarea ya está clara: el asistente responde bien a lo que se pregunta.'
    d: Indica lo que no se quiere; no aporta información del cliente.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/design-a-prompt.html
- id: S-014
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.6
  tipo: ordering
  dificultad: media
  enunciado: Ordena el ciclo que sigue un agente de IA para resolver la petición «cambia mi vuelo al viernes».
  opciones:
  - id: a
    texto: Observar el resultado y responder al usuario
  - id: b
    texto: Razonar y decidir qué herramienta usar
  - id: c
    texto: Invocar la herramienta de reservas
  - id: d
    texto: Recibir el objetivo del usuario
  correctas:
  - d
  - b
  - c
  - a
  explicacion: Un agente recibe el objetivo, razona y planifica, actúa con herramientas, observa el resultado y
    responde (o vuelve a razonar si hace falta otro paso).
  referencia: https://aws.amazon.com/what-is/ai-agents/
- id: S-015
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aseguradora quiere modernizar aplicaciones heredadas en .NET y mainframe con la ayuda de agentes
    de IA, en lugar de reescribirlas a mano. ¿Qué servicio de AWS está pensado para ello?
  opciones:
  - id: a
    texto: AWS Transform
  - id: b
    texto: Amazon SageMaker Canvas
  - id: c
    texto: Amazon Quick
  - id: d
    texto: Kiro
  correctas:
  - a
  explicacion: AWS Transform usa agentes de IA para acelerar la migración y modernización de aplicaciones, como
    .NET o mainframe.
  distractores:
    b: Sirve para crear modelos de ML sin código.
    c: Es un asistente para empleados sobre los datos de la empresa.
    d: Es un entorno de desarrollo agéntico basado en especificaciones, no un servicio de migración y modernización
      a escala.
  referencia: https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html
- id: S-016
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una pasarela de pagos quiere decidir en milisegundos si cada compra con tarjeta es sospechosa, a partir
    del historial de compras de cada cliente. ¿Qué aplicación de IA del mundo real es?
  opciones:
  - id: a
    texto: Sistema de recomendación
  - id: b
    texto: Detección de fraude
  - id: c
    texto: Previsión (forecasting)
  - id: d
    texto: Reconocimiento de voz
  correctas:
  - b
  explicacion: 'La detección de fraude es una de las aplicaciones reales de la IA que cita la guía: identificar
    operaciones que se apartan del comportamiento normal.'
  distractores:
    a: Sugiere productos a los clientes; no evalúa si una operación es sospechosa.
    c: Estima valores futuros, como la demanda; no evalúa cada operación.
    d: Convierte audio en texto; no analiza transacciones.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html
- id: S-017
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa contrata Provisioned Throughput para un modelo a un precio supuesto de 20 USD por hora
    y lo usa solo 8 horas los días laborables, pero lo mantiene contratado todo el mes. ¿Cuánto paga en un mes de
    730 horas?
  opciones:
  - id: a
    texto: 160 USD
  - id: b
    texto: 3 520 USD
  - id: c
    texto: 4 867 USD
  - id: d
    texto: 14 600 USD
  correctas:
  - d
  explicacion: 'Provisioned Throughput se factura por hora mientras está contratado, haya o no tráfico: 20 × 730
    = 14 600 USD. Para un uso así, bajo demanda puede ser más barato.'
  distractores:
    a: Es el coste de un solo día de uso.
    b: Supone pagar solo las horas de uso (8 × 22 días); mientras está contratada, la capacidad se paga aunque no
      se use.
    c: Divide el coste mensual entre tres sin motivo.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
- id: S-018
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una ONG tiene miles de fichas informativas en inglés y necesita publicarlas en cinco idiomas con un
    servicio gestionado, sin entrenar modelos. ¿Qué servicio usa?
  opciones:
  - id: a
    texto: Amazon Transcribe
  - id: b
    texto: Amazon Polly
  - id: c
    texto: Amazon Comprehend
  - id: d
    texto: Amazon Translate
  correctas:
  - d
  explicacion: Amazon Translate es un servicio de traducción automática neuronal gestionado.
  distractores:
    a: Convierte voz en texto.
    b: Convierte texto en voz, no lo traduce.
    c: Analiza el texto (entidades, sentimiento, idioma), pero no lo traduce.
  referencia: https://docs.aws.amazon.com/translate/latest/dg/what-is.html
- id: S-019
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.6
  tipo: multiple_choice
  dificultad: media
  enunciado: 'El agente de reservas de una agencia de viajes debe colaborar con el agente de pagos de otro proveedor:
    descubrir qué sabe hacer y enviarle tareas. ¿Qué protocolo está pensado para ello?'
  opciones:
  - id: a
    texto: Model Context Protocol (MCP)
  - id: b
    texto: La API Converse de Amazon Bedrock
  - id: c
    texto: Agent2Agent (A2A)
  - id: d
    texto: Retrieval Augmented Generation (RAG)
  correctas:
  - c
  explicacion: A2A es un protocolo abierto para que agentes de distintos equipos o proveedores se descubran (Agent
    Card) y se intercambien mensajes y tareas.
  distractores:
    a: Conecta un agente con herramientas y fuentes de datos, no agentes entre sí.
    b: Es una interfaz para invocar modelos, no un protocolo entre agentes.
    d: Es una técnica para aportar información al prompt.
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-a2a.html
- id: S-020
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.3
  tipo: ordering
  dificultad: media
  enunciado: Ordena la preparación de los datos para ajustar un modelo en Amazon Bedrock.
  opciones:
  - id: a
    texto: Subir los ficheros JSON Lines a Amazon S3
  - id: b
    texto: Darles formato de pares de prompt y respuesta
  - id: c
    texto: Separar un 10 % de los pares ya formateados para validación
  - id: d
    texto: Reunir ejemplos representativos del caso de uso
  - id: e
    texto: Revisar y curar los ejemplos
  correctas:
  - d
  - e
  - b
  - c
  - a
  explicacion: Primero se reúnen y curan los datos, luego se formatean como pares, se separa la validación y se
    suben a S3 en el formato que exige el trabajo de personalización.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
- id: S-021
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Un proceso nocturno consume 1 000 millones de tokens al mes a un precio supuesto de 0,50 USD por millón
    bajo demanda. El modelo admite inferencia por lotes. ¿Cuánto costaría por lotes?
  opciones:
  - id: a
    texto: 125 USD
  - id: b
    texto: 500 USD
  - id: c
    texto: 875 USD
  - id: d
    texto: 250 USD
  correctas:
  - d
  explicacion: '1 000 millones × 0,50 USD por millón = 500 USD bajo demanda; la inferencia por lotes cuesta un 50
    % menos: 250 USD.'
  distractores:
    a: Aplica un 75 % de descuento, que no es el de la inferencia por lotes.
    b: Es el coste bajo demanda; por lotes cuesta un 50 % menos en los modelos que la admiten.
    c: Aplica un recargo del 75 %, propio del nivel Priority.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
- id: S-022
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una aplicación de noticias quiere ofrecer cada artículo también en audio, con voces naturales y sin
    grabar a locutores. ¿Qué servicio usa?
  opciones:
  - id: a
