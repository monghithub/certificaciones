- id: S-063
  dominio: 1
  tarea: '1.1'
  objetivo: 1.1.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: 'Un equipo calcula el coste de su modelo de precios en dos fases: una que ocurrió una sola vez con
    diez años de datos históricos y otra que ocurre cada vez que un cliente pide un presupuesto en la web. ¿Cómo
    se llama la segunda fase?'
  opciones:
  - id: a
    texto: Inferencia
  - id: b
    texto: Ajuste fino
  - id: c
    texto: Entrenamiento
  - id: d
    texto: Etiquetado de datos
  correctas:
  - a
  explicacion: La inferencia es el uso de un modelo ya entrenado para obtener predicciones con datos nuevos, como
    cada petición de presupuesto.
  distractores:
    b: Adapta un modelo ya entrenado con datos adicionales; no es el uso del modelo para responder a cada petición.
    c: Es la fase que ocurrió una vez con los datos históricos, cuando el modelo aprendió los patrones.
    d: Consiste en asignar la respuesta correcta a los ejemplos antes de entrenar; no ocurre con cada presupuesto.
  referencia: https://docs.aws.amazon.com/decision-guides/latest/machine-learning-on-aws-how-to-choose/guide.html
- id: S-064
  dominio: 1
  tarea: '1.3'
