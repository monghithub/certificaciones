  tipo: multiple_response
  dificultad: media
  enunciado: Una empresa autoaloja un modelo de código abierto en instancias de Amazon EC2. Según el modelo de responsabilidad
    compartida, ¿qué DOS tareas le corresponden? (Elige DOS.)
  opciones:
