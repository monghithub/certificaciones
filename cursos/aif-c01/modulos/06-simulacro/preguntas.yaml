    a: Registra quién llamó a la API y cuándo, no el contenido.
    c: Detecta vulnerabilidades de software.
    d: Registra la configuración de los recursos.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
- id: S-061
  dominio: 5
  tarea: '5.1'
  objetivo: 5.1.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una administración pública quiere que sus aplicaciones, en subredes privadas, invoquen Amazon Bedrock
    sin que el tráfico salga a Internet. ¿Qué usa?
  opciones:
  - id: a
    texto: Un guardrail con filtros de contenido
  - id: b
    texto: Un endpoint de interfaz de VPC (AWS PrivateLink)
  - id: c
    texto: Un rol de IAM con permisos para invocar Amazon Bedrock
  - id: d
    texto: Una IP pública en cada instancia
  correctas:
  - b
  explicacion: Con un endpoint de interfaz de AWS PrivateLink se llega a Bedrock desde la VPC sin pasarela de Internet,
    NAT ni VPN.
  distractores:
    a: Filtra contenido; no crea conectividad privada.
    c: Concede permisos, pero no cambia el camino de red.
    d: Haría que el tráfico saliera a Internet.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
- id: S-062
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.5
  tipo: ordering
  dificultad: media
  enunciado: Ordena estas formas de adaptar un modelo fundacional de MENOR a MAYOR coste y esfuerzo.
  opciones:
  - id: a
    texto: RAG
  - id: b
    texto: Ajuste fino
  - id: c
    texto: Aprendizaje en contexto con prompts
  - id: d
    texto: Preentrenamiento
  correctas:
  - c
  - a
  - b
  - d
  explicacion: El aprendizaje en contexto solo cambia el prompt; RAG añade recuperación e infraestructura; el ajuste
    fino entrena con datos etiquetados; el preentrenamiento entrena un modelo desde cero y es lo más caro.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: S-063
  dominio: 1
  tarea: '1.1'
  objetivo: 1.1.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una cadena de ópticas quiere puntuar cada noche el riesgo de abandono de sus 30 millones de clientes
    con un modelo de SageMaker AI. Nadie necesita las predicciones al instante y no quieren un endpoint encendido.
    ¿Qué tipo de inferencia encaja?
  opciones:
  - id: a
    texto: Transformación por lotes
  - id: b
    texto: Inferencia asíncrona
  - id: c
    texto: Inferencia en tiempo real
  - id: d
    texto: Inferencia serverless
  correctas:
  - a
  explicacion: 'La transformación por lotes procesa conjuntos de datos completos sin un endpoint persistente: lee
    de S3, predice y escribe los resultados, y los recursos se liberan al terminar.'
  distractores:
    b: Encola peticiones grandes o largas a un endpoint; para procesar el conjunto completo sin endpoint persistente
      encaja la transformación por lotes.
    c: Mantiene un endpoint encendido y facturado aunque no haya peticiones; aquí no hace falta respuesta inmediata.
    d: Sirve peticiones individuales con tráfico intermitente; no está pensada para puntuar un conjunto de datos
      completo de una vez.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform.html
- id: S-064
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.4
  tipo: matching
  dificultad: media
  enunciado: Empareja cada etapa de un pipeline de ML con el servicio de AWS adecuado.
  prompts:
  - id: '1'
    texto: Limpiar y preparar datos de forma visual, sin código
  - id: '2'
    texto: Partir de un modelo preentrenado de un catálogo
  - id: '3'
    texto: Entrenar un modelo propio con control de la infraestructura
  - id: '4'
    texto: Catalogar versiones de modelos y su estado de aprobación
  opciones:
  - id: a
    texto: Amazon Polly
  - id: b
    texto: SageMaker Model Registry
  - id: c
    texto: Amazon SageMaker JumpStart
  - id: d
    texto: AWS Glue DataBrew
  - id: e
    texto: Amazon SageMaker AI
  correctas:
  - - '1'
    - d
  - - '2'
    - c
  - - '3'
    - e
  - - '4'
    - b
  explicacion: DataBrew prepara datos sin código; JumpStart ofrece modelos preentrenados; SageMaker AI entrena con
    control; el Model Registry cataloga versiones y aprobaciones.
