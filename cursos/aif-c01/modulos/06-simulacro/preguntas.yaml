  distractores:
    a: Sin monitorización el problema se detectaría aún más tarde.
    b: No garantiza un modelo mejor y puede sobreajustar.
    c: Reentrenar más a menudo no impide desplegar un modelo peor.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html
- id: S-055
  dominio: 5
  tarea: '5.1'
  objetivo: 5.1.5
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo llama a la API ApplyGuardrail con la comprobación de grounding contextual, enviando solo
    la pregunta del usuario y la respuesta del modelo. ¿Qué falta para que la comprobación funcione?
  opciones:
  - id: a
    texto: El registro de invocaciones activado
  - id: b
    texto: Un filtro de palabras activado
  - id: c
    texto: El número de versión del modelo usado
  - id: d
    texto: La fuente de referencia (grounding source)
  correctas:
  - d
  explicacion: 'La comprobación de grounding necesita tres piezas: la fuente de referencia, la pregunta y la respuesta
