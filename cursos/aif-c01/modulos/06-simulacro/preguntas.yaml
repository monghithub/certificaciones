  distractores:
    c: Da ejemplos en cada petición sin modificar el modelo.
    d: Añade información al prompt; el modelo no cambia.
    e: Reutiliza un prefijo del prompt; no cambia el modelo.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
- id: S-047
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Las respuestas de un asistente se cortan a mitad de frase, aunque el contenido es correcto. ¿Qué parámetro
    es la causa más probable?
  opciones:
  - id: a
    texto: Un valor de top-p demasiado bajo
  - id: b
    texto: Una temperatura demasiado alta
  - id: c
    texto: Una longitud máxima de salida demasiado baja
  - id: d
    texto: Una ventana de contexto de entrada pequeña
  correctas:
  - c
  explicacion: 'La longitud máxima fija un tope de tokens de salida: al alcanzarlo, la generación se detiene aunque
