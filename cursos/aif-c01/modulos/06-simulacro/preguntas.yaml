  opciones:
  - id: a
    texto: Desactivar la monitorización para ahorrar costes
  - id: b
    texto: Entrenar con más épocas cada vez
  - id: c
    texto: Reentrenar cada día en lugar de cada semana
  - id: d
    texto: Comparar el candidato con el actual y desplegarlo solo si mejora
  correctas:
  - d
  explicacion: Una puerta de calidad en el pipeline evalúa el modelo candidato con los mismos datos y métricas que
