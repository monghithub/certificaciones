- id: S-065
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un despacho quiere que un modelo analice contratos de unas 300 páginas en una sola petición, sin trocearlos.
    ¿Qué criterio de selección es el decisivo?
  opciones:
  - id: a
    texto: El tamaño de la ventana de contexto
  - id: b
    texto: La temperatura por defecto del modelo
  - id: c
    texto: La disponibilidad de generación de imágenes
  - id: d
    texto: El precio del ajuste fino
  correctas:
  - a
  explicacion: La longitud de entrada que admite un modelo (su ventana de contexto) decide si puede procesar documentos
    muy largos en una sola petición.
  distractores:
    b: Es un parámetro de inferencia, no una capacidad del modelo.
    c: El caso es de texto.
    d: No hay que ajustar el modelo para analizar contratos.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
