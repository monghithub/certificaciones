- id: S-024
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo necesita un asistente RAG en dos semanas. Construir su propia canalización de fragmentación,
    embeddings, índice y recuperación le llevaría meses. ¿Qué ventaja obtiene al usar Bedrock Knowledge Bases?
  opciones:
  - id: a
    texto: Que el modelo se reentrene con los documentos
  - id: b
    texto: Llegar antes al mercado al delegar ese trabajo
  - id: c
    texto: Que no se pague por las consultas ni por el almacenamiento vectorial
  - id: d
    texto: Que el asistente deje de necesitar evaluación
  correctas:
  - b
  explicacion: Los servicios gestionados reducen el trabajo de construir y operar piezas como la ingesta y la recuperación,
    lo que acelera la llegada al mercado, una de las ventajas que cita la guía.
  distractores:
    a: RAG no reentrena el modelo; añade fragmentos al prompt.
    c: Se paga la inferencia del modelo y el almacén vectorial elegido.
    d: Un RAG gestionado también hay que evaluarlo, por ejemplo con evaluaciones de RAG.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
- id: S-025
  dominio: 5
  tarea: '5.2'
  objetivo: 5.2.3
  tipo: multiple_response
  dificultad: media
  enunciado: Antes de lanzar un asistente para clientes, el comité de IA define su estrategia de revisión. ¿Qué
    DOS prácticas incluye? (Elige DOS.)
  opciones:
  - id: a
    texto: Revisar solo si llegan quejas tras el lanzamiento
  - id: b
    texto: Que el equipo que lo desarrolló apruebe su propio trabajo
  - id: c
    texto: Pruebas adversarias que intenten saltarse las salvaguardas
  - id: d
    texto: Lanzar sin documentar para iterar más rápido
  - id: e
    texto: Una revisión independiente de las evaluaciones críticas
  correctas:
  - c
  - e
  explicacion: Entre las estrategias de revisión están probar el sistema con ataques antes de lanzarlo y corroborar
    de forma independiente las evaluaciones críticas o subjetivas.
  distractores:
    a: 'Es reactivo: los problemas se descubren cuando ya afectan a clientes.'
    b: Falta independencia en las evaluaciones críticas.
    d: Incumple los estándares de transparencia y dificulta auditar.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raier01-bp02.html
- id: S-026
  dominio: 3
  tarea: '3.2'
  objetivo: 3.2.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo pide a un modelo, solo con ingeniería de prompts, que conteste sobre una normativa aprobada
    el mes pasado, posterior a su entrenamiento. Las respuestas son inventadas. ¿Qué limitación explica el fallo?
  opciones:
  - id: a
    texto: Falta un prompt negativo que prohíba inventar
  - id: b
    texto: La temperatura del modelo es demasiado baja
  - id: c
    texto: El modelo está sufriendo una inyección de prompts
  - id: d
    texto: Un prompt no añade conocimiento nuevo
  correctas:
  - d
  explicacion: 'Una limitación de la ingeniería de prompts es que no añade conocimiento: si el modelo no tiene la
    información, hay que dársela en el contexto (por ejemplo, con RAG) o adaptarlo.'
  distractores:
    a: Prohibir respuestas no le da la información que necesita.
    b: No hace que el modelo conozca una norma posterior a su entrenamiento.
    c: No hay ninguna instrucción maliciosa en el escenario.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html
- id: S-027
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo ajusta un modelo y reserva una parte de los datos que no usa para entrenar. ¿Para qué sirve
    ese conjunto de validación?
  opciones:
  - id: a
    texto: Cifrar los datos del trabajo de ajuste
  - id: b
    texto: Aumentar el volumen de datos de entrenamiento
  - id: c
    texto: Guardar las respuestas del modelo en producción
  - id: d
    texto: Medir la calidad y detectar sobreajuste
  correctas:
  - d
  explicacion: El conjunto de validación mide el modelo con datos que no ha visto durante el entrenamiento; si el
    error de validación empeora mientras el de entrenamiento mejora, hay sobreajuste.
  distractores:
    a: El cifrado lo hace AWS KMS, no un conjunto de datos.
    b: Precisamente no se usa para entrenar.
    c: Eso es el registro de invocaciones.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html
- id: S-028
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo explica con SHAP las predicciones de una red neuronal profunda de riesgo de crédito. ¿Qué
    precaución recomienda la guía de AWS?
  opciones:
  - id: a
    texto: Pueden engañar si las variables interactúan mucho
  - id: b
    texto: Tratarlas como la lógica exacta del modelo
  - id: c
    texto: Sustituir el modelo por SHAP en producción
  - id: d
    texto: Usarlas solo para modelos lineales
  correctas:
  - a
  explicacion: La guía prescriptiva de AWS advierte de que las atribuciones SHAP pueden engañar al estimar la importancia
    de las variables cuando hay interacciones fuertes entre ellas.
  distractores:
    b: SHAP es una explicación a posteriori y aproximada, no la lógica interna del modelo.
    c: SHAP explica un modelo; no predice por sí mismo.
    d: En los modelos lineales los coeficientes ya explican; SHAP se usa sobre todo con modelos complejos.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/faq.html
- id: S-029
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa de defensa necesita un modelo generativo que funcione en sus instalaciones sin conexión
    a Internet. ¿Qué factor de selección es el decisivo?
  opciones:
  - id: a
    texto: Un modelo de pesos abiertos autoalojable
  - id: b
    texto: La disponibilidad por API en Amazon Bedrock
  - id: c
    texto: La mayor ventana de contexto disponible
  - id: d
    texto: El menor precio por token del mercado
  correctas:
  - a
  explicacion: 'Las restricciones del caso (aquí, funcionar sin conexión) son un factor de selección: obligan a
    un modelo cuyos pesos se puedan desplegar en infraestructura propia.'
  distractores:
    b: Un servicio por API necesita conexión con AWS.
    c: No resuelve la restricción de funcionar sin conexión.
    d: El precio por token no importa si no se puede usar sin conexión.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: S-030
  dominio: 5
  tarea: '5.1'
  objetivo: 5.1.3
  tipo: multiple_response
  dificultad: baja
  enunciado: Un equipo va a entrenar un modelo de abandono de clientes con una base de datos de 60 columnas, incluidos
    el DNI y la dirección. ¿Qué DOS prácticas de privacidad aplica? (Elige DOS.)
  opciones:
  - id: a
    texto: Sustituir los identificadores por códigos
  - id: b
    texto: Publicar el conjunto para que lo revise un tercero
  - id: c
    texto: Usar solo las columnas que el modelo necesita
  - id: d
    texto: Dar acceso de lectura a toda la empresa
  - id: e
    texto: Copiar las 60 columnas por si son útiles más adelante
  correctas:
  - a
  - c
  explicacion: 'La minimización y la seudonimización son técnicas de mejora de la privacidad: no usar datos que
    la tarea no necesita y reducir la identificabilidad de lo que se usa.'
  distractores:
    b: Expondría datos personales.
    d: Va contra el control de acceso a los datos.
    e: Aumenta el riesgo sin beneficio para el modelo.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp02-bp02.html
- id: S-031
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una marca publica en redes sociales fotos de producto generadas con IA sin indicarlo. Cuando se descubre,
    muchos clientes reaccionan mal. ¿Qué riesgo se materializó y qué lo habría mitigado?
  opciones:
  - id: a
    texto: Infracción de propiedad intelectual; usar la temperatura más baja
  - id: b
    texto: Alucinación; añadir RAG con el catálogo
  - id: c
    texto: Sesgo; analizar los resultados por subgrupos
  - id: d
    texto: Pérdida de confianza; indicar que el contenido está generado con IA
  correctas:
  - d
  explicacion: La pérdida de confianza de los clientes es uno de los riesgos de la IA generativa; la transparencia
    sobre el uso de la IA lo reduce.
  distractores:
    a: No se describe ninguna obra de terceros, y la temperatura no protege derechos.
    b: Las fotos no contienen datos falsos sobre el producto; el problema es no haberlo comunicado.
    c: No hay un trato desigual entre grupos.
  referencia: https://aws.amazon.com/ai/responsible-ai/policy/
- id: S-032
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.3
  tipo: multiple_response
  dificultad: media
  enunciado: Una cadena de electrodomésticos estudia dónde aplicar RAG en lugar de ajuste fino. ¿Qué DOS casos encajan
    mejor con RAG? (Elige DOS.)
  opciones:
  - id: a
    texto: Un buscador de productos con precios y existencias actualizados
  - id: b
    texto: Un asistente sobre condiciones de garantía que cambian cada mes, con citas
  - id: c
    texto: Reducir la latencia de un modelo grande
  - id: d
    texto: Que el modelo devuelva un formato fijo de etiqueta
  - id: e
    texto: Que el asistente escriba con el tono desenfadado de la marca
  correctas:
  - a
  - b
  explicacion: RAG brilla cuando la información es propia, cambia a menudo y conviene citar la fuente; el ajuste
    fino, cuando hay que cambiar el estilo o el comportamiento.
  distractores:
    c: RAG añade un paso de recuperación; no reduce la latencia.
    d: Es una tarea de formato, propia de prompts o ajuste fino.
    e: El tono y el estilo se consiguen con prompts o ajuste fino, no aportando documentos.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
- id: S-033
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: El equipo de calidad de un banco necesita cientos de conversaciones de clientes ficticias y variadas
    para probar su nuevo canal de chat, sin usar datos reales. ¿Qué ventaja de la IA generativa aprovecha?
  opciones:
  - id: a
    texto: La capacidad de generar contenido nuevo
  - id: b
    texto: La exactitud de los cálculos numéricos
  - id: c
    texto: El determinismo de las respuestas
  - id: d
    texto: La interpretabilidad de sus decisiones
  correctas:
  - a
  explicacion: Generar contenido nuevo (texto, imágenes, código, datos de prueba) es una de las ventajas que cita
    la guía, junto con la adaptabilidad, la capacidad de respuesta y las capacidades conversacionales.
  distractores:
    b: La inexactitud es una de sus desventajas.
    c: La IA generativa no es determinista; aquí interesa la variedad.
    d: Es una de sus desventajas, no lo que se aprovecha aquí.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: S-034
  dominio: 5
  tarea: '5.2'
  objetivo: 5.2.2
  tipo: ordering
  dificultad: media
  enunciado: Ordena la respuesta de un equipo a un aumento de errores de su aplicación de IA en producción.
  opciones:
  - id: a
    texto: Identifica y corrige la causa
  - id: b
    texto: Comprueba que las métricas vuelven a la normalidad
  - id: c
    texto: El equipo revisa las métricas y los registros
  - id: d
    texto: Una alarma de CloudWatch avisa al superar el umbral
  correctas:
  - d
  - c
  - a
  - b
  explicacion: La monitorización detecta el problema con alarmas; los registros permiten diagnosticarlo; tras corregirlo,
    las métricas confirman la recuperación.
  referencia: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html
- id: S-035
  dominio: 1
  tarea: '1.2'
  objetivo: 1.2.6
  tipo: multiple_choice
  dificultad: media
  enunciado: Una startup necesita clasificar desde esta semana los correos de sus clientes en tres categorías. No
    tiene ningún correo etiquetado ni equipo de ML. ¿Qué enfoque es el más adecuado?
  opciones:
  - id: a
    texto: Un modelo fundacional con un prompt de clasificación y algunos ejemplos
  - id: b
    texto: Agrupar los correos con un algoritmo de clustering
  - id: c
    texto: Entrenar un clasificador tradicional con algoritmos integrados de SageMaker AI
  - id: d
    texto: Preentrenar un modelo de lenguaje propio
  correctas:
  - a
  explicacion: Sin datos etiquetados ni tiempo, un modelo fundacional resuelve la clasificación con instrucciones
    y pocos ejemplos en el prompt. Cuando haya datos y volumen, un modelo tradicional puede ser más barato.
  distractores:
    b: Descubre grupos, pero no los asigna a las tres categorías definidas.
    c: Necesitaría miles de correos etiquetados y un equipo de ML que no tienen.
    d: Es la opción más costosa y lenta, y tampoco hay datos.
  referencia: https://docs.aws.amazon.com/decision-guides/latest/machine-learning-on-aws-how-to-choose/guide.html
- id: S-036
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: multiple_response
  dificultad: media
  enunciado: Una consultora quiere que su nuevo asistente tenga la menor huella ambiental posible. ¿Qué DOS decisiones
    son las más responsables? (Elige DOS.)
  opciones:
  - id: a
    texto: Elegir el modelo con más parámetros para no quedarse corto
  - id: b
    texto: Partir de un modelo preentrenado en lugar de entrenar uno desde cero
  - id: c
    texto: Comparar candidatos y quedarse con el más pequeño que cumple
  - id: d
    texto: Entrenar su propio modelo para controlar la eficiencia
  - id: e
    texto: Mantener una réplica encendida en otra Región como reserva
  correctas:
  - b
  - c
  explicacion: Las prácticas de sostenibilidad de AWS para IA generativa recomiendan reutilizar modelos y elegir
    el del tamaño justo, además de evitar recursos ociosos.
  distractores:
    a: Un modelo mayor de lo necesario consume más en cada inferencia.
    d: El preentrenamiento tiene una huella enorme frente a reutilizar un modelo existente.
    e: Deja capacidad ociosa que consume energía sin necesidad.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/sustainability.html
- id: S-037
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un asistente de reservas da respuestas correctas, pero cambia de respuesta cuando el cliente escribe
    con faltas de ortografía o con sinónimos. ¿Qué rasgo de la IA responsable falla?
  opciones:
  - id: a
    texto: La transparencia
  - id: b
    texto: La equidad
  - id: c
    texto: La robustez
  - id: d
    texto: La controlabilidad
  correctas:
  - c
  explicacion: La robustez es mantener salidas correctas ante variaciones de la entrada, como erratas o sinónimos,
    y ante entradas maliciosas.
  distractores:
    a: Trata de informar sobre el sistema; no explica que la respuesta cambie con una errata.
    b: Trata del trato a los distintos grupos de personas, no de variaciones en la forma de escribir.
    d: Trata de poder supervisar y dirigir el sistema.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: S-038
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un analista pregunta qué arquitectura permite a los grandes modelos de lenguaje relacionar cada palabra
    de un texto con todas las demás para entender el contexto. ¿Cuál es?
  opciones:
  - id: a
    texto: La regresión lineal
  - id: b
    texto: El modelo de difusión
  - id: c
    texto: El árbol de decisión
  - id: d
    texto: La arquitectura transformer
  correctas:
  - d
  explicacion: Los LLM se basan en transformers, cuyo mecanismo de atención relaciona cada token con los demás del
    contexto.
  distractores:
    a: Es un modelo sencillo para predecir valores numéricos.
    b: Se usa sobre todo para generar imágenes eliminando ruido paso a paso.
    c: Es un modelo de ML clásico e interpretable, no la base de los LLM.
  referencia: https://aws.amazon.com/what-is/transformers-in-artificial-intelligence/
- id: S-039
  dominio: 3
  tarea: '3.1'
  objetivo: 3.1.5
  tipo: multiple_response
  dificultad: alta
  enunciado: Un equipo duda entre añadir 10 ejemplos few-shot a cada prompt o ajustar el modelo. Recibe 2 millones
    de peticiones al mes. ¿Qué DOS afirmaciones sobre el coste son correctas? (Elige DOS.)
  opciones:
  - id: a
    texto: Tras el ajuste solo se paga la inferencia, como con el modelo base
  - id: b
    texto: Few-shot exige crear y almacenar un modelo personalizado
  - id: c
    texto: Few-shot reduce los tokens de entrada de cada petición
  - id: d
    texto: El ajuste fino tiene un coste inicial y permite prompts más cortos
  - id: e
    texto: Few-shot no tiene coste de entrenamiento, pero añade tokens a cada petición
  correctas:
  - d
  - e
  explicacion: El aprendizaje en contexto se paga en cada petición; el ajuste fino concentra el coste al principio
    (más almacenamiento e inferencia del modelo personalizado). A gran volumen conviene comparar ambos.
  distractores:
    a: También se paga el almacenamiento mensual del modelo personalizado.
    b: Few-shot solo cambia el prompt; no crea ningún modelo.
    c: Los ejemplos se envían en cada petición, así que los aumentan.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
- id: S-040
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.1
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo quiere que 3 evaluadores propios valoren 500 respuestas en una evaluación humana de Amazon
    Bedrock. Si cada valoración es una tarea, ¿cuánto se paga por las tareas humanas, sin contar la inferencia?
  opciones:
  - id: a
    texto: 0 USD
  - id: b
    texto: 105 USD
  - id: c
    texto: 1 500 USD
  - id: d
    texto: 315 USD
  correctas:
  - d
  explicacion: 'La página de precios de Bedrock indica 0,21 USD por tarea humana completada en evaluaciones con
    equipo propio: 500 × 3 × 0,21 = 315 USD, más la inferencia del modelo.'
  distractores:
    a: Con trabajadores propios Bedrock cobra igualmente cada tarea humana completada.
    b: Cuenta un solo evaluador por respuesta (500 × 0,21).
    c: Paga 1 USD por tarea en lugar de 0,21.
  referencia: https://aws.amazon.com/bedrock/pricing/
- id: S-041
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo configura una evaluación programática de Amazon Bedrock para la tarea de preguntas y respuestas.
    ¿Qué métrica de exactitud usa el servicio en esa tarea?
  opciones:
  - id: a
    texto: BLEU
  - id: b
    texto: F1
  - id: c
    texto: ROUGE
  - id: d
    texto: BERTScore
