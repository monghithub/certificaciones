- id: S-043
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.2
  tipo: multiple_response
  dificultad: media
  enunciado: Una empresa de software revisa ideas de proyectos. ¿Qué DOS son buenos candidatos para la IA generativa?
