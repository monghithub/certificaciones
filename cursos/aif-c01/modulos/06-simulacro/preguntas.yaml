  opciones:
  - id: a
    texto: AWS Artifact
  - id: b
    texto: AWS Config
  - id: c
    texto: Amazon Inspector
  - id: d
    texto: AWS Trusted Advisor
  correctas:
  - a
  explicacion: AWS Artifact permite revisar, aceptar y seguir el estado de los acuerdos con AWS, además de descargar
