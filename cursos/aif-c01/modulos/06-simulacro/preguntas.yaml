  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html
- id: S-050
  dominio: 1
  tarea: '1.3'
  objetivo: 1.3.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa ha entrenado un modelo propio de detección de fraude. Quiere servirlo en producción con un endpoint gestionado que escale solo, sin administrar servidores ni el sistema operativo. ¿Qué opción encaja?
  opciones:
  - id: a
    texto: Usar un modelo fundacional de Amazon Bedrock por API
  - id: b
    texto: Desplegarlo en un clúster propio de Amazon EKS
  - id: c
    texto: Ejecutarlo como un trabajo de AWS Glue
  - id: d
    texto: Desplegarlo en un endpoint de SageMaker AI
  correctas:
  - d
  explicacion: 'Un endpoint de SageMaker AI aloja el modelo propio de la empresa, gestionado y con escalado automático, sin administrar servidores ni el sistema operativo.'
  distractores:
    a: Bedrock sirve modelos fundacionales del catálogo; aquí hay que servir un modelo de fraude propio.
    b: Un clúster de EKS da control total, pero obliga a gestionar la infraestructura, justo lo que se quiere evitar.
    c: Glue es un servicio de integración y ETL de datos, no de inferencia de modelos.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html
- id: S-051
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.3
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un banco quiere explicar con todo detalle a cada cliente por qué su modelo antifraude bloqueó una operación,
    incluidos los umbrales exactos de cada variable. ¿Qué compromiso debe valorar?
  opciones:
  - id: a
    texto: 'El detalle ayuda a eludir el modelo: mejor una explicación general'
  - id: b
    texto: Que el modelo deja de funcionar si se explican sus decisiones
  - id: c
    texto: Que explicar las decisiones reduce la exactitud del modelo antifraude
  - id: d
    texto: 'Ninguno: más detalle mejora la seguridad'
  correctas:
  - a
  explicacion: 'La transparencia y la seguridad pueden chocar: se da al cliente una explicación comprensible y una
    vía de revisión, y el detalle completo queda para los revisores internos.'
  distractores:
    b: El modelo sigue funcionando; el riesgo es que se eluda con más facilidad.
    c: Explicar no cambia la exactitud del modelo.
    d: Conocer los umbrales permite ajustar las operaciones fraudulentas para no superarlos.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp01-bp02.html
- id: S-052
  dominio: 1
  tarea: '1.1'
  objetivo: 1.1.2
  tipo: multiple_choice
  dificultad: media
  enunciado: El director de una aseguradora presenta como «IA generativa» su modelo de redes neuronales profundas
    que clasifica cada siniestro como fraudulento o no. ¿Qué respuesta es la correcta?
  opciones:
  - id: a
    texto: Es IA agéntica, porque toma decisiones de forma automática
  - id: b
    texto: Es IA generativa, porque usa redes neuronales profundas
  - id: c
    texto: Aprendizaje profundo, no IA generativa
  - id: d
    texto: No es aprendizaje automático, porque las redes profundas son un campo aparte
  correctas:
  - c
  explicacion: El aprendizaje profundo es un tipo de ML con redes neuronales de muchas capas. La IA generativa es
    un subconjunto que crea contenido nuevo; un clasificador de fraude no lo hace.
  distractores:
    a: Clasificar no es planificar ni ejecutar acciones con herramientas para cumplir un objetivo.
    b: Usar aprendizaje profundo no convierte un modelo en generativo; la IA generativa se define por crear contenido
      nuevo.
    d: El aprendizaje profundo es un subconjunto del aprendizaje automático.
  referencia: https://aws.amazon.com/what-is/generative-ai/
- id: S-053
  dominio: 1
  tarea: '1.1'
  objetivo: 1.1.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una compañía de aguas guarda, para cada tubería, una lectura de presión por minuto desde hace tres años. Para predecir averías, el modelo debe tener en cuenta cómo evoluciona la presión en las horas previas. ¿Cómo hay que tratar estos datos?
  opciones:
  - id: a
    texto: Como una serie temporal, conservando el orden de las lecturas
  - id: b
    texto: Como datos tabulares en los que el orden de las filas no importa
  - id: c
    texto: Como datos etiquetados para clasificar cada lectura por separado
  - id: d
    texto: Como texto no estructurado que hay que tokenizar
  correctas:
  - a
  explicacion: 'Valores medidos a intervalos regulares, en los que importa la evolución, forman una serie temporal; el orden y la periodicidad son parte de la información.'
  distractores:
    b: Tratarlas como filas independientes pierde justo lo que pide el enunciado, la evolución en el tiempo.
    c: Clasificar cada lectura por separado ignora las horas previas.
    d: Son valores numéricos con instante, no lenguaje libre.
