- id: D4-001
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Una cadena de tiendas comprueba que su asistente de recomendaciones ofrece productos más caros y peores
    condiciones de financiación a los clientes de ciertos barrios, aunque tengan el mismo historial de compras que
    el resto. ¿Qué dimensión de la IA responsable está fallando principalmente?
  opciones:
  - id: a
    texto: Controlabilidad
  - id: b
    texto: Transparencia
  - id: c
    texto: Equidad
  - id: d
    texto: Veracidad y robustez
  correctas:
  - c
  explicacion: 'La equidad consiste en tener en cuenta el impacto en los distintos grupos de personas. Dar peores
    condiciones a un grupo con el mismo perfil, solo por el barrio, es un trato desigual: un problema de equidad
    (sesgo en sentido ético).'
  distractores:
    a: Trata de poder supervisar y dirigir el comportamiento del sistema. El fallo descrito es que perjudica a un
      grupo de clientes, no que no se pueda controlar.
    b: Trata de informar a las personas sobre el sistema para que decidan. Aunque se informara, seguiría habiendo
      un trato desigual sin motivo.
    d: Trata de que las salidas sean correctas, también ante entradas inesperadas. Aquí las recomendaciones pueden
      ser «correctas» técnicamente; el problema es el trato desigual entre grupos.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: D4-002
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: El asistente de una farmacia en línea responde a veces con dosis de medicamentos que no aparecen en
    ningún prospecto ni en la documentación de la empresa. ¿Qué dimensión de la IA responsable se ve comprometida?
  opciones:
  - id: a
    texto: Transparencia
  - id: b
    texto: Equidad
  - id: c
    texto: Veracidad
  - id: d
    texto: Gobierno
  correctas:
  - c
  explicacion: La veracidad es conseguir salidas factualmente correctas. Inventar una dosis es una alucinación,
    el principal enemigo de la veracidad en la IA generativa.
  distractores:
    a: Se refiere a informar sobre el uso de IA y sus limitaciones. Informar no corrige que el sistema invente datos.
    b: Se refiere al trato a los distintos grupos de personas. El problema descrito afecta a la exactitud de los
      datos, no a un grupo concreto.
    d: Se refiere a incorporar buenas prácticas en la cadena de suministro de la IA. Puede ayudar a prevenir el
      problema, pero la dimensión directamente afectada es la exactitud de las salidas.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: D4-003
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.1
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un servicio de transcripción para una red de clínicas funciona bien con la mayoría de pacientes, pero
    comete muchos más errores con las personas mayores y con quienes tienen acentos regionales poco frecuentes en
    los datos de entrenamiento. La dirección quiere que el servicio sea útil para todos sus pacientes. ¿Qué característica
    de la IA responsable debe reforzar en primer lugar?
  opciones:
  - id: a
    texto: 'Transparencia: que se publique la exactitud media del servicio'
  - id: b
    texto: 'Controlabilidad: que se pueda detener el servicio cuando falle'
  - id: c
    texto: 'Inclusividad: representar en los datos a los grupos que lo usarán'
  - id: d
    texto: 'Robustez: que el modelo resista entradas maliciosas diseñadas para engañarlo'
  correctas:
  - c
  explicacion: La inclusividad consiste en que el sistema funcione bien para todos los grupos que lo van a usar.
    Empieza por datos que representen a personas mayores y acentos poco frecuentes, y por medir la calidad para
    cada grupo.
  distractores:
    a: La exactitud media ocultaría precisamente el problema de los grupos minoritarios.
    b: Detener el servicio no lo hace útil para esos pacientes; hay que representarlos en los datos y medir su calidad.
    d: 'La robustez también cubre variaciones de la entrada, pero el escenario no habla de ataques: el problema
      es que unos grupos concretos de pacientes no están representados.'
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html
- id: D4-004
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.1
  tipo: multiple_response
  dificultad: media
  enunciado: Una empresa de logística despliega un agente de IA que puede reprogramar entregas y emitir pequeños
    reembolsos. El comité de riesgos pide reforzar la controlabilidad del sistema. ¿Qué DOS medidas lo hacen? (Elige
    DOS.)
  opciones:
  - id: a
    texto: Cifrar con AWS KMS los datos de los pedidos almacenados
  - id: b
    texto: Limitar las acciones que el agente puede ejecutar y los importes que puede reembolsar
  - id: c
    texto: Prever que una persona revise, corrija o detenga las acciones del agente cuando haga falta
  - id: d
    texto: Publicar una ficha con el uso previsto y las limitaciones del agente
  - id: e
    texto: Equilibrar el conjunto de datos de entrenamiento por regiones
  correctas:
  - b
  - c
  explicacion: 'La controlabilidad consiste en tener mecanismos para supervisar y dirigir el comportamiento del
    sistema: acotar lo que el agente puede hacer y permitir que una persona intervenga son dos de esos mecanismos.'
  distractores:
    a: Protege los datos (privacidad y seguridad), pero no da mecanismos para supervisar o dirigir lo que hace el
      agente.
    d: Es una medida de transparencia; informa, pero no permite dirigir ni detener el comportamiento del sistema.
    e: Es una medida de equidad e inclusividad; no añade control sobre las acciones del agente.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: D4-005
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.1
  tipo: matching
  dificultad: media
  enunciado: Una aseguradora revisa su asistente de IA. Empareja cada situación con la dimensión de la IA responsable
    que aborda.
  prompts:
  - id: '1'
    texto: Las tasas de aprobación de pólizas son parecidas entre grupos de edad con el mismo perfil de riesgo
  - id: '2'
    texto: El cliente sabe que conversa con una IA y conoce las limitaciones del asistente
  - id: '3'
    texto: El asistente no da instrucciones peligrosas aunque se las pidan
  - id: '4'
    texto: Un comité revisa qué proveedores de modelos se usan y con qué datos se ajustaron
  opciones:
  - id: a
    texto: Equidad
  - id: b
    texto: Explicabilidad
  - id: c
    texto: Seguridad frente a daños (safety)
  - id: d
    texto: Gobierno
  - id: e
    texto: Transparencia
  correctas:
  - - '1'
    - a
  - - '2'
    - e
  - - '3'
    - c
  - - '4'
    - d
  explicacion: 'Equidad: impacto en los distintos grupos. Transparencia: decidir con información sobre el sistema.
    Seguridad frente a daños: evitar salidas dañinas y el mal uso. Gobierno: buenas prácticas en la cadena de suministro
    de la IA, de proveedores a implantadores.'
  distractores:
    b: Trata de entender por qué el sistema dio una salida concreta; ninguna de las situaciones pide explicar una
      decisión individual.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: D4-006
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa de selección de personal quiere usar un modelo de Amazon Bedrock para ordenar candidatos
    y descartar automáticamente a los peor puntuados. ¿Qué exige la política de IA responsable de AWS para este
    tipo de uso?
  opciones:
  - id: a
    texto: Desactivar los filtros del modelo para que no interfieran en la puntuación
  - id: b
    texto: Obtener de AWS una aprobación previa y por escrito del caso de uso antes de desplegarlo en producción
  - id: c
    texto: Usar exclusivamente modelos de Amazon cubiertos por la indemnización de propiedad intelectual
  - id: d
    texto: Evaluar los riesgos del caso de uso e implantar supervisión humana, pruebas y salvaguardas adecuadas
      al riesgo
  correctas:
  - d
  explicacion: Las decisiones de contratación son decisiones con consecuencias. La política de IA responsable de
    AWS exige en ellas evaluar los riesgos e implantar supervisión humana, pruebas y salvaguardas específicas del
    caso de uso.
  distractores:
    a: 'Es contrario a la política: desactivar salvaguardas aumenta el riesgo y además anula condiciones como las
      de la indemnización.'
    b: La política pide facilitar información sobre el uso previsto si AWS la solicita, no una aprobación previa.
    c: La indemnización trata reclamaciones de derechos de autor; no responde al riesgo de decidir sobre el empleo
      de las personas.
  referencia: https://aws.amazon.com/ai/responsible-ai/policy/
- id: D4-007
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un banco lanza un asistente de atención al cliente con un modelo de Amazon Bedrock. El departamento
    legal exige que el asistente no recomiende en qué productos invertir, aunque el cliente lo pida con palabras
    distintas cada vez. ¿Qué configuración lo consigue con el MENOR esfuerzo?
  opciones:
  - id: a
    texto: Un filtro de palabras de Guardrails con los nombres de fondos, acciones y criptomonedas más habituales
  - id: b
    texto: Un tema denegado de Amazon Bedrock Guardrails que describa el asesoramiento de inversión
  - id: c
    texto: Los filtros de contenido de Guardrails en intensidad alta
  - id: d
    texto: La comprobación de grounding contextual de Guardrails
  correctas:
  - b
  explicacion: Los temas denegados bloquean temas que el cliente describe en lenguaje natural, en las preguntas
    y en las respuestas, aunque cambie la redacción. Es el ejemplo que da la propia documentación de Guardrails
    para un banco.
  distractores:
    a: Bloquea palabras o frases exactas; no detecta peticiones de consejo formuladas con otras palabras.
    c: Detectan categorías predefinidas (odio, insultos, sexual, violencia, conducta indebida, ataques de prompt);
      el asesoramiento de inversión no es una de ellas.
    d: Detecta respuestas no basadas en una fuente o irrelevantes; no bloquea un tema de conversación.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
- id: D4-008
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un centro de atención telefónica genera con un modelo de Amazon Bedrock resúmenes de las llamadas para
    los supervisores. Los resúmenes deben seguir llegando, pero sin el teléfono ni el correo del cliente. ¿Qué configuración
    de Amazon Bedrock Guardrails es la adecuada?
  opciones:
  - id: a
    texto: Un filtro de información sensible con la acción de enmascarar para esos tipos de PII
  - id: b
    texto: Un tema denegado llamado «datos de contacto»
  - id: c
    texto: Un filtro de información sensible con la acción de bloquear para esos tipos de PII
  - id: d
    texto: Un filtro de palabras con la lista de teléfonos y correos de los clientes
  correctas:
  - a
  explicacion: 'El filtro de información sensible detecta PII como teléfonos o correos y puede enmascararla: la
    respuesta llega con el dato sustituido por una etiqueta. Es el caso de uso de resumen de llamadas que describe
    la documentación.'
  distractores:
    b: Bloquearía la respuesta completa cuando aparezca el tema, en lugar de quitar solo el dato.
    c: 'Bloquear sustituye toda la respuesta por el mensaje de bloqueo: el supervisor se quedaría sin el resumen.'
    d: Es inviable mantener esa lista y además expondría los datos; el filtro de información sensible los detecta
      por tipo.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
- id: D4-009
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aseguradora tiene un asistente RAG con Amazon Bedrock Knowledge Bases. En las pruebas, algunas
    respuestas añaden coberturas que no aparecen en los fragmentos recuperados. Quieren bloquear esas respuestas
    antes de que lleguen al cliente. ¿Qué salvaguarda deben configurar?
  opciones:
  - id: a
    texto: Un filtro de palabras con los nombres de las coberturas inexistentes
  - id: b
    texto: Automated Reasoning checks de Amazon Bedrock Guardrails
  - id: c
    texto: La comprobación de grounding contextual (contextual grounding check) de Guardrails
  - id: d
    texto: El filtro de ataques de prompt de Amazon Bedrock Guardrails
  correctas:
  - c
  explicacion: La comprobación de grounding contextual puntúa si la respuesta se basa en la fuente de referencia
    y si es relevante para la pregunta, y bloquea las que quedan por debajo del umbral. Es la salvaguarda para alucinaciones
    en RAG.
  distractores:
    a: Habría que adivinar de antemano qué inventará el modelo; no detecta información no basada en la fuente.
    b: Valida respuestas contra reglas lógicas definidas en una política, no contra los fragmentos recuperados en
      cada pregunta.
    d: Detecta intentos de manipular el modelo con instrucciones; no comprueba si la respuesta se basa en la fuente.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
- id: D4-010
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una mutua sanitaria responde en inglés a preguntas de sus afiliados sobre la elegibilidad para prestaciones,
    que dependen de muchas condiciones combinadas. El regulador exige poder demostrar, con una explicación verificable,
    que cada respuesta es coherente con las normas de la mutua. ¿Qué salvaguarda de Amazon Bedrock Guardrails encaja
    mejor?
  opciones:
  - id: a
    texto: Los filtros de contenido en intensidad alta
  - id: b
    texto: Automated Reasoning checks con una política que recoja las normas de elegibilidad
  - id: c
    texto: Un tema denegado sobre prestaciones sanitarias
  - id: d
    texto: La comprobación de grounding contextual con un umbral alto sobre el reglamento de prestaciones
  correctas:
  - b
  explicacion: 'Automated Reasoning checks valida la respuesta con lógica formal contra una política de reglas,
    explica por qué es correcta o no y señala supuestos no declarados. Está pensado para sectores regulados y reglas
    complejas; admite inglés (EE. UU.) y solo detecta: devuelve hallazgos y la aplicación decide si entrega o corrige
    la respuesta.'
  distractores:
    a: Detectan contenido dañino, no si una respuesta respeta las reglas de elegibilidad.
    c: Bloquearía las preguntas sobre prestaciones, que son precisamente el servicio que hay que dar.
    d: Comprueba que la respuesta se basa en un texto de referencia, pero no demuestra con lógica formal que cumple
      un conjunto de reglas combinadas.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
- id: D4-011
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una empresa usa varios modelos de Amazon Bedrock con un guardrail corporativo y, además, aloja en Amazon
    EC2 un modelo de código abierto ajustado por ella. Quiere aplicar las mismas políticas al modelo de EC2 sin
    migrarlo. ¿Qué solución lo permite?
  opciones:
  - id: a
    texto: Llamar a la API ApplyGuardrail con el guardrail corporativo antes y después de invocar el modelo de EC2
  - id: b
    texto: Asociar el guardrail a una Knowledge Base y enrutar las consultas del modelo de EC2 a través de esa Knowledge
      Base
  - id: c
    texto: Configurar SageMaker Clarify para que filtre las respuestas del modelo
  - id: d
    texto: 'Ninguna: los guardrails solo actúan cuando se invoca un modelo de Amazon Bedrock'
  correctas:
  - a
  explicacion: La API ApplyGuardrail evalúa un contenido con las políticas de un guardrail sin invocar ningún modelo.
    Así se aplican las mismas salvaguardas a modelos alojados fuera de Bedrock.
  distractores:
    b: Una Knowledge Base no sirve para enrutar peticiones a un modelo de EC2; además complica la arquitectura sin
      necesidad.
    c: Clarify mide sesgo y explica predicciones, no filtra contenido en tiempo real, y ya no admite clientes nuevos.
    d: 'Es falso: ApplyGuardrail evalúa texto sin invocar un modelo, precisamente para modelos externos o propios.'
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
- id: D4-012
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_response
  dificultad: media
  enunciado: El chat público de una aerolínea usa un modelo de Amazon Bedrock. Debe bloquear los mensajes de odio
    y evitar que aparezca el nombre de una aerolínea competidora en las conversaciones, de la forma más directa.
    ¿Qué DOS salvaguardas de Amazon Bedrock Guardrails debe configurar? (Elige DOS.)
  opciones:
  - id: a
    texto: Filtros de contenido
  - id: b
    texto: Filtros de palabras
  - id: c
    texto: Temas denegados
  - id: d
    texto: Filtros de información sensible
  - id: e
    texto: Comprobación de grounding contextual
  correctas:
  - a
  - b
  explicacion: Los filtros de contenido detectan el odio (una de sus categorías predefinidas). Los filtros de palabras
    bloquean palabras o frases exactas, como el nombre de la competencia.
  distractores:
    c: Están pensados para temas descritos en lenguaje natural; para un nombre propio exacto, el filtro de palabras
      es más directo (y no tiene coste).
    d: Detectan datos personales o patrones con expresiones regulares, no mensajes de odio ni nombres de empresas.
    e: Detecta respuestas no basadas en una fuente; no bloquea odio ni nombres concretos.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
- id: D4-013
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: ordering
  dificultad: media
  enunciado: Una aplicación invoca un modelo de Amazon Bedrock con un guardrail configurado para entradas y respuestas.
    Ordena lo que ocurre en una petición en la que la entrada es aceptable y la respuesta no.
  opciones:
  - id: a
    texto: El guardrail evalúa la entrada del usuario con las políticas configuradas
  - id: b
    texto: El guardrail evalúa la respuesta generada por el modelo
  - id: c
    texto: La respuesta se sustituye por el mensaje de bloqueo o se enmascaran los datos, según la política
  - id: d
    texto: Como la entrada no infringe ninguna política, se invoca el modelo
  correctas:
  - a
  - d
  - b
  - c
  explicacion: Guardrails evalúa primero la entrada; si hubiera infracción, devolvería el mensaje de bloqueo sin
    invocar el modelo. Si no, se invoca el modelo, se evalúa su respuesta y, si infringe una política, se bloquea
    o se enmascara.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-how.html
- id: D4-014
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa que nunca ha usado SageMaker AI quiere comparar tres modelos fundacionales de Amazon Bedrock
    según cuántos estereotipos y cuánto contenido nocivo generan con sus propios prompts. ¿Qué herramienta debe
    usar?
  opciones:
  - id: a
    texto: Amazon Bedrock Guardrails con temas denegados
  - id: b
    texto: Amazon SageMaker Clarify
  - id: c
    texto: Amazon SageMaker Model Monitor
  - id: d
    texto: Amazon Bedrock Evaluations
  correctas:
  - d
  explicacion: Bedrock Evaluations permite evaluar modelos con un modelo juez y métricas integradas como estereotipos,
    nocividad y rechazo, con conjuntos de prompts propios. Es la vía gestionada que AWS indica para modelos fundacionales.
  distractores:
    a: Filtra contenido en tiempo de ejecución; no compara modelos candidatos con métricas.
    b: Ya no admite clientes nuevos; AWS indica Bedrock Evaluations para evaluar modelos fundacionales.
    c: Monitoriza modelos de SageMaker AI en producción y ya no admite clientes nuevos; no compara modelos fundacionales.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
- id: D4-015
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo analiza la factura de un asistente que usa Amazon Bedrock Guardrails. Muchas preguntas de
    los usuarios se bloquean en la entrada por insultos. ¿Qué se cobra en esas peticiones bloqueadas?
  opciones:
  - id: a
    texto: Solo la inferencia del modelo, porque Guardrails no tiene precio propio
  - id: b
    texto: Nada, porque las peticiones bloqueadas no tienen coste
  - id: c
    texto: La evaluación del guardrail, pero no la inferencia del modelo, que no llega a invocarse
  - id: d
    texto: La evaluación del guardrail y también la inferencia completa del modelo, aunque no se devuelva su respuesta
  correctas:
  - c
  explicacion: Según la documentación, si un guardrail bloquea la entrada se cobra su evaluación y no hay cargos
    de inferencia del modelo. Si bloquea la respuesta, se cobran la evaluación de la entrada y de la respuesta y
    la inferencia del modelo.
  distractores:
    a: Guardrails se cobra por unidad de texto y por salvaguarda configurada.
    b: La evaluación del guardrail se cobra aunque bloquee la entrada.
    d: Si el guardrail bloquea la entrada, el modelo no se invoca y no hay inferencia que pagar.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-how.html
- id: D4-016
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aseguradora va a clasificar 2 millones de correos al mes en 8 categorías. Un modelo grande de razonamiento
    acierta un 96 % y uno pequeño, un 95 %, con una fracción del coste y del consumo. El error del 1 % adicional
    no tiene impacto relevante en el negocio. ¿Qué elección es la más responsable?
  opciones:
  - id: a
    texto: El modelo grande, porque más capacidad reduce el riesgo
  - id: b
    texto: El modelo pequeño, que cumple con menos coste y consumo
  - id: c
    texto: Ajustar con fine-tuning el modelo grande para que supere el 96 %
  - id: d
    texto: Preentrenar un modelo propio para no depender de proveedores
  correctas:
  - b
  explicacion: 'Las buenas prácticas de sostenibilidad de AWS piden elegir el modelo del tamaño justo: el más pequeño
    que cumple los requisitos. Aquí cumple el pequeño y la diferencia de exactitud no importa al negocio.'
  distractores:
    a: 'Más capacidad no es más responsable si no hace falta: consume más energía y cuesta más por cada inferencia.'
    c: Añade coste y consumo para una mejora que el negocio no necesita.
    d: Un preentrenamiento tiene una huella enorme y no aporta nada frente a un modelo pequeño que ya cumple.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/sustainability.html
- id: D4-017
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: multiple_choice
  dificultad: media
  enunciado: El departamento de RR. HH. quiere que los empleados encuentren el documento de una política interna
    escribiendo palabras clave. Un equipo propone desplegar un modelo generativo grande para ello. Según las buenas
    prácticas de sostenibilidad de AWS, ¿qué deben hacer primero?
  opciones:
  - id: a
    texto: Elegir el modelo generativo con la ventana de contexto más grande disponible
  - id: b
    texto: Ajustar el modelo con el texto de las políticas de la empresa
  - id: c
    texto: Comprobar si hace falta IA generativa
  - id: d
    texto: Contratar Provisioned Throughput para reservar la capacidad
  correctas:
  - c
  explicacion: 'El primer principio de sostenibilidad del Generative AI Lens es identificar si la IA generativa
    es la solución adecuada: si un buscador obtiene el mismo resultado, consume muchos menos recursos que un modelo
    generativo.'
  distractores:
    a: Agrava el consumo sin necesidad; el caso es una búsqueda por palabras clave.
    b: Es costoso y no resuelve mejor una búsqueda por palabras clave.
    d: Reserva capacidad que puede quedar ociosa; además, la primera pregunta es si hace falta un modelo generativo.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/sustainability.html
- id: D4-018
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: multiple_response
  dificultad: media
  enunciado: Una empresa quiere reducir la huella ambiental de una carga de inferencia de IA generativa con tráfico
    muy variable a lo largo del día, sin perder calidad. ¿Qué DOS prácticas recomienda AWS? (Elige DOS.)
  opciones:
  - id: a
    texto: Mantener las instancias encendidas a máxima capacidad para evitar arranques en frío
  - id: b
    texto: Usar servicios serverless o autoescalado para no mantener capacidad ociosa
  - id: c
    texto: Elegir el modelo con la mayor ventana de contexto para no recortar prompts
  - id: d
    texto: Elegir el modelo más pequeño que cumpla los requisitos de calidad
  - id: e
    texto: Preentrenar un modelo propio para controlar su eficiencia
  correctas:
  - b
  - d
  explicacion: El Generative AI Lens recomienda diseñar para la eficiencia (modelos del tamaño justo, personalización
    eficiente) y optimizar dinámicamente los recursos (autoescalado y serverless) para no consumir energía en capacidad
    ociosa.
  distractores:
    a: Deja recursos ociosos en las horas de poco tráfico, justo lo que las buenas prácticas piden evitar.
    c: Un modelo mayor de lo necesario consume más en cada inferencia; la ventana se elige según el caso.
    e: El preentrenamiento tiene una huella enorme; reutilizar un modelo preentrenado es más sostenible.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/sustainability.html
- id: D4-019
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: multiple_choice
  dificultad: baja
  enunciado: Antes de adoptar un modelo de Amazon Nova para un caso de uso, el equipo quiere consultar la información
    que publica AWS sobre sus usos previstos, sus limitaciones y sus decisiones de diseño responsable. ¿Dónde la
    encuentra?
  opciones:
  - id: a
    texto: En los registros de AWS CloudTrail
  - id: b
    texto: En las AWS AI Service Cards
  - id: c
    texto: En Amazon SageMaker Model Cards
  - id: d
    texto: En los resultados de Amazon Bedrock Evaluations
  correctas:
  - b
  explicacion: 'Las AI Service Cards son el recurso de transparencia de AWS: reúnen en un sitio los casos de uso
    previstos, las limitaciones, las decisiones de diseño responsable y las buenas prácticas de sus servicios y
    modelos, como Amazon Nova.'
  distractores:
    a: Registran llamadas a las API de la cuenta; no describen usos previstos ni limitaciones de un modelo.
    c: Sirven para que el cliente documente sus propios modelos, no recogen la información que publica AWS sobre
      los suyos.
    d: Miden el comportamiento con los datos del cliente; no son la documentación del proveedor sobre el uso previsto.
  referencia: https://aws.amazon.com/ai/responsible-ai/resources/
- id: D4-020
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa despliega en Amazon EC2 un modelo de deep learning propio para inferencia a gran escala
    y tiene objetivos de sostenibilidad. ¿Qué tipo de instancia ayuda más a reducir el consumo por inferencia?
  opciones:
  - id: a
    texto: Instancias de GPU de uso general sobredimensionadas para absorber los picos
  - id: b
    texto: Instancias de cómputo general con CPU, sin aceleradores
  - id: c
    texto: Instancias Inf2 con AWS Inferentia2
  - id: d
    texto: Réplicas encendidas de forma permanente en varias Regiones
  correctas:
  - c
  explicacion: AWS indica que las instancias Inf2, con chips Inferentia2 diseñados para ejecutar modelos de deep
    learning a escala, ofrecen hasta un 50 % más de rendimiento por vatio que instancias EC2 comparables y ayudan
    a cumplir objetivos de sostenibilidad.
  distractores:
    a: Sobredimensionar deja capacidad ociosa y aumenta el consumo.
    b: Para modelos de deep learning a escala suelen ofrecer peor rendimiento por vatio que un acelerador diseñado
      para inferencia.
    d: Multiplican la capacidad ociosa; no reducen el consumo por inferencia.
  referencia: https://aws.amazon.com/ai/machine-learning/inferentia/
- id: D4-021
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.3
  tipo: matching
  dificultad: media
  enunciado: Un equipo elige de forma responsable un modelo fundacional para un servicio de banca en Europa. Empareja
    cada necesidad con lo que hay que revisar.
  prompts:
  - id: '1'
    texto: Poder vender un producto basado en el modelo
  - id: '2'
    texto: Cumplir la normativa sobre dónde se procesan los datos
  - id: '3'
    texto: Reducir el impacto ambiental
  - id: '4'
    texto: Evitar respuestas tóxicas o con estereotipos
  opciones:
  - id: a
    texto: Las condiciones de la licencia del modelo
  - id: b
    texto: La disponibilidad del modelo en la Región requerida
  - id: c
    texto: Los resultados de Bedrock Evaluations con datos propios
  - id: d
    texto: El número de descargas del modelo en un repositorio público
  - id: e
    texto: El tamaño del modelo y su consumo por inferencia
  correctas:
  - - '1'
    - a
  - - '2'
    - b
  - - '3'
    - e
  - - '4'
    - c
  explicacion: La licencia dice si se permite el uso comercial; la Región, si se respeta la residencia de los datos;
    el tamaño, cuánta energía consume; y las evaluaciones con datos propios, cómo se comporta el modelo en las dimensiones
    responsables.
  distractores:
    d: La popularidad no informa sobre licencia, residencia, consumo ni comportamiento responsable.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: D4-022
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una agencia de marketing genera textos e imágenes de campañas con IA generativa y le preocupan las
    reclamaciones por derechos de autor. ¿Qué medida reduce MÁS ese riesgo?
  opciones:
  - id: a
    texto: Activar un filtro de palabras con los títulos de obras protegidas
  - id: b
    texto: Un servicio con indemnización de AWS, filtros activos y revisión previa
  - id: c
    texto: Usar el modelo de un proveedor externo en Bedrock, que también cubre la indemnización de AWS
  - id: d
    texto: Incluir en el prompt obras protegidas como referencia de estilo
  correctas:
  - b
  explicacion: AWS ofrece indemnización sin límite por reclamaciones de derechos de autor sobre la salida de sus
    modelos y servicios cubiertos, siempre que se usen de forma responsable (sin introducir material infractor ni
    desactivar filtros). La revisión humana añade otra barrera.
  distractores:
    a: Un filtro de palabras bloquea términos exactos en el texto; no impide que una imagen o un texto generados
      se parezcan a una obra protegida.
    c: La indemnización cubre los modelos de Amazon y los servicios enumerados en las condiciones de servicio; no
      hay que dar por hecho que cubre los modelos de otros proveedores.
    d: 'Aumenta el riesgo: introducir material que infringe derechos va contra el uso responsable que exige la indemnización.'
  referencia: https://aws.amazon.com/bedrock/faqs/
- id: D4-023
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.4
  tipo: multiple_choice
  dificultad: alta
  enunciado: El equipo jurídico de una editorial pregunta qué cubre la indemnización de propiedad intelectual que
    AWS ofrece para sus servicios de IA generativa. ¿Qué respuesta es la correcta?
  opciones:
  - id: a
    texto: Las reclamaciones por daños causados por respuestas inexactas del modelo
  - id: b
    texto: Reclamaciones de terceros por derechos de autor sobre la salida, con uso responsable
  - id: c
    texto: La salida de los modelos de proveedores externos, sin condiciones de uso
  - id: d
    texto: Las sanciones que imponga una autoridad por incumplir el Reglamento de IA de la Unión Europea
  correctas:
  - b
  explicacion: Según las preguntas frecuentes de Bedrock, la indemnización es sin límite frente a reclamaciones
    de terceros por derechos de autor sobre la salida de los modelos de Amazon y de los servicios enumerados en
    la sección 50.10 de las Service Terms, con uso responsable.
  distractores:
    a: La indemnización trata reclamaciones por derechos de autor sobre la salida, no daños por inexactitudes.
    c: Cubre los modelos de Amazon y los servicios enumerados en las condiciones, y exige un uso responsable.
    d: La política de AWS deja al cliente la responsabilidad de cumplir las leyes aplicables, incluidas las de IA.
  referencia: https://aws.amazon.com/bedrock/faqs/
- id: D4-024
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.4
  tipo: multiple_response
  dificultad: media
  enunciado: El asistente de una aerolínea prometió a un cliente un reembolso según una política que no existe.
    El caso se difundió en redes sociales. ¿Qué DOS riesgos de la IA generativa se han materializado? (Elige DOS.)
  opciones:
  - id: a
    texto: Alucinación del modelo
  - id: b
    texto: Resultados sesgados contra un grupo de clientes
  - id: c
    texto: Infracción de propiedad intelectual
  - id: d
    texto: Pérdida de confianza de los clientes
  - id: e
    texto: Incumplimiento de la residencia de los datos de los clientes
  correctas:
  - a
  - d
  explicacion: El modelo inventó una política (alucinación) y la difusión pública daña la reputación (pérdida de
    confianza). La empresa además puede tener que responder de lo prometido, porque es responsable de las salidas
    de su sistema.
  distractores:
    b: No se describe un trato desigual entre grupos, sino una respuesta inventada.
    c: No hay contenido protegido de terceros implicado.
    e: El problema no es dónde se procesan los datos, sino lo que respondió el modelo.
  referencia: https://aws.amazon.com/ai/responsible-ai/policy/
- id: D4-025
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aplicación de salud usa un modelo de Amazon Bedrock para responder dudas generales. El equipo detecta
    que algunos usuarios le preguntan qué dosis tomar de un medicamento. ¿Qué medida reduce MÁS el riesgo para el
    usuario final?
  opciones:
  - id: a
    texto: Un tema denegado sobre dosificación, avisos claros y derivar a un profesional
  - id: b
    texto: Cambiar a un modelo más grande y reciente, que suele equivocarse menos en temas médicos
  - id: c
    texto: Activar prompt caching para responder más rápido y barato
  - id: d
    texto: Poner la temperatura a 0 para que la respuesta no varíe entre llamadas
  correctas:
  - a
  explicacion: El riesgo para el usuario final se reduce limitando lo que el sistema puede hacer en temas con consecuencias
    graves, informando con claridad y derivando a una persona cualificada.
  distractores:
    b: Reduce errores, pero el asistente seguiría dando consejos de dosificación, que es el riesgo.
    c: Mejora coste y latencia; no reduce el riesgo para el usuario.
    d: Una respuesta estable puede ser igualmente incorrecta; no evita el consejo médico.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
- id: D4-026
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.4
  tipo: matching
  dificultad: media
  enunciado: Empareja cada riesgo legal de la IA generativa con la mitigación más directa.
  prompts:
  - id: '1'
    texto: Reclamación por infracción de propiedad intelectual
  - id: '2'
    texto: Resultados sesgados en la selección de personal
  - id: '3'
    texto: Alucinaciones en un asistente de condiciones comerciales
  - id: '4'
    texto: Pérdida de confianza por respuestas ofensivas
  opciones:
  - id: a
    texto: Filtros de contenido de Amazon Bedrock Guardrails
  - id: b
    texto: Análisis por subgrupos y supervisión humana de las decisiones
  - id: c
    texto: Servicio con indemnización, filtros activos y revisión antes de publicar
  - id: d
    texto: RAG con citas y comprobación de grounding contextual
  - id: e
    texto: Publicar la ficha de uso previsto del modelo
  correctas:
  - - '1'
    - c
  - - '2'
    - b
  - - '3'
    - d
  - - '4'
    - a
  explicacion: 'Cada riesgo tiene una mitigación propia: indemnización y revisión para la propiedad intelectual;
    medición por grupos y supervisión humana para el sesgo; fuentes y grounding para las alucinaciones; filtros
    de contenido para las salidas ofensivas.'
  distractores:
    e: Es una medida de transparencia útil, pero no es la mitigación más directa de ninguno de los cuatro riesgos.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: D4-027
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.4
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una consultora de selección descubre que su modelo de cribado de currículos puntúa de forma sistemáticamente
    más baja a las candidatas con el mismo perfil que los candidatos. ¿Qué riesgo legal representa?
  opciones:
  - id: a
    texto: Infracción de propiedad intelectual
  - id: b
    texto: Resultados sesgados que pueden suponer discriminación
  - id: c
    texto: Alucinación del modelo
  - id: d
    texto: Incumplimiento de la residencia de los datos de los candidatos
  correctas:
  - b
  explicacion: Puntuar peor a un grupo con el mismo perfil es un resultado sesgado; en selección de personal puede
    constituir discriminación, uno de los riesgos legales que cita la guía.
  distractores:
    a: No hay obras protegidas implicadas en el cribado.
    c: 'El modelo no inventa datos: puntúa de forma desigual a un grupo.'
    d: El problema no es dónde se procesan los datos, sino el trato desigual.
  referencia: https://aws.amazon.com/ai/responsible-ai/policy/
- id: D4-028
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un sistema de verificación facial de un banco funciona bien con la mayoría de clientes, pero falla
    mucho más con las personas de piel oscura, que apenas aparecían en los datos de entrenamiento. ¿Qué acción corrige
    la causa del problema?
  opciones:
  - id: a
    texto: Añadir más imágenes del grupo mayoritario
  - id: b
    texto: Entrenar durante más épocas con el mismo conjunto de datos para afinar el modelo
  - id: c
    texto: Usar un modelo más grande con los mismos datos
  - id: d
    texto: Añadir datos representativos de los grupos poco representados
  correctas:
  - d
  explicacion: 'El problema es de inclusividad y diversidad de los datos: un grupo con pocos ejemplos se aprende
    peor. Hay que completar el conjunto con datos representativos y comprobar la calidad para cada grupo.'
  distractores:
    a: Aumentaría el desequilibrio en lugar de reducirlo.
    b: El modelo seguiría aprendiendo casi solo del grupo mayoritario.
    c: Un modelo mayor no compensa la falta de ejemplos de un grupo.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html
- id: D4-029
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: multiple_choice
  dificultad: media
  enunciado: Un conjunto de entrenamiento para conceder créditos contiene 9 000 solicitudes del grupo a y 1 000
    del grupo d. ¿Cuál es el desequilibrio de clases (CI) según la fórmula que publica AWS, (na − nd) / (na + nd)?
  opciones:
  - id: a
    texto: 0,9
  - id: b
    texto: '9'
  - id: c
    texto: 0,8
  - id: d
    texto: 0,1
  correctas:
  - c
  explicacion: CI = (9 000 − 1 000) / (9 000 + 1 000) = 8 000 / 10 000 = 0,8. Un valor cercano a 0 indica grupos
    equilibrados; 0,8 avisa de que el modelo puede ajustarse peor al grupo d.
  distractores:
    a: Es la proporción del grupo a sobre el total (9 000 / 10 000), no el desequilibrio de clases.
    b: Es el cociente entre los dos grupos (9 000 / 1 000), no la fórmula normalizada, que va de −1 a 1.
    d: Es la proporción del grupo d sobre el total (1 000 / 10 000).
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-bias-metric-class-imbalance.html
- id: D4-030
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa quiere ajustar un modelo con conversaciones de atención al cliente. Un empleado propone
    usar miles de mensajes descargados de foros públicos, de origen desconocido y con lenguaje tóxico. ¿Qué característica
    de un buen conjunto de datos están incumpliendo?
  opciones:
  - id: a
    texto: Que sea lo bastante grande para cubrir los temas posibles de atención al cliente
  - id: b
    texto: Que esté etiquetado por el propio modelo para ahorrar coste
  - id: c
    texto: Que proceda de fuentes curadas, de origen conocido y revisado
  - id: d
    texto: Que se entrene durante más épocas para filtrar el ruido
  correctas:
  - c
  explicacion: 'Los datos de ajuste deben venir de fuentes curadas: de origen conocido, revisados, con derechos
    de uso y sin contenido inadecuado. Lo contrario introduce toxicidad, sesgos y riesgos legales.'
  distractores:
    a: El tamaño no compensa un origen desconocido y contenido tóxico; más datos de mala calidad empeoran el modelo.
    b: Etiquetar con el modelo no resuelve el origen ni la toxicidad de los datos.
    d: Más épocas con datos tóxicos aumentan el riesgo de que el modelo los reproduzca.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp05.html
- id: D4-031
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: multiple_response
  dificultad: media
  enunciado: Un equipo necesita un conjunto de evaluación con suficientes ejemplos de cada grupo de edad para medir
    la equidad de un modelo con confianza estadística. ¿Qué DOS prácticas le ayudan? (Elige DOS.)
  opciones:
  - id: a
    texto: Recoger datos adicionales de los grupos con poca representación
  - id: b
    texto: Eliminar los ejemplos de los grupos minoritarios para reducir el ruido
  - id: c
    texto: 'Usar muestreo estratificado: dividir la población en subgrupos y muestrear cada uno'
  - id: d
    texto: Duplicar los ejemplos del grupo mayoritario
  - id: e
    texto: Inferir la edad de cada persona a partir de su nombre
  correctas:
  - a
  - c
  explicacion: El Responsible AI Lens recomienda cubrir los huecos de representación recogiendo más datos de los
    grupos infrarrepresentados o con muestreo estratificado, y calcular si hay ejemplos suficientes por grupo.
  distractores:
    b: Empeora la representación y hace imposible medir la equidad para esos grupos.
    d: Aumenta el desequilibrio en lugar de corregirlo.
    e: Introduce errores y sesgos; AWS recomienda preferir etiquetas demográficas declaradas por las personas.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html
- id: D4-032
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: multiple_choice
  dificultad: alta
  enunciado: Para evaluar la equidad de un servicio, un equipo necesita saber el grupo demográfico de cada persona
    del conjunto de datos. Barajan varias fuentes para esa etiqueta. ¿Cuál recomiendan las buenas prácticas de AWS?
  opciones:
  - id: a
    texto: No etiquetar y asumir que el conjunto está equilibrado
  - id: b
    texto: Etiquetas que estiman los anotadores según la apariencia
  - id: c
    texto: Etiquetas que infiere un modelo de visión a partir de fotos
  - id: d
    texto: Etiquetas declaradas por las propias personas
  correctas:
  - d
  explicacion: El Responsible AI Lens recomienda considerar etiquetas demográficas declaradas por las personas (encuestas
    o información aportada por el usuario) en lugar de predicciones algorítmicas o humanas.
  distractores:
    a: Sin etiquetas no se puede medir la representación ni la equidad por grupo.
    b: Las estimaciones humanas también introducen errores y sesgos de los anotadores.
    c: Una inferencia algorítmica puede equivocarse y trasladar sus propios sesgos a la evaluación.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html
- id: D4-033
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: multiple_choice
  dificultad: media
  enunciado: El equipo de datos de una aseguradora quiere que cada conjunto de datos lleve un documento con su uso
    previsto y no previsto, sus fuentes, cómo se recogió, quién lo etiquetó y sus sesgos conocidos, y que se actualice
    cuando cambie. ¿Qué artefacto describe esta práctica?
  opciones:
  - id: a
    texto: Un registro de AWS CloudTrail
  - id: b
    texto: Una ficha de datos (datasheet) por conjunto
  - id: c
    texto: Una SageMaker Model Card por cada conjunto de datos
  - id: d
    texto: Una AWS AI Service Card
  correctas:
  - b
  explicacion: 'El Responsible AI Lens recomienda documentar cada conjunto de datos con una ficha (datasheet): usos
    previstos e inapropiados, fuentes, recogida, etiquetado, distribución y sesgos conocidos, como documento vivo.'
  distractores:
    a: Registra llamadas a las API; no describe el contenido ni el origen de un conjunto de datos.
    c: Las Model Cards documentan modelos (uso previsto, riesgo, evaluación); la práctica descrita documenta cada
      conjunto de datos.
    d: Las publica AWS sobre sus servicios y modelos; no documentan los datos del cliente.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp04-bp05.html
- id: D4-034
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.5
  tipo: ordering
  dificultad: media
  enunciado: Un equipo prepara el conjunto de evaluación de un asistente según el Responsible AI Lens. Ordena los
    pasos.
  opciones:
  - id: a
    texto: Determinar quién usará el sistema y cómo lo usará
  - id: b
    texto: Comparar la composición del conjunto con ese uso real e identificar huecos
  - id: c
    texto: Documentar qué se incluyó y qué se excluyó en la ficha de datos
  - id: d
    texto: Cubrir los huecos con datos adicionales o muestreo estratificado
  correctas:
  - a
  - b
  - d
  - c
  explicacion: Primero se define el uso real; luego se compara el conjunto con él; después se rellenan los huecos;
    por último se documenta lo incluido y excluido para conocer las limitaciones de los resultados.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp01.html
- id: D4-035
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un modelo para detectar fraude obtiene un 99 % de exactitud con los datos de entrenamiento y un 70
    % con datos nuevos. ¿Qué le ocurre?
  opciones:
  - id: a
    texto: 'Sobreajuste: alta varianza'
  - id: b
    texto: 'Subajuste: alto sesgo'
  - id: c
    texto: Ajuste equilibrado con datos ruidosos
  - id: d
    texto: Deriva de los datos en producción
  correctas:
  - a
  explicacion: 'Rendir muy bien con los datos de entrenamiento y mal con los nuevos es el síntoma del sobreajuste:
    el modelo memoriza en lugar de generalizar, lo que AWS describe como alta varianza.'
  distractores:
    b: Con alto sesgo el modelo fallaría también con los datos de entrenamiento, y aquí acierta un 99 %.
    c: Un ajuste equilibrado tiene errores parecidos en entrenamiento y en prueba; 29 puntos de diferencia no lo
      son.
    d: La deriva aparece cuando cambian los datos reales con el tiempo; aquí la diferencia ya existe entre entrenamiento
      y prueba.
  referencia: https://aws.amazon.com/what-is/overfitting/
- id: D4-036
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: multiple_choice
  dificultad: media
  enunciado: Un modelo de previsión de demanda obtiene un 61 % de exactitud con los datos de entrenamiento y un
    60 % con los de prueba, muy por debajo de lo que necesita el negocio. ¿Qué acción es la más adecuada?
  opciones:
  - id: a
    texto: Usar un modelo más capaz o entrenarlo durante más tiempo
  - id: b
    texto: Detener antes el entrenamiento para evitar memorizar
  - id: c
    texto: Aumentar la regularización para simplificar el modelo y evitar que memorice
  - id: d
    texto: Reducir el número de características de entrada
  correctas:
  - a
  explicacion: 'Fallar por igual en entrenamiento y en prueba es subajuste (alto sesgo): el modelo es demasiado
    simple o se entrenó poco. Se corrige con más capacidad, mejores características o más tiempo de entrenamiento.'
  distractores:
    b: Es un remedio contra el sobreajuste; aquí el problema es el contrario.
    c: Simplificaría aún más un modelo que ya no capta la relación entre los datos.
    d: Quitaría información a un modelo que ya es demasiado simple.
  referencia: https://aws.amazon.com/what-is/overfitting/
- id: D4-037
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: multiple_choice
  dificultad: media
  enunciado: Un modelo de concesión de créditos tiene una exactitud global del 93 %, pero se equivoca tres veces
    más con los trabajadores autónomos, que eran solo el 4 % de los datos de entrenamiento. ¿Cuál es la explicación
    más probable?
  opciones:
  - id: a
    texto: Los datos de producción han derivado con el tiempo respecto a los de entrenamiento
  - id: b
    texto: El grupo tenía pocos ejemplos y el modelo se ajustó peor a él
  - id: c
    texto: La temperatura del modelo es demasiado alta
  - id: d
    texto: El modelo tiene alto sesgo con carácter general
  correctas:
  - b
  explicacion: 'Un grupo con pocos ejemplos se aprende peor: el modelo se ajusta al grupo mayoritario y comete más
    errores (o se sobreajusta) con el minoritario. Es uno de los efectos del sesgo y la varianza sobre los grupos
    demográficos.'
  distractores:
    a: No se describe un cambio temporal, sino un grupo con poca representación desde el entrenamiento.
    c: La temperatura es un parámetro de los modelos generativos; no explica más errores en un grupo concreto.
    d: Con alto sesgo generalizado la exactitud global no sería del 93 %; el problema se concentra en un grupo.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-bias-metric-class-imbalance.html
- id: D4-038
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: multiple_response
  dificultad: media
  enunciado: Un modelo de clasificación de imágenes rinde muy bien con los datos de entrenamiento y mal con los
    nuevos. ¿Qué DOS acciones ayudan a reducir el problema? (Elige DOS.)
  opciones:
  - id: a
    texto: Eliminar el conjunto de validación para entrenar con más datos
  - id: b
    texto: Añadir más características de entrada
  - id: c
    texto: Reducir la complejidad del modelo o aumentar la regularización
  - id: d
    texto: Añadir más datos de entrenamiento y más variados
  - id: e
    texto: Entrenar durante más épocas con los mismos datos
  correctas:
  - c
  - d
  explicacion: El sobreajuste (alta varianza) se reduce dando al modelo más ejemplos y más diversos o reduciendo
    su flexibilidad (menos complejidad, más regularización), y se detecta comparando el error en entrenamiento y
    en validación.
  distractores:
    a: Se perdería la forma de detectar el sobreajuste.
    b: Más características aumentan la capacidad de memorizar ruido.
    e: Más épocas suelen aumentar la memorización en un modelo sobreajustado.
  referencia: https://aws.amazon.com/what-is/overfitting/
- id: D4-039
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: matching
  dificultad: baja
  enunciado: Tres modelos de detección de fraude tienen estas exactitudes (entrenamiento / prueba). Empareja cada
    modelo con su diagnóstico.
  prompts:
  - id: '1'
    texto: 'Modelo A: 62 % / 60 %'
  - id: '2'
    texto: 'Modelo B: 99 % / 71 %'
  - id: '3'
    texto: 'Modelo C: 91 % / 89 %'
  opciones:
  - id: a
    texto: Subajuste (alto sesgo)
  - id: b
    texto: Deriva de los datos
  - id: c
    texto: Ajuste equilibrado
  - id: d
    texto: Sobreajuste (alta varianza)
  correctas:
  - - '1'
    - a
  - - '2'
    - d
  - - '3'
    - c
  explicacion: A falla en los dos conjuntos (subajuste); B acierta en entrenamiento y falla en prueba (sobreajuste);
    C tiene un error bajo y parecido en ambos (generaliza).
  distractores:
    b: La deriva es un cambio de los datos reales con el tiempo en producción; no se diagnostica con la comparación
      entre entrenamiento y prueba.
  referencia: https://aws.amazon.com/what-is/overfitting/
- id: D4-040
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.6
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un modelo que predice el rendimiento académico se entrenó solo con alumnos de una universidad privada
    de rentas altas. Al usarlo en universidades públicas, su exactitud cae mucho. ¿Cómo describe AWS este problema?
  opciones:
  - id: a
    texto: Sobreajuste a una población no representada en el entrenamiento
  - id: b
    texto: 'Subajuste: el modelo necesitaba más épocas de entrenamiento con los mismos datos'
  - id: c
    texto: 'Alucinación: el modelo inventa datos de los alumnos'
  - id: d
    texto: Deriva del concepto por el paso del tiempo
  correctas:
  - a
  explicacion: 'La página de AWS sobre sobreajuste usa este ejemplo: el modelo se ajustó demasiado a los datos de
    una población concreta y su exactitud cae con alumnos cuyas características demográficas no estaban en los datos.'
  distractores:
    b: El modelo funcionaba bien con su población de origen; más épocas aumentarían la memorización.
    c: Es un modelo predictivo que se equivoca con otra población, no un modelo generativo que inventa contenido.
    d: No ha cambiado la relación con el tiempo; el modelo se aplica a otra población distinta de la de entrenamiento.
  referencia: https://aws.amazon.com/what-is/overfitting/
- id: D4-041
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.7
  tipo: multiple_choice
  dificultad: media
  enunciado: Un modelo de préstamos aprueba al 60 % de las solicitudes del grupo a y al 42 % de las del grupo d.
    ¿Cuál es el impacto dispar (DI) según la fórmula que publica AWS, q'd / q'a?
  opciones:
  - id: a
    texto: 0,7
  - id: b
    texto: 1,43
  - id: c
    texto: 0,18
  - id: d
    texto: 0,42
  correctas:
  - a
  explicacion: DI = q'd / q'a = 0,42 / 0,60 = 0,7. Un valor de 1 indica paridad; por debajo de 1, el grupo d recibe
    proporcionalmente menos resultados positivos.
  distractores:
    b: Es el cociente invertido (0,60 / 0,42); DI pone el grupo desfavorecido en el numerador.
    c: Es la diferencia (0,60 − 0,42), que corresponde a otra métrica (DPPL), no al cociente.
    d: Es solo la tasa de aprobación del grupo d, sin compararla con la del grupo a.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-post-training-bias-metric-di.html
- id: D4-042
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.7
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un modelo de detección de fraude tiene una exactitud global del 94 %, pero el área de atención al cliente
    recibe más quejas de clientes mayores de 70 años. ¿Qué práctica permite confirmar si hay sesgo?
  opciones:
  - id: a
    texto: Revisar con un modelo juez una muestra aleatoria de las decisiones del último mes
  - id: b
    texto: Calcular las métricas por subgrupo de edad y compararlas con un umbral aceptable pactado
  - id: c
    texto: Crear una SageMaker Model Card del modelo
  - id: d
    texto: Subir el objetivo de exactitud global al 97 %
  correctas:
  - b
  explicacion: El análisis por subgrupos calcula las mismas métricas para cada grupo y las compara con un umbral.
    Revela el sesgo que una exactitud media alta oculta.
  distractores:
    a: Una muestra aleatoria apenas incluirá al grupo afectado y no mide por grupos.
    c: Documenta el modelo, pero no mide si se equivoca más con un grupo.
    d: La media puede seguir ocultando un grupo con mucho más error.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp02.html
- id: D4-043
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.7
  tipo: multiple_choice
  dificultad: media
  enunciado: 'Las etiquetas de un conjunto de reseñas, hechas por un equipo externo, parecen inconsistentes: la
    misma reseña recibe a veces etiquetas distintas. ¿Qué práctica permite comprobar y mejorar la calidad de las
    etiquetas?'
  opciones:
  - id: a
    texto: Quitar las instrucciones de etiquetado para no condicionar al equipo
  - id: b
    texto: Entrenar durante más épocas para que el modelo compense el ruido
  - id: c
    texto: Duplicar el tamaño del conjunto con más reseñas etiquetadas por el mismo equipo externo
  - id: d
    texto: Medir el acuerdo entre anotadores e incluir ejemplos de control con respuesta conocida de antemano
  correctas:
  - d
  explicacion: El Responsible AI Lens recomienda formar a los anotadores, medir su acuerdo, usar ejemplos con respuesta
    conocida para detectar a quien no sigue las instrucciones y vigilar sus sesgos.
  distractores:
    a: Sin instrucciones las etiquetas serán todavía menos consistentes.
    b: Un modelo entrenado con etiquetas inconsistentes aprende esa inconsistencia.
    c: Más datos con el mismo problema no lo corrigen; lo amplifican.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp03.html
- id: D4-044
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.7
  tipo: multiple_choice
  dificultad: alta
  enunciado: Antes de lanzar un sistema de alto riesgo que prioriza solicitudes de ayudas sociales, la dirección
    quiere una comprobación del sesgo que no dependa del equipo que lo ha desarrollado. ¿Qué enfoque es el más adecuado?
  opciones:
  - id: a
    texto: Sustituir la revisión por un modelo juez con la rúbrica del equipo
  - id: b
    texto: Basarse en las métricas de sesgo que publica el proveedor del modelo
  - id: c
    texto: Una auditoría humana por un equipo independiente que construya su propio conjunto de evaluación del sistema
  - id: d
    texto: Que el equipo de desarrollo repita sus propias pruebas con otra semilla aleatoria y más iteraciones
  correctas:
  - c
  explicacion: El Responsible AI Lens recomienda corroborar de forma independiente las evaluaciones críticas o subjetivas,
    idealmente con evaluadores sin interés en el proyecto que construyan sus propios conjuntos de datos.
  distractores:
    a: Un juez LLM puede tener sus propios sesgos y la rúbrica sigue siendo la del equipo; en evaluaciones críticas
      se corrobora con personas independientes.
    b: No se refieren a los datos ni al caso de uso concretos del sistema.
    d: Sigue siendo el mismo equipo con los mismos datos y los mismos puntos ciegos.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raier01-bp02.html
- id: D4-045
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.7
  tipo: multiple_response
  dificultad: media
  enunciado: Una empresa tiene un asistente RAG en Amazon Bedrock y quiere detectar respuestas que no se basan en
    sus documentos, tanto antes del lanzamiento como en producción. ¿Qué DOS herramientas le ayudan? (Elige DOS.)
  opciones:
  - id: a
    texto: Una evaluación de RAG en Bedrock Evaluations (fidelidad)
  - id: b
    texto: La comprobación de grounding contextual de Amazon Bedrock Guardrails
  - id: c
    texto: Reducir el número máximo de tokens de salida
  - id: d
    texto: Una SageMaker Model Card que documente el modelo
  - id: e
    texto: Un filtro de palabras de Amazon Bedrock Guardrails
  correctas:
  - a
  - b
  explicacion: La comprobación de grounding contextual bloquea en tiempo de ejecución las respuestas no basadas
    en la fuente. Bedrock Evaluations mide antes del lanzamiento, entre otras, la fidelidad (si la respuesta contiene
    información que no está en el contexto).
  distractores:
    c: Acorta la respuesta, pero no impide que lo que diga sea inventado.
    d: Documenta el modelo; no detecta respuestas no basadas en la fuente.
    e: Bloquea palabras exactas; no compara la respuesta con los documentos.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
- id: D4-046
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.7
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una empresa que nunca ha usado SageMaker Model Monitor quiere vigilar cada semana si su modelo de préstamos
    empieza a tratar de forma distinta a algún grupo de clientes y recibir una alarma si ocurre. ¿Qué enfoque sigue
    las indicaciones vigentes de AWS?
  opciones:
  - id: a
    texto: Configurar un tema denegado de Bedrock Guardrails sobre préstamos
  - id: b
    texto: Activar la monitorización de deriva de sesgo de Amazon SageMaker Model Monitor en el endpoint
  - id: c
    texto: Medir el sesgo una única vez antes del despliegue
  - id: d
    texto: Métricas por grupo con las soluciones abiertas de AWS y alertas por umbral
  correctas:
  - d
  explicacion: El sesgo puede aparecer tras el despliegue si cambian los datos reales. Para clientes nuevos, AWS
    indica sustituir Model Monitor por sus soluciones abiertas de monitorización, que calculan métricas por segmento
    y avisan (por ejemplo, con Amazon SNS) al superar un umbral.
  distractores:
    a: Guardrails filtra contenido de modelos generativos; no mide el sesgo de un modelo de préstamos.
    b: Model Monitor ya no admite clientes nuevos; AWS remite a sus soluciones abiertas de monitorización con CloudWatch.
    c: El sesgo puede aparecer después si cambian los datos reales; hay que medirlo periódicamente.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-availability-change.html
- id: D4-047
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.7
  tipo: ordering
  dificultad: media
  enunciado: Ordena, a lo largo del ciclo de vida, los controles de sesgo de un modelo de préstamos.
  opciones:
  - id: a
    texto: Monitorizar el sesgo en producción y alertar si supera un umbral
  - id: b
    texto: Evaluar las métricas por subgrupo con datos de prueba
  - id: c
    texto: Medir el equilibrio entre grupos y las etiquetas del conjunto de datos
  - id: d
    texto: Entrenar o elegir el modelo
  - id: e
    texto: Someter el modelo a una auditoría humana independiente
  correctas:
  - c
  - d
  - b
  - e
  - a
  explicacion: 'El sesgo se controla en todo el ciclo: en los datos antes de entrenar, en la evaluación por subgrupos,
    con una revisión independiente antes del lanzamiento y con monitorización continua en producción.'
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp02.html
- id: D4-048
  dominio: 4
  tarea: '4.1'
  objetivo: 4.1.7
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aseguradora que trabaja desde hace años con SageMaker AI y sus herramientas de sesgo quiere medir,
    antes de entrenar, si su conjunto de pólizas está desequilibrado entre grupos de edad y, después, si las predicciones
    del modelo tratan de forma distinta a esos grupos. ¿Qué herramienta cubre las dos fases?
  opciones:
  - id: a
    texto: Amazon SageMaker Model Cards con la calificación de riesgo
  - id: b
    texto: Amazon Bedrock Evaluations con la métrica de estereotipos
  - id: c
    texto: Amazon Bedrock Guardrails con un tema denegado sobre la edad
  - id: d
    texto: Amazon SageMaker Clarify
  correctas:
  - d
  explicacion: Clarify calcula métricas de sesgo previas al entrenamiento (por ejemplo, CI o DPL) y posteriores
    (por ejemplo, DI). La aseguradora es cliente desde hace años, así que el cierre a clientes nuevos no le afecta.
  distractores:
    a: Documenta el modelo y su riesgo, pero no calcula métricas de sesgo.
    b: Evalúa modelos fundacionales; AWS aclara que no sustituye la detección de sesgo de modelos predictivos clásicos.
    c: Filtra contenido de modelos generativos en tiempo de ejecución; no mide el sesgo de un conjunto de datos
      ni de un modelo predictivo.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-configure-processing-jobs.html
- id: D4-049
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un regulador exige a una financiera que cualquier analista pueda seguir directamente la lógica de cada
    decisión de crédito, sin herramientas adicionales. El rendimiento de un modelo sencillo es suficiente. ¿Qué
    tipo de modelo encaja mejor?
  opciones:
  - id: a
    texto: Una red neuronal profunda con muchas capas
  - id: b
    texto: Un árbol de decisión pequeño o una regresión logística
  - id: c
    texto: Un modelo fundacional al que se le pide que justifique cada decisión
  - id: d
    texto: Un conjunto de muchos modelos profundos combinados
  correctas:
  - b
  explicacion: 'Los modelos simples, como una regresión o un árbol de decisión, son interpretables: sus coeficientes
    o sus ramas muestran cómo decide. Si cumplen el rendimiento, son la opción natural cuando hay que justificar
    cada decisión.'
  distractores:
    a: Su lógica interna no se puede seguir directamente; necesitaría explicaciones a posteriori.
    c: La justificación que genera no es la lógica interna del modelo y puede no reflejarla.
    d: Es aún más difícil de interpretar que un único modelo profundo.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html
- id: D4-050
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un cliente pregunta a su banco por qué se rechazó su solicitud de préstamo, y el banco le muestra los
    tres factores que más pesaron en esa decisión. ¿Qué propiedad del sistema está aplicando?
  opciones:
  - id: a
    texto: Veracidad, porque la decisión es correcta
  - id: b
    texto: Interpretabilidad global, porque muestra cómo funciona el modelo entero
  - id: c
    texto: Transparencia, porque informa de que el sistema usa IA
  - id: d
    texto: Explicabilidad, con una explicación local de esa predicción
  correctas:
  - d
  explicacion: La explicabilidad permite entender por qué el sistema dio una salida concreta. Mostrar los factores
    que pesaron en una predicción individual es una explicación local.
  distractores:
    a: La veracidad trata de que las salidas sean correctas, no de explicar por qué se produjeron.
    b: Una explicación global describe qué variables pesan en el modelo en general, no en la solicitud de este cliente.
    c: La transparencia informa sobre el sistema en general; aquí se explica una decisión concreta.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html
- id: D4-051
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.1
  tipo: multiple_choice
  dificultad: media
  enunciado: El comité de riesgos de una aseguradora quiere saber qué variables influyen más, en general, en las
    predicciones de su modelo de siniestralidad, no en un caso concreto. ¿Qué necesita?
  opciones:
  - id: a
    texto: Una explicación global de la importancia de cada variable del modelo
  - id: b
    texto: Una comprobación de grounding contextual
  - id: c
    texto: La matriz de confusión del modelo con los datos de prueba
  - id: d
    texto: Una explicación local de una predicción elegida al azar
  correctas:
  - a
  explicacion: Las importancias de las variables pueden ser globales (válidas para el modelo en todas las entradas)
    o locales (para una predicción). El comité pide la visión global.
  distractores:
    b: Es una salvaguarda de IA generativa para respuestas basadas en una fuente; no explica un modelo predictivo.
    c: Mide aciertos y errores, pero no qué variables influyen en las predicciones.
    d: Explica un caso, no el comportamiento general del modelo.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html
- id: D4-052
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.1
  tipo: multiple_response
  dificultad: media
  enunciado: Una empresa compara un modelo opaco (black box) con uno interpretable para aprobar devoluciones. ¿Qué
    DOS afirmaciones describen al modelo opaco? (Elige DOS.)
  opciones:
  - id: a
    texto: 'Su lógica interna no se ve: solo se observan sus entradas y salidas'
  - id: b
    texto: No se puede desplegar en AWS sin un permiso especial
  - id: c
    texto: Sus coeficientes muestran cuánto pesa cada variable
  - id: d
    texto: Rinde peor que el interpretable en problemas complejos
  - id: e
    texto: Es más difícil justificar sus decisiones ante auditores y reguladores
  correctas:
  - a
  - e
  explicacion: Un modelo opaco no deja ver cómo decide, lo que complica justificarlo y depurarlo; suele compensarlo
    con más rendimiento en problemas complejos, y se acompaña de explicaciones a posteriori.
  distractores:
    b: La opacidad no impide desplegarlo; es una cuestión de explicabilidad, no de permisos.
    c: Eso describe un modelo interpretable, como una regresión lineal.
    d: 'Suele ser al revés: los modelos complejos tienden a rendir más en problemas complejos, a cambio de ser menos
      interpretables.'
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html
- id: D4-053
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.1
  tipo: matching
  dificultad: baja
  enunciado: Un equipo de producto revisa su asistente de IA. Empareja cada práctica con el concepto que aplica.
  prompts:
  - id: '1'
    texto: Publicar que el asistente usa IA y cuáles son sus limitaciones
  - id: '2'
    texto: Mostrar al cliente los tres factores que pesaron en su rechazo
  - id: '3'
    texto: Leer los coeficientes de una regresión para entender cómo decide el modelo
  opciones:
  - id: a
    texto: Interpretabilidad
  - id: b
    texto: Explicabilidad
  - id: c
    texto: Veracidad
  - id: d
    texto: Transparencia
  correctas:
  - - '1'
    - d
  - - '2'
    - b
  - - '3'
    - a
  explicacion: 'Transparencia: información sobre el sistema para decidir. Explicabilidad: entender por qué salió
    una decisión concreta. Interpretabilidad: entender el funcionamiento interno del modelo sin herramientas.'
  distractores:
    c: Trata de que las salidas sean correctas; ninguna de las prácticas comprueba la exactitud de una respuesta.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: D4-054
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.1
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un agente de IA generativa de una empresa de telecomunicaciones resuelve incidencias consultando herramientas
    internas. Los supervisores necesitan entender cómo llegó a cada solución. ¿Qué mecanismo de explicabilidad es
    el más adecuado?
  opciones:
  - id: a
    texto: Valores SHAP calculados sobre los embeddings de la conversación
  - id: b
    texto: Una SageMaker Model Card del modelo fundacional
  - id: c
    texto: Subir la temperatura para que el agente detalle más sus respuestas
  - id: d
    texto: Las trazas del agente con sus pasos, herramientas consultadas y razonamiento
  correctas:
  - d
  explicacion: En IA generativa y agentes, la explicabilidad se apoya en las trazas (los pasos orquestados, las
    herramientas usadas), el razonamiento paso a paso y las citas. AWS cita las trazas de los agentes de Bedrock
    y AgentCore como ejemplo.
  distractores:
    a: SHAP explica la contribución de las variables en modelos predictivos; no reconstruye los pasos y herramientas
      de un agente.
    b: Documenta el modelo, pero no explica cómo se resolvió una incidencia concreta.
    c: Aumenta la variabilidad, no la explicabilidad de las decisiones.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp02-bp07.html
- id: D4-055
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: El comité de riesgos de un banco pide, para cada modelo propio de SageMaker AI, un documento con el
    uso previsto, la calificación de riesgo, los detalles de entrenamiento y los resultados de evaluación. ¿Qué
    herramienta deben usar?
  opciones:
  - id: a
    texto: AWS CloudTrail
  - id: b
    texto: Amazon Bedrock Guardrails con temas denegados
  - id: c
    texto: AWS AI Service Cards
  - id: d
    texto: Amazon SageMaker Model Cards
  correctas:
  - d
  explicacion: SageMaker Model Cards documenta en un único sitio el uso previsto y no previsto, la calificación
    de riesgo (desconocido, bajo, medio o alto), el entrenamiento, las métricas y la evaluación de un modelo, para
    gobierno y auditoría.
  distractores:
    a: Registra las llamadas a las API; no documenta el uso previsto ni la evaluación de un modelo.
    b: Filtra contenido en tiempo de ejecución; no documenta modelos.
    c: Las publica AWS sobre sus propios servicios y modelos; no documentan los modelos del cliente.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
- id: D4-056
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un auditor externo quiere comprobar qué información tenía documentada un modelo hace seis meses y qué
    se cambió después. El equipo usa Amazon SageMaker Model Cards. ¿Qué característica le ayuda?
  opciones:
  - id: a
    texto: La ficha calcula de nuevo las métricas de sesgo en cada edición
  - id: b
    texto: Cada edición crea una versión nueva, que queda como registro inmutable
  - id: c
    texto: La ficha cifra el modelo para que no se pueda modificar
  - id: d
    texto: La ficha impide desplegar el modelo hasta que el auditor externo la apruebe en la consola
  correctas:
  - b
  explicacion: Según la documentación, toda edición de una Model Card distinta de una actualización del estado de
    aprobación crea una versión adicional, para tener un registro inmutable de los cambios del modelo.
  distractores:
    a: Model Cards documenta; no calcula métricas de sesgo.
    c: El cifrado no forma parte de Model Cards ni da un historial de cambios.
    d: La ficha registra un estado de aprobación, pero no bloquea por sí misma el despliegue.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
- id: D4-057
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un organismo público exige poder inspeccionar los pesos y la arquitectura del modelo que use y desplegarlo
    en su propia cuenta. ¿Qué opción cumple el requisito?
  opciones:
  - id: a
    texto: Un modelo de código abierto desplegado desde Amazon SageMaker JumpStart
  - id: b
    texto: Un modelo propietario evaluado con Amazon Bedrock Evaluations
  - id: c
    texto: Un modelo propietario consumido por API en Amazon Bedrock, sin acceso a sus pesos
  - id: d
    texto: Consultar la AWS AI Service Card de un modelo propietario
  correctas:
  - a
  explicacion: Los modelos de código abierto exponen sus pesos y su arquitectura, lo que permite inspeccionarlos,
    auditarlos y desplegarlos con control propio, por ejemplo desde SageMaker JumpStart.
  distractores:
    b: Las evaluaciones miden su comportamiento, pero no dan acceso a los pesos ni a la arquitectura.
    c: No permite inspeccionar los pesos ni la arquitectura.
    d: Informa del uso previsto y las limitaciones, pero no da acceso a los pesos.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html
- id: D4-058
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: multiple_response
  dificultad: media
  enunciado: Antes de elegir un modelo para un servicio de atención al cliente, un equipo quiere conocer el uso
    previsto, las limitaciones y las condiciones de uso de los candidatos. ¿Qué DOS fuentes debe consultar? (Elige
    DOS.)
  opciones:
  - id: a
    texto: Los registros de AWS CloudTrail
  - id: b
    texto: Las AWS AI Service Cards de los modelos de Amazon
  - id: c
    texto: La ficha y la licencia que publica el proveedor de cada modelo
  - id: d
    texto: Los resultados de Amazon Bedrock Evaluations
  - id: e
    texto: Las SageMaker Model Cards de la propia empresa
  correctas:
  - b
  - c
  explicacion: Las AI Service Cards documentan el uso previsto y las limitaciones de los modelos y servicios de
    AWS; para modelos de otros proveedores, sus fichas y licencias cumplen ese papel de transparencia.
  distractores:
    a: Registran llamadas a las API de la cuenta; no informan del uso previsto de un modelo.
    d: Miden el comportamiento con los datos de la empresa, pero no describen el uso previsto ni las condiciones
      de uso que fija el proveedor.
    e: Documentan los modelos propios de la empresa; todavía no existen para los candidatos de terceros que se están
      evaluando.
  referencia: https://aws.amazon.com/ai/responsible-ai/resources/
- id: D4-059
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una empresa emergente quiere ajustar un modelo de código abierto y vender un producto basado en él.
    ¿Qué debe revisar antes para saber si puede hacerlo?
  opciones:
  - id: a
    texto: Las condiciones de uso comercial y modificación de la licencia del modelo
  - id: b
    texto: La configuración de Amazon Bedrock Guardrails
  - id: c
    texto: La calificación de riesgo que figura en su SageMaker Model Card
  - id: d
    texto: Los resultados de Amazon Bedrock Evaluations
  correctas:
  - a
  explicacion: 'La licencia es parte de la transparencia de un modelo: establece si se permite el uso comercial,
    la modificación y la redistribución.'
  distractores:
    b: Filtra contenido; no responde a qué derechos de uso tiene la empresa.
    c: Indica el nivel de riesgo del caso de uso; no dice qué permite la licencia.
    d: Miden el comportamiento del modelo, no sus condiciones legales de uso.
  referencia: https://aws.amazon.com/ai/responsible-ai/
- id: D4-060
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una empresa que nunca ha usado SageMaker Clarify necesita explicaciones SHAP de las predicciones de
    un modelo tabular de riesgo de impago. ¿Qué opción sigue las indicaciones vigentes de AWS?
  opciones:
  - id: a
    texto: Usar directamente la biblioteca de código abierto SHAP
  - id: b
    texto: Documentar el modelo con SageMaker Model Cards
  - id: c
    texto: Crear trabajos de explicabilidad con Amazon SageMaker Clarify
  - id: d
    texto: Usar Amazon Bedrock Evaluations para explicar cada predicción
  correctas:
  - a
  explicacion: Tras el cierre de Clarify a clientes nuevos, AWS indica calcular la atribución de características
    con la biblioteca SHAP (el mismo motor que usa Clarify) dentro de sus soluciones de referencia y flujos de SageMaker
    AI.
  distractores:
    b: Documenta el modelo, pero no calcula explicaciones de cada predicción.
    c: Clarify ya no admite clientes nuevos; AWS indica usar SHAP directamente, el mismo motor que usa Clarify.
    d: Bedrock Evaluations es para modelos fundacionales; AWS aclara que no sustituye la explicabilidad de modelos
      predictivos.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-availability-change.html
- id: D4-061
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: matching
  dificultad: media
  enunciado: Empareja cada necesidad de transparencia o explicabilidad con la herramienta adecuada.
  prompts:
  - id: '1'
    texto: Documentar el uso previsto y el riesgo de un modelo propio
  - id: '2'
    texto: Conocer las limitaciones de un servicio de IA de AWS
  - id: '3'
    texto: Comparar la toxicidad de tres modelos candidatos con datos propios
  - id: '4'
    texto: Inspeccionar y auditar los pesos del modelo
  opciones:
  - id: a
    texto: Un modelo de código abierto
  - id: b
    texto: Amazon SageMaker Model Cards
  - id: c
    texto: Amazon Bedrock Guardrails
  - id: d
    texto: Amazon Bedrock Evaluations
  - id: e
    texto: AWS AI Service Cards
  correctas:
  - - '1'
    - b
  - - '2'
    - e
  - - '3'
    - d
  - - '4'
    - a
  explicacion: Model Cards documenta modelos propios; AI Service Cards, los servicios de AWS; Bedrock Evaluations
    mide el comportamiento de los candidatos; un modelo de código abierto permite inspeccionar sus pesos.
  distractores:
    c: Filtra contenido en tiempo de ejecución; no documenta ni permite inspeccionar un modelo.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html
- id: D4-062
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aseguradora compara un árbol de decisión (86 % de exactitud, cada decisión se explica con sus ramas)
    con una red profunda (90 %, necesita SHAP). El regulador exige explicar cada rechazo y el mínimo de exactitud
    pactado es el 85 %. ¿Qué modelo debe elegir?
  opciones:
  - id: a
    texto: Ninguno, hasta conseguir un modelo interpretable con el 90 %
  - id: b
    texto: La red profunda, porque tiene la mayor exactitud
  - id: c
    texto: La red profunda sin explicaciones, porque el regulador solo revisa una muestra
  - id: d
    texto: El árbol de decisión, porque cumple el mínimo y se explica por sí mismo
  correctas:
  - d
  explicacion: La interpretabilidad y el rendimiento se miden en el caso concreto y se fijan mínimos. Si el modelo
    interpretable cumple el mínimo de rendimiento, se prefiere en decisiones reguladas porque su explicación sale
    del propio modelo.
  distractores:
    a: 'Retrasa el proyecto sin necesidad: el árbol ya cumple los requisitos.'
    b: Maximizar la exactitud no es el criterio si un modelo interpretable ya cumple el mínimo pactado y el requisito
      de explicación.
    c: Incumple el requisito de explicar cada rechazo.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp02-bp07.html
- id: D4-063
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Para ser transparente, una empresa propone publicar las instrucciones del sistema completas de su asistente
    y las reglas exactas de sus guardrails. ¿Qué riesgo plantea y qué alternativa es mejor?
  opciones:
  - id: a
    texto: 'Ninguno: cuanta más información se publique, más seguro es el sistema'
  - id: b
    texto: Aumenta el coste de inferencia; es mejor cifrar las instrucciones del sistema
  - id: c
    texto: Facilita saltarse las salvaguardas; conviene publicar el uso previsto y los límites
  - id: d
    texto: Reduce la exactitud del modelo; es mejor no informar de que se usa IA
  correctas:
  - c
  explicacion: 'Transparencia y seguridad pueden chocar: revelar las reglas de los filtros o las instrucciones del
    sistema facilita saltárselos o extraer información. Se publica lo que los usuarios necesitan para decidir, sin
    los detalles que facilitan un ataque.'
  distractores:
    a: Más información sobre las defensas facilita diseñar ataques para eludirlas.
    b: Publicar no cambia el coste de inferencia, y cifrar no responde a la necesidad de transparencia.
    d: Publicar no afecta a la exactitud, y ocultar que se usa IA va contra la transparencia.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp01-bp02.html
- id: D4-064
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.3
  tipo: multiple_choice
  dificultad: baja
  enunciado: Tras configurar Amazon Bedrock Guardrails con todos los filtros en intensidad máxima, el asistente
    de una tienda bloquea muchas preguntas legítimas de los clientes. ¿Qué deben hacer?
  opciones:
  - id: a
    texto: Subir la temperatura del modelo para que más preguntas pasen el filtro
  - id: b
    texto: Cambiar a un modelo más grande y con más capacidad
  - id: c
    texto: Ajustar la intensidad de los filtros y probar con casos reales
  - id: d
    texto: Desactivar el guardrail para no perder clientes
  correctas:
  - c
  explicacion: Un filtro más estricto bloquea más contenido dañino pero también más contenido legítimo (falsos positivos).
    Es un compromiso entre seguridad y utilidad que se ajusta con la intensidad de los filtros y pruebas reales.
  distractores:
    a: La temperatura afecta a la generación del modelo, no a la evaluación del guardrail.
    b: Los bloqueos los produce el guardrail, no el modelo.
    d: Eliminaría la protección frente al contenido dañino.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html
- id: D4-065
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.3
  tipo: multiple_response
  dificultad: alta
  enunciado: Un equipo debe equilibrar exactitud, privacidad y explicabilidad en un sistema de concesión de ayudas.
    ¿Qué DOS enfoques recomienda el Responsible AI Lens de AWS? (Elige DOS.)
  opciones:
  - id: a
    texto: Publicar los datos de entrenamiento completos para maximizar la transparencia
  - id: b
    texto: Medir la interpretabilidad y el rendimiento de los modelos candidatos en el caso concreto
  - id: c
    texto: Maximizar la privacidad aunque la exactitud caiga por debajo del mínimo
  - id: d
    texto: Fijar un mínimo aceptable para cada criterio en lugar de maximizar uno a costa de los demás
  - id: e
    texto: Maximizar primero la exactitud y añadir explicaciones solo si lo pide el regulador
  correctas:
  - b
  - d
  explicacion: El Responsible AI Lens recomienda identificar dónde chocan los criterios, fijar mínimos (por ejemplo,
    un 85 % de exactitud y un 90 % de protección de la privacidad) y comparar las alternativas midiendo en el caso
    concreto.
  distractores:
    a: Puede vulnerar la privacidad de las personas representadas en los datos.
    c: Optimiza un criterio a costa de otro; la guía pide cumplir el mínimo de cada criterio, no sacrificar uno.
    e: Optimiza un criterio a costa de los demás, justo lo que la guía desaconseja.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp01-bp02.html
- id: D4-066
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Al eliminar los datos personales del conjunto de entrenamiento para proteger la privacidad, la exactitud
    de un modelo baja del 91 % al 87 %. El mínimo pactado con negocio y jurídico es del 85 %. ¿Qué decisión es la
    adecuada?
  opciones:
  - id: a
    texto: Mantener la protección de la privacidad, porque se cumple el mínimo pactado
  - id: b
    texto: Renunciar a explicar las decisiones para recuperar exactitud
  - id: c
    texto: Cambiar a un modelo opaco más grande sin evaluarlo
  - id: d
    texto: Volver a incluir los datos personales para recuperar el 91 %
  correctas:
  - a
  explicacion: 'Las protecciones de privacidad pueden reducir la exactitud. Con mínimos pactados para cada criterio,
    la decisión es sencilla: si se cumplen, se mantiene la protección.'
  distractores:
    b: 'Cambia un criterio por otro sin necesidad: el modelo ya cumple.'
    c: Añade coste y pierde explicabilidad sin comprobar que mejore nada.
    d: Sacrifica la privacidad para superar un mínimo que ya se cumple.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp01-bp02.html
- id: D4-067
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.3
  tipo: ordering
  dificultad: media
  enunciado: Una entidad financiera decide entre un modelo interpretable y uno complejo para aprobar créditos. Ordena
    los pasos.
  opciones:
  - id: a
    texto: Si no cumple, medir el modelo complejo con explicaciones a posteriori
  - id: b
    texto: Validar con expertos del negocio que las explicaciones son coherentes
  - id: c
    texto: Medir el rendimiento del modelo interpretable con datos del caso
  - id: d
    texto: Fijar los mínimos de rendimiento y de explicabilidad con negocio y jurídico
  correctas:
  - d
  - c
  - a
  - b
  explicacion: Primero se fijan los requisitos; se prueba el modelo interpretable; solo si no llega se pasa al complejo
    con explicaciones a posteriori, y estas se validan con expertos porque pueden engañar.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html
- id: D4-068
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.4
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una empresa quiere que los usuarios de su asistente de IA puedan avisar cuando una respuesta es incorrecta
    o inadecuada, y que esos avisos sirvan para mejorarlo. ¿Qué principio de diseño aplica?
  opciones:
  - id: a
    texto: Aumentar el número máximo de tokens de salida
  - id: b
    texto: Desactivar los registros de conversación para proteger la privacidad
  - id: c
    texto: Crear una SageMaker Model Card del modelo
  - id: d
    texto: Un mecanismo de feedback con revisiones periódicas
  correctas:
  - d
  explicacion: Los mecanismos de feedback de los usuarios son un principio del diseño centrado en las personas.
    El Responsible AI Lens recomienda convertir ese feedback en mejoras con ciclos de revisión periódicos.
  distractores:
    a: Cambia la longitud de las respuestas; no recoge la opinión de los usuarios.
    b: Sin información sobre los fallos no hay forma de mejorar el sistema.
    c: Documenta el modelo, pero no recoge feedback de los usuarios.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raimon02-bp01.html
- id: D4-069
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aseguradora usa IA para proponer cómo tramitar cada siniestro. Los siniestros de importe alto o
    con confianza baja tienen consecuencias graves para el cliente. ¿Qué diseño es el más adecuado?
  opciones:
  - id: a
    texto: Ocultar la confianza al tramitador para no condicionarlo
  - id: b
    texto: Revisar a mano un 1 % de siniestros elegidos al azar
  - id: c
    texto: Revisión humana de esos casos, con los factores y la confianza a la vista
  - id: d
    texto: Automatizar la tramitación de los siniestros para reducir costes y tiempos de espera
  correctas:
  - c
  explicacion: 'El diseño centrado en las personas pone la supervisión humana donde los errores tienen consecuencias
    graves y da al revisor la información que necesita: explicación, factores y confianza.'
  distractores:
    a: El revisor necesita la explicación y la confianza para decidir con información.
    b: Una muestra aleatoria no garantiza revisar los casos graves, que son los que importan.
    d: Deja sin supervisión las decisiones con consecuencias graves.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raiuc04-bp02.html
- id: D4-070
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Un banco usa IA para preaprobar tarjetas de crédito. ¿Qué información aplica mejor el principio de
    transparencia de las decisiones de la IA ante el cliente?
  opciones:
  - id: a
    texto: Solo el resultado, para no confundir al cliente
  - id: b
    texto: Las instrucciones del sistema que usa el asistente para decidir cada caso
  - id: c
    texto: Los pesos completos del modelo y su arquitectura
  - id: d
    texto: Que interviene una IA, los factores principales y cómo pedir una revisión humana
  correctas:
  - d
  explicacion: La transparencia de las decisiones consiste en avisar de que interviene una IA, explicar de forma
    comprensible los factores de la decisión y dar al usuario la posibilidad de cuestionarla o escalarla a una persona.
  distractores:
    a: Sin explicación ni opción de revisión, el cliente no puede entender ni cuestionar la decisión.
    b: No explican la decisión y facilitan intentos de manipular el sistema.
    c: No ayudan al cliente a entender su caso y pueden exponer información sensible.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raigt01-bp04.html
- id: D4-071
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.4
  tipo: multiple_response
  dificultad: media
  enunciado: Un hospital despliega un sistema que sugiere prioridades en urgencias. Lo usan pacientes, enfermeras
    y auditores. ¿Qué DOS principios de diseño centrado en las personas debe aplicar? (Elige DOS.)
  opciones:
  - id: a
    texto: Maximizar la automatización sin opción de escalar a una persona
  - id: b
    texto: Dar el mismo nivel de detalle técnico a cada perfil
  - id: c
    texto: Adaptar las explicaciones al nivel de cada usuario
  - id: d
    texto: Indicar cuándo confiar en la sugerencia y cuándo verificarla
  - id: e
    texto: Mostrar los valores SHAP en bruto a cada usuario
  correctas:
  - c
  - d
  explicacion: El Responsible AI Lens recomienda adaptar la complejidad de la guía al nivel de cada usuario y ayudarle
    a saber cuándo confiar, cuándo verificar y cuándo ignorar las recomendaciones del sistema.
  distractores:
    a: Elimina la supervisión humana en decisiones con consecuencias sobre la salud.
    b: Contradice la adaptación de las explicaciones a la experiencia del usuario.
    e: Los valores SHAP en bruto no son comprensibles para pacientes ni para la mayoría del personal sanitario.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raigt01-bp04.html
- id: D4-072
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.4
  tipo: matching
  dificultad: media
  enunciado: Empareja cada práctica de una aplicación de IA con el principio de diseño centrado en las personas
    que aplica.
  prompts:
  - id: '1'
    texto: Botones de valoración y revisión mensual de las respuestas marcadas
  - id: '2'
    texto: Aviso de que interviene una IA y fuentes citadas en cada respuesta
  - id: '3'
    texto: Un médico revisa el informe antes de comunicarlo al paciente
  - id: '4'
    texto: Resumen sencillo para el cliente y detalle técnico para el auditor
  opciones:
  - id: a
    texto: Supervisión humana en decisiones con consecuencias
  - id: b
    texto: Registro de invocaciones del modelo
  - id: c
    texto: Explicaciones adaptadas a cada usuario
  - id: d
    texto: Transparencia de las decisiones de la IA
  - id: e
    texto: Mecanismo de feedback de los usuarios
  correctas:
  - - '1'
    - e
  - - '2'
    - d
  - - '3'
    - a
  - - '4'
    - c
  explicacion: 'Cada práctica corresponde a un principio: recoger y usar el feedback, explicar las decisiones, supervisar
    donde hay consecuencias y adaptar la explicación al usuario.'
  distractores:
    b: Es un mecanismo de auditoría; ayuda a investigar, pero por sí solo no es un principio de diseño centrado
      en las personas.
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raigt01-bp04.html
- id: D4-073
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.4
  tipo: ordering
  dificultad: media
  enunciado: Ordena el circuito de mejora a partir del feedback de los usuarios de un asistente de IA.
  opciones:
  - id: a
    texto: El usuario valora una respuesta o notifica un error
  - id: b
    texto: Una revisión periódica identifica patrones en los fallos
  - id: c
    texto: El feedback se registra y se clasifica
  - id: d
    texto: Se comprueba que el cambio corrige el fallo sin empeorar otras áreas
  - id: e
    texto: Se ajustan los guardrails, los prompts o los datos
  correctas:
  - a
  - c
  - b
  - e
  - d
  explicacion: 'El Responsible AI Lens describe un circuito: recoger el feedback, analizarlo en revisiones periódicas,
    convertirlo en mejoras (guardrails, prompts, datos) y validar que las mejoras no introducen problemas nuevos.'
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raimon02-bp01.html
- id: D4-074
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un banco que usa desde hace años las herramientas de explicabilidad de SageMaker AI tiene un modelo
    de crédito en un endpoint de SageMaker AI. Necesita que cada respuesta del endpoint incluya qué variables pesaron
    más en esa decisión, para mostrárselas al gestor en el momento. ¿Qué solución encaja mejor?
  opciones:
  - id: a
    texto: La explicabilidad en línea de SageMaker Clarify, con atribuciones SHAP en cada predicción
  - id: b
    texto: Amazon Bedrock Evaluations con un modelo juez sobre las decisiones
  - id: c
    texto: Una SageMaker Model Card actualizada después de cada decisión
  - id: d
    texto: La comprobación de grounding contextual de Amazon Bedrock Guardrails
  correctas:
  - a
  explicacion: Clarify ofrece explicaciones locales con SHAP también en tiempo real desde un endpoint de SageMaker
    AI (explicabilidad en línea). El banco ya usa estas herramientas desde hace años, así que el cierre a clientes
    nuevos no le afecta.
  distractores:
    b: Evalúa modelos fundacionales por lotes; no da atribuciones por variable de un modelo de crédito en cada petición.
    c: La ficha documenta el modelo en general; no explica cada predicción en tiempo real.
    d: Comprueba si una respuesta generativa se basa en una fuente; no explica predicciones de un modelo tabular.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-model-explainability.html
- id: D4-075
  dominio: 4
  tarea: '4.2'
  objetivo: 4.2.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una entidad financiera, cliente desde hace años de la revisión humana gestionada de AWS, extrae con
    Amazon Textract los datos de solicitudes de hipoteca escaneadas. Quiere que una persona revise solo los campos
    que Textract extrae con baja confianza. ¿Qué solución es la adecuada?
  opciones:
  - id: a
    texto: Un trabajo de etiquetado de Amazon SageMaker Ground Truth
  - id: b
    texto: Un flujo de revisión humana de Amazon A2I activado por un umbral de confianza
  - id: c
    texto: La comprobación de grounding contextual de Amazon Bedrock Guardrails
  - id: d
    texto: Amazon SageMaker Model Monitor sobre el endpoint de Textract
  correctas:
  - b
  explicacion: Amazon A2I añade revisión humana a las predicciones con baja confianza, con integración para Textract.
    Pone la supervisión humana donde el sistema está menos seguro, un principio del diseño centrado en las personas.
    La entidad es cliente desde hace años, así que el cierre a clientes nuevos no le afecta.
  distractores:
    a: Sirve para etiquetar datos de entrenamiento, no para revisar en producción las predicciones de baja confianza.
    c: Es para respuestas de modelos generativos frente a una fuente; no revisa extracciones de Textract.
    d: Model Monitor vigila modelos alojados en SageMaker AI; no envía casos concretos a revisión humana.
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/a2i-use-augmented-ai-a2i-human-review-loops.html
