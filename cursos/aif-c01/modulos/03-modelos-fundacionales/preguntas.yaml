  opciones:
  - id: a
    texto: 'El coste: datos masivos y meses de cómputo'
  - id: b
    texto: Amazon Bedrock no permite usar modelos preentrenados
  - id: c
    texto: Un modelo preentrenado no se puede ajustar después
  - id: d
    texto: El preentrenamiento solo admite datos etiquetados manualmente
  correctas:
  - a
  explicacion: Preentrenar un modelo fundacional requiere datos masivos, infraestructura y meses; lo hacen los proveedores.
    Las empresas suelen partir de un modelo existente y adaptarlo.
  distractores:
    b: Bedrock ofrece modelos fundacionales preentrenados de varios proveedores.
    c: Los modelos preentrenados son precisamente la base del ajuste fino.
    d: 'Al contrario: el preentrenamiento es autosupervisado y usa datos sin etiquetar.'
  referencia: https://aws.amazon.com/what-is/foundation-models/
- id: D3-057
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un hospital tiene millones de informes clínicos sin etiquetar y observa que el modelo no entiende bien
