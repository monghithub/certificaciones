  - id: b
    texto: 20 USD
  - id: c
    texto: 0,03 USD
  - id: d
    texto: 0,50 USD
  correctas:
  - a
  explicacion: Coste total = 1800 + 700 + 500 = 3000 USD; coste por interacción = 3000 / 60 000 = 0,05 USD.
  distractores:
    b: Resulta de dividir las interacciones entre el coste, al revés.
    c: Solo cuenta la inferencia (1800 / 60 000); hay que incluir todos los costes.
