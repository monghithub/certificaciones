  distractores:
    a: Aporta información, pero no enseña un estilo de respuesta de forma consistente.
    b: Usa texto sin etiquetar del dominio; aquí hay pares de entrada y salida.
    c: 'Es desproporcionado: cuesta meses y datos masivos para adaptar un estilo.'
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html
- id: D3-062
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo prepara miles de ejemplos del tipo «Resume esta incidencia en tres líneas» → resumen correcto,
