- id: D3-063
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa quiere detectar defectos en piezas con muy pocas imágenes etiquetadas. Parte de un modelo
