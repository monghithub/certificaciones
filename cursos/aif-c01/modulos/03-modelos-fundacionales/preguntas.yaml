- id: D3-070
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.3
  tipo: multiple_response
  dificultad: alta
  enunciado: Un equipo de datos prepara el conjunto para el fine-tuning de un modelo de Amazon Bedrock con datos
    de clientes. ¿Qué DOS prácticas de gobierno de datos son adecuadas?
  opciones:
  - id: a
    texto: Publicar el conjunto en un bucket abierto para facilitar la revisión
  - id: b
    texto: Prescindir del conjunto de validación para entrenar con más datos
  - id: c
