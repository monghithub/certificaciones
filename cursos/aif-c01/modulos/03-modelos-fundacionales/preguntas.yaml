- id: D3-058
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.1
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una empresa usa un modelo grande en Amazon Bedrock y tiene meses de registros de invocación con las
    respuestas que dio en producción. Quiere un modelo más pequeño y barato para ese caso sin volver a generar las
    respuestas. ¿Qué opción de Bedrock Model Distillation encaja?
  opciones:
  - id: a
    texto: Importar los registros a una Knowledge Base
  - id: b
    texto: Usar pares de prompt y respuesta de los registros de invocación como datos para ajustar al alumno
  - id: c
    texto: Usar solo los prompts de los registros para que el maestro vuelva a responder
  - id: d
    texto: Entrenar el modelo pequeño desde cero con los registros
  correctas:
  - b
  explicacion: Bedrock Model Distillation puede usar los pares prompt-respuesta de los registros de invocación sin
    regenerar las respuestas, siempre que el maestro del trabajo coincida con el modelo de los registros.
  distractores:
    a: Serviría para RAG, pero no crea un modelo más pequeño y barato.
    c: Es otra opción válida, pero vuelve a generar las respuestas y se paga la inferencia del maestro, justo lo
      que quieren evitar.
    d: La destilación ajusta un alumno existente; no preentrena un modelo desde cero.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
- id: D3-059
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.1
  tipo: ordering
  dificultad: media
  enunciado: Un proveedor crea un modelo de chat partiendo de cero. Ordena las etapas típicas de su entrenamiento,
    desde la primera hasta la última.
  opciones:
  - id: a
    texto: Ajuste fino supervisado con pares instrucción → respuesta
  - id: b
    texto: Preentrenamiento autosupervisado con datos masivos sin etiquetar
  - id: c
    texto: Alineamiento con preferencias humanas (RLHF)
  correctas:
  - b
  - a
  - c
  explicacion: Primero el preentrenamiento general, que da el conocimiento del lenguaje; después el ajuste fino
    con ejemplos etiquetados para seguir instrucciones; por último, el alineamiento con preferencias humanas para
    que las respuestas sean más útiles y seguras.
  referencia: https://aws.amazon.com/what-is/reinforcement-learning-from-human-feedback/
- id: D3-060
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.1
  tipo: multiple_response
  dificultad: media
  enunciado: ¿Qué DOS afirmaciones sobre la destilación de modelos en Amazon Bedrock son correctas?
  opciones:
  - id: a
    texto: Transfiere el conocimiento de un modelo maestro más grande a un alumno más pequeño y barato
  - id: b
    texto: Si Bedrock genera nuevas respuestas del maestro, esa inferencia se factura a precio bajo demanda
  - id: c
    texto: El modelo destilado queda disponible para otros clientes de Bedrock
  - id: d
    texto: Convierte un modelo pequeño en uno más grande con más parámetros
  - id: e
    texto: Requiere preentrenar el alumno desde cero
  correctas:
  - a
  - b
  explicacion: La destilación ajusta un alumno pequeño con respuestas del maestro; generar respuestas nuevas consume
    inferencia del maestro a precio bajo demanda (si se usan pares prompt-respuesta de los registros de invocación,
    no se regeneran). El modelo resultante es privado.
  distractores:
    c: Solo el cliente accede al modelo destilado; Bedrock no usa sus datos para modelos públicos.
    d: 'Es al revés: el resultado es un modelo pequeño que imita al grande en un caso de uso.'
    e: Se ajusta un alumno existente con las respuestas del maestro.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html
- id: D3-061
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una empresa tiene 3000 pares de «pregunta de un cliente» y «respuesta aprobada por el equipo de soporte»
    y quiere que el modelo responda con ese estilo. ¿Qué método encaja?
  opciones:
  - id: a
    texto: RAG con una Knowledge Base
  - id: b
    texto: Preentrenamiento continuado
  - id: c
    texto: Preentrenamiento desde cero
  - id: d
    texto: Fine-tuning supervisado
  correctas:
  - d
  explicacion: El fine-tuning supervisado usa ejemplos etiquetados (entrada → salida esperada) para ajustar los
