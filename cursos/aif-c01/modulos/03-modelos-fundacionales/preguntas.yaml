- id: D3-065
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.2
  tipo: multiple_response
  dificultad: media
  enunciado: Un despacho de abogados quiere que el modelo domine la jerga procesal y, además, redacte cláusulas
