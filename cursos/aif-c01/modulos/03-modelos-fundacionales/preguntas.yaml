- id: D3-068
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Un banco ajusta un modelo con conversaciones de clientes, pero casi todas son de clientes de grandes
