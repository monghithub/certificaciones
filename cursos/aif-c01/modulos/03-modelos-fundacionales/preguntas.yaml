  correctas:
  - c
  explicacion: Los criterios subjetivos (tono, estilo, adecuación a la marca) se valoran mejor con personas, que
    son la referencia final antes de las decisiones críticas.
  distractores:
    a: Es una métrica de rendimiento, no de tono.
    b: Mide palabras coincidentes, no si el tono encaja con la marca.
    d: No mide nada propio de la marca.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
- id: D3-073
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo quiere comparar tres modelos de Amazon Bedrock en tareas de resumen con un conjunto integrado
    y obtener métricas de exactitud, robustez y toxicidad sin intervención humana. ¿Qué tipo de trabajo de evaluación
    debe crear?
  opciones:
  - id: a
    texto: AgentCore Evaluations
  - id: b
    texto: Una evaluación con trabajadores humanos
  - id: c
    texto: Una evaluación programática de modelos
  - id: d
    texto: Una evaluación de RAG de solo recuperación
  correctas:
  - c
  explicacion: Las evaluaciones programáticas de Bedrock usan conjuntos integrados o propios y calculan métricas
    como exactitud, robustez y toxicidad según el tipo de tarea.
  distractores:
    a: Evalúa agentes a partir de sus trazas, no modelos en una tarea de resumen.
    b: Implica que personas valoren las respuestas, que es justo lo que no quieren.
    d: Evalúa lo que recupera una Knowledge Base, no las capacidades de resumen de los modelos.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html
- id: D3-074
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.1
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una empresa necesita valorar cada noche miles de respuestas de su asistente con criterios como corrección,
    utilidad y seguimiento de instrucciones, con una explicación de cada nota. La evaluación humana es demasiado
    lenta y cara para ese volumen. ¿Qué enfoque encaja, y qué precaución recomienda AWS?
  opciones:
  - id: a
    texto: Un benchmark público, repetido cada noche
  - id: b
    texto: Encuestas de satisfacción a los usuarios cada noche
  - id: c
    texto: Un modelo juez (LLM-as-a-judge) validado con evaluaciones humanas
  - id: d
    texto: ROUGE frente a una respuesta de referencia, sin revisión humana
  correctas:
  - c
  explicacion: El juez LLM escala y explica cada nota con métricas como corrección, utilidad o seguimiento de instrucciones.
    AWS recomienda validarlo contra personas y usar, si es posible, un juez de otra familia de modelos.
  distractores:
    a: Daría siempre el mismo resultado general; no evalúa las respuestas reales del asistente.
    b: Miden la percepción del usuario, pero no puntúan cada respuesta con criterios definidos.
    d: Mide solapamiento de palabras, no utilidad ni seguimiento de instrucciones, y no explica la nota.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
- id: D3-075
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.1
  tipo: multiple_response
  dificultad: media
  enunciado: Un equipo construye un marco de evaluación para una nueva aplicación de IA generativa siguiendo la
    guía prescriptiva de AWS. ¿Qué DOS prácticas recomienda?
  opciones:
  - id: a
    texto: Mantener la revisión humana como última barrera antes de producción
  - id: b
    texto: Usar como juez el mismo modelo que genera las respuestas
  - id: c
    texto: Evaluar solo la respuesta final de la aplicación
  - id: d
    texto: Crear al inicio un conjunto dorado de preguntas y respuestas revisadas por expertos
  - id: e
    texto: Confiar en un benchmark público y no crear datos propios
  correctas:
  - a
  - d
  explicacion: La guía recomienda empezar por un conjunto dorado revisado por expertos, combinar métricas automáticas,
    juez LLM y personas, y mantener la revisión humana como barrera final.
  distractores:
    b: Favorece el sesgo de autopreferencia; se recomienda un juez de otra familia.
    c: Se recomienda evaluar también cada componente para saber dónde falla.
    e: Un benchmark público no representa el caso de la empresa.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
- id: D3-076
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.1
  tipo: ordering
  dificultad: media
  enunciado: Ordena un proceso de evaluación eficiente según la guía prescriptiva de AWS, desde el primer paso hasta
    el último antes de producción.
  opciones:
  - id: a
    texto: Revisión humana de las variantes más prometedoras
  - id: b
    texto: Filtrar las variantes con métricas automáticas y un juez LLM
  - id: c
    texto: Crear un conjunto dorado de casos revisados por expertos
  - id: d
    texto: Aprobar la versión para producción
  correctas:
  - c
  - b
  - a
  - d
  explicacion: El conjunto dorado es la base; las evaluaciones automáticas filtran rápido las variantes; las personas
    revisan las mejores y son la última barrera antes de aprobar el paso a producción.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
- id: D3-077
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un equipo evalúa un sistema de traducción automática del inglés al español comparando sus traducciones
    con traducciones de referencia hechas por profesionales. ¿Qué métrica se usa tradicionalmente para esta tarea?
  opciones:
  - id: a
    texto: Coste por interacción
  - id: b
    texto: BLEU
  - id: c
    texto: Tasa de tareas completadas
  - id: d
    texto: ROUGE
  correctas:
  - b
  explicacion: BLEU mide el solapamiento de n-gramas con un enfoque de precisión y penaliza las traducciones demasiado
    cortas; es la métrica clásica de traducción automática.
  distractores:
    a: Es una métrica económica, no de calidad del texto.
    c: Es una métrica de negocio de aplicaciones, no de calidad de traducción.
    d: Se usa sobre todo para resúmenes, con un enfoque de exhaustividad.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
- id: D3-078
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo evalúa resúmenes automáticos de noticias y quiere saber cuánto de la información del resumen
    de referencia aparece en el resumen generado. ¿Qué métrica encaja?
  opciones:
  - id: a
    texto: Tasa de conversión
  - id: b
    texto: ROUGE
  - id: c
    texto: Latencia del modelo
  - id: d
    texto: BLEU
  correctas:
  - b
  explicacion: 'ROUGE mide el solapamiento de n-gramas con un enfoque de exhaustividad (recall): cuánto de la referencia
    aparece en el resumen. Es la métrica típica de resúmenes.'
  distractores:
    a: Es una métrica de negocio, no de calidad de resúmenes.
    c: Mide tiempo, no contenido.
    d: Se orienta a la precisión (cuánto de lo generado está en la referencia) y se usa sobre todo en traducción.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
- id: D3-079
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un asistente responde «el envío se retrasó» cuando la respuesta de referencia es «el pedido llegó tarde».
    ROUGE y BLEU dan valores muy bajos aunque el significado es el mismo. ¿Qué métrica reflejaría mejor la calidad
    de esta respuesta?
  opciones:
  - id: a
    texto: BLEU con n-gramas más largos
  - id: b
    texto: BERTScore
  - id: c
    texto: ROUGE-L, que usa la subsecuencia común más larga
  - id: d
    texto: Exactitud de clasificación
  correctas:
  - b
  explicacion: BERTScore compara los embeddings de la respuesta y de la referencia, así que reconoce paráfrasis
    que las métricas de n-gramas penalizan.
  distractores:
    a: Con n-gramas más largos la coincidencia sería aún menor.
    c: Sigue basándose en palabras coincidentes, que aquí casi no hay.
    d: Es una métrica de clasificación; no compara textos generados con una referencia.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
- id: D3-080
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: La referencia de un resumen es «el pedido llegó tarde» (4 palabras) y el modelo genera «el pedido llegó
    muy tarde» (5 palabras). ¿Cuál es ROUGE-1 (exhaustividad de unigramas)?
  opciones:
  - id: a
    texto: '1,25: la respuesta tiene más palabras que la referencia'
  - id: b
    texto: '0,5: la mitad de las palabras difieren'
  - id: c
    texto: '0,8: 4 palabras coincidentes entre las 5 de la respuesta'
  - id: d
    texto: '1,0: las 4 palabras de la referencia aparecen en la respuesta'
  correctas:
  - d
  explicacion: 'ROUGE-1 = palabras coincidentes / palabras de la referencia = 4 / 4 = 1,0. La precisión de unigramas
    = 4 / 5 = 0,8: la respuesta añade una palabra que no estaba en la referencia.'
  distractores:
    a: ROUGE-1 es una proporción entre 0 y 1.
    b: 'Coinciden 4 palabras: todas las de la referencia.'
    c: Esa es la precisión de unigramas, la base de BLEU, no ROUGE-1.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
- id: D3-081
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: matching
  dificultad: media
  enunciado: Empareja cada necesidad de evaluación con la métrica o el enfoque más adecuado.
  prompts:
  - id: '1'
    texto: Calidad de traducciones frente a traducciones de referencia
  - id: '2'
    texto: Cobertura de un resumen frente a un resumen de referencia
  - id: '3'
    texto: Similitud de significado aunque cambien las palabras
  - id: '4'
    texto: Puntuar utilidad y fidelidad de respuestas abiertas con una explicación
  opciones:
  - id: a
    texto: ROUGE
  - id: b
    texto: LLM-as-a-judge
  - id: c
    texto: BERTScore
  - id: d
    texto: BLEU
  - id: e
    texto: F1
  correctas:
  - - '1'
    - d
  - - '2'
    - a
  - - '3'
    - c
  - - '4'
    - b
  explicacion: BLEU para traducción; ROUGE para resúmenes; BERTScore para similitud semántica; el juez LLM para
    criterios abiertos con explicación.
  distractores:
    e: Combina precisión y exhaustividad en clasificación; no evalúa por sí sola la calidad de un texto generado
      frente a otro.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html
- id: D3-082
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo crea en Amazon Bedrock una evaluación programática de un modelo con la tarea de resumen de
    texto y el conjunto integrado Gigaword. ¿Con qué métrica calcula Bedrock la exactitud de los resúmenes?
  opciones:
  - id: a
    texto: F1 de NLP
  - id: b
    texto: ROUGE
  - id: c
    texto: BLEU
  - id: d
    texto: BERTScore
  correctas:
  - d
  explicacion: En la tarea de resumen de las evaluaciones programáticas de Bedrock, la exactitud se mide con BERTScore
    y la robustez con BERTScore y deltaBERTScore. Que ROUGE sea típica de resúmenes no significa que sea la que
    usa Bedrock.
  distractores:
    a: Bedrock la usa en la tarea de preguntas y respuestas, no en la de resumen.
    b: Es la métrica clásica de resúmenes, pero en las evaluaciones programáticas de Bedrock la exactitud de esta
      tarea se calcula con BERTScore.
    c: Se usa sobre todo en traducción, no en la tarea de resumen de Bedrock.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks-text-summary.html
- id: D3-083
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.3
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un equipo jurídico implanta un asistente para revisar contratos. ¿Qué medida comprueba mejor si cumple
    el objetivo de productividad?
  opciones:
  - id: a
    texto: El número de parámetros del modelo
  - id: b
    texto: El tiempo medio de revisión frente a la línea base
  - id: c
    texto: La temperatura configurada en el asistente
  - id: d
    texto: La puntuación ROUGE de los resúmenes del asistente
  correctas:
  - b
  explicacion: La productividad se mide con el tiempo o el número de tareas por persona frente a una línea base,
    comprobando que la calidad se mantiene.
  distractores:
    a: Describe el modelo, no el resultado de negocio.
    c: Es un parámetro de inferencia, no una medida de productividad.
    d: Mide la coincidencia de palabras con una referencia, no si el equipo trabaja más rápido.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: D3-084
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Un modelo obtiene muy buenas métricas técnicas en las pruebas, pero tras el lanzamiento pocos empleados
    lo usan y las conversaciones se abandonan tras el primer mensaje. ¿Qué objetivo de negocio no se está cumpliendo?
  opciones:
  - id: a
    texto: La exactitud del modelo
  - id: b
    texto: La implicación de los usuarios
  - id: c
    texto: La latencia de la inferencia
  - id: d
    texto: El coste por token
  correctas:
  - b
  explicacion: 'Unas buenas métricas técnicas no garantizan valor: el uso activo y la continuidad de las conversaciones
    miden la implicación de los usuarios, un objetivo de negocio propio.'
  distractores:
    a: Las métricas técnicas son buenas; el problema es que no se usa.
    c: No hay indicios de lentitud; el síntoma es el abandono y el poco uso.
    d: No explica que los empleados no usen la herramienta.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: D3-085
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.3
  tipo: ordering
  dificultad: media
  enunciado: Ordena los pasos para comprobar si un asistente de IA cumple un objetivo de negocio.
  opciones:
  - id: a
    texto: Comparar los resultados con la línea base y decidir
  - id: b
    texto: Definir el objetivo y la métrica de negocio
  - id: c
    texto: Medir la línea base sin el asistente
  - id: d
    texto: Hacer un piloto o una prueba A/B con un grupo de usuarios
  correctas:
  - b
  - c
  - d
  - a
  explicacion: Primero se fija qué se quiere conseguir y cómo medirlo, se mide la situación actual, se prueba con
    usuarios reales y se compara para decidir si se amplía, se ajusta o se descarta.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: D3-086
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.3
  tipo: multiple_response
  dificultad: media
  enunciado: Una empresa quiere demostrar a dirección que su asistente de ventas aporta valor. ¿Qué DOS evidencias
    son más adecuadas?
  opciones:
  - id: a
    texto: El tiempo que ahorran los comerciales en preparar cada propuesta
  - id: b
    texto: La puntuación BLEU del asistente frente a textos de referencia
  - id: c
    texto: El número de tokens que procesa al mes
  - id: d
    texto: El aumento de la tasa de conversión del grupo que usa el asistente frente al que no lo usa
  - id: e
    texto: Que use el modelo más grande disponible
  correctas:
  - a
  - d
  explicacion: El valor de negocio se demuestra con métricas como la conversión y la productividad frente a una
    línea base o un grupo de control, no con métricas técnicas del modelo.
  distractores:
    b: Es una métrica técnica de traducción; no demuestra valor de negocio.
    c: Mide uso y coste, no el valor que aporta.
    e: El tamaño del modelo no es una evidencia de valor.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html
- id: D3-087
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.4
  tipo: multiple_choice
  dificultad: media
  enunciado: 'Un asistente RAG da respuestas incorrectas. Una evaluación de solo recuperación muestra que la Knowledge
    Base trae los fragmentos correctos, pero la evaluación de recuperación y generación muestra baja fidelidad:
    la respuesta añade datos que no están en el contexto. ¿Dónde está el problema?'
  opciones:
  - id: a
    texto: En la ingesta de documentos de la Knowledge Base
  - id: b
    texto: En el almacén vectorial elegido
  - id: c
    texto: En el modelo de embeddings
  - id: d
    texto: 'En la generación: el prompt o el modelo, no la Knowledge Base'
  correctas:
  - d
  explicacion: 'Separar recuperación y generación localiza el fallo: si se recuperan bien los fragmentos pero la
    respuesta no es fiel al contexto, hay que mejorar el prompt o el modelo generador.'
  distractores:
    a: 'La recuperación funciona: los fragmentos correctos llegan al modelo.'
    b: La recuperación es correcta, así que el almacén no es el problema.
    c: Si los embeddings fallaran, la recuperación traería fragmentos incorrectos.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
- id: D3-088
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.4
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una empresa tiene un agente programado con Strands Agents y desplegado en Amazon Bedrock AgentCore,
    y quiere puntuar de forma continua su utilidad y si elige bien las herramientas a partir de sus trazas. ¿Qué
    servicio encaja?
  opciones:
  - id: a
    texto: Una evaluación programática de modelos de Bedrock con un conjunto integrado
  - id: b
    texto: Amazon Bedrock AgentCore Evaluations
  - id: c
    texto: Una evaluación de RAG de solo recuperación
  - id: d
    texto: SageMaker Clarify
  correctas:
  - b
  explicacion: AgentCore Evaluations evalúa agentes y herramientas a partir de sus trazas (por ejemplo, de Strands
    o LangGraph) con evaluadores integrados o propios basados en LLM-as-a-judge, antes y después del despliegue.
  distractores:
    a: Evalúa un modelo en tareas estándar, no el comportamiento del agente a partir de sus trazas.
    c: Evalúa lo que recupera una Knowledge Base, no las decisiones del agente.
    d: Ya no admite clientes nuevos y no evalúa trazas de agentes.
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations.html
- id: D3-089
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.4
  tipo: multiple_response
  dificultad: media
  enunciado: Un equipo diseña la evaluación de una aplicación RAG. ¿Qué DOS aspectos debe medir por separado?
  opciones:
  - id: a
    texto: La temperatura usada en la ingesta de documentos
  - id: b
    texto: Si la recuperación trae los fragmentos relevantes para cada pregunta
  - id: c
    texto: Si la respuesta generada es fiel al contexto recuperado y correcta
  - id: d
    texto: El número de parámetros del modelo de embeddings
  - id: e
    texto: El tamaño en disco de la Knowledge Base
  correctas:
  - b
  - c
  explicacion: En RAG se evalúan la recuperación (relevancia de lo recuperado) y la generación (corrección, completitud
    y fidelidad al contexto). Bedrock ofrece trabajos de solo recuperación y de recuperación y generación.
  distractores:
    a: La ingesta no usa temperatura; es un parámetro de generación.
    d: Describe el modelo, no la calidad de la aplicación.
    e: Es un dato de almacenamiento, no de calidad.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
- id: D3-090
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.4
  tipo: matching
  dificultad: alta
  enunciado: Empareja cada tipo de aplicación con lo que es más importante evaluar en ella.
  prompts:
  - id: '1'
    texto: Aplicación RAG
  - id: '2'
    texto: Agente con herramientas
  - id: '3'
    texto: Flujo de pasos fijos
  opciones:
  - id: a
    texto: La BLEU de la respuesta frente a una traducción de referencia
  - id: b
    texto: Si completa la tarea y elige bien las herramientas y sus parámetros
  - id: c
    texto: El resultado de cada nodo y el de extremo a extremo
  - id: d
    texto: La relevancia de lo recuperado y la fidelidad de la respuesta al contexto
  correctas:
  - - '1'
    - d
  - - '2'
    - b
  - - '3'
    - c
  explicacion: En RAG importa qué se recupera y si la respuesta se ciñe a ello; en un agente, si cumple la tarea
    y usa bien las herramientas; en un flujo, cada paso y el resultado completo.
  distractores:
    a: Es una métrica de traducción; no es lo más importante en ninguno de estos tres tipos de aplicación.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
- id: D3-091
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un asistente de soporte atendió 60 000 consultas en un mes y resolvió 42 000 sin intervención humana.
    ¿Cuál es su tasa de tareas completadas?
  opciones:
  - id: a
    texto: 70 %
  - id: b
    texto: 30 %
