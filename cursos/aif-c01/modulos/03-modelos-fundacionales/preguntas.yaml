    ¿Qué técnica encaja?
  opciones:
  - id: a
    texto: Fine-tuning supervisado con los informes tal cual
  - id: b
    texto: Destilación hacia un modelo más pequeño
  - id: c
    texto: Preentrenamiento continuado con los informes sin etiquetar
  - id: d
    texto: Prompt caching de un glosario médico
  correctas:
  - c
  explicacion: El preentrenamiento continuado sigue entrenando un modelo existente con grandes volúmenes de texto
    sin etiquetar de un dominio para que aprenda su vocabulario, conservando la mayor parte de sus capacidades generales.
  distractores:
    a: Necesita pares etiquetados de entrada y salida; los informes no lo están.
    b: Transfiere la calidad de un modelo grande a uno pequeño; no enseña vocabulario nuevo del dominio.
    d: Abarata un contexto repetido, pero no adapta el modelo a millones de documentos.
