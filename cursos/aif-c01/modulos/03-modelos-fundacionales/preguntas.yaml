- id: D3-094
  dominio: 3
  tarea: '3.4'
  objetivo: 3.4.5
  tipo: multiple_choice
  dificultad: alta
  enunciado: Dos versiones de un asistente cuestan lo mismo por interacción (0,05 USD), pero la A resuelve el 60
    % de las consultas y la B el 75 %. Con 3000 USD de coste mensual en ambos casos y 60 000 interacciones, ¿qué
    conclusión es correcta?
  opciones:
  - id: a
    texto: 'B: menor coste por consulta resuelta (≈0,067 frente a ≈0,083 USD)'
  - id: b
    texto: A es mejor porque deriva más consultas a personas
  - id: c
    texto: No se pueden comparar sin conocer el precio por token
  - id: d
    texto: Son equivalentes porque el coste por interacción es el mismo
  correctas:
  - a
  explicacion: 'A resuelve 36 000 consultas: 3000 / 36 000 ≈ 0,083 USD. B resuelve 45 000: 3000 / 45 000 ≈ 0,067
    USD. Combinar coste y tasa de tareas completadas da una visión más fiel del valor.'
  distractores:
    b: Derivar más consultas aumenta el coste total del servicio y empeora la tasa de tareas completadas.
