  opciones:
  - id: a
    texto: Preentrenamiento desde cero
  - id: b
    texto: Aprendizaje no supervisado
  - id: c
    texto: Transfer learning
  - id: d
    texto: Prompt caching
  correctas:
  - c
  explicacion: El aprendizaje por transferencia reutiliza el conocimiento de un modelo entrenado en una tarea general
    y lo adapta a otra con pocos datos; es la idea en la que se basa el ajuste fino.
  distractores:
    a: Necesitaría muchísimas imágenes; justo lo que no tienen.
    b: Usa datos sin etiquetar para encontrar patrones; aquí se ajusta con imágenes etiquetadas.
    d: Es una optimización de la inferencia de modelos de lenguaje, no un método de entrenamiento.
  referencia: https://aws.amazon.com/what-is/transfer-learning/
- id: D3-064
  dominio: 3
  tarea: '3.3'
  objetivo: 3.3.2
  tipo: multiple_choice
  dificultad: alta
  enunciado: Un equipo quiere mejorar un modelo que genera consultas SQL. No tiene respuestas de referencia para
