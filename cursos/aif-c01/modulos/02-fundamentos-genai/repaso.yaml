      texto: "Subir la temperatura del modelo"
  correctas: [["1", b], ["2", d], ["3", a], ["4", c]]
  explicacion: "RAG aporta datos fiables de la empresa; la memoria de largo plazo conserva lo aprendido entre sesiones; resumir el historial contiene el coste; y el prompt caching abarata un prefijo largo que se repite. Pista: cada problema se arregla cambiando qué información llega al modelo."
  distractores:
    e: "Subir la temperatura solo hace las respuestas más variadas; no aporta información ni reduce el coste."
  referencia: "https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-context.html"

- id: R2-044
  dominio: 2
  tarea: "2.1"
  objetivo: "2.1.6"
