      texto: "La conversación crece y el coste se dispara"
    - id: "4"
      texto: "El mismo documento largo se envía en cada pregunta"
  opciones:
    - id: a
      texto: "Resumir o recortar el historial y enviar solo lo relevante"
    - id: b
      texto: "Añadir los fragmentos relevantes recuperados con RAG"
    - id: c
