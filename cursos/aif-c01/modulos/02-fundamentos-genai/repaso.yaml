  opciones:
    - id: a
      texto: "Menor barrera de entrada"
    - id: b
      texto: "Eficiencia"
    - id: c
      texto: "Rentabilidad"
    - id: d
      texto: "Velocidad de comercialización"
  correctas: [a]
  explicacion: "La menor barrera de entrada significa que no hace falta experiencia en ML ni en infraestructura para empezar. Pista: barrera de entrada = qué conocimientos necesitas para arrancar."
  distractores:
    b: "La eficiencia es que AWS se ocupe de servidores, escalado y parches, para que el equipo se centre en la lógica de negocio."
    c: "La rentabilidad es el pago por uso sin inversión inicial y las opciones más baratas para lotes o capacidad reservada."
    d: "La velocidad de comercialización viene de los componentes listos (RAG, Guardrails, agentes, evaluaciones) que acortan el desarrollo."
