- id: R2-040
  dominio: 2
  tarea: "2.1"
  objetivo: "2.1.3"
  tipo: multiple_choice
  dificultad: media
  enunciado: "Una empresa que usa un modelo fundacional existente en Amazon Bedrock, ¿en qué etapa del ciclo de vida empieza normalmente?"
  opciones:
    - id: a
