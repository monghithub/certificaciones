  enunciado: "Relaciona cada carga de trabajo con la opción de inferencia de Amazon Bedrock que mejor encaja."
  prompts:
    - id: "1"
      texto: "Resumir un gran volumen de reseñas cada noche, con entrada y salida en Amazon S3"
    - id: "2"
      texto: "Un piloto con tráfico bajo e impredecible, sin compromisos"
    - id: "3"
      texto: "Una aplicación crítica de cara al cliente que necesita la respuesta más rápida sin reservar capacidad"
    - id: "4"
      texto: "Evaluaciones no urgentes que deben seguir usando llamadas normales a la API con herramientas"
    - id: "5"
      texto: "El mismo documento largo enviado como contexto en muchas preguntas"
  opciones:
    - id: a
      texto: "Nivel Flex"
    - id: b
      texto: "Nivel Priority"
    - id: c
      texto: "Inferencia por lotes"
    - id: d
      texto: "Prompt caching"
    - id: e
      texto: "Bajo demanda, nivel Standard"
    - id: f
      texto: "Provisioned Throughput"
  correctas: [["1", "c"], ["2", "e"], ["3", "b"], ["4", "a"], ["5", "d"]]
  explicacion: "Lotes, asíncrono con S3 y un 50 % más barato; bajo demanda, para tráfico variable; Priority, la respuesta más rápida con un recargo del 75 %; Flex, el mismo 50 % de descuento manteniendo las llamadas normales a la API; prompt caching, para prefijos repetidos. Pista: si puede esperar, lotes o Flex; si no puede esperar, Priority."
  distractores:
    f: "Provisioned Throughput es capacidad dedicada que se paga por horas mientras exista; encaja con un rendimiento alto y constante o con modelos personalizados, no con ninguna de estas cargas."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html

- id: R2-035
  dominio: 2
  tarea: "2.3"
  objetivo: "2.3.4"
  tipo: multiple_choice
  dificultad: media
  enunciado: "¿Cómo se paga Provisioned Throughput en Amazon Bedrock?"
  opciones:
    - id: a
      texto: "Solo por los tokens de entrada y salida que se consumen cada mes"
    - id: b
      texto: "Por hora y por unidad de modelo, mientras exista, se use o no"
    - id: c
      texto: "Con un descuento del 50 % sobre el nivel Standard"
    - id: d
      texto: "Con un compromiso obligatorio de un año"
  correctas: [b]
  explicacion: "Provisioned Throughput se paga por hora y por unidad de modelo (MU), sin compromiso o con 1 o 6 meses (más descuento cuanto más largo). Se paga mientras exista, aunque no se use, por eso no conviene para pilotos ni tráfico bajo. Pista: capacidad dedicada = factura por horas."
  distractores:
    a: "El pago por tokens consumidos es el modo bajo demanda."
    c: "El descuento del 50 % es propio del nivel Flex y de la inferencia por lotes."
    d: "Puede contratarse sin compromiso o con 1 o 6 meses."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html

- id: R2-036
  dominio: 2
  tarea: "2.3"
  objetivo: "2.3.4"
  tipo: multiple_choice
  dificultad: alta
  enunciado: "¿Qué modalidad de Amazon Bedrock reparte la carga entre Regiones para ganar rendimiento ante picos manteniendo los datos dentro de una zona como la UE?"
  opciones:
    - id: a
      texto: "La inferencia entre Regiones global"
    - id: b
      texto: "El nivel Priority"
    - id: c
      texto: "La inferencia por lotes"
    - id: d
      texto: "La inferencia entre Regiones geográfica"
  correctas: [d]
  explicacion: "La inferencia entre Regiones geográfica mantiene los datos dentro de una zona (EE. UU., UE, APAC), sin coste adicional de enrutamiento y con el precio de la Región de origen. La global ahorra aproximadamente un 10 %, pero puede procesar en otras Regiones comerciales. Pista: con residencia de datos, geográfica."
  distractores:
    a: "La global puede procesar en Regiones comerciales de fuera de la zona, así que no respeta un requisito de residencia en la UE."
    b: "Priority acelera la respuesta con un recargo del 75 %, pero no reparte la carga entre Regiones."
    c: "Los lotes procesan ficheros de S3 de forma asíncrona y más barata; no tratan de repartir picos entre Regiones."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
