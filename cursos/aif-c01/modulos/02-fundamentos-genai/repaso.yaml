- id: R2-041
  dominio: 2
  tarea: "2.1"
  objetivo: "2.1.4"
  tipo: multiple_choice
  dificultad: media
  enunciado: "Un asistente envía 1 500 tokens de entrada y recibe 400 de salida por conversación. Si se pega el manual completo y la entrada sube a 6 000 tokens, ¿qué ocurre?"
  opciones:
    - id: a
      texto: "El coste no cambia, porque solo se facturan los tokens de salida"
    - id: b
      texto: "Sube el coste de entrada y también la latencia, sin cambiar de modelo"
    - id: c
      texto: "Baja la latencia, porque el modelo tiene más información"
    - id: d
      texto: "Solo aumenta el coste si se cambia a un modelo más grande"
  correctas: [b]
  explicacion: "En modo bajo demanda se pagan los tokens de entrada y los de salida. Cuadruplicar la entrada encarece cada conversación y aumenta el tiempo de respuesta. En el ejemplo del módulo, el coste mensual pasa de 167 a 446 USD con el mismo modelo. Pista: más contexto, más coste y más latencia."
  distractores:
    a: "Se factura tanto la entrada como la salida, cada una con su precio."
    c: "Procesar más tokens lleva más tiempo; enviar solo lo relevante es lo que reduce la latencia."
    d: "El modelo es la palanca principal, pero con el mismo modelo el coste crece con los tokens enviados."
  referencia: "https://aws.amazon.com/bedrock/pricing/"

- id: R2-042
  dominio: 2
  tarea: "2.1"
  objetivo: "2.1.5"
  tipo: multiple_choice
  dificultad: baja
  enunciado: "¿Por qué necesita una aplicación ingeniería de contexto aunque el modelo sea muy capaz?"
  opciones:
    - id: a
      texto: "Porque el modelo no tiene memoria entre peticiones y solo sabe lo que aprendió en el entrenamiento y lo que contiene la llamada"
    - id: b
      texto: "Porque el modelo se reentrena con cada pregunta y necesita datos limpios"
    - id: c
      texto: "Porque sin ella el modelo no puede generar texto en español"
    - id: d
      texto: "Porque es la única forma de reducir la temperatura del modelo"
  correctas: [a]
  explicacion: "Un modelo fundacional no recuerda las llamadas anteriores. La ingeniería de contexto decide qué información llega en cada llamada (instrucciones, historial, memoria, conocimiento recuperado, herramientas, ejemplos), en qué orden y con qué tamaño. Pista: lo que no está en la llamada, el modelo no lo sabe."
  distractores:
    b: "Responder a una pregunta es inferencia; el modelo no se reentrena con cada petición."
    c: "El idioma depende de las capacidades del modelo, no de la ingeniería de contexto."
    d: "La temperatura es un parámetro de inferencia que se fija en la llamada; no tiene relación con el contexto."
  referencia: "https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-context.html"

- id: R2-043
  dominio: 2
  tarea: "2.1"
  objetivo: "2.1.5"
  tipo: matching
  dificultad: media
  enunciado: "Empareja cada problema de una aplicación con la medida de ingeniería de contexto que lo resuelve."
  prompts:
    - id: "1"
      texto: "El modelo inventa datos de la empresa"
    - id: "2"
