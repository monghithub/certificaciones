  referencia: "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html"

- id: R2-049
  dominio: 2
  tarea: "2.2"
  objetivo: "2.2.3"
  tipo: multiple_choice
  dificultad: media
  enunciado: "¿Qué ventaja ofrece la API Converse de Amazon Bedrock a la hora de elegir un modelo?"
  opciones:
    - id: a
      texto: "Elige automáticamente el modelo más barato para cada petición"
    - id: b
      texto: "Unifica la forma de llamar a los modelos, de modo que cambiar de modelo es modificar un parámetro"
    - id: c
      texto: "Reserva capacidad dedicada para el modelo elegido"
    - id: d
      texto: "Cuenta los tokens de una petición antes de enviarla"
  correctas: [b]
  explicacion: "Con la API Converse, el código llama a todos los modelos de la misma forma, así que probar o cambiar de modelo solo exige modificar un parámetro. Eso reduce el riesgo de elegir mal al principio. Pista: «converse» = una conversación común para todos los modelos."
  distractores:
    a: "Repartir las peticiones entre modelos según calidad y coste es lo que hace Intelligent Prompt Routing, no la API Converse."
    c: "Reservar capacidad dedicada corresponde a Provisioned Throughput o al nivel Reserved."
    d: "Contar los tokens antes de enviar la petición es la función de la API CountTokens."
  referencia: "https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html"

- id: R2-050
  dominio: 2
  tarea: "2.2"
  objetivo: "2.2.4"
  tipo: multiple_choice
  dificultad: media
  enunciado: "Un asistente cuesta 3 000 USD al mes y ahorra 33 300 USD al mes en tiempo de agentes. ¿Cuál es aproximadamente su ROI?"
  opciones:
    - id: a
      texto: "0,09"
    - id: b
      texto: "11,1"
    - id: c
      texto: "30 300"
    - id: d
      texto: "10,1"
  correctas: [d]
  explicacion: "ROI = (beneficio − coste) / coste = (33 300 − 3 000) / 3 000 ≈ 10,1, es decir, un 1 010 %. Pista: al beneficio se le resta primero el coste y luego se divide entre el coste."
  distractores:
    a: "Sale de dividir el coste entre el ahorro (3 000 / 33 300); es la proporción inversa, no el retorno."
    b: "Sale de dividir el ahorro entre el coste sin restar antes la inversión (33 300 / 3 000)."
    c: "Es el beneficio neto en dólares, no el retorno relativo a la inversión."
  referencia: "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html"

- id: R2-051
  dominio: 2
  tarea: "2.2"
  objetivo: "2.2.4"
  tipo: multiple_choice
  dificultad: baja
  enunciado: "¿Qué mide el rendimiento entre dominios (cross-domain performance) de una solución de IA generativa?"
  opciones:
    - id: a
      texto: "Si el modelo mantiene la calidad en tareas o áreas distintas de aquellas para las que se probó"
    - id: b
      texto: "El porcentaje de usuarios que completan la compra"
    - id: c
      texto: "Los ingresos esperados de un cliente durante toda su relación con la empresa"
    - id: d
      texto: "El tiempo ahorrado por cada caso de soporte"
  correctas: [a]
  explicacion: "El rendimiento entre dominios mide si la calidad se mantiene fuera del área de prueba: por ejemplo, un asistente probado con preguntas de facturación que también debe responder sobre envíos. Pista: «entre dominios» = fuera de lo que se probó."
  distractores:
    b: "El porcentaje de usuarios que completan la acción deseada es la tasa de conversión."
    c: "Los ingresos de un cliente durante toda su relación son el valor del ciclo de vida del cliente (CLV)."
    d: "El tiempo o los recursos ahorrados por tarea miden la eficiencia."
  referencia: "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html"

- id: R2-052
  dominio: 2
  tarea: "2.3"
  objetivo: "2.3.2"
  tipo: matching
  dificultad: media
  enunciado: "Empareja cada ejemplo con la ventaja de los servicios de IA generativa de AWS que ilustra."
  prompts:
    - id: "1"
      texto: "Un prototipo listo en días gracias a RAG, Guardrails y evaluaciones ya disponibles"
    - id: "2"
      texto: "Un piloto que solo cuesta los tokens consumidos, sin inversión inicial"
    - id: "3"
      texto: "AWS se ocupa de servidores, escalado y parches y el equipo se centra en la lógica de negocio"
    - id: "4"
      texto: "Probar varios modelos de distintos proveedores en el playground en una tarde"
  opciones:
    - id: a
      texto: "Eficiencia"
    - id: b
      texto: "Velocidad de comercialización (speed to market)"
    - id: c
      texto: "Accesibilidad"
    - id: d
      texto: "Rentabilidad"
    - id: e
      texto: "Interpretabilidad del modelo"
  correctas: [["1", b], ["2", d], ["3", a], ["4", c]]
  explicacion: "Componentes listos aceleran la llegada al mercado; el pago por uso sin inversión inicial es rentabilidad; delegar la operación en AWS es eficiencia; y tener muchos modelos tras una misma API es accesibilidad."
  distractores:
    e: "La interpretabilidad no es una ventaja que aporten los servicios gestionados: los modelos fundacionales siguen siendo difíciles de explicar."
  referencia: "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html"

- id: R2-053
  dominio: 2
  tarea: "2.3"
  objetivo: "2.3.2"
  tipo: multiple_choice
  dificultad: baja
  enunciado: "¿Qué ventaja de AWS permite a una empresa cambiar a un modelo más barato cuando la calidad lo permite y medir el resultado?"
  opciones:
    - id: a
      texto: "Menor barrera de entrada"
    - id: b
      texto: "Accesibilidad"
    - id: c
      texto: "Cumplir los objetivos de negocio"
    - id: d
      texto: "Eficiencia"
  correctas: [c]
  explicacion: "La ventaja de cumplir los objetivos de negocio consiste en poder elegir y cambiar de modelo según la calidad y el coste, y medir los resultados. Pista: la decisión se ajusta al objetivo del negocio, no al modelo de moda."
  distractores:
    a: "La menor barrera de entrada se refiere a empezar sin experiencia en ML ni infraestructura."
    b: "La accesibilidad es tener modelos de muchos proveedores tras una misma API; facilita el cambio, pero la ventaja que describe el enunciado es ajustar la elección al objetivo."
    d: "La eficiencia es que AWS opere servidores, escalado y parches."
  referencia: "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html"

- id: R2-054
  dominio: 2
  tarea: "2.3"
  objetivo: "2.3.3"
  tipo: multiple_choice
  dificultad: media
  enunciado: "¿Qué chip diseñado por AWS sirve tanto para entrenar como para servir modelos de IA a escala?"
  opciones:
    - id: a
      texto: "AWS Inferentia"
    - id: b
      texto: "AWS Trainium"
    - id: c
      texto: "AWS Graviton"
    - id: d
      texto: "AWS Nitro"
  correctas: [b]
  explicacion: "AWS Trainium está pensado para entrenar y también para servir modelos de IA con la mejor relación coste-rendimiento; AWS Inferentia es específico de la inferencia de aprendizaje profundo e IA generativa al menor coste en Amazon EC2. Pista: Trainium entrena (y sirve); Inferentia solo infiere."
  distractores:
    a: "Inferentia está especializado en inferencia; no es el chip de AWS para entrenar."
    c: "Graviton es el procesador de uso general de AWS para instancias EC2, no un acelerador de IA del temario."
    d: "Nitro es el sistema de virtualización y seguridad de las instancias EC2, no un acelerador de IA."
  referencia: "https://aws.amazon.com/ai/machine-learning/inferentia/"

- id: R2-055
  dominio: 2
  tarea: "2.3"
  objetivo: "2.3.3"
  tipo: multiple_response
  dificultad: media
  enunciado: "¿Qué DOS afirmaciones sobre la protección de datos en Amazon Bedrock son correctas?"
  opciones:
    - id: a
      texto: "Al personalizar un modelo, se trabaja sobre una copia privada"
    - id: b
      texto: "Los proveedores de modelos reciben los prompts para mejorar sus modelos"
    - id: c
      texto: "Se puede conectar desde una VPC sin pasar por internet con AWS PrivateLink"
    - id: d
      texto: "El contenido se almacena en reposo en una Región de EE. UU., sea cual sea la Región de uso"
    - id: e
      texto: "Los datos solo se cifran si el cliente aporta sus propias claves"
  correctas: [a, c]
  explicacion: "En Bedrock el contenido del cliente no se usa para mejorar los modelos base ni se comparte con los proveedores; la personalización trabaja sobre una copia privada; PrivateLink permite el acceso privado desde la VPC; y los datos se cifran en tránsito y en reposo en la Región donde se usa el servicio."
  distractores:
    b: "Los modelos se despliegan en cuentas operadas por AWS a las que los proveedores no tienen acceso, y el contenido no se comparte con ellos."
    d: "El contenido procesado se cifra y se almacena en reposo en la Región en la que se usa el servicio."
    e: "El cifrado en tránsito y en reposo está activo; las claves propias son una opción adicional."
  referencia: "https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html"

- id: R2-056
  dominio: 2
  tarea: "2.3"
  objetivo: "2.3.4"
  tipo: multiple_choice
  dificultad: media
  enunciado: "¿Qué nivel de servicio de Amazon Bedrock cobra un 50 % menos que Standard y mantiene las llamadas normales a la API, a cambio de una respuesta más lenta?"
  opciones:
    - id: a
      texto: "Nivel Flex"
    - id: b
      texto: "Nivel Priority"
    - id: c
      texto: "Nivel Reserved"
    - id: d
      texto: "Inferencia por lotes"
  correctas: [a]
  explicacion: "El nivel Flex cuesta la mitad que Standard y sigue usando las llamadas normales a la API, incluidas las herramientas; encaja con evaluaciones, resúmenes o flujos agénticos no urgentes. Pista: Flex = mismo uso de la API, más paciencia, mitad de precio."
  distractores:
    b: "Priority cuesta un 75 % más que Standard a cambio de la respuesta más rápida."
    c: "Reserved es un precio fijo por capacidad reservada de 1 o 3 meses, para aplicaciones críticas."
    d: "La inferencia por lotes también cuesta un 50 % menos, pero no usa llamadas normales: procesa de forma asíncrona ficheros en S3 y no admite herramientas."
  referencia: "https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html"
