    - id: b
      texto: "El usuario, que copia los parámetros y llama a la API a mano"
    - id: c
      texto: "El proveedor del modelo, desde sus servidores"
    - id: d
      texto: "La aplicación o la plataforma, que devuelve el resultado al modelo"
  correctas: [d]
  explicacion: "El modelo no ejecuta nada por sí mismo: decide qué herramienta llamar y con qué parámetros; la aplicación o la plataforma la ejecuta y le devuelve el resultado para que continúe. Pista: el modelo decide, la aplicación ejecuta."
  distractores:
    a: "El modelo solo genera la petición de uso de la herramienta; no tiene acceso directo a las APIs."
    b: "El agente automatiza esa llamada; si el usuario tuviera que hacerla, no habría agente."
    c: "En Amazon Bedrock, los proveedores de modelos no tienen acceso a las cuentas donde se ejecutan los modelos ni a los datos del cliente."
  referencia: "https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html"

