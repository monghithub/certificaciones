- id: R2-047
  dominio: 2
  tarea: "2.2"
  objetivo: "2.2.2"
  tipo: multiple_choice
  dificultad: media
  enunciado: "¿Por qué la misma pregunta a un modelo fundacional puede dar respuestas distintas?"
  opciones:
    - id: a
      texto: "Porque el modelo se reentrena entre una petición y otra"
    - id: b
      texto: "Porque el proveedor cambia de modelo sin avisar"
    - id: c
      texto: "Porque el modelo muestrea el siguiente token de una distribución de probabilidad"
    - id: d
      texto: "Porque la ventana de contexto se vacía de forma aleatoria"
  correctas: [c]
  explicacion: "Para cada posición, el modelo calcula la probabilidad de cada posible token y toma una muestra. Ese muestreo es la causa del no determinismo; una temperatura baja, un formato de salida estructurado y la validación de la respuesta lo atenúan. Pista: muestrear = no determinismo."
  distractores:
    a: "Responder es inferencia; el modelo no cambia sus parámetros entre peticiones."
    b: "La variabilidad aparece aunque se use siempre la misma versión del modelo."
    d: "La ventana de contexto contiene lo que la aplicación envía en cada llamada; no se vacía al azar."
  referencia: "https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html"

- id: R2-048
  dominio: 2
  tarea: "2.2"
  objetivo: "2.2.3"
  tipo: matching
  dificultad: media
  enunciado: "Empareja cada requisito con el factor de selección de modelo que decide."
  prompts:
    - id: "1"
