- id: D2-053
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo de ciencia de datos quiere partir de un modelo fundacional de código abierto, ajustarlo con
    sus datos y desplegarlo en un endpoint propio en el que controle el tipo de instancia. ¿Qué opción de AWS está
    pensada para ese recorrido?
  opciones:
  - id: a
    texto: Amazon Bedrock Custom Model Import
  - id: b
    texto: Amazon SageMaker JumpStart
  - id: c
    texto: Amazon SageMaker Canvas
  - id: d
    texto: Amazon Bedrock
