  - id: c
    texto: La temperatura configurada en el modelo
  - id: d
    texto: El número de parámetros del modelo
  - id: e
    texto: El tiempo medio que tarda un gestor en resolver una consulta
  correctas:
  - b
  - e
  explicacion: 'La eficiencia se mide en tiempo o recursos ahorrados por tarea: tiempo de resolución y casos resueltos
    por persona y hora.'
  distractores:
    a: Mide ingresos, no la eficiencia del trabajo de los gestores.
    c: Es un parámetro de inferencia, no una métrica.
    d: Es una característica técnica del modelo, no una métrica de negocio.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: D2-051
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.4
  tipo: matching
  dificultad: media
  enunciado: Una empresa define los indicadores de varios proyectos de IA generativa. Empareja cada objetivo con
    la métrica más adecuada.
  prompts:
  - id: '1'
    texto: Que más visitas de la tienda acaben en compra
  - id: '2'
    texto: Que cada usuario genere más ingresos de media en el mes
  - id: '3'
    texto: Que el asistente mantenga la calidad en temas para los que no se probó
  - id: '4'
    texto: Que la inversión en el asistente se recupere con creces
  opciones:
  - id: a
