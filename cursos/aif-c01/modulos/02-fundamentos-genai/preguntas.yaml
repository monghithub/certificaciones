  distractores:
    a: Es una métrica técnica de rendimiento, no de valor de negocio.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: D2-052
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un equipo de desarrollo sin experiencia en ML quiere añadir a su aplicación un resumen de textos con
    modelos de varios proveedores, llamándolos por API y sin gestionar servidores ni infraestructura. ¿Qué servicio
