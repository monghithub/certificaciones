  distractores:
    a: Importa un modelo propio a Bedrock para inferencia serverless; tampoco permite elegir la instancia.
    c: Permite crear modelos predictivos sin código para analistas; no está pensado para ajustar y desplegar un
      modelo fundacional en un endpoint propio.
    d: 'Ofrece modelos y personalización, pero es serverless: el equipo no elige ni controla el tipo de instancia.'
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models.html
- id: D2-054
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_choice
  dificultad: media
  enunciado: El departamento financiero de una empresa quiere que sus empleados pregunten en lenguaje natural por
    los datos de ventas, automaticen informes repetitivos y obtengan informes de investigación con fuentes citadas,
    sin que TI desarrolle una aplicación. ¿Qué servicio de AWS encaja mejor?
  opciones:
  - id: a
    texto: Amazon Quick
  - id: b
    texto: Amazon SageMaker AI
  - id: c
    texto: Strands Agents
  - id: d
    texto: Kiro
  correctas:
  - a
  explicacion: Amazon Quick es un servicio con IA para automatizar tareas, analizar datos (Quick Sight), crear aplicaciones
    e investigar (Quick Research), que se usa mediante chat y no requiere desarrollo.
  distractores:
    b: Es una plataforma para crear modelos de ML, no un asistente listo para empleados.
    c: 'Es un SDK para programar agentes: exigiría desarrollo.'
    d: Está orientado a desarrolladores de software, no a empleados de negocio.
  referencia: https://docs.aws.amazon.com/quick/latest/userguide/what-is.html
- id: D2-055
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una empresa ya ha programado varios agentes con Strands Agents y LangGraph. Ahora necesita ejecutarlos
    en producción con aislamiento de sesiones, memoria gestionada, control de identidad y observabilidad, sin gestionar
    infraestructura. Es un proyecto nuevo. ¿Qué servicio encaja mejor?
  opciones:
  - id: a
    texto: Amazon Bedrock AgentCore
  - id: b
    texto: Amazon SageMaker JumpStart
  - id: c
    texto: Strands Agents
  - id: d
    texto: Amazon Bedrock Agents (Classic)
  correctas:
  - a
  explicacion: AgentCore es una plataforma agéntica para desplegar y operar agentes con cualquier framework (Strands
    Agents, LangGraph, CrewAI…) y modelo, con Runtime, Memory, Identity, Gateway y Observability.
  distractores:
    b: Ofrece modelos preentrenados para desplegar; no ejecuta ni opera agentes.
    c: Es el SDK con el que ya han programado parte de los agentes; no es la plataforma de ejecución y operación.
    d: Ya no admite clientes nuevos; AWS remite a AgentCore para proyectos nuevos.
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
- id: D2-056
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo de desarrollo quiere un asistente que convierta un prompt en especificaciones, un plan de
    implementación, código, documentación y pruebas, y que ejecute acciones automáticas al guardar ficheros. Hasta
    ahora usaba los plugins de IDE de Amazon Q Developer. ¿Qué servicio de AWS es la opción vigente para este caso?
  opciones:
  - id: a
    texto: Amazon SageMaker AI
  - id: b
    texto: AWS Transform
  - id: c
    texto: Kiro
  - id: d
    texto: Amazon Quick
  correctas:
  - c
  explicacion: Kiro es un servicio de programación agéntica con desarrollo guiado por especificaciones y hooks de
    agente. AWS remite a Kiro ante el fin de soporte de los plugins de IDE de Amazon Q Developer (30 de abril de
    2027).
  distractores:
    a: Sirve para crear y desplegar modelos de ML, no para generar especificaciones y código.
    b: Usa agentes para modernizar y migrar código e infraestructura existentes; el escenario pide desarrollar funcionalidades
      nuevas a partir de especificaciones.
    d: Está orientado a empleados de negocio (datos, automatización, investigación), no al desarrollo de software.
  referencia: https://aws.amazon.com/documentation-overview/kiro/
- id: D2-057
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_response
  dificultad: media
  enunciado: Un equipo diseña un agente en código que consulte el inventario y abra incidencias. ¿Qué DOS afirmaciones
    sobre Strands Agents son correctas?
  opciones:
  - id: a
    texto: Es la nueva versión de Amazon Q Business
  - id: b
    texto: Solo funciona con modelos de Amazon Nova
  - id: c
    texto: Es un SDK de código abierto, publicado inicialmente por AWS, para crear agentes con un enfoque centrado
      en el modelo
  - id: d
    texto: Admite MCP y patrones multiagente, y funciona con Amazon Bedrock y con otros proveedores de modelos
  - id: e
    texto: Es un servicio gestionado que aloja y escala los agentes en producción
  correctas:
  - c
  - d
  explicacion: Strands Agents es un SDK de código abierto centrado en el modelo, con integración nativa de MCP,
    patrones multiagente y soporte de varios proveedores de modelos.
  distractores:
    a: Q Business ya no admite clientes nuevos y AWS remite a Amazon Quick, no a Strands Agents.
    b: Admite varios modelos y proveedores, como Anthropic Claude, Amazon Nova u OpenAI.
    e: Esa función corresponde a Amazon Bedrock AgentCore; Strands Agents es un SDK.
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html
- id: D2-058
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: multiple_response
  dificultad: alta
  enunciado: Un arquitecto revisa qué servicios de IA generativa proponer en 2026 para proyectos nuevos. ¿Qué DOS
    afirmaciones son correctas?
  opciones:
  - id: a
    texto: Amazon Bedrock Agents (ahora Agents Classic) no admite clientes nuevos y AWS remite a Amazon Bedrock
      AgentCore
  - id: b
    texto: Amazon Q Business no admite clientes nuevos y AWS remite a Amazon Quick
  - id: c
    texto: Amazon QuickSight se ha retirado sin sustituto
  - id: d
    texto: Strands Agents sustituye a Amazon SageMaker AI
  - id: e
    texto: Kiro es un modelo fundacional de Amazon disponible en Bedrock
  correctas:
  - a
  - b
  explicacion: La documentación indica que Bedrock Agents (Classic) y Amazon Q Business ya no admiten clientes nuevos,
    con AgentCore y Amazon Quick como alternativas respectivas.
  distractores:
    c: QuickSight continúa como Amazon Quick Sight, una funcionalidad de Amazon Quick, y sus API siguen funcionando.
    d: Strands Agents es un SDK de agentes; SageMaker AI sigue siendo la plataforma de ML.
    e: Kiro es un servicio de programación agéntica construido sobre Bedrock, no un modelo.
  referencia: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
- id: D2-059
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.1
  tipo: matching
  dificultad: media
  enunciado: Un grupo empresarial recoge las peticiones de IA generativa de sus filiales. Empareja cada necesidad
    con el servicio de AWS que mejor la cubre.
  prompts:
  - id: '1'
    texto: Usar modelos fundacionales por API sin gestionar infraestructura
  - id: '2'
    texto: Entrenar y desplegar modelos propios con control de la infraestructura
  - id: '3'
    texto: Desplegar y operar agentes en producción con memoria, identidad y observabilidad
  - id: '4'
    texto: Programar agentes en código con un SDK de código abierto
  - id: '5'
    texto: Dar a los empleados un asistente con agentes sobre los datos de la empresa
  opciones:
  - id: a
    texto: Strands Agents
  - id: b
    texto: Amazon Bedrock AgentCore
  - id: c
    texto: Amazon Bedrock
  - id: d
    texto: Amazon SageMaker AI
  - id: e
    texto: Amazon Quick
  - id: f
    texto: AWS Transform
  correctas:
  - - '1'
    - c
  - - '2'
    - d
  - - '3'
    - b
  - - '4'
    - a
  - - '5'
    - e
  explicacion: 'Bedrock: modelos por API. SageMaker AI: modelos propios con control. AgentCore: ejecutar y operar
    agentes. Strands Agents: SDK de agentes. Amazon Quick: asistente para empleados.'
  distractores:
    f: Moderniza y migra código e infraestructura existentes con agentes; no cubre ninguna de las necesidades.
  referencia: https://docs.aws.amazon.com/decision-guides/latest/bedrock-or-sagemaker/bedrock-or-sagemaker.html
- id: D2-060
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una pyme sin científicos de datos quiere lanzar un asistente para clientes en pocas semanas, sin inversión
    inicial en hardware y pagando solo por lo que use. ¿Qué ventaja de los servicios de IA generativa de AWS lo
    hace posible?
  opciones:
  - id: a
    texto: La inferencia entre Regiones
  - id: b
    texto: Una menor barrera de entrada
  - id: c
    texto: El ajuste fino de modelos
  - id: d
    texto: El Provisioned Throughput
  correctas:
  - b
  explicacion: 'Los servicios gestionados como Amazon Bedrock bajan la barrera de entrada: no hacen falta experiencia
    en ML ni infraestructura, y se paga por uso.'
  distractores:
    a: Aumenta la capacidad ante picos, pero no explica que una pyme sin científicos de datos pueda empezar sin
      inversión.
    c: Sirve para adaptar el estilo o la tarea, pero requiere datos y trabajo; no es lo que permite empezar en pocas
      semanas sin experiencia.
    d: 'Da capacidad dedicada con facturación por horas: es lo contrario de pagar solo por lo que se usa.'
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
- id: D2-061
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.2
  tipo: multiple_choice
  dificultad: media
  enunciado: Un equipo construye un prototipo con un modelo en Amazon Bedrock. Tras un mes, aparece otro modelo
    con la misma calidad a menor precio, y quieren cambiar con el mínimo trabajo. ¿Qué característica de Bedrock
    lo facilita?
  opciones:
  - id: a
    texto: La API Converse
  - id: b
    texto: El Provisioned Throughput
  - id: c
    texto: El prompt caching
  - id: d
    texto: La inferencia entre Regiones global
  correctas:
  - a
  explicacion: La API Converse abstrae las diferencias entre modelos, de modo que se puede cambiar de modelo con
    un solo parámetro. Ayuda a cumplir los objetivos de negocio ajustando calidad y coste.
  distractores:
    b: Es una opción de capacidad dedicada para un modelo concreto; no facilita el cambio y puede exigir compromiso.
    c: Reutiliza prefijos repetidos para ahorrar tokens; no tiene relación con el cambio de modelo.
    d: Reparte las peticiones entre Regiones para el mismo modelo; no simplifica cambiar a otro modelo.
  referencia: https://aws.amazon.com/bedrock/faqs/
- id: D2-062
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.2
  tipo: multiple_response
  dificultad: media
  enunciado: La dirección de una empresa pregunta por qué construir su aplicación de IA generativa con servicios
    de AWS en lugar de montar su propia infraestructura. ¿Qué DOS ventajas son correctas?
  opciones:
  - id: a
    texto: Obligan a firmar un compromiso de uso de tres años
  - id: b
    texto: 'Eficiencia: AWS gestiona servidores, escalado y parches y el equipo se centra en el negocio'
  - id: c
    texto: Eliminan la necesidad de evaluar la calidad de las respuestas
  - id: d
    texto: Mayor velocidad de comercialización gracias a componentes listos como RAG, Guardrails o agentes
  - id: e
    texto: Hacen que los modelos no alucinen
  correctas:
  - b
  - d
  explicacion: La guía cita accesibilidad, menor barrera de entrada, eficiencia, rentabilidad, velocidad de comercialización
    y capacidad de cumplir los objetivos de negocio.
  distractores:
    a: Se puede pagar por uso, sin compromiso.
    c: La evaluación sigue siendo responsabilidad del cliente.
    e: Las alucinaciones son una limitación de los modelos; los servicios ayudan a mitigarlas, no las eliminan.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: D2-063
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.2
  tipo: ordering
  dificultad: baja
  enunciado: Una empresa quiere validar una idea de IA generativa con el menor riesgo. Ordena los pasos de un enfoque
    típico con servicios de AWS.
  opciones:
  - id: a
    texto: Escalar a producción ajustando modelo y opciones de coste
  - id: b
    texto: Medir calidad, coste y métricas de negocio con usuarios piloto
  - id: c
    texto: Construir un prototipo con la API de Bedrock y pago por uso
  - id: d
    texto: Probar varios modelos en el playground de Amazon Bedrock
  correctas:
  - d
  - c
  - b
  - a
  explicacion: Los servicios gestionados permiten experimentar en la consola, prototipar pagando por uso, medir
    resultados y escalar solo cuando el caso está demostrado.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/playgrounds.html
- id: D2-064
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Un banco teme que, al usar modelos de terceros en Amazon Bedrock, sus prompts y respuestas acaben entrenando
    los modelos públicos o lleguen a los proveedores de los modelos. ¿Qué indica la documentación de AWS?
  opciones:
  - id: a
    texto: El contenido del cliente no se usa para mejorar los modelos base ni se comparte con los proveedores de
      modelos
  - id: b
    texto: Los proveedores reciben los prompts para mejorar sus modelos, salvo que se pague un plan premium
  - id: c
    texto: Solo Amazon Nova protege los datos; los demás modelos los comparten
  - id: d
    texto: Los datos se comparten con el proveedor, pero de forma anónima
  correctas:
  - a
  explicacion: Según AWS, en Amazon Bedrock el contenido no se usa para mejorar los modelos base ni se comparte
    con ningún proveedor de modelos. Los modelos se despliegan en cuentas operadas por AWS a las que los proveedores
    no tienen acceso.
  distractores:
    b: 'No existe esa condición: el contenido no se comparte con los proveedores.'
    c: La protección se aplica en Bedrock a los modelos de todos los proveedores.
    d: Los datos de entrada y salida no se comparten con los proveedores de modelos.
  referencia: https://aws.amazon.com/bedrock/faqs/
- id: D2-065
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.3
  tipo: multiple_choice
  dificultad: media
  enunciado: Una aseguradora usa Amazon Bedrock. Un auditor pregunta quién es responsable de configurar qué usuarios
    pueden invocar los modelos y de proteger los datos que se envían. ¿Qué responde el modelo de responsabilidad
    compartida?
  opciones:
  - id: a
    texto: 'AWS: al ser un servicio gestionado, AWS configura los permisos de cada usuario'
  - id: b
    texto: El cliente, con IAM y la configuración del servicio
  - id: c
    texto: El proveedor del modelo, porque procesa las peticiones
  - id: d
    texto: 'Nadie: los servicios serverless no requieren permisos'
  correctas:
  - b
  explicacion: AWS es responsable de la infraestructura global; el cliente, de controlar su contenido y de la configuración
    de seguridad (por ejemplo, IAM) de los servicios que usa.
  distractores:
    a: AWS gestiona la infraestructura, pero la configuración de IAM la hace el cliente.
    c: Los proveedores no tienen acceso a las cuentas en las que se despliegan los modelos ni a los prompts.
    d: Los permisos se configuran con IAM también en los servicios serverless.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
- id: D2-066
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.3
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una empresa va a entrenar un modelo grande propio en Amazon EC2 y quiere hacerlo con chips diseñados
    por AWS para optimizar el coste. Un miembro del equipo propone instancias con AWS Inferentia. ¿Qué es correcto?
  opciones:
  - id: a
    texto: Inferentia es para inferencia; para entrenar, AWS Trainium
  - id: b
    texto: Inferentia es la opción adecuada, porque sirve igual para entrenar que para inferir
  - id: c
    texto: Trainium solo sirve para la inferencia, así que hay que usar Inferentia
  - id: d
    texto: Hay que usar Amazon Bedrock, porque EC2 no admite chips de AWS
  correctas:
  - a
  explicacion: AWS diseña Trainium para entrenar y servir modelos de IA con la mejor relación coste-rendimiento,
    e Inferentia específicamente para la inferencia al menor coste en EC2. Para entrenar, la opción es Trainium.
  distractores:
    b: Inferentia está diseñado específicamente para la inferencia, no para el entrenamiento.
    c: 'Es al revés: Trainium sirve para entrenar (y también para inferencia a escala).'
    d: Trainium e Inferentia están disponibles precisamente en instancias de Amazon EC2.
  referencia: https://aws.amazon.com/ai/machine-learning/inferentia/
- id: D2-067
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.3
  tipo: multiple_response
  dificultad: media
  enunciado: Un hospital evalúa Amazon Bedrock y quiere conocer las garantías de seguridad y cumplimiento. ¿Qué
    DOS afirmaciones son correctas?
  opciones:
  - id: a
    texto: Usar Bedrock traslada al proveedor del modelo la responsabilidad del cumplimiento del cliente
  - id: b
    texto: Los proveedores de modelos pueden consultar los registros de Bedrock del cliente
  - id: c
    texto: Bedrock está en el alcance de estándares como SOC e ISO y es apto para HIPAA
  - id: d
    texto: Los datos se cifran en tránsito y en reposo, y se puede usar AWS PrivateLink para no exponer el tráfico
      a internet
  - id: e
    texto: El cifrado de los datos debe programarlo el cliente, porque Bedrock no cifra
  correctas:
  - c
  - d
  explicacion: Bedrock cifra en tránsito y en reposo (opcionalmente con claves propias), admite PrivateLink y está
    en el alcance de SOC e ISO; además, es apto para HIPAA y puede usarse conforme al RGPD.
  distractores:
    a: La responsabilidad sigue siendo compartida entre AWS y el cliente.
    b: Los proveedores no tienen acceso a las cuentas de despliegue, ni a los registros ni a los prompts.
    e: Bedrock cifra los datos en tránsito y en reposo, con opción de claves propias.
  referencia: https://aws.amazon.com/bedrock/faqs/
- id: D2-068
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.3
  tipo: matching
  dificultad: media
  enunciado: Empareja cada necesidad de una aplicación de IA generativa con el beneficio o control de AWS que la
    cubre.
  prompts:
  - id: '1'
    texto: Filtrar contenido dañino y enmascarar datos personales en las respuestas
  - id: '2'
    texto: Conectar con Bedrock desde una VPC sin pasar por internet
  - id: '3'
    texto: Controlar qué usuarios pueden invocar cada modelo
  - id: '4'
    texto: Procesar las peticiones solo dentro de la UE aunque haya picos
  opciones:
  - id: a
    texto: Políticas de IAM
  - id: b
    texto: AWS PrivateLink
  - id: c
    texto: Amazon Bedrock Guardrails
  - id: d
    texto: Inferencia entre Regiones geográfica
  - id: e
    texto: Inferencia por lotes
  correctas:
  - - '1'
    - c
  - - '2'
    - b
  - - '3'
    - a
  - - '4'
    - d
  explicacion: 'Guardrails: seguridad del contenido. PrivateLink: conectividad privada. IAM: control de acceso.
    Inferencia geográfica: capacidad dentro de una zona, respetando la residencia de datos.'
  distractores:
    e: Reduce el coste de grandes volúmenes asíncronos; no aporta seguridad, privacidad ni residencia de datos.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
- id: D2-069
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_choice
  dificultad: media
  enunciado: Una empresa quiere resumir cada noche 500 000 reseñas de clientes con un modelo de Amazon Bedrock que
    admite procesamiento por lotes. Los resúmenes se consultan a la mañana siguiente. ¿Qué opción es la MÁS rentable?
  opciones:
  - id: a
    texto: Inferencia por lotes, con la entrada y la salida en Amazon S3
  - id: b
    texto: Inferencia bajo demanda en el nivel Standard, petición a petición
  - id: c
    texto: Provisioned Throughput con compromiso de seis meses
  - id: d
    texto: Inferencia bajo demanda en el nivel Priority
  correctas:
  - a
  explicacion: La inferencia por lotes procesa muchos prompts de forma asíncrona, con entrada y salida en S3, a
    un precio un 50 % menor que bajo demanda en los modelos que la admiten.
  distractores:
    b: Funciona, pero cuesta el doble que la inferencia por lotes en los modelos que la admiten.
    c: Se paga por horas aunque el trabajo solo se ejecute de noche.
    d: Paga un recargo por respuestas inmediatas que no se necesitan.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
- id: D2-070
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_choice
  dificultad: media
  enunciado: 'Una startup lanza un piloto de asistente con tráfico bajo e impredecible: algunos días casi no hay
    peticiones. Un consultor propone comprar Provisioned Throughput para «asegurar el rendimiento». ¿Cuál es el
    principal inconveniente?'
  opciones:
  - id: a
    texto: Se factura por horas aunque no haya tráfico
  - id: b
    texto: No admite modelos de Amazon
  - id: c
    texto: Exige un compromiso mínimo de tres años
  - id: d
    texto: Solo puede usarse con inferencia por lotes
  correctas:
  - a
  explicacion: Provisioned Throughput se factura por horas hasta que se elimina. Con tráfico bajo y variable, la
    inferencia bajo demanda, en la que se paga por token, es más rentable.
  distractores:
    b: No es una limitación del Provisioned Throughput.
    c: Admite sin compromiso, 1 mes o 6 meses.
    d: 'Es al revés: la inferencia por lotes no se admite con modelos aprovisionados.'
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html
- id: D2-071
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_choice
  dificultad: alta
  enunciado: Una aplicación de evaluación de modelos genera miles de peticiones que no son urgentes y pueden tardar
    más en completarse, pero necesita usar las mismas API síncronas y llamadas a herramientas que el resto de la
    aplicación. ¿Qué opción de Amazon Bedrock reduce el coste?
  opciones:
  - id: a
    texto: El nivel de servicio Priority
  - id: b
    texto: La inferencia por lotes
  - id: c
    texto: El nivel de servicio Reserved
  - id: d
    texto: El nivel de servicio Flex
  correctas:
  - d
  explicacion: El nivel Flex ofrece un descuento para cargas que toleran tiempos de proceso más largos, como evaluaciones,
    resúmenes o flujos agénticos, usando el parámetro service_tier en la propia petición.
  distractores:
    a: 'Ofrece respuestas más rápidas con un recargo: encarece la carga.'
    b: Abarata los volúmenes asíncronos, pero no admite llamadas a herramientas y cambia el modo de trabajo a ficheros
      en S3.
    c: Reserva capacidad con compromiso para aplicaciones críticas; no es la opción barata para cargas no urgentes.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
- id: D2-072
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_response
  dificultad: media
  enunciado: Un equipo analiza la factura de Amazon Bedrock de su asistente interno y quiere reducirla. ¿Qué DOS
    medidas reducen el coste?
  opciones:
  - id: a
    texto: Usar prompt caching para el contexto largo que se repite en muchas peticiones, si el modelo lo admite
  - id: b
    texto: Comprar Provisioned Throughput para un uso esporádico
  - id: c
    texto: Enviar el historial completo de la conversación en cada petición
  - id: d
    texto: Elegir un modelo más pequeño que cumpla la calidad requerida
  - id: e
    texto: Pasar las peticiones del asistente al nivel Priority
  correctas:
  - a
  - d
  explicacion: El modelo es la principal palanca de precio, y el prompt caching reduce el coste de los tokens de
    entrada repetidos.
  distractores:
    b: 'Se pagaría por horas aunque no se usara: encarece un uso esporádico.'
    c: Aumenta los tokens de entrada y, por tanto, el coste.
    e: Priority lleva un recargo sobre Standard.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
- id: D2-073
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_response
  dificultad: alta
  enunciado: 'Una empresa de comercio electrónico prepara su asistente para el Black Friday: la aplicación es crítica,
    el tráfico será alto y no hay requisitos de residencia de datos. ¿Qué DOS opciones de Amazon Bedrock mejoran
    la disponibilidad o el rendimiento ante el pico?'
  opciones:
  - id: a
    texto: Inferencia entre Regiones con un perfil global
  - id: b
    texto: Procesar las conversaciones con inferencia por lotes
  - id: c
    texto: Reservar capacidad en el nivel Reserved con el equipo de cuenta de AWS
  - id: d
    texto: Pasar las peticiones del asistente al nivel Flex
  - id: e
    texto: Reducir la temperatura del modelo
  correctas:
  - a
  - c
  explicacion: La inferencia entre Regiones reparte la carga entre Regiones (la global, sin restricción geográfica
    y con ahorro). El nivel Reserved reserva capacidad de tokens por minuto, con un objetivo de disponibilidad del
    99,5 %.
  distractores:
    b: Es asíncrona y no sirve para conversaciones en tiempo real.
    d: 'Flex acepta tiempos de proceso más largos a cambio de descuento: no mejora la respuesta ante un pico crítico.'
    e: La temperatura no afecta a la capacidad ni a la disponibilidad.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
- id: D2-074
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: matching
  dificultad: alta
  enunciado: Una empresa revisa sus cargas en Amazon Bedrock. Empareja cada una con la opción MÁS adecuada.
  prompts:
  - id: '1'
    texto: Asistente web con tráfico variable e impredecible
  - id: '2'
    texto: Resumen nocturno de un millón de documentos para el día siguiente
  - id: '3'
    texto: Modelo personalizado con tráfico alto y constante que necesita capacidad dedicada
  - id: '4'
    texto: Asistente de atención al cliente que necesita la respuesta más rápida sin reservar capacidad
  opciones:
  - id: a
    texto: Nivel Priority
  - id: b
    texto: Bajo demanda, nivel Standard
  - id: c
    texto: Preentrenar un modelo propio
  - id: d
    texto: Inferencia por lotes
  - id: e
    texto: Provisioned Throughput
  correctas:
  - - '1'
    - b
  - - '2'
    - d
  - - '3'
    - e
  - - '4'
    - a
  explicacion: Bajo demanda para tráfico variable; lotes para volúmenes que pueden esperar (un 50 % menos); Provisioned
    Throughput para capacidad dedicada, también para modelos personalizados; Priority para la respuesta más rápida
    sin reserva.
  distractores:
    c: No es una opción de inferencia y es lo más caro con diferencia.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html
- id: D2-075
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: ordering
  dificultad: media
  enunciado: Para un modelo de Amazon Bedrock que admite procesamiento por lotes y niveles de servicio, ordena estas
    formas de invocarlo de MENOR a MAYOR precio por token.
  opciones:
  - id: a
    texto: Bajo demanda, nivel Standard
  - id: b
    texto: Inferencia por lotes
  - id: c
    texto: Bajo demanda, nivel Priority
  correctas:
  - b
  - a
  - c
  explicacion: La inferencia por lotes cuesta un 50 % menos que bajo demanda en los modelos que la admiten; Standard
    es el precio de referencia; Priority lleva un recargo a cambio de respuestas más rápidas.
  referencia: https://aws.amazon.com/bedrock/pricing/
- id: D2-076
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.4
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un equipo calcula el coste mensual de un asistente en Amazon Bedrock con un modelo que se paga bajo
    demanda por tokens. ¿Qué tokens debe incluir en la estimación?
  opciones:
  - id: a
    texto: Solo los tokens de entrada que envía la aplicación
  - id: b
    texto: Solo los tokens de salida que genera el modelo
  - id: c
    texto: Los tokens de entrada y los de salida, cada uno con su precio
  - id: d
    texto: 'Ninguno: bajo demanda se paga una cuota mensual fija'
  correctas:
  - c
  explicacion: Bajo demanda se paga por los tokens de entrada y por los de salida, con precios distintos por modelo
    y Región; los de salida suelen costar varias veces más.
  distractores:
    a: También se pagan los de salida, que suelen ser más caros.
    b: 'También se pagan los de entrada: instrucciones, historial y documentos enviados.'
    d: Bajo demanda se paga por uso, sin cuota fija.
  referencia: https://aws.amazon.com/bedrock/pricing/
- id: D2-077
  dominio: 2
  tarea: '2.1'
  objetivo: 2.1.5
  tipo: multiple_choice
  dificultad: baja
  enunciado: Los clientes de una tienda se quejan de que el asistente les pide de nuevo el número de pedido que
    ya dieron dos mensajes antes. ¿Qué pieza del contexto falta en cada llamada al modelo?
  opciones:
  - id: a
    texto: Una temperatura más alta
  - id: b
    texto: Más ejemplos few-shot de otras conversaciones
  - id: c
    texto: Un modelo con más parámetros
  - id: d
    texto: El historial de la conversación o la memoria de corto plazo
  correctas:
  - d
  explicacion: 'Un modelo no recuerda nada entre peticiones: la aplicación debe enviar el historial o una memoria
    de la sesión. Decidir qué información llega en cada llamada es ingeniería de contexto.'
  distractores:
    a: Cambia la variabilidad de la respuesta, no lo que el modelo sabe de la conversación.
    b: Muestran un formato, pero no aportan lo que dijo este cliente.
    c: El modelo no guarda estado entre llamadas, sea del tamaño que sea; hay que enviarle el historial.
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html
- id: D2-078
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.2
  tipo: multiple_choice
  dificultad: baja
  enunciado: Un asistente afirma con total seguridad que la empresa tiene una oficina en Lisboa, aunque no existe.
    ¿Cómo se llama esta limitación de la IA generativa?
  opciones:
  - id: a
    texto: Deriva del modelo
  - id: b
    texto: Sobreajuste
  - id: c
    texto: Alucinación
  - id: d
    texto: Latencia
  correctas:
  - c
  explicacion: Una alucinación es una respuesta que parece plausible y segura pero es falsa o no está respaldada
    por los datos. Se reduce con RAG, prompts precisos y verificación.
  distractores:
    a: Es la pérdida de calidad de un modelo con el tiempo porque cambian los datos reales.
    b: Es memorizar los datos de entrenamiento y generalizar mal; no describe inventar un dato con seguridad.
    d: Es el tiempo de respuesta, no la exactitud del contenido.
  referencia: https://aws.amazon.com/what-is/ai-hallucinations/
- id: D2-079
  dominio: 2
  tarea: '2.2'
  objetivo: 2.2.4
  tipo: multiple_choice
  dificultad: baja
  enunciado: Una tienda online implanta un asistente de compra y quiere saber si ayuda a vender más. ¿Qué métrica
    debe comparar entre los visitantes que lo usan y los que no?
  opciones:
  - id: a
    texto: La ventana de contexto del modelo
  - id: b
    texto: La temperatura del modelo
  - id: c
    texto: El número de tokens procesados
  - id: d
    texto: La tasa de conversión
  correctas:
  - d
  explicacion: La tasa de conversión (visitas que terminan en compra) mide directamente el efecto del asistente
    en las ventas.
  distractores:
    a: Es una característica técnica del modelo, no un resultado de negocio.
    b: Es un parámetro de inferencia, no una métrica de negocio.
    c: Mide el uso y el coste del modelo, no si se vende más.
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html
- id: D2-080
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.3
  tipo: multiple_choice
  dificultad: baja
  enunciado: El responsable de seguridad de un banco pregunta si los datos que su aplicación envía a Amazon Bedrock
    se usan para entrenar los modelos base de los proveedores. ¿Qué respuesta es correcta?
  opciones:
  - id: a
    texto: 'No: el contenido del cliente no se usa para mejorar los modelos base ni se comparte con los proveedores
      de modelos'
  - id: b
    texto: Depende de la temperatura configurada
  - id: c
    texto: Sí, salvo que se contrate Provisioned Throughput
  - id: d
    texto: Sí, pero de forma anónima
  correctas:
  - a
  explicacion: Según la documentación de Bedrock, el contenido del cliente no se usa para mejorar los modelos base
    ni se comparte con los proveedores de modelos.
  distractores:
    b: La temperatura no tiene relación con el uso de los datos.
    c: Provisioned Throughput es una opción de capacidad, no de privacidad.
    d: Bedrock no usa el contenido del cliente para mejorar los modelos base, ni anonimizado.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/data-protection.html
- id: D2-081
  dominio: 2
  tarea: '2.3'
  objetivo: 2.3.4
  tipo: multiple_response
  dificultad: baja
  enunciado: 'Una empresa usa Amazon Bedrock bajo demanda para dos cargas: un chat web con tráfico irregular y un
    informe que resume cada noche 200 000 reseñas y se lee por la mañana. ¿Qué DOS decisiones de coste son correctas?'
  opciones:
  - id: a
    texto: Usar el nivel Priority para el informe nocturno
  - id: b
    texto: Procesar el chat web con inferencia por lotes
  - id: c
    texto: Procesar el informe nocturno con inferencia por lotes
  - id: d
    texto: Mantener el chat web bajo demanda
  - id: e
    texto: Comprar Provisioned Throughput para el chat web
  correctas:
  - c
  - d
  explicacion: Para tráfico irregular, bajo demanda; para volúmenes que pueden esperar, la inferencia por lotes
    cuesta un 50 % menos en los modelos que la admiten.
  distractores:
    a: Paga un recargo por rapidez en una carga que puede esperar.
    b: 'Es asíncrona: un chat necesita respuesta inmediata.'
    e: Se paga por horas aunque no se use; no compensa con tráfico irregular.
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
