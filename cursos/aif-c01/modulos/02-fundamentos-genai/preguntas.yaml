  - id: b
    texto: Tasa de conversión
  - id: c
    texto: ROI
  - id: d
    texto: ARPU
  - id: e
    texto: Rendimiento entre dominios
  correctas:
  - - '1'
    - b
  - - '2'
    - d
  - - '3'
    - e
  - - '4'
    - c
  explicacion: 'Conversión: proporción que compra. ARPU: ingreso medio por usuario. Rendimiento entre dominios:
