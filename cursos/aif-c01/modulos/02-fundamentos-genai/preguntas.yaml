  opciones:
  - id: a
    texto: Amazon SageMaker AI
  - id: b
    texto: Amazon Comprehend
  - id: c
    texto: Amazon Bedrock
  - id: d
    texto: Amazon EC2 con GPU
  correctas:
  - c
  explicacion: Amazon Bedrock es un servicio totalmente gestionado y serverless que da acceso por API a modelos
