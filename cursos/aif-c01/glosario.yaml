# Glosario del curso AIF-C01. Cada servicio o concepto clave que aparece en los módulos debe tener su entrada.
# Los términos y alias se convierten en botones que abren un modal en la consola.

# ------------------------------------------------------------------ servicios de AWS
- id: amazon-ec2
  termino: Amazon EC2
  alias: [EC2, Amazon Elastic Compute Cloud]
  categoria: servicio
  icono: aws/Arch_Amazon-EC2_48.svg
  definicion: "Capacidad de cómputo escalable bajo demanda en la nube de AWS: servidores virtuales llamados instancias. El cliente elige el tipo de instancia, la red y el almacenamiento, y gestiona el sistema operativo invitado."
  usar_cuando: "Cuando se necesita control del sistema operativo, de la red y del almacenamiento (por ejemplo, para alojar un modelo propio)."
  no_usar_cuando: "Cuando basta un servicio gestionado y no se quiere asumir parches, actualizaciones ni configuración del servidor: código por eventos con AWS Lambda; modelos con Amazon Bedrock o un endpoint de SageMaker AI."
  referencia: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html

- id: amazon-s3
  termino: Amazon S3
  alias: [S3, Amazon Simple Storage Service]
  categoria: servicio
  icono: aws/Arch_Amazon-Simple-Storage-Service_48.svg
  definicion: "Servicio de almacenamiento de objetos con gran escalabilidad, disponibilidad, seguridad y rendimiento. Se usa, entre otros, para lagos de datos, sitios web, copias de seguridad y analítica de big data."
  no_usar_cuando: "Como base de datos transaccional: para eso, una base de datos (Amazon RDS o Amazon Aurora si es relacional; Amazon DynamoDB si es clave-valor). Tampoco como disco de baja latencia de un servidor: eso es almacenamiento de bloques o de ficheros (Amazon EBS o Amazon EFS, que este examen no evalúa)."
  referencia: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html

- id: aws-lambda
  termino: AWS Lambda
  alias: [Lambda]
  categoria: servicio
  icono: aws/Arch_AWS-Lambda_48.svg
  definicion: "Servicio de cómputo serverless: ejecuta código sin aprovisionar ni gestionar servidores. AWS se encarga del mantenimiento, la capacidad, el escalado y los parches."
  usar_cuando: "Para ejecutar código en respuesta a eventos o llamadas a una API sin gestionar servidores."
  no_usar_cuando: "Cuando se necesita control sobre el servidor o el sistema operativo: Amazon EC2."
  referencia: https://docs.aws.amazon.com/lambda/latest/dg/welcome.html

- id: region-de-aws
  termino: Región de AWS
  alias: [Región, Regiones, AWS Region]
  categoria: concepto
  definicion: "Ubicación geográfica donde se crean los recursos de AWS. Se elige la que ofrece los servicios y funcionalidades necesarios, cumple los requisitos legales y está cerca de los usuarios (menos latencia). La disponibilidad de servicios y modelos varía según la Región."
  enlaces:
    - {texto: "Modelos de Amazon Bedrock por Región", url: "https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html"}
  referencia: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html

- id: computacion-en-la-nube
  termino: computación en la nube
  alias: [cloud computing]
  categoria: concepto
  definicion: "Entrega bajo demanda, por internet y con pago por uso, de capacidad de cómputo, bases de datos, almacenamiento, aplicaciones y otros recursos de TI, en lugar de comprar y mantener centros de datos y servidores propios."
  enlaces:
    - {texto: "Seis ventajas de la computación en la nube", url: "https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html"}
    - {texto: "Modelos de despliegue", url: "https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html"}
  referencia: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/what-is-cloud-computing.html

- id: nube-hibrida
  termino: nube híbrida
  alias: [despliegue híbrido, hybrid cloud]
  categoria: concepto
  definicion: "Modelo de despliegue que conecta recursos de la nube con recursos que siguen fuera de ella, normalmente en el centro de datos propio. Los otros dos modelos son la nube (todo en la nube) y el local u on-premises (todo en el centro de datos propio, también llamado nube privada)."
  usar_cuando: "Cuando parte de la carga debe quedarse en las instalaciones propias (sistemas heredados, ubicación de los datos) y otra parte se lleva a la nube."
  no_usar_cuando: "Si toda la aplicación puede ejecutarse en la nube: un despliegue solo en la nube es más sencillo de operar."
  referencia: https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html

- id: iaas
  termino: IaaS (Infrastructure as a Service)
  alias: [IaaS, Infrastructure as a Service, infraestructura como servicio]
  categoria: concepto
  definicion: "Tipo de servicio en la nube que ofrece los bloques básicos de TI (cómputo, almacenamiento y red). El cliente gestiona el sistema operativo, el software, la aplicación y los datos. AWS cita Amazon EC2 como ejemplo."
  usar_cuando: "Cuando se necesita el máximo control sobre el servidor y su sistema operativo."
  no_usar_cuando: "Cuando no se quiere gestionar servidores: un servicio más gestionado (AWS Lambda, Amazon Bedrock, un servicio de IA preentrenado) reduce las tareas operativas."
  referencia: https://aws.amazon.com/compliance/shared-responsibility-model/

- id: paas
  termino: PaaS (Platform as a Service)
  alias: [PaaS, Platform as a Service, plataforma como servicio]
  categoria: concepto
  definicion: "Tipo de servicio en la nube que ofrece una plataforma para desarrollar y mantener aplicaciones sin gestionar la infraestructura de debajo. El cliente gestiona su aplicación y sus datos."
  usar_cuando: "Cuando el equipo quiere centrarse en su código y no en el sistema operativo ni en la infraestructura."
  no_usar_cuando: "Cuando hace falta controlar el sistema operativo o el hardware: IaaS (Amazon EC2)."
  referencia: https://aws.amazon.com/types-of-cloud-computing/

- id: saas
  termino: SaaS (Software as a Service)
  alias: [SaaS, Software as a Service, software como servicio]
  categoria: concepto
  definicion: "Tipo de servicio en la nube en el que el proveedor ejecuta y gestiona una aplicación completa; el usuario solo la usa y la configura. El ejemplo clásico es el correo web."
  usar_cuando: "Cuando una aplicación ya hecha cubre la necesidad y no se quiere desarrollar ni operar nada."
  no_usar_cuando: "Cuando hay que construir una aplicación propia: PaaS o IaaS."
  referencia: https://aws.amazon.com/types-of-cloud-computing/

- id: zona-de-disponibilidad
  termino: zona de disponibilidad
  alias: [zonas de disponibilidad, Availability Zone, Availability Zones, AZ]
  categoria: concepto
  definicion: "Uno o varios centros de datos separados, con alimentación, red y conectividad redundantes, dentro de una Región de AWS. Cada Región tiene al menos tres. Repartir una aplicación entre varias zonas permite diseñar aplicaciones de alta disponibilidad."
  enlaces:
    - {texto: "Infraestructura global de AWS", url: "https://docs.aws.amazon.com/whitepapers/latest/aws-overview/global-infrastructure.html"}
  referencia: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-availability-zones.html

- id: aws-local-zones
  termino: AWS Local Zones
  alias: [Local Zones, Local Zone]
  categoria: concepto
  definicion: "Extensiones de una Región que acercan cómputo, almacenamiento, bases de datos y otros servicios a grandes núcleos de población e industria, para dar latencia muy baja a los usuarios de esa zona."
  usar_cuando: "Cuando una aplicación necesita latencia de milisegundos de un dígito para usuarios de una ciudad concreta."
  no_usar_cuando: "Para entregar contenido estático o en caché a usuarios de todo el mundo: Amazon CloudFront y sus ubicaciones de borde."
  referencia: https://docs.aws.amazon.com/local-zones/latest/ug/what-is-aws-local-zones.html

- id: ubicacion-de-borde
  termino: ubicación de borde
  alias: [ubicaciones de borde, edge location, edge locations, punto de presencia]
  categoria: concepto
  definicion: "Centro de datos de la red mundial de Amazon CloudFront donde se guardan copias en caché del contenido para entregarlo desde el punto más cercano al usuario, con menos latencia."
  referencia: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html

- id: dedicated-hosts
  termino: Dedicated Hosts
  alias: [Dedicated Host, hosts dedicados]
  categoria: concepto
  definicion: "Opción de compra de Amazon EC2: un servidor físico dedicado por completo al cliente. Permite usar licencias de software existentes por socket, por núcleo o por máquina virtual, o cumplir el requisito de ejecutar en hardware dedicado."
  usar_cuando: "Para reutilizar licencias ligadas al hardware o cuando se exige hardware dedicado."
  no_usar_cuando: "Si solo se busca ahorrar: Savings Plans, Reserved Instances o Spot Instances."
  referencia: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html

- id: aws-pricing-calculator
  termino: AWS Pricing Calculator
  alias: [Pricing Calculator, calculadora de precios de AWS]
  categoria: servicio
  definicion: "Herramienta web gratuita para estimar el coste de usar servicios de AWS antes de desplegarlos, según la Región y el uso previsto. Es una estimación y no incluye impuestos."
  usar_cuando: "Para presupuestar una arquitectura antes de crearla."
  no_usar_cuando: "Para recibir avisos cuando el gasto real supera un umbral (AWS Budgets) o para analizar el gasto ya hecho (AWS Cost Explorer)."
  referencia: https://docs.aws.amazon.com/pricing-calculator/latest/userguide/what-is-pricing-calculator.html

- id: iam-access-analyzer
  termino: IAM Access Analyzer
  alias: [Access Analyzer]
  categoria: servicio
  definicion: "Funcionalidad de IAM que identifica recursos compartidos con entidades externas a la cuenta u organización y accesos concedidos que no se usan. También valida políticas y puede generarlas a partir de la actividad registrada en AWS CloudTrail."
  usar_cuando: "Para revisar permisos y acercarse al mínimo privilegio."
  no_usar_cuando: "Para descubrir datos sensibles en Amazon S3 (Amazon Macie) o auditar quién hizo cada llamada (AWS CloudTrail)."
  referencia: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html

- id: aws-iam
  termino: AWS Identity and Access Management (IAM)
  alias: [IAM, AWS IAM, AWS Identity and Access Management]
  categoria: servicio
  icono: aws/Arch_AWS-Identity-and-Access-Management_48.svg
  definicion: "Servicio que controla de forma segura el acceso a los recursos de AWS: quién está autenticado (ha iniciado sesión) y quién está autorizado (tiene permisos) para usar qué recursos."
  no_usar_cuando: "No es un servicio de datos ni de cómputo: no sustituye al cifrado (AWS KMS) ni a los controles de la propia aplicación."
  referencia: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html

- id: amazon-bedrock
  termino: Amazon Bedrock
  alias: [Bedrock]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock_48.svg
  definicion: "Servicio totalmente gestionado que da acceso seguro a modelos fundacionales de alto rendimiento de las principales compañías de IA para crear y escalar aplicaciones de IA generativa."
  usar_cuando: "Para usar modelos fundacionales de varios proveedores mediante API, sin gestionar la infraestructura."
  no_usar_cuando: "Cuando se necesita entrenar un modelo propio desde cero o controlar toda la infraestructura de entrenamiento: Amazon SageMaker AI."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html

- id: amazon-bedrock-agentcore
  termino: Amazon Bedrock AgentCore
  alias: [AgentCore]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock-AgentCore_48.svg
  definicion: "Plataforma agéntica para crear, desplegar y operar agentes de IA de forma segura y a escala, con cualquier framework y modelo fundacional."
  usar_cuando: "Cuando hay un caso de uso agéntico que necesita ejecución, memoria, identidad y observabilidad gestionadas."
  no_usar_cuando: "Cuando basta una consulta sencilla a un modelo (una llamada a Bedrock, por ejemplo con la API Converse) o un flujo de pasos fijos (Amazon Bedrock Flows): no hace falta un agente."
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html

- id: amazon-bedrock-agents
  termino: Amazon Bedrock Agents
  alias: [Bedrock Agents, Amazon Bedrock Agents Classic]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock_48.svg
  definicion: "Permite crear y configurar agentes autónomos en una aplicación: orquestan las interacciones entre modelos fundacionales, fuentes de datos, aplicaciones y usuarios, y llaman a APIs para ejecutar acciones. Ahora se llama Agents Classic y ya no está abierto a clientes nuevos."
  no_usar_cuando: "En proyectos nuevos: AWS remite a Amazon Bedrock AgentCore para capacidades similares."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/agents.html

- id: amazon-bedrock-knowledge-bases
  termino: Amazon Bedrock Knowledge Bases
  alias: [Bedrock Knowledge Bases, Knowledge Bases]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock_48.svg
  definicion: "Permite integrar información propia en aplicaciones de IA generativa mediante RAG: busca en tus datos la información relevante para una consulta y la usa para mejorar las respuestas del modelo. Hay dos tipos: Managed Knowledge Base (Bedrock gestiona ingesta, índice y almacén, con conectores y permisos por documento) y customer-managed (el cliente elige y gestiona el almacén vectorial)."
  usar_cuando: "Cuando el modelo debe responder con información propia, específica o actualizada."
  no_usar_cuando: "Cuando el modelo no necesita datos propios ni actualizados: basta invocar el modelo con un buen prompt."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html

- id: amazon-sagemaker-ai
  termino: Amazon SageMaker AI
  alias: [SageMaker AI, SageMaker]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "Servicio totalmente gestionado de aprendizaje automático para construir, entrenar y desplegar modelos propios en un entorno de alojamiento listo para producción. Antes del 3 de diciembre de 2024 se llamaba Amazon SageMaker; desde esa fecha, «Amazon SageMaker» es el nombre de una plataforma unificada de datos, analítica e IA que incluye SageMaker AI."
  usar_cuando: "Cuando hace falta un modelo propio y la máxima flexibilidad y control sobre el algoritmo."
  no_usar_cuando: "Cuando un servicio de IA preentrenado (Rekognition, Comprehend, Transcribe…) o un modelo fundacional de Amazon Bedrock resuelve el caso con menos esfuerzo."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html

- id: amazon-sagemaker-jumpstart
  termino: Amazon SageMaker JumpStart
  alias: [SageMaker JumpStart, JumpStart]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "Ofrece modelos preentrenados de código abierto para muchos tipos de problemas, que se pueden entrenar de forma incremental y ajustar antes de desplegarlos, además de plantillas de solución y cuadernos de ejemplo."
  usar_cuando: "Para partir de un modelo preentrenado y ajustarlo con datos propios sin entrenar desde cero."
  no_usar_cuando: "Cuando se necesita un modelo totalmente a medida con un algoritmo propio, sin partir de uno preentrenado: SageMaker AI con código o contenedor propios."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html

- id: amazon-sagemaker-model-monitor
  termino: SageMaker Model Monitor
  alias: [Model Monitor, Amazon SageMaker Model Monitor]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "Vigila modelos de SageMaker AI en producción: deriva de la calidad de los datos y del modelo, deriva del sesgo y de la atribución de características, con alertas. Ya no está abierto a clientes nuevos; los existentes pueden seguir usándolo. AWS indica como sustituto sus soluciones abiertas de monitorización con CloudWatch."
  no_usar_cuando: "Como opción para un proyecto nuevo: ya no admite clientes nuevos; AWS remite a sus soluciones abiertas de monitorización con Amazon CloudWatch."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-model-quality-metrics.html

- id: amazon-sagemaker-clarify
  termino: SageMaker Clarify
  alias: [Amazon SageMaker Clarify]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "Herramienta de SageMaker AI para detectar sesgo en los datos (por ejemplo, CI y DPL) y en las predicciones (por ejemplo, DI) y explicarlas con SHAP. Ya no está abierta a clientes nuevos; los existentes pueden seguir usándola. AWS indica como sustituto calcular las mismas métricas con bibliotecas abiertas y SHAP, y Amazon Bedrock Evaluations para modelos fundacionales."
  usar_cuando: "Clientes actuales que necesitan métricas de sesgo y explicaciones de modelos de ML clásico."
  no_usar_cuando: "Como opción para un proyecto nuevo: métricas de sesgo y SHAP con bibliotecas abiertas (pandas, scikit-learn, SHAP) en ML clásico; Amazon Bedrock Evaluations solo para modelos fundacionales. En las preguntas del examen sigue siendo la respuesta clásica para sesgo y SHAP."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-availability-change.html

- id: amazon-transcribe
  termino: Amazon Transcribe
  alias: [Transcribe]
  categoria: servicio
  icono: aws/Arch_Amazon-Transcribe_48.svg
  definicion: "Servicio de reconocimiento automático del habla que usa modelos de aprendizaje automático para convertir audio en texto."
  usar_cuando: "Para transcribir audio (reuniones, llamadas) a texto."
  no_usar_cuando: "Cuando se necesita generar voz a partir de texto (Amazon Polly) o traducir (Amazon Translate)."
  referencia: https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html

- id: amazon-translate
  termino: Amazon Translate
  alias: [Translate]
  categoria: servicio
  icono: aws/Arch_Amazon-Translate_48.svg
  definicion: "Servicio de traducción de texto bajo demanda que usa aprendizaje automático. Sirve para traducir documentos de texto no estructurado y para crear aplicaciones multilingües."
  no_usar_cuando: "Cuando hay que transcribir audio (Amazon Transcribe) o extraer información del contenido de un documento (Amazon Textract o Amazon Comprehend)."
  referencia: https://docs.aws.amazon.com/translate/latest/dg/what-is.html

- id: amazon-comprehend
  termino: Amazon Comprehend
  alias: [Comprehend]
  categoria: servicio
  icono: aws/Arch_Amazon-Comprehend_48.svg
  definicion: "Usa procesamiento del lenguaje natural (NLP) para extraer información del contenido de los documentos: reconoce entidades, frases clave, idioma, opiniones y otros elementos."
  usar_cuando: "Para analizar texto: opiniones de clientes, entidades o temas de un conjunto de documentos."
  no_usar_cuando: "Cuando el problema no es de lenguaje natural: imágenes (Amazon Rekognition) o datos tabulares (Amazon SageMaker AI)."
  referencia: https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html

- id: amazon-lex
  termino: Amazon Lex
  alias: [Lex, Amazon Lex V2]
  categoria: servicio
  icono: aws/Arch_Amazon-Lex_48.svg
  definicion: "Servicio para crear interfaces conversacionales por voz y texto en las aplicaciones, con comprensión del lenguaje natural (NLU) y reconocimiento automático del habla (ASR)."
  usar_cuando: "Para construir un chatbot o asistente de voz propio."
  no_usar_cuando: "Cuando solo se quiere analizar texto existente, sin diálogo con el usuario: Amazon Comprehend."
  referencia: https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html

- id: amazon-polly
  termino: Amazon Polly
  alias: [Polly]
  categoria: servicio
  icono: aws/Arch_Amazon-Polly_48.svg
  definicion: "Servicio en la nube que convierte texto en voz realista, con varios idiomas y voces. Solo se paga por el texto sintetizado."
  usar_cuando: "Para dar voz a aplicaciones: lectura de artículos, asistentes, accesibilidad."
  no_usar_cuando: "Cuando se necesita el proceso inverso, de voz a texto (Amazon Transcribe)."
  referencia: https://docs.aws.amazon.com/polly/latest/dg/what-is.html

- id: amazon-rekognition
  termino: Amazon Rekognition
  alias: [Rekognition]
  categoria: servicio
  icono: aws/Arch_Amazon-Rekognition_48.svg
  definicion: "Servicio de análisis de imágenes y vídeo basado en aprendizaje profundo que añade capacidades de visión por computador a las aplicaciones sin necesidad de experiencia en ML."
  usar_cuando: "Para analizar imágenes y vídeos: objetos, escenas, moderación de contenido."
  no_usar_cuando: "Cuando hay que extraer texto estructurado de documentos (Amazon Textract)."
  referencia: https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html

- id: amazon-textract
  termino: Amazon Textract
  alias: [Textract]
  categoria: servicio
  icono: aws/Arch_Amazon-Textract_48.svg
  definicion: "Detecta y analiza texto mecanografiado y manuscrito en documentos, y extrae texto, formularios y tablas de documentos con datos estructurados."
  usar_cuando: "Para digitalizar formularios, facturas y documentos escaneados."
  no_usar_cuando: "Cuando se trata de reconocer objetos o rostros en fotografías (Amazon Rekognition)."
  referencia: https://docs.aws.amazon.com/textract/latest/dg/what-is.html

- id: amazon-personalize
  termino: Amazon Personalize
  alias: [Personalize]
  categoria: servicio
  icono: aws/Arch_Amazon-Personalize_48.svg
  definicion: "Servicio de aprendizaje automático totalmente gestionado que usa tus datos para generar recomendaciones de elementos para los usuarios y segmentos de usuarios por afinidad."
  usar_cuando: "Para personalizar recomendaciones (por ejemplo, en una aplicación de vídeo)."
  no_usar_cuando: "Cuando no se dispone de datos propios de usuarios y elementos con los que generar recomendaciones: hasta reunirlos, una regla sencilla (por ejemplo, los más vendidos)."
  referencia: https://docs.aws.amazon.com/personalize/latest/dg/what-is-personalize.html

- id: amazon-quick
  termino: Amazon Quick
  alias: [Quick]
  categoria: servicio
  icono: aws/Arch_Amazon-Quick_48.svg
  definicion: "Servicio con IA para automatizar tareas, analizar datos, crear aplicaciones web e investigar. Se usa mediante chat en lenguaje natural y emplea agentes de IA sobre los datos y aplicaciones conectados."
  usar_cuando: "Para dar a los empleados un asistente con agentes que consulte los datos de la empresa, automatice tareas, analice datos e investigue, sin desarrollar."
  no_usar_cuando: "Cuando se necesita un modelo propio con control sobre el entrenamiento (Amazon SageMaker AI) o una aplicación propia para clientes (Amazon Bedrock)."
  referencia: https://docs.aws.amazon.com/quick/latest/userguide/what-is.html

- id: kiro
  termino: Kiro
  categoria: servicio
  definicion: "Plataforma de desarrollo con IA de AWS, basada en especificaciones (spec-driven development), con un IDE y una CLI en los que agentes de IA ayudan a planificar, escribir y probar código."
  usar_cuando: "Para acelerar el desarrollo de software (incluidas aplicaciones de IA) con un asistente agéntico."
  no_usar_cuando: "Cuando la pregunta trata de entrenar o desplegar un modelo de ML: Amazon SageMaker AI."
  referencia: https://aws.amazon.com/documentation-overview/kiro/
  enlaces:
    - {texto: "Documentación de Kiro", url: "https://kiro.dev/docs/"}
    - {texto: "Kiro en la documentación de AWS (GovCloud)", url: "https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-kiro.html"}

# ------------------------------------------------------------------ conceptos de IA y ML
- id: inteligencia-artificial
  termino: inteligencia artificial
  alias: [IA, AI]
  categoria: concepto
  definicion: "Cualquier sistema capaz de replicar tareas que antes requerían inteligencia humana. La mayoría de los casos de uso buscan un resultado probabilístico: una predicción o decisión con un alto grado de certeza."
  referencia: https://docs.aws.amazon.com/decision-guides/latest/machine-learning-on-aws-how-to-choose/guide.html

- id: aprendizaje-automatico
  termino: aprendizaje automático
  alias: [ML, machine learning]
  categoria: concepto
  definicion: "Subconjunto de la IA que usa grandes cantidades de datos para crear y validar una lógica de decisión, llamada modelo. Casi todos los sistemas de IA actuales se crean con ML."
  referencia: https://docs.aws.amazon.com/decision-guides/latest/machine-learning-on-aws-how-to-choose/guide.html

- id: aprendizaje-profundo
  termino: aprendizaje profundo
  alias: [deep learning]
  categoria: concepto
  definicion: "Método de IA inspirado en el cerebro humano que procesa datos con redes neuronales de muchas capas. Reconoce patrones complejos en imágenes, texto, sonido y otros datos."
  referencia: https://aws.amazon.com/what-is/deep-learning/

- id: red-neuronal
  termino: red neuronal
  alias: [redes neuronales, neural network]
  categoria: concepto
  definicion: "Método de IA que procesa datos con nodos (neuronas artificiales) interconectados y organizados en capas, de forma inspirada en el cerebro humano. Es la base del aprendizaje profundo."
  referencia: https://aws.amazon.com/what-is/neural-network/

- id: ia-generativa
  termino: IA generativa
  alias: [GenAI, generative AI]
  categoria: concepto
  definicion: "Conjunto de sistemas y modelos de IA diseñados para generar contenido nuevo (texto, código, imágenes, música u otros datos) a partir de patrones aprendidos de datos existentes. Es un subconjunto del aprendizaje profundo."
  referencia: https://docs.aws.amazon.com/decision-guides/latest/generative-ai-on-aws-how-to-choose/guide.html

- id: modelo-fundacional
  termino: modelo fundacional
  alias: [modelos fundacionales, foundation model, foundation models, FM, FMs]
  categoria: concepto
  definicion: "Modelo muy grande preentrenado con vastos conjuntos de datos que sirve de base de la IA generativa. Se desarrolla en los dominios 2 y 3 del examen."
  referencia: https://docs.aws.amazon.com/decision-guides/latest/generative-ai-on-aws-how-to-choose/guide.html

- id: llm
  termino: LLM
  alias: [modelo de lenguaje de gran tamaño, large language model, LLMs]
  categoria: concepto
  definicion: "Modelo de aprendizaje profundo muy grande, preentrenado con enormes cantidades de datos y basado en la arquitectura transformer, capaz de comprender y generar lenguaje."
  referencia: https://aws.amazon.com/what-is/large-language-model/

- id: ia-agentica
  termino: IA agéntica
  alias: [agentic AI]
  categoria: concepto
  definicion: "Sistema de IA autónomo que puede actuar de forma independiente para alcanzar objetivos predefinidos, sin una supervisión humana constante. En AWS, un agente orquesta modelos, fuentes de datos y aplicaciones, y llama a APIs para ejecutar acciones."
  referencia: https://aws.amazon.com/what-is/agentic-ai/

- id: nlp
  termino: procesamiento del lenguaje natural
  alias: [NLP, PLN]
  categoria: concepto
  definicion: "Tecnología que permite a los ordenadores interpretar, manipular y comprender el lenguaje humano, en texto y en voz."
  referencia: https://aws.amazon.com/what-is/nlp/

- id: vision-por-computador
  termino: visión por computador
  alias: [computer vision]
  categoria: concepto
  definicion: "Campo de la IA que permite a los ordenadores obtener información útil de imágenes, vídeos y otras entradas visuales."
  referencia: https://aws.amazon.com/what-is/computer-vision/

- id: inferencia
  termino: inferencia
  alias: [inferir, inference]
  categoria: concepto
  definicion: "Uso de un modelo ya entrenado para obtener predicciones sobre datos nuevos. Se distingue del entrenamiento, que es el proceso de crear el modelo a partir de datos conocidos."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model.html

- id: sobreajuste
  termino: sobreajuste
  alias: [overfitting, alta varianza]
  categoria: concepto
  definicion: "El modelo acierta con los datos de entrenamiento pero no con datos reales porque se ajusta demasiado a ellos y no generaliza. Es un modelo de alta varianza."
  referencia: https://aws.amazon.com/what-is/overfitting/

- id: subajuste
  termino: subajuste
  alias: [underfitting, alto sesgo]
  categoria: concepto
  definicion: "El modelo no encuentra una relación significativa entre las entradas y las salidas y falla incluso con los datos de entrenamiento. Es un modelo de alto sesgo."
  referencia: https://aws.amazon.com/what-is/overfitting/

- id: sesgo-y-equidad
  termino: sesgo y equidad
  alias: [equidad, fairness]
  categoria: concepto
  definicion: "Un sistema se considera sesgado si discrimina a determinadas personas o grupos; los datos pueden reflejar desigualdades, por ejemplo por representación insuficiente de grupos o etiquetas sesgadas. La equidad es la ausencia de ese trato desigual. No confundir con el «sesgo» como error del modelo (bias frente a varianza)."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-detect-data-bias.html

- id: aprendizaje-supervisado
  termino: aprendizaje supervisado
  alias: [supervisado, supervised learning]
  categoria: tecnica
  definicion: "Los datos incluyen entradas y los valores objetivo (salidas) correctos. Si el objetivo es categórico es un problema de clasificación; si es continuo, de regresión."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html

- id: aprendizaje-no-supervisado
  termino: aprendizaje no supervisado
  alias: [no supervisado, unsupervised learning]
  categoria: tecnica
  definicion: "Los datos no tienen etiquetas ni valores objetivo: el modelo descubre patrones, como agrupaciones, anomalías o una representación con menos dimensiones."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html

- id: aprendizaje-por-refuerzo
  termino: aprendizaje por refuerzo
  alias: [reinforcement learning]
  categoria: tecnica
  definicion: "Un agente aprende un comportamiento por ensayo y error interactuando con un entorno dinámico, con el objetivo de maximizar las recompensas a largo plazo."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html

- id: clasificacion
  termino: clasificación
  alias: [classification, clasificación binaria, clasificación multiclase]
  categoria: tecnica
  definicion: "Problema supervisado cuyo valor objetivo es categórico: asignar un elemento a una clase. Es binaria si hay dos clases (spam o no spam) y multiclase si hay varias (el tema de un documento)."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html

- id: regresion
  termino: regresión
  alias: [regression]
  categoria: tecnica
  definicion: "Problema supervisado cuyo valor objetivo es continuo: estima una variable dependiente a partir de otras, por ejemplo el precio de una vivienda."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html

- id: agrupamiento
  termino: agrupamiento
  alias: [clustering, análisis de agrupamiento]
  categoria: tecnica
  definicion: "Técnica no supervisada que busca grupos en los datos cuyos miembros se parecen entre sí lo más posible y se diferencian de los de otros grupos."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html

- id: deteccion-de-anomalias
  termino: detección de anomalías
  alias: [anomaly detection]
  categoria: tecnica
  definicion: "Identificación de elementos o eventos poco habituales que se desvían significativamente del resto de los datos; sirve, por ejemplo, para detectar fraude bancario o errores médicos."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html

- id: datos-estructurados
  termino: datos estructurados
  alias: [datos no estructurados, estructurados, no estructurados]
  categoria: concepto
  definicion: "Los datos estructurados siguen un formato predefinido, normalmente tabular con filas y columnas. Los no estructurados (audio, vídeo, imágenes, documentos largos) no siguen reglas ni un esquema predeterminado."
  referencia: https://aws.amazon.com/compare/the-difference-between-structured-data-and-unstructured-data/

- id: series-temporales
  termino: series temporales
  alias: [time series, serie temporal]
  categoria: concepto
  definicion: "Datos ordenados en el tiempo, como las lecturas continuas de sensores de IoT o los datos financieros."
  referencia: https://aws.amazon.com/what-is/time-series-database/

- id: datos-etiquetados
  termino: datos etiquetados
  alias: [etiquetado de datos, datos sin etiquetar, etiquetas]
  categoria: concepto
  definicion: "Datos a los que se ha añadido una etiqueta informativa (por ejemplo, que una foto contiene un pájaro) para que un modelo supervisado pueda aprender de ellos."
  referencia: https://aws.amazon.com/what-is/data-labeling/

- id: rag
  termino: RAG
  alias: [Retrieval Augmented Generation, generación aumentada por recuperación]
  categoria: tecnica
  definicion: "Retrieval Augmented Generation: técnica que usa información de fuentes de datos para mejorar la relevancia y la exactitud de las respuestas generadas por un modelo fundacional."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html

- id: mlops
  termino: MLOps
  alias: [ML Operations]
  categoria: concepto
  definicion: "Metodología que aplica las prácticas de DevOps a las cargas de trabajo de ML: integra desarrollo de software, operaciones, ingeniería de datos y ciencia de datos para agilizar la entrega de modelos durante todo su ciclo de vida."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-projects-why.html

- id: inferencia-en-tiempo-real
  termino: inferencia en tiempo real
  alias: [real-time inference]
  categoria: tecnica
  definicion: "Opción de SageMaker AI para cargas interactivas con requisitos de baja latencia: un endpoint gestionado y permanente, con escalado automático."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints.html

- id: inferencia-serverless
  termino: inferencia serverless
  alias: [Serverless Inference]
  categoria: tecnica
  definicion: "Opción de SageMaker AI que despliega y escala modelos sin gestionar la infraestructura. Es ideal para cargas con periodos de inactividad entre ráfagas de tráfico que toleran arranques en frío, y se paga por uso."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html

- id: inferencia-asincrona
  termino: inferencia asíncrona
  alias: [asynchronous inference]
  categoria: tecnica
  definicion: "Opción de SageMaker AI que encola las solicitudes y las procesa de forma asíncrona: ideal para cargas grandes o con tiempos de procesamiento largos. Puede escalar a cero cuando no hay solicitudes."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html

- id: transformacion-por-lotes
  termino: transformación por lotes
  alias: [batch transform, inferencia por lotes]
  categoria: tecnica
  definicion: "Opción de SageMaker AI para obtener inferencias de conjuntos de datos grandes sin necesitar un endpoint persistente y asociando cada registro de entrada con su predicción."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform.html

# ------------------------------------------------------------------ métricas
- id: exactitud
  termino: exactitud
  alias: [accuracy]
  categoria: metrica
  definicion: "Proporción de elementos clasificados correctamente sobre el total de elementos clasificados. Va de 0 a 1. Engaña con clases desequilibradas: si solo el 1 % de las operaciones es fraude, un modelo que nunca detecta fraude tiene un 99 % de exactitud."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html

- id: precision
  termino: precisión
  alias: [precision]
  categoria: metrica
  definicion: "De todo lo que el modelo predice como positivo, qué parte lo es realmente: VP / (VP + FP). Se prioriza cuando un falso positivo es costoso."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html

- id: exhaustividad
  termino: exhaustividad
  alias: [recall, sensibilidad]
  categoria: metrica
  definicion: "De todos los positivos reales, cuántos detecta el modelo: VP / (VP + FN). Se prioriza cuando un falso negativo es costoso, por ejemplo al detectar una enfermedad."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html

- id: f1
  termino: puntuación F1
  alias: [F1, F1 score]
  categoria: metrica
  definicion: "Media armónica de la precisión y la exhaustividad: F1 = 2 × (precisión × exhaustividad) / (precisión + exhaustividad). Va de 0 a 1."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html

- id: auc
  termino: AUC
  alias: [área bajo la curva ROC]
  categoria: metrica
  definicion: "Área bajo la curva ROC: resume el rendimiento de un clasificador en todos los umbrales. 1 es perfecto y 0,5 equivale a adivinar al azar."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/autopilot-metrics-validation.html

- id: roi
  termino: retorno de la inversión
  alias: [ROI, return on investment]
  categoria: metrica
  definicion: "Métrica de negocio que compara el beneficio económico obtenido con lo invertido. Mide el valor que aporta una solución, no la calidad técnica del modelo."

# ------------------------------------------------------------------ conceptos de AWS (módulo 00)
- id: responsabilidad-compartida
  termino: modelo de responsabilidad compartida
  alias: [responsabilidad compartida, shared responsibility model]
  categoria: concepto
  definicion: "La seguridad y el cumplimiento son una responsabilidad compartida: AWS protege la infraestructura (seguridad de la nube) y el cliente protege sus datos, accesos y configuración (seguridad en la nube). El reparto depende del servicio usado."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/security.html

- id: minimo-privilegio
  termino: mínimo privilegio
  alias: [least privilege]
  categoria: concepto
  definicion: "Práctica recomendada de IAM: conceder solo los permisos imprescindibles para cada tarea."
  referencia: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html

- id: rol-de-iam
  termino: rol de IAM
  alias: [roles de IAM, IAM role]
  categoria: concepto
  definicion: "Identidad de IAM que concede credenciales temporales. AWS recomienda que las cargas de trabajo usen roles en lugar de claves de acceso permanentes."
  referencia: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html

- id: usuario-raiz
  termino: usuario raíz
  alias: [root user]
  categoria: concepto
  definicion: "Identidad de inicio de sesión con la que empieza toda cuenta de AWS, con acceso completo a todos los servicios y recursos. AWS recomienda no usarla en las tareas diarias."
  referencia: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html

- id: serverless
  termino: serverless
  alias: [sin servidores]
  categoria: concepto
  definicion: "Modelo en el que el cliente ejecuta su código sin aprovisionar ni gestionar servidores: AWS se encarga de la infraestructura, la capacidad, el escalado y los parches. No significa que no haya servidores."
  referencia: https://docs.aws.amazon.com/lambda/latest/dg/welcome.html

- id: on-demand
  termino: On-Demand
  alias: [bajo demanda]
  categoria: concepto
  definicion: "Modelo de precios de pago por uso sin compromiso. En Amazon EC2 se paga por segundo por las instancias lanzadas; en Amazon Bedrock, por los tokens de entrada y de salida de cada petición (nivel Standard por defecto)."
  referencia: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html
  enlaces:
    - {texto: "Precios de Amazon Bedrock", url: "https://aws.amazon.com/bedrock/pricing/"}

- id: savings-plans
  termino: Savings Plans
  alias: [Savings Plan]
  categoria: concepto
  definicion: "Modelo de precios que reduce el coste a cambio de comprometerse a un uso constante, en dólares por hora, durante 1 o 3 años. Hay varios tipos, entre ellos de cómputo, de instancias de EC2 y de Amazon SageMaker AI. El compromiso no se puede cambiar después de comprarlo."
  referencia: https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html

- id: reserved-instances
  termino: Reserved Instances
  alias: [instancias reservadas]
  categoria: concepto
  definicion: "Modelo de precios que reduce el coste de Amazon EC2 a cambio de comprometerse con una configuración concreta de instancia (tipo y Región) durante 1 o 3 años."
  referencia: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html

- id: spot-instances
  termino: Spot Instances
  alias: [instancias Spot, Spot]
  categoria: concepto
  definicion: "Instancias de EC2 sin usar solicitadas a un coste significativamente menor. Son una opción rentable si la aplicación es flexible en cuándo se ejecuta y admite interrupciones."
  referencia: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html

- id: provisioned-throughput
  termino: Provisioned Throughput
  alias: [rendimiento aprovisionado, unidades de modelo, unidad de modelo]
  categoria: concepto
  definicion: "Opción de Amazon Bedrock para reservar un mayor nivel de rendimiento de un modelo a un coste fijo, facturado por horas según el modelo y el número de unidades de modelo (MU), sin compromiso o con compromiso de 1 o 6 meses. Se factura mientras exista, se use o no. Es una de las formas de usar un modelo personalizado; algunos modelos personalizados admiten también inferencia bajo demanda."
  usar_cuando: "Para un rendimiento alto y constante de un modelo concreto, o para servir un modelo personalizado con capacidad dedicada."
  no_usar_cuando: "Con tráfico bajo, variable o de prueba: bajo demanda es más barato porque solo se paga por uso."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prov-throughput.html

# ------------------------------------------------------------------ ampliación (revisión de la iteración 1)
- id: amazon-nova
  termino: Amazon Nova
  alias: [Nova]
  categoria: servicio
  icono: aws/Arch_Amazon-Nova_48.svg
  definicion: "Familia de modelos fundacionales de Amazon que se usan mediante API a través de Amazon Bedrock: Micro (solo texto), Lite, Pro y Premier, y la generación Nova 2 (Lite, Sonic y Multimodal Embeddings). Nova Canvas (imagen), Nova Reel (vídeo) y Nova Sonic v1 están retirados desde septiembre de 2026."
  usar_cuando: "Cuando se busca un modelo fundacional propio de Amazon dentro de Bedrock, por ejemplo por precio-rendimiento."
  no_usar_cuando: "Cuando basta un servicio de IA especializado (Comprehend, Rekognition, Textract…) o un modelo de ML tradicional (SageMaker AI) para una tarea acotada."
  referencia: https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html

- id: aws-glue
  termino: AWS Glue
  alias: [Glue]
  categoria: servicio
  icono: aws/Arch_AWS-Glue_48.svg
  definicion: "Servicio serverless de integración de datos para descubrir, preparar, mover e integrar datos de varias fuentes (ETL), con un catálogo de datos centralizado (AWS Glue Data Catalog)."
  usar_cuando: "Para preparar y transformar datos (ETL) antes de entrenar un modelo o analizarlos."
  no_usar_cuando: "Para entrenar o desplegar modelos: eso es SageMaker AI."
  referencia: https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html

- id: aws-glue-databrew
  termino: AWS Glue DataBrew
  alias: [DataBrew, Glue DataBrew]
  categoria: servicio
  icono: aws/Arch_AWS-Glue-DataBrew_48.svg
  definicion: "Herramienta visual de preparación de datos que permite limpiar y normalizar datos sin escribir código, con más de 250 transformaciones predefinidas. Es serverless."
  usar_cuando: "Cuando analistas sin experiencia en programación deben limpiar datos para analítica o ML."
  no_usar_cuando: "Cuando se necesita un pipeline ETL programado a medida (AWS Glue) o entrenar un modelo."
  referencia: https://docs.aws.amazon.com/databrew/latest/dg/what-is.html

- id: amazon-sagemaker-canvas
  termino: Amazon SageMaker Canvas
  alias: [SageMaker Canvas]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "Funcionalidad de SageMaker AI para generar predicciones con ML sin escribir código: modelos listos para usar (basados en Rekognition, Textract y Comprehend) o modelos propios de regresión, clasificación, previsión de series temporales, imagen y texto."
  usar_cuando: "Cuando analistas de negocio sin experiencia en ML ni en programación necesitan un modelo predictivo con sus datos."
  no_usar_cuando: "Cuando un equipo de ciencia de datos necesita control total sobre el algoritmo y el código: SageMaker AI con cuadernos o código propio."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/canvas.html

- id: amazon-sagemaker-ground-truth
  termino: Amazon SageMaker Ground Truth
  alias: [SageMaker Ground Truth, Ground Truth]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-Ground-Truth_48.svg
  definicion: "Servicio para crear conjuntos de datos de entrenamiento etiquetados con trabajadores humanos (propios, de un proveedor o de Amazon Mechanical Turk) y etiquetado automático. Ya no está abierto a clientes nuevos; los existentes pueden seguir usándolo."
  no_usar_cuando: "Como opción para un proyecto nuevo: ya no admite clientes nuevos, y su documentación no indica sustituto."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/sms.html

- id: amazon-sagemaker-pipelines
  termino: Amazon SageMaker Pipelines
  alias: [SageMaker Pipelines]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "Servicio de orquestación de flujos de trabajo de SageMaker AI para automatizar el procesamiento de datos, el entrenamiento, la evaluación, el despliegue y la monitorización de modelos, con versionado y trazabilidad (lineage)."
  usar_cuando: "Para que el entrenamiento y el despliegue sean repetibles y automatizados (MLOps)."
  no_usar_cuando: "Para un experimento puntual que no se va a repetir: basta un trabajo de entrenamiento suelto o un cuaderno."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html

- id: amazon-sagemaker-model-registry
  termino: SageMaker Model Registry
  alias: [Model Registry, Amazon SageMaker Model Registry]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "Catálogo de modelos de SageMaker AI: gestiona versiones, metadatos (como métricas de entrenamiento), linaje, estado de aprobación y despliegue a producción."
  usar_cuando: "Para versionar modelos, aprobarlos antes de producción y saber qué versión está desplegada."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry.html

- id: sagemaker-mlflow
  termino: MLflow en SageMaker AI
  alias: [MLflow, SageMaker Experiments]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "MLflow totalmente gestionado en SageMaker AI para registrar, organizar y comparar experimentos y registrar los mejores modelos. Sustituye como opción recomendada a SageMaker Experiments, que ahora es Experiments Classic y solo funciona en Studio Classic."
  usar_cuando: "Para que los experimentos de ML sean reproducibles y comparables."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow.html

- id: amazon-cloudwatch
  termino: Amazon CloudWatch
  alias: [CloudWatch]
  categoria: servicio
  icono: aws/Arch_Amazon-CloudWatch_48.svg
  definicion: "Servicio de monitorización de recursos y aplicaciones de AWS: recoge métricas y registros (logs) y permite crear alarmas cuando una métrica supera un umbral."
  usar_cuando: "Para vigilar el rendimiento y el uso de un endpoint o una aplicación y recibir alarmas."
  no_usar_cuando: "Para auditar quién hizo qué llamada a la API (AWS CloudTrail)."
  referencia: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html

- id: aws-cloudtrail
  termino: AWS CloudTrail
  alias: [CloudTrail]
  categoria: servicio
  icono: aws/Arch_AWS-CloudTrail_48.svg
  definicion: "Servicio que registra la actividad de la cuenta (llamadas a la API de AWS: quién, qué, cuándo y desde dónde) para auditoría, gobierno y cumplimiento."
  usar_cuando: "Para auditar el uso de los servicios, por ejemplo quién invocó un modelo o cambió un permiso."
  no_usar_cuando: "Para monitorizar métricas de rendimiento (Amazon CloudWatch)."
  referencia: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html

- id: amazon-vpc
  termino: Amazon VPC
  alias: [VPC, Amazon Virtual Private Cloud]
  categoria: servicio
  icono: aws/Arch_Amazon-Virtual-Private-Cloud_48.svg
  definicion: "Red virtual aislada lógicamente dentro de AWS en la que el cliente lanza sus recursos y controla direcciones IP, subredes, tablas de rutas y acceso."
  usar_cuando: "Cuando los recursos (por ejemplo, un endpoint de modelo) deben quedar en una red privada controlada por el cliente."
  referencia: https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html

- id: aws-budgets
  termino: AWS Budgets
  alias: [Budgets]
  categoria: servicio
  icono: aws/Arch_AWS-Budgets_48.svg
  definicion: "Permite definir presupuestos de coste o de uso y recibir alertas cuando el gasto real o previsto los supera."
  usar_cuando: "Para avisar antes de que un laboratorio o un proyecto de IA supere un gasto previsto."
  no_usar_cuando: "Para analizar en detalle el gasto histórico (AWS Cost Explorer)."
  referencia: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html

- id: aws-cost-explorer
  termino: AWS Cost Explorer
  alias: [Cost Explorer]
  categoria: servicio
  icono: aws/Arch_AWS-Cost-Explorer_48.svg
  definicion: "Herramienta para visualizar, entender y analizar los costes y el uso de AWS a lo largo del tiempo, con previsiones."
  usar_cuando: "Para ver qué servicios generan el gasto (por ejemplo, la inferencia de un modelo) y su tendencia."
  no_usar_cuando: "Para recibir alertas automáticas al superar un umbral (AWS Budgets)."
  referencia: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html

- id: politica-de-iam
  termino: política de IAM
  alias: [políticas de IAM, IAM policy]
  categoria: concepto
  definicion: "Documento JSON que define permisos (qué acciones se permiten o deniegan sobre qué recursos). Las basadas en identidad se asocian a usuarios, grupos o roles; las basadas en recursos, a un recurso como un bucket de S3."
  referencia: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html

- id: aprendizaje-autosupervisado
  termino: aprendizaje autosupervisado
  alias: [self-supervised learning]
  categoria: tecnica
  definicion: "Variante en la que las etiquetas se generan a partir de los propios datos de entrada (por ejemplo, ocultar una palabra y predecirla). Es como se preentrenan los modelos fundacionales con enormes volúmenes de datos sin etiquetar."
  referencia: https://aws.amazon.com/what-is/foundation-models/

- id: deriva
  termino: deriva
  alias: [deriva del modelo, deriva de datos, data drift, drift]
  categoria: concepto
  definicion: "Cambio con el tiempo de los datos de producción respecto a los de entrenamiento, que degrada la calidad del modelo. La deriva de datos es un cambio en las propiedades estadísticas de las entradas; si lo que cambia es la relación entre entradas y resultado, es deriva de concepto. Se detecta monitorizando y se corrige reentrenando."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/machine-learning-lens/mlperf06-bp03.html

- id: matriz-de-confusion
  termino: matriz de confusión
  alias: [confusion matrix, falso positivo, falsos positivos, falso negativo, falsos negativos]
  categoria: metrica
  definicion: "Tabla que cruza las clases reales con las predichas: verdaderos positivos (VP), falsos positivos (FP), verdaderos negativos (VN) y falsos negativos (FN). A partir de ella se calculan la exactitud, la precisión, la exhaustividad y F1."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-monitor-model-quality-metrics.html

- id: algoritmo
  termino: algoritmo
  alias: [algoritmos, algorithm]
  categoria: concepto
  definicion: "La «receta» con la que se resuelve un tipo de problema de ML. Al aplicarlo a unos datos de entrenamiento se obtiene un modelo. La relación entre algoritmos y tipos de problema es de muchos a muchos."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html

# ------------------------------------------------------------------ módulo 02: fundamentos de IA generativa
- id: token
  termino: token
  alias: [tokens]
  categoria: concepto
  definicion: "Unidad mínima de texto (u otro dato) que procesa un modelo: una palabra, parte de una palabra o un signo. El modelo recibe tokens de entrada y genera tokens de salida uno a uno. Cada modelo tokeniza a su manera. Es la unidad de facturación y de las cuotas de los modelos fundacionales."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/count-tokens.html

- id: chunking
  termino: chunking
  alias: [chunks, fragmentación de documentos]
  categoria: tecnica
  definicion: "Dividir documentos largos en fragmentos (chunks) antes de convertirlos en embeddings. Bedrock Knowledge Bases ofrece fragmentación de tamaño fijo (tokens por fragmento y solapamiento), jerárquica, semántica o sin fragmentar."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html

- id: embedding
  termino: embedding
  alias: [embeddings, incrustaciones vectoriales]
  categoria: concepto
  definicion: "Representación numérica (un vector) de un objeto del mundo real, como un texto o una imagen, que captura su significado. Objetos parecidos tienen embeddings cercanos, lo que permite buscar por similitud semántica."
  referencia: https://aws.amazon.com/what-is/embeddings-in-machine-learning/

- id: vector
  termino: vector
  alias: [vectores]
  categoria: concepto
  definicion: "Lista de valores numéricos que representa información en un espacio de muchas dimensiones. Es la forma de un embedding; la distancia entre vectores mide la similitud."
  referencia: https://aws.amazon.com/what-is/embeddings-in-machine-learning/

- id: base-de-datos-vectorial
  termino: base de datos vectorial
  alias: [bases de datos vectoriales, vector database]
  categoria: concepto
  definicion: "Base de datos que almacena e indexa vectores (embeddings) para encontrar rápidamente los más parecidos a uno dado. Es la pieza de búsqueda semántica de RAG."
  referencia: https://aws.amazon.com/what-is/vector-databases/

- id: ingenieria-de-prompts
  termino: ingeniería de prompts
  alias: [prompt engineering]
  categoria: tecnica
  definicion: "Redactar y refinar el prompt (instrucciones, contexto, ejemplos y pregunta) para que el modelo dé la respuesta deseada sin modificar el modelo. Es la forma más barata de adaptar un modelo fundacional."
  referencia: https://aws.amazon.com/what-is/prompt-engineering/

- id: transformer
  termino: transformer
  alias: [transformers, arquitectura transformer]
  categoria: concepto
  definicion: "Arquitectura de red neuronal en la que se basan los LLM. Su mecanismo de autoatención (self-attention) analiza a la vez todas las partes de la secuencia y decide cuáles son más importantes, en lugar de procesarla palabra a palabra."
  referencia: https://aws.amazon.com/what-is/transformers-in-artificial-intelligence/

- id: modelo-multimodal
  termino: modelo multimodal
  alias: [modelos multimodales, multimodal]
  categoria: concepto
  definicion: "Modelo que procesa y entiende varios tipos de entrada a la vez (texto, imágenes, vídeo, documentos, audio) en una misma petición, y puede generar uno o varios tipos de salida."
  referencia: https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html

- id: modelo-de-difusion
  termino: modelo de difusión
  alias: [modelos de difusión, diffusion model]
  categoria: concepto
  definicion: "Modelo generativo de imagen (y vídeo) que aprende a eliminar ruido: al generar parte de ruido y lo va limpiando, guiado por el prompt, hasta obtener la imagen. Stable Diffusion es un ejemplo."
  referencia: https://aws.amazon.com/what-is/stable-diffusion/

- id: ventana-de-contexto
  termino: ventana de contexto
  alias: [context window]
  categoria: concepto
  definicion: "Cantidad máxima de tokens (entrada e historial) que un modelo puede tener en cuenta en una petición. Es un límite técnico y un factor de coste: más contexto implica pagar más tokens."
  referencia: https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html

- id: alucinacion
  termino: alucinación
  alias: [alucinaciones, hallucination, hallucinations]
  categoria: concepto
  definicion: "Respuesta incorrecta o engañosa que genera un modelo fundacional. Causas habituales: datos de entrenamiento insuficientes o sesgados, sobreajuste y falta de contexto. Se mitiga con RAG, prompts precisos y verificación."
  referencia: https://aws.amazon.com/what-is/ai-hallucinations/

- id: parametros-de-inferencia
  termino: parámetros de inferencia
  alias: [inference parameters, temperatura de muestreo, top-p, Top-p, top-k, Top-k]
  categoria: concepto
  definicion: "Ajustes de cada petición que cambian la generación. La temperatura baja favorece los tokens más probables (respuestas más deterministas) y la alta da más variedad; top-k limita a los k candidatos más probables; top-p, a los que suman una proporción de la probabilidad acumulada; la longitud máxima limita la respuesta."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html

- id: no-determinismo
  termino: no determinismo
  alias: [nondeterminism, no deterministas]
  categoria: concepto
  definicion: "Propiedad de los modelos generativos por la que la misma petición puede dar respuestas distintas, porque el siguiente token se elige muestreando una distribución de probabilidad. Una temperatura baja la reduce."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html

- id: ingenieria-de-contexto
  termino: ingeniería de contexto
  alias: [context engineering]
  categoria: tecnica
  definicion: "Decidir qué información llega al modelo en cada llamada, en qué orden y con qué tamaño: instrucciones del sistema, historial y memoria, conocimiento recuperado (RAG), herramientas y ejemplos. Busca respuestas correctas sin desperdiciar tokens."
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html

- id: mcp
  termino: MCP
  alias: [Model Context Protocol]
  categoria: concepto
  definicion: "Model Context Protocol: protocolo abierto que proporciona una capa de comunicación estándar para que los agentes de IA interactúen con datos, herramientas y servicios externos, y también con otros agentes."
  usar_cuando: "Para exponer una herramienta o fuente de datos una sola vez y que la use cualquier agente compatible."
  no_usar_cuando: "No es un modelo ni un servicio de AWS: no genera respuestas por sí mismo (eso lo hace el modelo, por ejemplo en Amazon Bedrock). Para comunicar agentes entre sí, A2A."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/getting-started-with-mcp.html

- id: uso-de-herramientas
  termino: uso de herramientas
  alias: [tool use, llamadas a herramientas, function calling]
  categoria: concepto
  definicion: "Capacidad de un modelo para decidir qué herramienta (API, función, base de datos) llamar y con qué parámetros. La aplicación o la plataforma la ejecuta y devuelve el resultado al modelo."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use.html

- id: memoria-del-agente
  termino: memoria del agente
  alias: [memoria a corto plazo, memoria a largo plazo]
  categoria: concepto
  definicion: "Capacidad de un agente para recordar: la memoria a corto plazo guarda los turnos de la sesión; la de largo plazo extrae y conserva entre sesiones datos clave como las preferencias del usuario. Sin memoria, cada interacción empieza de cero."
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html

- id: sistema-multiagente
  termino: sistema multiagente
  alias: [sistemas multiagente, multi-agent]
  categoria: concepto
  definicion: "Varios agentes con roles o especialidades distintos que colaboran en una tarea compleja, bien con un coordinador que delega (flujo centralizado), bien como iguales que negocian y comparten información."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/multi-agent-collaboration.html

- id: orquestacion-de-flujos
  termino: orquestación de flujos
  alias: [workflow orchestration]
  categoria: concepto
  definicion: "Coordinación de los pasos, herramientas y agentes de un proceso: orden, paralelismo, gestión de errores y puntos de aprobación humana."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-patterns/introduction.html

- id: strands-agents
  termino: Strands Agents
  alias: [Strands]
  categoria: servicio
  definicion: "SDK de código abierto publicado inicialmente por AWS para crear agentes de IA con un enfoque centrado en el modelo. Admite MCP, patrones multiagente (Swarm, Graph, Workflow) y varios proveedores de modelos, incluido Amazon Bedrock."
  usar_cuando: "Para programar agentes en código con herramientas y MCP, sobre Bedrock u otros proveedores."
  no_usar_cuando: "Cuando no se quiere programar: para un asistente listo para empleados, Amazon Quick."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/agentic-ai-frameworks/strands-agents.html

- id: preentrenamiento
  termino: preentrenamiento
  alias: [pre-training, preentrenar]
  categoria: tecnica
  definicion: "Entrenamiento inicial de un modelo fundacional con datos masivos, de forma autosupervisada. Requiere enormes recursos y puede durar meses; lo hacen los proveedores de modelos, no las empresas que los usan."
  referencia: https://aws.amazon.com/what-is/foundation-models/

- id: fine-tuning
  termino: fine-tuning
  alias: [ajuste fino, supervised fine-tuning]
  categoria: tecnica
  definicion: "Personalización de un modelo preentrenado con datos etiquetados de una tarea o dominio, que ajusta los parámetros del modelo. En Amazon Bedrock existen también el reinforcement fine-tuning y la destilación."
  usar_cuando: "Cuando el prompt y el contexto no consiguen la calidad, el estilo o el formato necesarios."
  no_usar_cuando: "Cuando el problema es que faltan datos actualizados o propios: eso lo resuelve RAG."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html

- id: inferencia-por-lotes-bedrock
  termino: inferencia por lotes de Bedrock
  alias: [batch inference]
  categoria: concepto
  definicion: "Modo de Amazon Bedrock que procesa de forma asíncrona muchos prompts de una vez: la entrada y la salida van a Amazon S3. En los modelos que lo admiten cuesta un 50 % menos que bajo demanda. No admite llamadas a herramientas."
  usar_cuando: "Para grandes volúmenes que no necesitan respuesta inmediata."
  no_usar_cuando: "En aplicaciones interactivas o conversaciones de varios turnos: inferencia bajo demanda."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html

- id: niveles-de-servicio-bedrock
  termino: niveles de servicio de Bedrock
  alias: [service tiers, nivel Flex, nivel Priority, nivel Reserved, nivel Standard]
  categoria: concepto
  definicion: "Niveles de inferencia de Amazon Bedrock: Standard (por defecto), Priority (respuesta más rápida con un recargo del 75 %), Flex (un 50 % de descuento para cargas que toleran más tiempo) y Reserved (capacidad reservada de tokens por minuto durante 1 o 3 meses, con objetivo de disponibilidad del 99,5 %; el exceso pasa a Standard)."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html

- id: prompt-caching
  termino: prompt caching
  alias: [caché de prompts]
  categoria: tecnica
  definicion: "Funcionalidad de Amazon Bedrock que reutiliza prefijos de prompt repetidos (por ejemplo, un documento largo) para reducir la latencia y el coste de los tokens de entrada. Disponible en modelos compatibles."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html

- id: inferencia-entre-regiones
  termino: inferencia entre Regiones
  alias: [cross-Region inference, CRIS]
  categoria: concepto
  definicion: "Enrutamiento automático de las peticiones de Amazon Bedrock a otras Regiones para ganar rendimiento. La geográfica se limita a una zona (EE. UU., UE, APAC) y sirve para residencia de datos; la global usa cualquier Región comercial y ahorra aproximadamente un 10 %. Sin coste adicional de enrutamiento."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html

- id: amazon-bedrock-guardrails
  termino: Amazon Bedrock Guardrails
  alias: [Bedrock Guardrails, Guardrails]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock_48.svg
  definicion: "Salvaguardas configurables para detectar y filtrar contenido no deseado y proteger información sensible en las entradas y respuestas de los modelos: filtros de contenido, temas denegados, filtros de palabras, filtros de información sensible, comprobación de grounding contextual y Automated Reasoning checks. Se aplica al invocar un modelo de Bedrock o con la API ApplyGuardrail, sin invocar un modelo."
  usar_cuando: "Para aplicar políticas de uso responsable y privacidad a una aplicación de IA generativa."
  no_usar_cuando: "Como sustituto de los permisos (IAM) o del cifrado de los datos (AWS KMS)."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html

- id: amazon-q
  termino: Amazon Q
  alias: [Amazon Q Business, Amazon Q Developer]
  categoria: servicio
  icono: aws/Arch_Amazon-Q_48.svg
  definicion: "Asistentes de IA generativa de AWS. Amazon Q Business ya no admite clientes nuevos (AWS remite a Amazon Quick) y los plugins de IDE de Amazon Q Developer dejan de tener soporte el 30 de abril de 2027 (AWS remite a Kiro)."
  no_usar_cuando: "En proyectos nuevos: para asistentes empresariales, Amazon Quick; para desarrollo, Kiro."
  referencia: https://docs.aws.amazon.com/amazonq/latest/qbusiness-ug/what-is.html
  enlaces:
    - {texto: "Amazon Q Developer (aviso de fin de soporte)", url: "https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/what-is.html"}

- id: aws-trainium
  termino: AWS Trainium
  alias: [Trainium]
  categoria: servicio
  definicion: "Chips diseñados por AWS para entrenar y servir (inferencia) modelos de IA a escala con la mejor relación coste-rendimiento, disponibles en instancias de Amazon EC2."
  usar_cuando: "Para entrenar modelos grandes propios (o servirlos) en EC2 optimizando el coste."
  no_usar_cuando: "Cuando se consume un modelo por API: ahí no se eligen chips (basta Amazon Bedrock)."
  referencia: https://aws.amazon.com/ai/machine-learning/trainium/

- id: aws-inferentia
  termino: AWS Inferentia
  alias: [Inferentia]
  categoria: servicio
  definicion: "Chips diseñados por AWS específicamente para la inferencia de aprendizaje profundo e IA generativa, con alto rendimiento al menor coste en Amazon EC2. AWS indica que las instancias Inf2 ofrecen hasta un 50 % más de rendimiento por vatio que instancias EC2 comparables, lo que ayuda a los objetivos de sostenibilidad."
  usar_cuando: "Para servir en EC2 un modelo ya entrenado al menor coste por inferencia."
  no_usar_cuando: "Para entrenar modelos: para eso está AWS Trainium."
  referencia: https://aws.amazon.com/ai/machine-learning/inferentia/

- id: tasa-de-conversion
  termino: tasa de conversión
  alias: [conversion rate]
  categoria: metrica
  definicion: "Porcentaje de usuarios que completan la acción deseada (comprar, registrarse) respecto al total. Métrica de negocio habitual para asistentes de venta."
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html

- id: arpu
  termino: ARPU
  alias: [ingreso medio por usuario, average revenue per user]
  categoria: metrica
  definicion: "Ingreso medio por usuario: ingresos totales divididos entre el número de usuarios en un periodo."
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html

- id: clv
  termino: CLV
  alias: [valor del ciclo de vida del cliente, customer lifetime value]
  categoria: metrica
  definicion: "Valor del ciclo de vida del cliente: ingresos que se esperan de un cliente durante toda su relación con la empresa. Sube cuando mejora la retención."
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html

- id: aws-transform
  termino: AWS Transform
  alias: [Transform]
  categoria: servicio
  icono: aws/Arch_AWS-Transform_48.svg
  definicion: "Servicio con IA agéntica para acelerar la transformación de infraestructura, aplicaciones y código: modernizar y migrar cargas existentes, por ejemplo mainframes o servidores VMware, a AWS."
  usar_cuando: "Para modernizar o migrar sistemas y código heredados con ayuda de agentes."
  no_usar_cuando: "Para desarrollar software nuevo (Kiro) o crear una aplicación de IA generativa propia (Amazon Bedrock)."
  referencia: https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html

- id: a2a
  termino: A2A
  alias: [Agent-to-Agent, Agent2Agent]
  categoria: concepto
  definicion: "Protocolo abierto para la comunicación entre agentes: cada agente publica una Agent Card con su identidad, capacidades y punto de acceso para que otros lo descubran, y se intercambian mensajes y tareas. AgentCore Runtime admite servidores A2A."
  usar_cuando: "Para que agentes de equipos o proveedores distintos se descubran y colaboren."
  no_usar_cuando: "Para conectar un agente con herramientas o datos: eso es MCP."
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-a2a.html

- id: aws-privatelink
  termino: AWS PrivateLink
  alias: [PrivateLink]
  categoria: servicio
  icono: aws/Arch_AWS-PrivateLink_48.svg
  definicion: "Conectividad privada entre una VPC y servicios de AWS (como Amazon Bedrock) mediante endpoints de interfaz, sin exponer el tráfico a internet."
  usar_cuando: "Cuando el tráfico hacia el servicio no debe pasar por internet."
  no_usar_cuando: "Como sustituto de los permisos (IAM) o del cifrado (AWS KMS)."
  referencia: https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html

- id: api-converse
  termino: API Converse
  alias: [Converse API, Converse]
  categoria: concepto
  definicion: "API unificada de Amazon Bedrock para conversar con los modelos: abstrae sus diferencias, de modo que se puede cambiar de modelo modificando un solo parámetro."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html

- id: rendimiento-entre-dominios
  termino: rendimiento entre dominios
  alias: [cross-domain performance]
  categoria: metrica
  definicion: "Capacidad de una aplicación de IA generativa de mantener la calidad en tareas o áreas distintas de aquellas para las que se probó o ajustó."
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html

# ------------------------------------------------------------------ módulo 03: aplicaciones de modelos fundacionales
- id: amazon-opensearch-service
  termino: Amazon OpenSearch Service
  alias: [OpenSearch Service, OpenSearch Serverless, Amazon OpenSearch Serverless]
  categoria: servicio
  icono: aws/Arch_Amazon-OpenSearch-Service_48.svg
  definicion: "Servicio gestionado de búsqueda y análisis con búsqueda vectorial (k-NN). Combina búsqueda de texto completo y vectorial con latencias muy bajas; OpenSearch Serverless es la opción de creación rápida más habitual para Bedrock Knowledge Bases y, junto con los clústeres gestionados, la única que admite vectores binarios."
  usar_cuando: "Búsqueda híbrida (texto completo + vectores), muchas consultas con baja latencia o el almacén vectorial de una Knowledge Base."
  no_usar_cuando: "Cuando la aplicación ya usa PostgreSQL y basta añadir pgvector, o cuando hay que guardar miles de millones de vectores al menor coste con consultas poco frecuentes (S3 Vectors)."
  referencia: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/knn.html

- id: amazon-aurora
  termino: Amazon Aurora
  alias: [Aurora, Aurora PostgreSQL]
  categoria: servicio
  icono: aws/Arch_Amazon-Aurora_48.svg
  definicion: "Base de datos relacional gestionada compatible con MySQL y PostgreSQL. Con la extensión pgvector de PostgreSQL almacena embeddings y combina consultas SQL con búsqueda por similitud; Bedrock Knowledge Bases la admite como almacén vectorial."
  usar_cuando: "Cuando la aplicación ya usa SQL relacional y quiere combinar filtros relacionales y búsqueda vectorial en la misma base de datos."
  no_usar_cuando: "Cuando el caso pide relaciones de grafo (Neptune) o búsqueda de texto completo a gran escala (OpenSearch)."
  referencia: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html

- id: amazon-rds
  termino: Amazon RDS
  alias: [RDS for PostgreSQL, Amazon RDS for PostgreSQL, Amazon Relational Database Service]
  categoria: servicio
  icono: aws/Arch_Amazon-RDS_48.svg
  definicion: "Servicio de bases de datos relacionales gestionadas. Amazon RDS for PostgreSQL con la extensión pgvector puede almacenar y consultar embeddings sin otra base de datos."
  usar_cuando: "Aplicaciones RAG propias de equipos que ya gestionan PostgreSQL en RDS."
  no_usar_cuando: "Como almacén de una Bedrock Knowledge Base: no está admitido (Aurora PostgreSQL sí)."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/choosing-an-aws-vector-database-for-rag-use-cases/vector-db-options.html

- id: amazon-neptune
  termino: Amazon Neptune
  alias: [Neptune, Neptune Analytics, Amazon Neptune Analytics]
  categoria: servicio
  icono: aws/Arch_Amazon-Neptune_48.svg
  definicion: "Base de datos de grafos gestionada. Neptune Analytics añade búsqueda vectorial combinada con recorridos y algoritmos de grafos, la base de GraphRAG; Bedrock Knowledge Bases la admite."
  usar_cuando: "Cuando importan las relaciones entre entidades: GraphRAG, redes de fraude, vista 360 del cliente, respuestas explicables por relaciones."
  no_usar_cuando: "Para una búsqueda semántica sencilla sobre documentos sin relaciones relevantes: Amazon OpenSearch Service, Aurora PostgreSQL con pgvector o Amazon S3 Vectors."
  referencia: https://docs.aws.amazon.com/neptune-analytics/latest/userguide/vector-similarity.html

- id: amazon-documentdb
  termino: Amazon DocumentDB
  alias: [DocumentDB]
  categoria: servicio
  icono: aws/Arch_Amazon-DocumentDB_48.svg
  definicion: "Base de datos de documentos compatible con MongoDB, con búsqueda vectorial nativa desde la versión 5.0."
  usar_cuando: "Aplicaciones que ya usan la API de MongoDB y quieren añadir búsqueda semántica."
  no_usar_cuando: "Cuando el caso no usa documentos JSON ni la API de MongoDB: para búsqueda vectorial, Aurora PostgreSQL con pgvector u OpenSearch Service."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/choosing-an-aws-vector-database-for-rag-use-cases/vector-db-options.html

- id: amazon-s3-vectors
  termino: Amazon S3 Vectors
  alias: [S3 Vectors]
  categoria: servicio
  icono: aws/Arch_Amazon-Simple-Storage-Service_48.svg
  definicion: "Almacenamiento vectorial de Amazon S3 (buckets e índices vectoriales) optimizado en coste para volúmenes enormes, con latencias por debajo del segundo en consultas poco frecuentes y de unos 100 ms en las frecuentes. Se integra con Bedrock Knowledge Bases."
  usar_cuando: "Miles de millones de vectores al menor coste, con consultas poco frecuentes."
  no_usar_cuando: "Aplicaciones que necesitan latencias de pocos milisegundos o búsqueda de texto completo: Amazon OpenSearch Service."
  referencia: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html

- id: graphrag
  termino: GraphRAG
  categoria: tecnica
  definicion: "Variante de RAG que combina la búsqueda vectorial con un grafo de conocimiento, para recuperar también las relaciones entre entidades. En AWS, con Amazon Neptune Analytics y Bedrock Knowledge Bases."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/choosing-an-aws-vector-database-for-rag-use-cases/vector-db-options.html

- id: amazon-bedrock-prompt-management
  termino: Amazon Bedrock Prompt Management
  alias: [Prompt Management, Bedrock Prompt Management]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock_48.svg
  definicion: "Funcionalidad de Amazon Bedrock para crear, guardar, probar y versionar prompts reutilizables: variables, variantes comparables, borrador y versiones inmutables que la aplicación invoca por su ARN o desde Bedrock Flows."
  usar_cuando: "Para reutilizar prompts probados, compararlos y desplegarlos o revertirlos por versiones sin tocar el código."
  no_usar_cuando: "Como control de seguridad: los ataques de prompt se filtran con Guardrails."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html

- id: amazon-bedrock-flows
  termino: Amazon Bedrock Flows
  alias: [Bedrock Flows]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock_48.svg
  definicion: "Constructor visual de flujos de trabajo de IA generativa que enlaza prompts, modelos fundacionales, Knowledge Bases y otros servicios como AWS Lambda, y despliega flujos inmutables. Se paga por los recursos que usa."
  usar_cuando: "Procesos con pasos fijos y predecibles."
  no_usar_cuando: "Cuando los pasos dependen de lo que vaya pasando y el sistema debe decidir por sí mismo: eso es un agente (AgentCore)."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/flows.html

- id: amazon-bedrock-model-evaluation
  termino: Amazon Bedrock Model Evaluation
  alias: [Bedrock Model Evaluation, Amazon Bedrock Evaluations, Bedrock Evaluations]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock_48.svg
  definicion: "Evaluaciones de Amazon Bedrock: programáticas (conjuntos integrados o propios con métricas de exactitud, robustez y toxicidad), con trabajadores humanos, con un modelo juez (LLM-as-a-judge) y de fuentes RAG o Knowledge Bases."
  usar_cuando: "Para comparar modelos, prompts o Knowledge Bases con datos del caso antes de elegir o de pasar a producción."
  no_usar_cuando: "Para evaluar agentes a partir de sus trazas: AgentCore Evaluations."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html

- id: intelligent-prompt-routing
  termino: Intelligent Prompt Routing
  alias: [enrutamiento inteligente de prompts]
  categoria: tecnica
  definicion: "Funcionalidad de Amazon Bedrock que envía cada petición, dentro de una familia de modelos, al que predice que dará la mejor calidad al menor coste: las preguntas sencillas a un modelo pequeño y las complejas a uno más capaz."
  referencia: https://aws.amazon.com/bedrock/pricing/

- id: aprendizaje-en-contexto
  termino: in-context learning
  alias: [aprendizaje en contexto]
  categoria: tecnica
  definicion: "Capacidad del modelo de adaptarse a una tarea a partir de las instrucciones y los ejemplos que recibe en el prompt, sin cambiar sus parámetros. Es la forma más barata de personalización."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html

- id: zero-shot
  termino: zero-shot
  alias: [zero-shot prompting]
  categoria: tecnica
  definicion: "Técnica de prompt que pide la tarea sin incluir ejemplos. Sirve para tareas que el modelo ya hace bien."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html

- id: few-shot
  termino: few-shot
  alias: [few-shot prompting, one-shot, single-shot]
  categoria: tecnica
  definicion: "Técnica de prompt que incluye ejemplos de entrada y salida: uno (one-shot o single-shot) o varios (few-shot). Enseña un formato o una clasificación propia sin entrenar, a cambio de más tokens de entrada."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html

- id: chain-of-thought
  termino: chain-of-thought
  alias: [cadena de pensamiento]
  categoria: tecnica
  definicion: "Técnica de prompt que pide al modelo razonar paso a paso antes de dar la respuesta. Mejora los problemas de varios pasos (cálculos, lógica) a cambio de más tokens de salida y latencia."
  referencia: https://aws.amazon.com/what-is/prompt-engineering/

- id: plantilla-de-prompt
  termino: plantilla de prompt
  alias: [prompt template, prompt templates, plantillas de prompt]
  categoria: tecnica
  definicion: "Prompt fijo con variables que se rellenan en cada petición. Permite reutilizar un prompt probado de forma coherente; en AWS se gestiona con Amazon Bedrock Prompt Management."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html

- id: prompt-negativo
  termino: prompt negativo
  alias: [negative prompt, negative prompts]
  categoria: concepto
  definicion: "Indicación de lo que no debe aparecer en la respuesta. En modelos de imagen suele ser un campo aparte (sin texto, sin personas); en texto se expresa como restricción."
  referencia: https://docs.aws.amazon.com/nova/latest/userguide/prompting-image-negative.html

- id: prompt-injection
  termino: prompt injection
  alias: [inyección de prompts, hijacking, secuestro de objetivo]
  categoria: concepto
  definicion: "Ataque con instrucciones (del usuario o escondidas en un documento o web que lee el modelo) que intentan ignorar y sustituir las del desarrollador para cambiar el objetivo del modelo. Prevenirlo en la aplicación es responsabilidad del cliente; Guardrails ayuda a detectarlo."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html

- id: jailbreak
  termino: jailbreaking
  alias: [jailbreak, jailbreaks]
  categoria: concepto
  definicion: "Ataque con prompts diseñados para saltarse las protecciones de seguridad y moderación del propio modelo y obtener contenido dañino (por ejemplo, prompts tipo DAN o juegos de rol). Guardrails incluye un filtro de jailbreaks."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html

- id: fuga-de-prompt
  termino: fuga de prompt
  alias: [prompt leakage]
  categoria: concepto
  definicion: "Riesgo de exposición: el usuario consigue que el modelo revele las instrucciones del sistema, la configuración o el historial de la conversación. Guardrails lo detecta en su modalidad Standard (no en la Classic)."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html

- id: envenenamiento-de-datos
  termino: envenenamiento de datos
  alias: [poisoning, data poisoning]
  categoria: concepto
  definicion: "Introducción intencionada de datos maliciosos o sesgados en los datos de entrenamiento, de ajuste fino o en las fuentes de RAG para alterar el comportamiento del modelo. Se mitiga con curación, gobierno y control de acceso a los datos."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/llm-prompt-engineering-best-practices/common-attacks.html

- id: preentrenamiento-continuado
  termino: preentrenamiento continuado
  alias: [continued pre-training, continued pretraining]
  categoria: tecnica
  definicion: "Seguir preentrenando un modelo existente con grandes volúmenes de texto sin etiquetar de un dominio (médico, legal, financiero) para que aprenda su vocabulario, conservando la mayor parte de sus capacidades generales."
  usar_cuando: "Cuando el modelo no conoce la jerga de un dominio y hay mucho texto propio sin etiquetar."
  no_usar_cuando: "Cuando el problema es la información actualizada (RAG) o una tarea concreta con ejemplos etiquetados (fine-tuning)."
  referencia: https://aws.amazon.com/bedrock/faqs/

- id: destilacion
  termino: destilación
  alias: [model distillation, distillation, Amazon Bedrock Model Distillation]
  categoria: tecnica
  definicion: "Transferir el conocimiento de un modelo grande (maestro) a uno más pequeño, rápido y barato (alumno) para un caso de uso. Bedrock genera respuestas del maestro con los prompts del cliente (o las toma de los registros de invocación) y ajusta al alumno."
  usar_cuando: "Cuando se quiere una calidad cercana a la del modelo grande con la latencia y el precio de uno pequeño."
  no_usar_cuando: "Cuando el problema es que faltan datos propios o actualizados: RAG."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html

- id: reinforcement-fine-tuning
  termino: reinforcement fine-tuning
  alias: [ajuste fino por refuerzo]
  categoria: tecnica
  definicion: "Método de personalización de Amazon Bedrock en el que el modelo genera respuestas, una función de recompensa (código en Lambda o un modelo juez) las puntúa y el modelo aprende a maximizar la recompensa, sin pares etiquetados."
  usar_cuando: "Cuando el éxito se puede medir (código que pasa pruebas, respuestas verificables) pero es caro conseguir ejemplos etiquetados."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/reinforcement-fine-tuning.html

- id: instruction-tuning
  termino: instruction tuning
  alias: [ajuste por instrucciones]
  categoria: tecnica
  definicion: "Ajuste fino con pares instrucción → respuesta para que el modelo siga mejor las instrucciones de un tipo de tarea."
  referencia: https://aws.amazon.com/what-is/foundation-models/

- id: transfer-learning
  termino: transfer learning
  alias: [aprendizaje por transferencia]
  categoria: tecnica
  definicion: "Reutilizar lo que un modelo aprendió en una tarea general para otra concreta, con pocos datos o entrenando solo una parte. Es la idea en la que se basa el ajuste fino de los modelos fundacionales."
  referencia: https://aws.amazon.com/what-is/transfer-learning/

- id: rlhf
  termino: RLHF
  alias: [Reinforcement Learning from Human Feedback, aprendizaje por refuerzo con retroalimentación humana]
  categoria: tecnica
  definicion: "Técnica en la que personas comparan o puntúan respuestas del modelo; con esas preferencias se entrena un modelo de recompensa y se ajusta el modelo para producir las respuestas que prefieren las personas (más útiles, seguras o alineadas)."
  referencia: https://aws.amazon.com/what-is/reinforcement-learning-from-human-feedback/

- id: curacion-de-datos
  termino: curación de datos
  alias: [data curation]
  categoria: concepto
  definicion: "Seleccionar, limpiar, deduplicar y revisar los datos antes de entrenar o ajustar un modelo: quitar errores, contenido tóxico y datos personales innecesarios."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html

- id: benchmark
  termino: benchmark
  alias: [benchmarks, benchmark datasets, conjunto de referencia]
  categoria: concepto
  definicion: "Conjunto de datos de referencia con preguntas y respuestas conocidas para medir y comparar modelos de forma repetible. Bedrock incluye conjuntos integrados (TREX, BOLD, RealToxicityPrompts, Gigaword, BoolQ…) y admite conjuntos propios."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html

- id: evaluacion-humana
  termino: evaluación humana
  alias: [human-in-the-loop, human evaluation]
  categoria: tecnica
  definicion: "Evaluación en la que personas (empleados o expertos) puntúan o comparan respuestas del modelo. Capta criterios subjetivos y es la referencia final, pero es lenta y cara."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-human.html

- id: llm-as-a-judge
  termino: LLM-as-a-judge
  alias: [modelo juez, LLM como juez]
  categoria: tecnica
  definicion: "Evaluación en la que un segundo modelo puntúa las respuestas de otro con una rúbrica (corrección, fidelidad, relevancia, tono…) y explica la nota. Escala bien, pero el juez debe validarse con personas y conviene que sea de otra familia de modelos."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html

- id: rouge
  termino: ROUGE
  alias: [Recall-Oriented Understudy for Gisting Evaluation, ROUGE-N, ROUGE-L]
  categoria: metrica
  definicion: "Métrica que mide el solapamiento de n-gramas entre la respuesta y un texto de referencia, orientada a la exhaustividad (cuánto de la referencia aparece en la respuesta). Típica de resúmenes."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html

- id: bleu
  termino: BLEU
  alias: [Bilingual Evaluation Understudy]
  categoria: metrica
  definicion: "Métrica que mide el solapamiento de n-gramas orientada a la precisión (cuánto de la respuesta aparece en la referencia) y penaliza respuestas demasiado cortas. Típica de traducción automática."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/gen-ai-lifecycle-operational-excellence/dev-experimenting-quality.html

- id: bertscore
  termino: BERTScore
  categoria: metrica
  definicion: "Métrica que compara los embeddings de la respuesta y de la referencia para medir su similitud semántica: reconoce paráfrasis que ROUGE y BLEU penalizan. Bedrock la usa en las tareas de resumen."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-tasks.html

- id: tasa-de-tareas-completadas
  termino: tasa de tareas completadas
  alias: [task completion rate]
  categoria: metrica
  definicion: "Proporción de solicitudes que una aplicación de IA resuelve sin intervención humana. Por ejemplo, 42 000 de 60 000 consultas = 70 %."
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html

- id: coste-por-interaccion
  termino: coste por interacción
  alias: [cost per interaction]
  categoria: metrica
  definicion: "Coste total de una aplicación de IA (inferencia, almacenamiento, otros servicios) dividido entre el número de interacciones en un periodo."
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html

- id: satisfaccion-del-usuario
  termino: satisfacción del usuario
  alias: [user satisfaction, CSAT]
  categoria: metrica
  definicion: "Valoración de los usuarios de una aplicación de IA: encuestas (CSAT), votos positivos o negativos y quejas."
  referencia: https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html

- id: amazon-dynamodb
  termino: Amazon DynamoDB
  alias: [DynamoDB]
  categoria: servicio
  icono: aws/Arch_Amazon-DynamoDB_48.svg
  definicion: "Base de datos NoSQL sin servidor y totalmente gestionada. Tiene índices vectoriales nativos que se consultan con la API SearchVectors para buscar por similitud junto a los datos operativos, sin otra base de datos ni réplicas."
  usar_cuando: "RAG o memoria de agentes cuando los datos operativos ya están en DynamoDB."
  no_usar_cuando: "Como almacén de una Bedrock Knowledge Base: no está admitido (sí OpenSearch Serverless o clústeres gestionados de OpenSearch, Aurora PostgreSQL, Neptune Analytics, S3 Vectors y terceros como Pinecone; ver el módulo 03)."
  referencia: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/VectorSearch.html

- id: amazon-elasticache
  termino: Amazon ElastiCache
  alias: [ElastiCache, ElastiCache para Valkey]
  categoria: servicio
  icono: aws/Arch_Amazon-ElastiCache_48.svg
  definicion: "Caché y almacén de datos en memoria totalmente gestionado (Valkey, Redis OSS, Memcached). Desde Valkey 8.2 ofrece búsqueda vectorial en memoria con latencias mínimas."
  usar_cuando: "Búsqueda semántica en tiempo real, caché semántica o memoria de agentes con latencias mínimas."
  no_usar_cuando: "Como almacén de una Bedrock Knowledge Base: no está admitido (sí OpenSearch Serverless o clústeres gestionados de OpenSearch, Aurora PostgreSQL, Neptune Analytics, S3 Vectors y terceros como Pinecone; ver el módulo 03)."
  referencia: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/vector-search-overview.html

- id: instrucciones-del-sistema
  termino: instrucciones del sistema
  alias: [system prompt, prompt del sistema]
  categoria: concepto
  definicion: "Parte fija del prompt que define el papel, las reglas, el tono y el formato de todas las respuestas de una aplicación, separada del mensaje que escribe el usuario."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/design-a-prompt.html

- id: agentcore-evaluations
  termino: AgentCore Evaluations
  alias: [Amazon Bedrock AgentCore Evaluations]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock-AgentCore_48.svg
  definicion: "Servicio de Amazon Bedrock AgentCore que evalúa agentes y herramientas a partir de sus trazas (por ejemplo, de Strands o LangGraph) con evaluadores integrados o propios basados en LLM-as-a-judge, antes y después del despliegue."
  usar_cuando: "Para medir de forma continua la calidad de un agente: utilidad, elección de herramientas, cumplimiento de la tarea."
  no_usar_cuando: "Para comparar modelos en tareas estándar: Amazon Bedrock Model Evaluation."
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/evaluations.html

# ------------------------------------------------------------------ módulo 04: IA responsable
- id: ia-responsable
  termino: IA responsable
  alias: [responsible AI]
  categoria: concepto
  definicion: "Disciplina de diseñar, desarrollar y usar la IA con el objetivo de maximizar los beneficios y minimizar los riesgos. AWS la concreta en dimensiones: equidad, explicabilidad, privacidad y seguridad, seguridad frente a daños, controlabilidad, veracidad y robustez, gobierno y transparencia."
  referencia: https://aws.amazon.com/ai/responsible-ai/

- id: explicabilidad
  termino: explicabilidad
  alias: [explainability]
  categoria: concepto
  definicion: "Dimensión de la IA responsable: entender y evaluar por qué el sistema da una salida concreta, aunque el modelo sea complejo. Se apoya en explicaciones locales y globales (por ejemplo, SHAP), citas de fuentes o trazas de agentes."
  referencia: https://aws.amazon.com/ai/responsible-ai/

- id: transparencia
  termino: transparencia
  alias: [transparency]
  categoria: concepto
  definicion: "Dimensión de la IA responsable: permitir que las personas decidan con información sobre su relación con un sistema de IA (que se usa IA, uso previsto, limitaciones, datos). Se documenta con Model Cards, AI Service Cards o fichas de datos."
  referencia: https://aws.amazon.com/ai/responsible-ai/

- id: interpretabilidad
  termino: interpretabilidad
  alias: [interpretability]
  categoria: concepto
  definicion: "Grado en que se entiende cómo funciona un modelo por dentro sin herramientas adicionales. Los modelos simples (regresión lineal, árbol de decisión) son más interpretables; los complejos suelen rendir más pero necesitan explicaciones a posteriori."
  referencia: https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-model-interpretability/overview.html

- id: veracidad
  termino: veracidad
  alias: [veracity, veracidad y robustez]
  categoria: concepto
  definicion: "Dimensión de la IA responsable: que las salidas sean factualmente correctas, también ante entradas inesperadas o maliciosas (robustez). En IA generativa se protege con RAG y citas, comprobaciones de grounding y Automated Reasoning checks."
  referencia: https://aws.amazon.com/ai/responsible-ai/

- id: robustez
  termino: robustez
  alias: [robustness]
  categoria: concepto
  definicion: "Capacidad de un sistema de IA de dar salidas correctas ante entradas esperadas e inesperadas: erratas, sinónimos, otro idioma o ataques. Bedrock Evaluations la mide perturbando ligeramente los prompts y comparando las respuestas."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-report-programmatic.html

- id: controlabilidad
  termino: controlabilidad
  alias: [controllability]
  categoria: concepto
  definicion: "Dimensión de la IA responsable: disponer de mecanismos para supervisar y dirigir el comportamiento del sistema, por ejemplo supervisión humana, límites de actuación de un agente o la posibilidad de corregir o detener una acción."
  referencia: https://aws.amazon.com/ai/responsible-ai/

- id: inclusividad
  termino: inclusividad
  alias: [inclusivity, inclusión]
  categoria: concepto
  definicion: "Que el sistema funcione bien para todos los grupos que lo van a usar, incluidos los minoritarios y las personas con necesidades de accesibilidad. Empieza por conjuntos de datos que los representen."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html

- id: conjunto-equilibrado
  termino: conjunto de datos equilibrado
  alias: [balanced dataset, datos equilibrados]
  categoria: concepto
  definicion: "Conjunto en el que cada grupo y cada clase tienen suficientes ejemplos para aprender y medir. Los huecos se cubren recogiendo más datos o con muestreo estratificado."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html

- id: ficha-de-datos
  termino: ficha de datos
  alias: [datasheet, datasheets]
  categoria: concepto
  definicion: "Documento vivo que describe un conjunto de datos: uso previsto y no previsto, fuentes, forma de recogida, etiquetado, distribución y sesgos o limitaciones conocidos."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp04-bp05.html

- id: desequilibrio-de-clases
  termino: desequilibrio de clases
  alias: [class imbalance]
  categoria: metrica
  definicion: "Métrica de sesgo previa al entrenamiento: CI = (na − nd) / (na + nd), con na y nd el número de miembros de cada grupo. Va de −1 a 1; cerca de 0 indica grupos equilibrados."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-bias-metric-class-imbalance.html

- id: diferencia-en-proporciones-de-etiquetas
  termino: diferencia en las proporciones de etiquetas
  alias: [difference in proportions of labels, DPL]
  categoria: metrica
  definicion: "Métrica de sesgo previa al entrenamiento: DPL = qa − qd, la diferencia entre la proporción de resultados positivos observados en un grupo y en otro. Un modelo entrenado con un DPL alto tiende a reproducirlo."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-data-bias-metric-true-label-imbalance.html

- id: impacto-dispar
  termino: impacto dispar
  alias: [disparate impact]
  categoria: metrica
  definicion: "Métrica de sesgo posterior al entrenamiento: DI = q'd / q'a, la proporción de predicciones positivas del grupo desfavorecido entre la del favorecido. 1 indica paridad; por debajo de 1, el grupo d recibe menos resultados positivos."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-post-training-bias-metric-di.html

- id: analisis-por-subgrupos
  termino: análisis por subgrupos
  alias: [subgroup analysis]
  categoria: tecnica
  definicion: "Calcular las mismas métricas (exactitud, precisión, recall, tasa de aprobación) para cada grupo de personas, incluidos los interseccionales, y compararlas con un umbral aceptable para detectar sesgo que la media oculta."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc03-bp02.html

- id: auditoria-humana
  termino: auditoría humana
  alias: [human audit, auditorías humanas]
  categoria: tecnica
  definicion: "Revisión por personas, idealmente independientes del equipo y con sus propios datos de evaluación, de los aspectos críticos o subjetivos de un sistema de IA (seguridad, sesgo, experiencia de usuario) antes de lanzarlo y de forma periódica."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raier01-bp02.html

- id: calidad-de-etiquetas
  termino: calidad de las etiquetas
  alias: [label quality]
  categoria: tecnica
  definicion: "Control de las etiquetas de un conjunto de datos: formación de los anotadores, acuerdo entre anotadores, ejemplos con respuesta conocida, búsqueda de sesgos de los anotadores y contraste de las etiquetas sintéticas con el juicio humano."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp02-bp03.html

- id: shap
  termino: SHAP
  alias: [SHapley Additive exPlanations, valores de Shapley]
  categoria: tecnica
  definicion: "Método de explicación a posteriori, independiente del modelo, basado en los valores de Shapley de la teoría de juegos cooperativos: asigna a cada variable su contribución a una predicción concreta (explicación local) o al modelo en general (global)."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-model-explainability.html

- id: supervision-humana
  termino: supervisión humana
  alias: [human oversight]
  categoria: tecnica
  definicion: "Revisión o decisión de una persona en los puntos donde un error tiene consecuencias graves o donde su experiencia aporta más. La política de IA responsable de AWS la exige en las decisiones con consecuencias para las personas."
  referencia: https://aws.amazon.com/ai/responsible-ai/policy/

- id: mecanismo-de-feedback
  termino: mecanismo de feedback
  alias: [user-feedback mechanism, feedback de los usuarios]
  categoria: tecnica
  definicion: "Forma de que los usuarios valoren o notifiquen respuestas incorrectas o inadecuadas, unida a un circuito de revisión periódica que convierte ese feedback en mejoras del sistema (guardrails, prompts, datos)."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raimon02-bp01.html

- id: diseno-centrado-en-las-personas
  termino: diseño centrado en las personas
  alias: [human-centered design]
  categoria: concepto
  definicion: "Diseñar el sistema de IA a partir de quién lo usa y qué necesita entender: transparencia de las decisiones, explicaciones adaptadas, supervisión humana donde hay consecuencias, feedback de los usuarios y accesibilidad."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raigt01-bp04.html

- id: decisiones-con-consecuencias
  termino: decisiones con consecuencias
  alias: [consequential decisions]
  categoria: concepto
  definicion: "Decisiones que afectan a derechos, salud o seguridad de las personas (diagnóstico médico, crédito, empleo, vivienda, prestaciones, asesoramiento legal o financiero). Según la política de AWS, exigen evaluar riesgos e implantar supervisión humana y pruebas."
  referencia: https://aws.amazon.com/ai/responsible-ai/policy/

- id: indemnizacion-de-propiedad-intelectual
  termino: indemnización de propiedad intelectual
  alias: [IP indemnity]
  categoria: concepto
  definicion: "AWS ofrece una indemnización sin límite frente a reclamaciones de terceros por derechos de autor sobre la salida de los modelos de Amazon y de otros servicios de IA generativa enumerados en sus condiciones de servicio, siempre que el cliente use el servicio de forma responsable."
  referencia: https://aws.amazon.com/bedrock/faqs/

- id: filtros-de-contenido
  termino: filtros de contenido
  alias: [content filters, filtro de contenido]
  categoria: tecnica
  definicion: "Salvaguarda de Bedrock Guardrails que detecta contenido dañino en texto o imágenes por categorías (odio, insultos, sexual, violencia, conducta indebida y ataque de prompt), con una intensidad configurable para cada una."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-content-filters.html

- id: temas-denegados
  termino: temas denegados
  alias: [denied topics]
  categoria: tecnica
  definicion: "Salvaguarda de Bedrock Guardrails que bloquea los temas que el cliente define en lenguaje natural como no deseados para su aplicación, en las preguntas y en las respuestas."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html

- id: filtros-de-palabras
  termino: filtros de palabras
  alias: [word filters]
  categoria: tecnica
  definicion: "Salvaguarda de Bedrock Guardrails que bloquea palabras o frases exactas de hasta tres palabras, sin distinguir mayúsculas y por palabra completa: una lista predefinida de blasfemias o términos propios, como nombres de la competencia. No tiene coste."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-word-filters.html

- id: filtros-de-informacion-sensible
  termino: filtros de información sensible
  alias: [sensitive information filters]
  categoria: tecnica
  definicion: "Salvaguarda de Bedrock Guardrails que detecta datos personales (PII) y patrones propios con expresiones regulares en las entradas y respuestas, y bloquea el mensaje o enmascara el dato."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html

- id: pii
  termino: PII
  alias: [datos personales, personally identifiable information]
  categoria: concepto
  definicion: "Información de identificación personal: datos que identifican a una persona, como nombre, dirección, correo, teléfono, número de documento o de tarjeta."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html

- id: contextual-grounding-check
  termino: contextual grounding check
  alias: [comprobación de grounding contextual, contextual grounding checks]
  categoria: tecnica
  definicion: "Salvaguarda de Bedrock Guardrails que detecta alucinaciones: puntúa si la respuesta se basa en la fuente de referencia (grounding) y si responde a la pregunta (relevancia), y bloquea las que quedan por debajo del umbral (0 a 0,99). Para resúmenes, paráfrasis y preguntas y respuestas; no para chat conversacional."
  usar_cuando: "En RAG o resúmenes, para bloquear respuestas que añaden datos que no están en la fuente."
  no_usar_cuando: "Para comprobar respuestas contra reglas lógicas de negocio: Automated Reasoning checks."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html

- id: automated-reasoning-checks
  termino: Automated Reasoning checks
  alias: [comprobaciones de razonamiento automatizado]
  categoria: tecnica
  definicion: "Salvaguarda de Bedrock Guardrails que valida con lógica formal si una respuesta es coherente con una política de reglas definida por el cliente, explica por qué y señala supuestos no declarados. Solo detecta (no bloquea): devuelve hallazgos y la aplicación decide. Solo inglés (EE. UU.), sin streaming y sin protección frente a la inyección de prompts."
  usar_cuando: "Sectores regulados o reglas complejas (elegibilidad, prestaciones, normativa interna) donde hay que demostrar que la respuesta cumple las reglas."
  no_usar_cuando: "Para detectar contenido dañino, temas fuera de alcance o ataques de prompt: filtros de contenido y temas denegados."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html

- id: amazon-sagemaker-model-cards
  termino: Amazon SageMaker Model Cards
  alias: [SageMaker Model Cards, Model Cards, model card]
  categoria: servicio
  icono: aws/Arch_Amazon-SageMaker-AI_48.svg
  definicion: "Documentación de un modelo de ML en un único sitio: uso previsto y no previsto, calificación de riesgo (desconocido, bajo, medio, alto), detalles de entrenamiento, métricas y resultados de evaluación. Cada cambio crea una versión inmutable; se exporta a PDF y se integra con el Model Registry."
  usar_cuando: "Para gobierno y auditoría: comunicar a riesgos, cumplimiento o reguladores para qué sirve un modelo y cómo se evaluó."
  no_usar_cuando: "Para detectar sesgo o explicar predicciones: documenta, no mide. Para medir, métricas de sesgo y SHAP con bibliotecas abiertas o, en el examen, SageMaker Clarify (ya no admite clientes nuevos); para modelos fundacionales, Amazon Bedrock Evaluations."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html

- id: aws-ai-service-cards
  termino: AWS AI Service Cards
  alias: [AI Service Cards, AI Service Card]
  categoria: servicio
  definicion: "Fichas que publica AWS sobre sus servicios y modelos de IA (por ejemplo, Amazon Nova o Bedrock Guardrails) con los casos de uso previstos, las limitaciones, las decisiones de diseño responsable y las buenas prácticas de rendimiento."
  usar_cuando: "Para conocer el uso previsto y las limitaciones de un servicio o modelo de AWS antes de adoptarlo."
  no_usar_cuando: "Para documentar un modelo propio: SageMaker Model Cards."
  referencia: https://aws.amazon.com/ai/responsible-ai/resources/

- id: amazon-augmented-ai
  termino: Amazon Augmented AI
  alias: [Amazon A2I, A2I]
  categoria: servicio
  icono: aws/Arch_Amazon-Augmented-AI-A2I_48.svg
  definicion: "Servicio para añadir revisión humana a predicciones de ML con baja confianza o a muestras aleatorias (Textract, Rekognition, modelos propios). Ya no está abierto a clientes nuevos; los existentes pueden seguir usándolo."
  usar_cuando: "Clientes actuales que necesitan revisión humana de predicciones de baja confianza."
  no_usar_cuando: "Como opción para un proyecto nuevo: ya no admite clientes nuevos, y su documentación no indica un sustituto; la revisión humana se tendría que diseñar en la propia aplicación."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/a2i-use-augmented-ai-a2i-human-review-loops.html

- id: responsible-ai-lens
  termino: Responsible AI Lens
  alias: [AWS Well-Architected Responsible AI Lens]
  categoria: concepto
  definicion: "Guía del AWS Well-Architected Framework (noviembre de 2025) con buenas prácticas para diseñar, desarrollar y operar de forma responsable sistemas de IA para casos de uso concretos, organizada en ocho áreas del ciclo de vida."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/responsible-ai-lens.html

- id: sostenibilidad-de-la-ia
  termino: sostenibilidad de la IA
  alias: [sostenibilidad]
  categoria: concepto
  definicion: "Reducir el impacto ambiental de una carga de IA: comprobar si la IA generativa hace falta, elegir el modelo del tamaño justo, personalizar de forma eficiente y usar recursos que se ajustan a la demanda (serverless, autoescalado, chips eficientes)."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/sustainability.html

- id: fmeval
  termino: fmeval
  alias: [FMEval]
  categoria: servicio
  definicion: "Biblioteca de código abierto de AWS para evaluar modelos de lenguaje (exactitud, robustez, toxicidad y otras dimensiones), la que usa la evaluación de modelos fundacionales de SageMaker Clarify. Para proyectos nuevos, AWS indica Amazon Bedrock Evaluations como vía gestionada."
  usar_cuando: "Para evaluar con control total, en código, modelos de lenguaje alojados dentro o fuera de AWS."
  no_usar_cuando: "Cuando basta una evaluación gestionada de modelos de Bedrock (Bedrock Evaluations)."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-foundation-model-evaluate.html

# ------------------------------------------------------------------ módulo 05: seguridad, cumplimiento y gobierno
- id: aws-kms
  termino: AWS KMS
  alias: [AWS Key Management Service, KMS]
  categoria: servicio
  icono: aws/Arch_AWS-Key-Management-Service_48.svg
  definicion: "Servicio gestionado para crear y controlar las claves de cifrado y firma. Las claves se protegen en módulos de seguridad de hardware y no salen del servicio sin cifrar. En Bedrock cifra con claves del cliente modelos personalizados, agentes, ingesta de Knowledge Bases y evaluaciones."
  usar_cuando: "Para cifrar en reposo datos y modelos con claves que controla la empresa y auditar su uso."
  no_usar_cuando: "Para guardar contraseñas o claves de API de terceros (Secrets Manager)."
  referencia: https://docs.aws.amazon.com/kms/latest/developerguide/overview.html

- id: amazon-macie
  termino: Amazon Macie
  alias: [Macie]
  categoria: servicio
  icono: aws/Arch_Amazon-Macie_48.svg
  definicion: "Servicio de seguridad de datos que descubre datos sensibles en Amazon S3 con aprendizaje automático y coincidencia de patrones, mantiene un inventario de los buckets y avisa de riesgos, como un bucket que pasa a ser público."
  usar_cuando: "Antes de usar un bucket para ajustar un modelo o como fuente de una Knowledge Base, para saber si contiene datos personales."
  no_usar_cuando: "Para filtrar datos personales en tiempo real en las respuestas de un modelo (Bedrock Guardrails)."
  referencia: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html

- id: aws-secrets-manager
  termino: AWS Secrets Manager
  alias: [Secrets Manager]
  categoria: servicio
  icono: aws/Arch_AWS-Secrets-Manager_48.svg
  definicion: "Servicio para guardar, recuperar y rotar credenciales de bases de datos, claves de API, tokens OAuth y otros secretos, para no escribirlos en el código de las aplicaciones."
  usar_cuando: "Para las claves de API y credenciales que usan las herramientas de un agente o una aplicación de IA."
  no_usar_cuando: "Para claves de cifrado (KMS) o credenciales de AWS (IAM)."
  referencia: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html

- id: agentcore-identity
  termino: AgentCore Identity
  alias: [Amazon Bedrock AgentCore Identity]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock-AgentCore_48.svg
  definicion: "Servicio de Amazon Bedrock AgentCore de identidad y gestión de credenciales para agentes: autentica y autoriza a los agentes y sus herramientas para acceder a recursos de AWS y de terceros en nombre de los usuarios, con trazas de auditoría."
  usar_cuando: "Cuando un agente debe acceder a servicios externos o de AWS con la identidad y los permisos del usuario."
  no_usar_cuando: "Para limitar qué acciones puede hacer el agente con cada herramienta (Policy in AgentCore)."
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html

- id: policy-in-agentcore
  termino: Policy in AgentCore
  alias: [Policy in Amazon Bedrock AgentCore]
  categoria: servicio
  icono: aws/Arch_Amazon-Bedrock-AgentCore_48.svg
  definicion: "Políticas deterministas, en lenguaje Cedar o redactadas en lenguaje natural, que un motor de políticas evalúa en el AgentCore Gateway antes de permitir cada llamada de un agente a una herramienta: qué puede hacer y con qué límites."
  usar_cuando: "Para impedir que un agente actúe fuera de su autoridad, por ejemplo aprobar importes por encima de un límite."
  no_usar_cuando: "Para filtrar contenido dañino en los prompts (Guardrails) o gestionar las credenciales del agente (AgentCore Identity)."
  referencia: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html

- id: registro-de-invocaciones
  termino: registro de invocaciones de modelos
  alias: [model invocation logging, registro de invocaciones]
  categoria: tecnica
  definicion: "Funcionalidad de Amazon Bedrock que guarda la petición, la respuesta y los metadatos de cada invocación (Converse, InvokeModel y sus variantes) en CloudWatch Logs o en S3 de la misma cuenta y Región. Está desactivada por defecto; cuánto se conservan los registros lo decide la retención del destino. El enmascarado de PII de Guardrails no se aplica a estos registros."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html

- id: aws-lake-formation
  termino: AWS Lake Formation
  alias: [Lake Formation]
  categoria: servicio
  icono: aws/Arch_AWS-Lake-Formation_48.svg
  definicion: "Servicio para gobernar, proteger y compartir los datos de un lago de datos con permisos detallados por columna, fila y celda sobre los datos de S3 y sus metadatos del AWS Glue Data Catalog."
  usar_cuando: "Para que cada equipo o modelo acceda solo a las columnas o filas que necesita."
  no_usar_cuando: "Para descubrir datos personales en S3 (Macie) o catalogar los conjuntos de datos (Glue Data Catalog)."
  referencia: https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html

- id: aws-glue-data-catalog
  termino: AWS Glue Data Catalog
  alias: [Glue Data Catalog, Data Catalog]
  categoria: servicio
  icono: aws/Arch_AWS-Glue_48.svg
  definicion: "Repositorio central de metadatos de los conjuntos de datos de la organización: ubicación, esquema y métricas. Se rellena con rastreadores (crawlers) o a mano y lo usan Athena, Lake Formation o EMR."
  usar_cuando: "Para saber qué conjuntos de datos existen, dónde están y con qué esquema."
  no_usar_cuando: "Para controlar permisos detallados sobre esos datos (Lake Formation)."
  referencia: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html

- id: aws-glue-data-quality
  termino: AWS Glue Data Quality
  alias: [Glue Data Quality]
  categoria: servicio
  icono: aws/Arch_AWS-Glue_48.svg
  definicion: "Funcionalidad serverless de AWS Glue para medir y vigilar la calidad de los datos con reglas (recomendadas o propias), una puntuación de calidad y detección de anomalías con ML."
  usar_cuando: "Para comprobar la calidad de los datos antes de entrenar o ajustar un modelo."
  no_usar_cuando: "Para descubrir datos personales (Macie)."
  referencia: https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html

- id: aws-config
  termino: AWS Config
  alias: [Config]
  categoria: servicio
  icono: aws/Arch_AWS-Config_48.svg
  definicion: "Servicio que registra la configuración de los recursos de AWS, cómo se relacionan y cómo ha cambiado con el tiempo, y la evalúa con reglas y paquetes de conformidad."
  usar_cuando: "Para comprobar que los recursos de un sistema de IA cumplen reglas (cifrado, acceso público) y ver su historial de configuración."
  no_usar_cuando: "Para saber quién hizo una llamada a la API (CloudTrail)."
  referencia: https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html

- id: amazon-inspector
  termino: Amazon Inspector
  alias: [Inspector]
  categoria: servicio
  icono: aws/Arch_Amazon-Inspector_48.svg
  definicion: "Servicio de gestión de vulnerabilidades que descubre y escanea de forma continua instancias EC2, imágenes de contenedores en ECR y funciones Lambda en busca de vulnerabilidades de software y exposición de red no deseada."
  usar_cuando: "Para detectar bibliotecas vulnerables en el software que sirve o rodea a un modelo."
  no_usar_cuando: "Para obtener informes de cumplimiento de AWS (Artifact) o recomendaciones generales (Trusted Advisor)."
  referencia: https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html

- id: aws-artifact
  termino: AWS Artifact
  alias: [Artifact]
  categoria: servicio
  icono: aws/Arch_AWS-Artifact_48.svg
  definicion: "Portal de descarga bajo demanda de los informes de seguridad y cumplimiento de AWS (por ejemplo, SOC, ISO o PCI) y de gestión de los acuerdos con AWS."
  usar_cuando: "Para entregar a un auditor la evidencia de cumplimiento de la infraestructura de AWS."
  no_usar_cuando: "Para demostrar la configuración o el cumplimiento de los recursos del propio cliente (Config)."
  referencia: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html

- id: aws-trusted-advisor
  termino: AWS Trusted Advisor
  alias: [Trusted Advisor]
  categoria: servicio
  icono: aws/Arch_AWS-Trusted-Advisor_48.svg
  definicion: "Servicio que inspecciona el entorno de AWS y recomienda mejoras para ahorrar costes, mejorar la disponibilidad y el rendimiento y cerrar brechas de seguridad. Con el plan Basic se accede a los límites de servicio y a algunas comprobaciones de seguridad y tolerancia a fallos."
  usar_cuando: "Para revisar buenas prácticas de la cuenta (permisos abiertos, cuotas, costes)."
  no_usar_cuando: "Para escanear vulnerabilidades de software (Inspector)."
  referencia: https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html

- id: aws-well-architected-tool
  termino: AWS Well-Architected Tool
  alias: [Well-Architected Tool, AWS WA Tool]
  categoria: servicio
  icono: aws/Arch_AWS-Well-Architected-Tool_48.svg
  definicion: "Herramienta para revisar una carga de trabajo frente a las buenas prácticas del AWS Well-Architected Framework y a lentes adicionales del catálogo oficial o propias, con un plan de mejora."
  usar_cuando: "Para revisar de forma estructurada la arquitectura de un sistema de IA."
  no_usar_cuando: "Para escanear vulnerabilidades (Amazon Inspector) o recopilar evidencias de cumplimiento de los recursos (conformance packs de AWS Config)."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses.html

- id: aws-audit-manager
  termino: AWS Audit Manager
  alias: [Audit Manager]
  categoria: servicio
  icono: aws/Arch_AWS-Audit-Manager_48.svg
  definicion: "Servicio que recopila automáticamente evidencias para auditorías con marcos predefinidos o propios. Ya no está abierto a clientes nuevos; los existentes pueden seguir usándolo."
  no_usar_cuando: "Como opción para un proyecto nuevo: ya no admite clientes nuevos. AWS recomienda los conformance packs de AWS Config, que no equivalen del todo (no hay plantillas para SOC 2 ni RGPD)."
  referencia: https://docs.aws.amazon.com/audit-manager/latest/userguide/what-is.html

- id: amazon-s3-glacier
  termino: Amazon S3 Glacier
  alias: [S3 Glacier]
  categoria: servicio
  icono: aws/Arch_Amazon-Simple-Storage-Service-Glacier_48.svg
  definicion: "Clases de almacenamiento de archivo de Amazon S3, de bajo coste, para datos que se consultan poco y deben conservarse mucho tiempo. (El servicio original de bóvedas, Amazon Glacier, es distinto.)"
  usar_cuando: "Para conservar años datos de entrenamiento o registros que exige la normativa."
  no_usar_cuando: "Para datos que se consultan a menudo o con baja latencia: S3 Standard."
  referencia: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html

- id: s3-lifecycle
  termino: S3 Lifecycle
  alias: [ciclo de vida de S3]
  categoria: tecnica
  definicion: "Reglas de Amazon S3 que mueven automáticamente los objetos a clases de almacenamiento más baratas (transición) o los borran al cumplirse un plazo (expiración)."
  referencia: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html

- id: amazon-guardduty
  termino: Amazon GuardDuty
  alias: [GuardDuty]
  categoria: servicio
  icono: aws/Arch_Amazon-GuardDuty_48.svg
  definicion: "Servicio de detección de amenazas que analiza de forma continua registros y datos de la cuenta con inteligencia de amenazas y ML para encontrar actividad sospechosa, como credenciales comprometidas o exfiltración de datos. Está fuera del alcance del examen AIF-C01: basta reconocerlo."
  referencia: https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html

- id: citacion-de-fuentes
  termino: citación de fuentes
  alias: [source citation]
  categoria: tecnica
  definicion: "Indicar de qué documentos sale cada respuesta. Amazon Bedrock Knowledge Bases devuelve citas con los fragmentos y documentos de origen, lo que permite comprobar la respuesta."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-retrieve-generate.html

- id: linaje-de-datos
  termino: linaje de datos
  alias: [data lineage, linaje]
  categoria: concepto
  definicion: "Recorrido de los datos y artefactos desde su origen hasta el modelo desplegado (conjunto de datos, versión, trabajo de entrenamiento, endpoint). SageMaker ML Lineage Tracking lo registra para reproducir el flujo y auditarlo."
  referencia: https://docs.aws.amazon.com/sagemaker/latest/dg/lineage-tracking.html

- id: catalogo-de-datos
  termino: catalogación de datos
  alias: [data cataloging, catálogo de datos]
  categoria: concepto
  definicion: "Inventario de los conjuntos de datos con su ubicación, esquema y metadatos para que se puedan encontrar y gobernar. En AWS, el AWS Glue Data Catalog."
  referencia: https://docs.aws.amazon.com/glue/latest/dg/catalog-and-crawler.html

- id: tecnologias-de-mejora-de-la-privacidad
  termino: tecnologías de mejora de la privacidad
  alias: [privacy-enhancing technologies, PET]
  categoria: tecnica
  definicion: "Técnicas para usar datos protegiendo a las personas: minimización, anonimización, seudonimización o tokenización, enmascarado, privacidad diferencial y datos sintéticos."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raisp02-bp02.html

- id: integridad-de-los-datos
  termino: integridad de los datos
  alias: [data integrity]
  categoria: concepto
  definicion: "Garantía de que los datos no se alteran sin control: versiones, registros de cambios y permisos de escritura mínimos, también como defensa frente al envenenamiento de los datos de entrenamiento."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp04-bp03.html

- id: residencia-de-datos
  termino: residencia de datos
  alias: [data residency]
  categoria: concepto
  definicion: "Requisito de que los datos se almacenen y procesen en una Región o geografía concreta. En Bedrock se respeta eligiendo la Región y, con inferencia entre Regiones, un perfil geográfico en lugar del global."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html

- id: retencion-de-datos
  termino: retención de datos
  alias: [data retention]
  categoria: concepto
  definicion: "Cuánto tiempo se conservan los datos y los registros antes de borrarlos. En AWS se fija con la retención de los grupos de CloudWatch Logs (indefinida por defecto), la expiración de S3 Lifecycle y los modos de retención de datos de Bedrock."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/data-retention.html

- id: ciclo-de-vida-de-los-datos
  termino: ciclo de vida de los datos
  alias: [data lifecycle]
  categoria: concepto
  definicion: "Qué ocurre con los datos desde que se crean hasta que se borran: almacenamiento, uso, archivo y eliminación según políticas. En S3 se automatiza con S3 Lifecycle."
  referencia: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html

- id: ai-security-scoping-matrix
  termino: Generative AI Security Scoping Matrix
  alias: [AI Security Scoping Matrix, Security Scoping Matrix]
  categoria: concepto
  definicion: "Marco de AWS que clasifica los casos de IA generativa en cinco ámbitos según cuánto controla la organización el modelo y sus datos (aplicación de consumo, aplicación empresarial, modelo preentrenado, modelo ajustado, modelo propio) y los cruza con cinco disciplinas: gobierno y cumplimiento, legal y privacidad, gestión de riesgos, controles y resiliencia."
  referencia: https://aws.amazon.com/ai/generative-ai/security/scoping-matrix/

- id: puntuacion-de-confianza
  termino: puntuación de confianza
  alias: [confidence scoring, confidence score]
  categoria: tecnica
  definicion: "Valor que indica cuánto se puede fiar de una salida. Se usa con un umbral para entregar, avisar, derivar a una persona o no responder. Guardrails da puntuaciones de grounding y relevancia; servicios como Textract o Comprehend devuelven una confianza por predicción."
  referencia: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html

- id: validacion-de-la-salida
  termino: validación de la salida
  alias: [output validation]
  categoria: tecnica
  definicion: "Comprobar la respuesta de un modelo antes de usarla: contra la fuente (grounding), contra reglas lógicas (Automated Reasoning), contra un formato o esquema esperado, o con revisión humana."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/security.html

- id: exceso-de-autonomia
  termino: exceso de autonomía
  alias: [excessive agency]
  categoria: concepto
  definicion: "Riesgo de que un agente de IA tenga más permisos o capacidad de acción de la necesaria, lo que multiplica el daño de un error o de una inyección de prompts. Se limita con mínimo privilegio, Policy in AgentCore y aprobación humana."
  referencia: https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/security.html

