  definicion: "Almacén de datos (data warehouse) totalmente gestionado a escala de petabytes; con Redshift Serverless se analizan datos sin configurar un almacén aprovisionado."
  usar_cuando: "Para analizar con SQL grandes volúmenes de datos estructurados que alimentan modelos o informes."
  no_usar_cuando: "Para guardar objetos y ficheros de entrenamiento sin estructura (Amazon S3)."
