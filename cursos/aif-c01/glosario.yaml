  alias: [EMR, Amazon Elastic MapReduce]
  categoria: servicio
  icono: aws/Arch_Amazon-EMR_48.svg
  definicion: "Plataforma gestionada de clústeres para ejecutar marcos de big data como Apache Hadoop y Apache Spark y procesar y analizar grandes volúmenes de datos."
  usar_cuando: "Para preparar con Spark o Hadoop volúmenes de datos muy grandes antes de entrenar un modelo."
  no_usar_cuando: "Para una preparación visual y sin código (AWS Glue DataBrew)."
