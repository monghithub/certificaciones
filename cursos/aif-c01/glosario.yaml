  definicion: "Servicio totalmente gestionado de orquestación de contenedores para desplegar, gestionar y escalar aplicaciones en contenedores, integrado con Amazon ECR."
  usar_cuando: "Para desplegar en contenedores una aplicación o un modelo propio sin gestionar Kubernetes."
  no_usar_cuando: "Cuando la organización ya estandariza en Kubernetes (Amazon EKS) o basta un endpoint gestionado de SageMaker AI."
  referencia: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html

- id: amazon-eks
  termino: Amazon EKS
  alias: [EKS, Amazon Elastic Kubernetes Service]
  categoria: servicio
  icono: aws/Arch_Amazon-Elastic-Kubernetes-Service_48.svg
  definicion: "Servicio gestionado de Kubernetes que elimina la complejidad de operar clústeres de Kubernetes para desplegar aplicaciones en contenedores."
  usar_cuando: "Para desplegar modelos o aplicaciones en Kubernetes cuando la organización ya usa ese estándar."
  no_usar_cuando: "Cuando basta un servicio de contenedores más sencillo (Amazon ECS) o un endpoint gestionado de SageMaker AI."
