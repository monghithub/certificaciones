  usar_cuando: "Para obtener conjuntos de datos de terceros con los que entrenar o enriquecer un modelo."
  no_usar_cuando: "Para preparar o transformar los datos (AWS Glue, Amazon EMR)."
  referencia: https://docs.aws.amazon.com/data-exchange/latest/userguide/what-is.html

