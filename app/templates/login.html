{% extends "base.html" %}{% block titulo %}Acceso{% endblock %}
{% block contenido %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>Acceso</h1>
  {% if error %}<div class="msg error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" hx-boost="false">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Usuario</label><input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <p><button type="submit">Entrar</button></p>
  </form>
  <p class="suave">Las cuentas las crea el administrador.</p>
</div>
{% endblock %}
