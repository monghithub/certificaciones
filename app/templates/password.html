{% extends "base.html" %}{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<h1>Cambiar contraseña</h1>
{% if user.debe_cambiar_password %}<div class="msg aviso">Debes cambiar tu contraseña temporal antes de continuar.</div>{% endif %}
{% if error %}<div class="msg error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/cuenta/password" class="card" hx-boost="false">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="actual">Contraseña actual</label><input id="actual" name="actual" type="password" autocomplete="current-password" required>
  <label for="nueva">Contraseña nueva (mínimo {{ min_password }} caracteres)</label><input id="nueva" name="nueva" type="password" autocomplete="new-password" required>
  <label for="repetir">Repite la contraseña nueva</label><input id="repetir" name="repetir" type="password" autocomplete="new-password" required>
  <p><button type="submit">Guardar</button></p>
</form>
{% endblock %}
